      - 'manual: a real Node.js run confirming a 3-day record produces "1/3"/"2/3"/"3/3" badges in chronological order, and a single-day record renders no badge'
      - 'live: real lifetxt serve process with a 3-day on:/on:/on: fixture, served page confirmed to contain the cal-entry-span markup'
      - python -m unittest tests.test_release_policy tests.test_web_i18n -> Ran 26 tests, OK (no translation-coverage regression)
      - tests/test_lifetxt.py test_calendar_places_a_record_on_every_day_even_with_occurrence_start -> asserts matches is checked before occurrence_start in the served page source
      - 'live: real lifetxt serve process against the exact #220 reproduction fixture (10-day Google Calendar on: import), GET /api/agenda confirmed occurrence_start=matches[0].start while matches carries all 10 real day entries'
