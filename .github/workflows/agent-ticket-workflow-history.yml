name: Apply ticket workflow history and planning

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ticket-workflow-history-time'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ticket-workflow-history-time
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and extract implementation payload
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import pathlib
          import shutil
          import tarfile

          root = pathlib.Path('.agent_ticket_workflow')
          chunks = sorted(root.glob('part-*.txt'))
          if len(chunks) != 9:
              raise SystemExit('expected 9 payload chunks, found %d' % len(chunks))
          payload = ''.join(path.read_text(encoding='ascii') for path in chunks)
          if len(payload) != 54668:
              raise SystemExit('payload length mismatch: %d' % len(payload))
          digest = hashlib.sha256(payload.encode('ascii')).hexdigest()
          expected = 'c5007609bb6191fe13c8cd015297a428ebfd3fb00fb2c37316fdfa179761a7dc'
          if digest != expected:
              raise SystemExit('payload SHA-256 mismatch: %s' % digest)
          data = base64.b64decode(payload, validate=True)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              archive.extractall('.')
          shutil.rmtree(root)
          PY
          python tools/apply_ticket_workflow_history_batch.py
          rm tools/apply_ticket_workflow_history_batch.py
          rm .github/workflows/agent-ticket-workflow-history.yml
      - name: Compile and run focused validation
        shell: bash
        run: |
          python -m compileall -q lifetxt tests
          python -m unittest \
            tests.test_ticket_workflow_history \
            tests.test_ticket_planning \
            tests.test_ticket_workflow_surfaces \
            tests.test_safety_cli \
            tests.test_safety_foundation \
            tests.test_schema_extensions_v2
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add ticket workflow history time and planning'
          git push origin HEAD:agent/ticket-workflow-history-time
