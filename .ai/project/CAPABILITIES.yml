    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      #260 was too large to implement directly (Task Decomposition Standard:
      L/XL must be decomposed) and was split into an epic (#260) plus four
      sub-issues; this entry covers #270 (runbook), #271 (systemd/nginx
      examples), #272 (the guarded core update flow), and #273 (risk
      classification and the review gate) together, since they are one
      coherent capability. #273 landed in a separate PR after #272 was
      independently reviewed and merged, per the Task Decomposition
      Standard's own reasoning for the original split: #272 could be
      reviewed and shipped without waiting on the gate. Risk classification
      is deliberately split into an impure `gather_diff_summary()` (the
      only git-touching part) and a pure `classify_risk()`, so the pure
      function is unit-testable with fixture data with no live git
      repository, per #273's own acceptance criteria; see
      `.ai/project/changes/server-update-review-gate/design.md` for the
      full design record, including a live disposable-git-repository
      verification transcript. `command_server_update` reuses
      `command_update`'s git helpers
      (`_run_git_for_update`, `_lifetxt_install_root`,
      `_reject_option_like_git_arg`, `_git_commit_summary`,
      `_github_latest_release_or_tag`) via a lazy import
      (`server_update._git_helpers`) rather than reimplementing fetch/
      fast-forward logic, per #260's own explicit preference for a Python
      command over a shell script wrapper. Deployment config
      (`--server-config PATH`) is a separate JSON file from the
      application's own `.lifetxt.json`/`--config`, since it describes the
      deployment (paths, services, backup policy) rather than workspace
      content. Security/High assurance, matching `cap-lifetxt-self-update`'s
      escalation basis (production git/service mutation automation);
      requires independent security review and Merge Authority approval
      before merge to main. Adding `datetime.now` to
      config/release/clock-boundary-baseline-v1.json's allowed list
      (classification `operational-recovery`, matching
      `transaction_journal.py`'s existing entry) was required by the
      pre-existing `tests.test_clock_contract_v4`/`tests.test_release_policy`
      gate: the backup-directory timestamp is recovery-evidence naming, not
      a life.txt workflow date choice. #277 extends the same capability after
      live Ubuntu Server validation found production-readiness gaps: uv-managed
      pip-less venvs, conda-managed environments that should not rely on shell
      activation, system-level unit authorization under a non-root updater user,
      separate primary/archive/config/workspace validation targets, and
      optional full-suite validation before service restart. The extension keeps
      the old pip/string-check config path valid and records the environment
      review in `.ai/project/changes/server-update-production-readiness/`.
      #526 (a follow-up implementation issue from the #500 AI-integration
      epic's Phase 6 item 13, "server-hosted MCP runbook") added a new
      section 9 to `docs/deployment/ubuntu-server.md` and a matching
      "Server-hosted (SSH)" subsection to `docs/en/ai-integration.md`/
      `docs/ja/ai-integration.md`, documenting that an AI client reaches a
      server-hosted workspace's `lifetxt mcp` by pointing its MCP client
      `command` at `ssh` instead of `python`/`lifetxt` directly -- no new
      code, no new listening port, and no change to `lifetxt mcp` itself,
      since SSH is only the transport carrying the same stdio JSON-RPC
      session. Before writing this, checked #500's own Phase 8
      ("Conversational context tools") and found it already satisfied by
      existing `get_command_center`/`get_project` MCP tools (both call
      domain-layer aggregation directly, matching Phase 8's own acceptance
      bar), recorded as a comment on #500 rather than building redundant
      aliases. #526 also confirmed sshd is reachable on the verification
      host but did not set up authorized-key access to force a full
      authenticated round-trip test, since doing so would have meant
      modifying the operator's personal SSH trust configuration for a
      docs-only task -- recorded as an explicit, honest verification
      boundary rather than silently assumed or forced through. Separately
      found, while reading the existing section 5 "Backup and restore"
      list, that it does not mention a configured named workspace's
      separate write target (e.g. an `ai` workspace's `write_file`) --
      matching #500's own stated Phase 6 item 16 concern that
      `server-update` should not silently omit newly configured
      authoritative AI write targets from backup coverage. This is a
      distinct, evidenced gap in `server_update.py`/`server_init.py`
      themselves (their `backup_paths` is a static list, not derived from
      the live application config's `workspaces`), not something #526's
      own docs-only scope should absorb; left unfiled/unfixed here and
      recorded as a candidate follow-up rather than silently dropped.
      #528 and #529 close that follow-up: #528 adds an opt-in
      `ai_workspace.enabled`/`ai_workspace.write_file` section to
      `server-init`'s config, switching `_application_config()` between the
      legacy `{"paths": [...], "write_file": ...}` shape (unchanged,
      byte-identical, when disabled) and a `{"workspaces": {"default": ...,
      "ai": ...}}` shape matching #500's own AI-safe-workspace example when
      enabled, and adds the generated AI-inbox file to both the build plan
      and the generated `server-update.json`'s `backup_paths`. #529 adds
      `lifetxt.server_update.backup_coverage_warnings()`, a non-fatal
      diagnostic comparing `backup_paths` against every workspace write
      target the live application config declares (reusing
      `lifetxt.workspace.iter_workspace_definitions()` unmodified via a new
      `_configured_write_targets()` helper), surfaced as a
      `backup_coverage_warnings` report field and, in `command_server_update`'s
      text renderer, a printed warning naming any uncovered path -- it never
      auto-expands `backup_paths` itself, keeping that an operator decision.
      Live verification of #529 found and fixed a real bug before recording
      any evidence as passed: a configured workspace's relative `write_file`
      value must be resolved against the application config file's own
      directory via `lifetxt.workspace.config_base_dir()` before comparing it
      against `backup_paths`'s (typically absolute) entries; the first
      implementation compared raw, unresolved relative strings and falsely
      flagged every relative write target as uncovered even when it named
      the exact same file already present in `backup_paths`. Both requirements
      escalated to Security/High assurance, matching this capability's own
      established basis for `server-init`/`server-update` changes; see
      `.ai/project/changes/server-init-ai-workspace-and-backup-coverage/`
      for the full change package.
