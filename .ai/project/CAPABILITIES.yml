    name: Unified conversion, export dispatcher, and expanded interchange formats
    summary: >-
      A surface-neutral text conversion core and explicit `lifetxt convert
      --from ... --to ...` interface (#826), plus the existing single
      `lifetxt export --format ...` routing dispatcher over the
      existing JSON/JSONL/CSV/Markdown exporters (#688), extended with
      first-class native life.txt round-trip support (#689), a versioned
      SQLite relational interchange (`lifetxt-sqlite-v1`, #690/#691), and a
      versioned compressed native archive (`lifetxtz-v1`, #692/#693). SQLite
      and `.lifetxtz` are explicitly interchange/archive representations,
      never authoritative stores; plain life.txt remains authoritative. The
      shared text converter also supports strict life.txt Task ↔ todo.txt
      interchange (#1432/#1438).
