  - id: cap-lifetxt-backup-v1
    name: Disaster-recovery backup snapshots (lifetxt-backup-v1)
    summary: >-
      An atomic ZIP-based backup archive format (create/verify/restore/
      list/prune) with SHA-256 manifest integrity and resource-limit
      guards, a provider-independent rclone upload adapter, CLI
      orchestration (`lifetxt backup create|status|verify|restore|prune|
      run-scheduled`), an authoritative-metadata-based
      `backup verify --latest` convenience, registered backup.*
      configuration keys, and an
      opt-in server-init scheduled-backup systemd timer/service pair.
      Distinct from the periodic local Git-commit worker (#731): protects
