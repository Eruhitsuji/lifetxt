      result: "Ran 122 tests, OK (27 new McpPermissionProfileTests cases plus 95 pre-existing, unmodified)"
      commit: working-tree (feature/ai-integration-phase1, pre-commit)
    - type: unit
      command: python -m unittest tests.test_surface_runtime tests.test_safety_cli
        tests.test_safety_foundation tests.test_attachments tests.test_clock_skew_v5
        tests.test_ticket_project_surfaces tests.test_ticket_workflow_surfaces
        tests.test_remote_pagination tests.test_remote_web_v20
      requirement_ids:
