schema_version: 1
verification:
  executed:
  - type: compatibility
    command: Extract first text fence in each bilingual proposal; parse_text; python
      -m lifetxt check on extracted file, normally and with --warnings-as-errors.
    requirement_ids:
    - req-procedure-guidance-v1
    source_commit: 204fc69e0796a29e8ecf98fa822e64fd866ac028
    result: 'Both: 7 records, no parse errors, 20 W106 warnings. Normal check exit
      0; strict check exit 1.'
    status: passed
  - type: roundtrip
    command: Compare status/kind/title/details after item_to_line + parse_text, items_to_json
      + items_from_json_text, items_to_jsonl + items_from_jsonl_text.
    requirement_ids:
    - req-procedure-guidance-v1
    source_commit: 204fc69e0796a29e8ecf98fa822e64fd866ac028
    result: Both preserve semantic records including repeated proc_case and body.
    status: passed
  - type: regression
    command: python -m unittest tests.test_roundtrip_golden tests.test_parser_format_metadata
      tests.test_change_package_closeout
    requirement_ids:
    - req-procedure-guidance-v1
    source_commit: 204fc69e0796a29e8ecf98fa822e64fd866ac028
    result: 21 tests passed; Python 3.12.14 Linux/bash. Bash completion execution
      ran, no skips reported. Production tree unchanged during tests.
    status: passed
  - type: focused
    command: python -m unittest tests.test_procedure_definition tests.test_procedure_validation
      tests.test_procedure_graph tests.test_procedure_cli
    requirement_ids:
    - req-procedure-guidance-v1
    source_commit: 9fc056590dc7bc0ca9a38672dcb7e16be4008a7e
    status: passed
    result: 35 tests passed, no skips; includes non-TTY subprocess, FIFO, source BOM/CRLF
      hashes, 500-step and edge limits, closed cycles, cross-root targets, generic
      roundtrip and independent bilingual occurrences.
  - type: regression
    command: python -m unittest tests.test_procedure_definition tests.test_procedure_validation
      tests.test_procedure_graph tests.test_procedure_cli tests.test_roundtrip_golden
      tests.test_links tests.test_vm tests.test_vm_cli tests.test_daily_flow tests.test_daily_flow_cli
      tests.test_cli_taxonomy
    requirement_ids:
    - req-procedure-guidance-v1
    source_commit: 9fc056590dc7bc0ca9a38672dcb7e16be4008a7e
    status: passed
    result: 316 tests OK, one skip for installed console script not on PATH.
  - type: lint
    command: python -m ruff check lifetxt tests scripts
    requirement_ids:
    - req-procedure-guidance-v1
    source_commit: 9fc056590dc7bc0ca9a38672dcb7e16be4008a7e
    status: passed
    result: All checks passed (ruff 0.17.1).
  - type: format
    command: python -m ruff format --check lifetxt/procedure_*.py tests/test_procedure_*.py
    requirement_ids:
    - req-procedure-guidance-v1
    source_commit: 9fc056590dc7bc0ca9a38672dcb7e16be4008a7e
    status: passed
    result: 8 files already formatted. Global legacy formatting unchanged.
  - type: type
    command: python -m mypy --follow-imports=skip --ignore-missing-imports lifetxt/diagnostic_contract.py
    requirement_ids:
    - req-procedure-guidance-v1
    source_commit: 9fc056590dc7bc0ca9a38672dcb7e16be4008a7e
    status: passed
    result: Success, no issues in the approved one-file typing boundary (mypy 1.20.2).
  - type: integration
    command: python -m lifetxt check examples/minimal_life.txt; check both language
      template/work pairs; procedure show/graph on both opt-in examples
    requirement_ids:
    - req-procedure-guidance-v1
    source_commit: 9fc056590dc7bc0ca9a38672dcb7e16be4008a7e
    status: passed
    result: Baseline 10 items accepted. All bilingual examples and text/Mermaid/DOT
      commands returned 0; W106 for generic opt-in check and PG201 for exit-capable
      loop are expected.
  - type: render
    command: 'Isolated Node probe: mermaid.parse and viz.renderString(format=svg,
      engine=dot) for en/ja/unsafe-title graph outputs'
    requirement_ids:
    - req-procedure-guidance-v1
    source_commit: 9fc056590dc7bc0ca9a38672dcb7e16be4008a7e
    status: passed
    result: Mermaid 12.2.0 parse and @viz-js/viz 3.31.0 SVG rendering passed for all
      three inputs (jsdom 30.1.3); packages installed only in disposable verification
      environment, no runtime dependency added.
  - type: performance
    command: Read/validate synthetic 500-step, 499-edge single-root chain through
      procedure_cli.read_definition
    requirement_ids:
    - req-procedure-guidance-v1
    source_commit: 9fc056590dc7bc0ca9a38672dcb7e16be4008a7e
    status: passed
    result: 500-step exact bound accepted in 0.015 seconds on this Linux/Python 3.12.14
      host; this is a measurement, not a cross-host latency guarantee.
  - type: full_initial
    command: MPLBACKEND=Agg python -m unittest discover
    requirement_ids:
    - req-procedure-guidance-v1
    source_commit: f60b48e55c97bb61011a7bec99325484c55f516a
    status: failed
    result: '5765 tests, 5 failures, 456 skips. Four failures: package not installed
      for child processes with a temporary working directory. One: traceability evidence
      list indentation not recognized by the gate. No procedure behavior failure.
      Captured full output retained locally.'
  - type: failure_recheck
    command: python -m pip install --no-build-isolation -e .; python -m unittest tests.test_git_commit_worker_cli
      tests.test_traceability_gate
    requirement_ids:
    - req-procedure-guidance-v1
    source_commit: 9fc056590dc7bc0ca9a38672dcb7e16be4008a7e
    status: passed
    result: Editable setup completed; evidence list indentation corrected. All 18
      affected/gate tests passed. Initial full run used Python 3.12.14/bash; Bash
      completion execution ran. Only documentation records changed while it was running,
      not production code.
  - type: full_rerun
    command: MPLBACKEND=Agg python -m unittest discover
    requirement_ids:
    - req-procedure-guidance-v1
    source_commit: 9fc056590dc7bc0ca9a38672dcb7e16be4008a7e
    status: passed
    result: '5765 tests in 324.423 seconds: OK, 456 skips for optional dependencies/environment
      conditions. Linux/bash, Python 3.12.14, no Web extras installed. Bash completion
      execution ran. Production code/tests unchanged during run; verification documentation
      was updated separately. Initial failures resolved by editable setup and evidence
      indentation correction. Required CI/optional-extra suites remain separate evidence.'
  gaps:
  - description: Run schema/replay, CAS persistence and Web remain unimplemented and
      untested in stage 1.
    tracked_by: https://github.com/Eruhitsuji/lifetxt/issues/1332
