name: Export merged PR13 patch parts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/repair-pr13-implementation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-pr13-implementation
      - name: Archive merged patch parts
        run: tar -czf /tmp/pr13-patch-parts.tar.gz .github/agent-patch
      - uses: actions/upload-artifact@v4
        with:
          name: pr13-patch-parts
          path: /tmp/pr13-patch-parts.tar.gz
          if-no-files-found: error
