      - 'a refused write must leave the file byte-identical, retain the candidate, and not consume a backup generation'
      - 'an audit record must never contain configuration content or key values, verified with a marker string and a secret-referencing key absent from the audit line'
      - 'the audit log is disabled by default (unset audit_log produces no file) and trims to audit_max_bytes from the oldest end once forced past the cap'
