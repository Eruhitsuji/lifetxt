schema_version: 1

requirements:
  - id: req-server-update-health-readiness
    kind: ADDED
    statement: "`lifetxt server-update` must retry post-restart health checks within a bounded readiness window so normal application startup latency is not misreported as a failed deployment."
    acceptance_criteria:
      - "Transient connection failures after service restart are retried until success or deadline."
      - "The first healthy response returns `updated` immediately."
      - "Deadline exhaustion preserves `validated_health_check_failed`."
      - "Service restart failures preserve `validated_restart_incomplete` and do not run health checks."
      - "The health report includes attempts, elapsed seconds, and final status or error evidence."
      - "Dry-run and operator documentation expose the relevant health readiness settings."
    constraints:
      - "Health retry occurs only after code validation and service restart."
      - "Health retry must not perform git, package, data, or service mutations."
      - "Existing `health_timeout` remains the per-request timeout; total readiness is configured separately."
    owner: Eruhitsuji

open_questions: []
