name: Extract chunked typed ticket custom fields

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ticket-typed-custom-fields'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ticket-typed-custom-fields
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract implementation payload
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import base64
          import io
          import pathlib
          import shutil
          import tarfile
          import traceback

          workflow = pathlib.Path('.github/workflows/agent-ticket-custom-fields-chunks.yml')
          try:
              chunks = sorted(pathlib.Path('.agent_payload').glob('part-*.txt'))
              if len(chunks) != 5:
                  raise RuntimeError('expected five implementation chunks, found %d' % len(chunks))
              payload = ''.join(path.read_text(encoding='ascii') for path in chunks)
              data = base64.b64decode(payload, validate=True)
              with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
                  archive.extractall('.')
              shutil.rmtree('.agent_payload')
              error = pathlib.Path('agent-ticket-custom-fields-error.log')
              if error.exists():
                  error.unlink()
              workflow.unlink()
          except Exception:
              pathlib.Path('agent-ticket-custom-fields-error.log').write_text(
                  traceback.format_exc(), encoding='utf-8'
              )
              if workflow.exists():
                  workflow.unlink()
              raise
          PY
          status=$?
          if [ "$status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'Record chunked typed field extraction failure'
            git push origin HEAD:agent/ticket-typed-custom-fields
            exit "$status"
          fi
      - name: Compile and run typed-field tests
        shell: bash
        run: |
          python -m compileall -q lifetxt tests
          python -m unittest tests.test_ticket_custom_fields
      - name: Commit extracted implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add typed ticket custom fields'
          git push origin HEAD:agent/ticket-typed-custom-fields
