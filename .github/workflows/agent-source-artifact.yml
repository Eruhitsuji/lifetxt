name: Apply verified PR13 repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/repair-pr13-implementation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-pr13-implementation
          fetch-depth: 0
      - name: Verify every repair patch part
        run: |
          cat > /tmp/repair-parts.sha256 <<'EOF'
          656a30bec3cdf71b160687a404a956a2bfd95597a9a16ce13a8b9899f1b3fa80  .github/repair-patch/part-00
          c9ee73073d7604bd26cbee484d9a51a02fec4745afa6cfc363f5ab1acc003cc0  .github/repair-patch/part-01
          8ce2bfcc51a70aed619d13942bde51a8272564118dace04c5be447d1d3289a1e  .github/repair-patch/part-02a
          51f37e888aa0e03d111b3ca380d53b62c28db02d05603c38d0097e8eace0dc06  .github/repair-patch/part-02b
          09b0fa12837387378cfd9327e3c1d3c216adaa3f172cc97032d591c7454bcd97  .github/repair-patch/part-03
          754b17b2d6cfcbf871c1a3e9db93eecf4311cd16646cd1268736795a3fd4ba45  .github/repair-patch/part-04a
          420f8091ce39cd0a0a1b6dc407f75bac2aa74124c31266e6c53c7b25005d48a3  .github/repair-patch/part-04b
          fdbe62ed9fb304370181e85d29ab25e623dd01d2e01922e5ffb96f5559c1118d  .github/repair-patch/part-05a
          7be1178533bbd5fa932d2be6f617c09b83eea889fd4f5bdb720683d72603c5c6  .github/repair-patch/part-05b
          0e66cb62312f69d1a4beee43840ad4506d4218c12b7ea0aeb251d07b04521b39  .github/repair-patch/part-06
          e58b484d372cc58938b350ecbb21b228c42be228ac1c3e41c049973833dc0e50  .github/repair-patch/part-07
          8b897b40055d0450a3c6619b8dbb5846b685ac50ed030c1c2abb67861a83a218  .github/repair-patch/part-08a
          7c498636cafbcf0069fc0d2608662c7acd9dd9bc0e6ae64c5d89a041cb7a391c  .github/repair-patch/part-08b
          a24fd10c4998f6b2946f062ae2b023fe90e908758493cfbcd562e50250f16813  .github/repair-patch/part-09
          EOF
          sha256sum --check /tmp/repair-parts.sha256
      - name: Reconstruct and verify clean patch
        run: |
          cat \
            .github/repair-patch/part-00 \
            .github/repair-patch/part-01 \
            .github/repair-patch/part-02a \
            .github/repair-patch/part-02b \
            .github/repair-patch/part-03 \
            .github/repair-patch/part-04a \
            .github/repair-patch/part-04b \
            .github/repair-patch/part-05a \
            .github/repair-patch/part-05b \
            .github/repair-patch/part-06 \
            .github/repair-patch/part-07 \
            .github/repair-patch/part-08a \
            .github/repair-patch/part-08b \
            .github/repair-patch/part-09 \
            | base64 -d | gzip -d > /tmp/lifetxt-repair.patch
          echo 'f4ed00865a2118f9d6a031bc7a6ac08f7255933266a9b3c0f5b5fba21c7fcbd2  /tmp/lifetxt-repair.patch' | sha256sum --check
          git apply --check /tmp/lifetxt-repair.patch
      - name: Apply recovered implementation and remove transfer artifacts
        run: |
          git apply --index /tmp/lifetxt-repair.patch
          rm -rf .github/agent-patch .github/repair-patch
          rm -f .github/pr13-repair-diagnostic.txt
          git add -A
      - name: Commit and push repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply recovered PR13 implementation'
          git push origin HEAD:agent/repair-pr13-implementation
