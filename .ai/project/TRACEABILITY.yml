      release_or_deployment: null
      notes: >-
        Reopened from new real Windows full-profile evidence collected on
        merge commit 284a0cf: ResourceWarning path representations remained
        structurally expanded around <redacted-user> instead of collapsing
        to one <temp> root, even though the account name itself was
        correctly redacted. Root-caused before any fix: a ResourceWarning
        message's text is a Python repr() of a file object, and repr()
        escapes each backslash as two literal backslash characters, so the
        real separator there is two characters, not one. The username
        lookaround only checks the single character immediately adjacent,
        so it still matched and redacted the account name either way -- but
        the original _WINDOWS_USER_TEMP_PATTERN required exactly one
        separator character between each path segment and missed the
        doubled form, leaving the surrounding Users/AppData/Local/Temp
        structure unredacted around the already-redacted username. Fixed by
        broadening each single-character separator class in that pattern to
        one-or-more, which handles both the normal single-backslash case and
        the repr()-escaped doubled case uniformly, with no change to the
        username redaction itself. While constructing this fixture, a
        separate, low-severity, non-privacy-impacting quirk was found and
        filed as its own follow-up (#447) rather than folded into this fix:
