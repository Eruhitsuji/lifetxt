      result: "Ran 287 tests, OK -- confirms the CLI/Web/MCP capability drift gate and every module that also wraps mcp.call_tool/tool_schemas is unaffected"
      commit: working-tree (feature/ai-integration-phase1, pre-commit)
    - type: integration
      command: MPLBACKEND=Agg python -m unittest discover
      requirement_ids: []
      result: "Ran 2645 tests, OK (skipped=5) -- full repository suite green"
      commit: working-tree (feature/ai-integration-phase1, pre-commit)
    - type: manual
      command: real 'python -m lifetxt mcp --profile read|assist|full <fixture life.txt>'
        stdio sessions driven with real JSON-RPC tools/list and tools/call lines
      requirement_ids:
        - req-mcp-permission-profiles-read-enforcement
        - req-mcp-permission-profiles-assist-enforcement
        - req-mcp-permission-profiles-full-compat
      result: >-
        read: 63 tools listed, no stage_proposal/create_item, tools/call
        stage_proposal denied. assist: 64 tools listed (+stage_proposal),
        tools/call stage_proposal succeeds. full: 87 tools listed
        (+stage_proposal/create_item), both succeed. life.txt byte-unchanged
        by every stage_proposal call in all three modes.
      commit: working-tree (feature/ai-integration-phase1, pre-commit)
    - type: check
      command: python -m lifetxt check examples/minimal_life.txt
      requirement_ids: []
      result: "OK: 10 item(s)"
      commit: working-tree (feature/ai-integration-phase1, pre-commit)
    - type: lint
      command: ruff format --check lifetxt/mcp.py lifetxt/cli.py tests/test_mcp_expansion.py
        && ruff check lifetxt tests scripts
      requirement_ids: []
      result: "All changed files already formatted; ruff check: All checks passed. (9 pre-existing unrelated files elsewhere in the repo would be reformatted -- confirmed present before this change, not introduced by it.)"
      commit: working-tree (feature/ai-integration-phase1, pre-commit)
    - type: docs
      command: python scripts/validate_release_docs.py --output .cache/release-doc-validation.json
      requirement_ids:
        - req-mcp-permission-profiles-docs
      result: '{"errors": 0, "ok": true} after updating docs/en+ja/ai-integration.md section 6 and docs/en+ja/cli.md section 11.1 in parallel'
      commit: working-tree (feature/ai-integration-phase1, pre-commit)
    - type: security
      command: /security-review (dispatched research + false-positive-filtering
        subagents per this repository's security-review skill)
      requirement_ids: []
      result: >-
        No qualifying vulnerabilities found. Verified: the profile check is
        the sole tool-handler dispatch site and every monkeypatch wrapper
        (surface_runtime.py, surface_runtime_compat.py, runtime_safety_v2.py,
        remote_contracts_v6.py) falls through to it rather than dispatching
        TOOL_HANDLERS directly; tools/list and tools/call consult the same
        allowlist so nothing hidden becomes callable; McpContext.profile is
        set once in __init__, validated against MCP_PROFILES, and never
        reassigned or settable from client/tool-argument input; unclassified
        tools fail closed by construction.
      commit: working-tree (feature/ai-integration-phase1, pre-commit)

