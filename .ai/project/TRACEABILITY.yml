      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/99
      changed_files_or_scope:
        - Add config.write.require_revision as the configuration-driven require_revision policy
        - Wire config set|unset|migrate to write_config(require_revision=...) without changing the compare-and-set contract
        - lifetxt/cli.py
        - lifetxt/config.py
        - lifetxt/config_registry.py
        - lifetxt/schema_extensions_v5.py
        - dist/schemas/config-v1.schema.json
