    notes: >-
      No existing capability entry covered `lifetxt/command_center.py` or
      `command-center-v1` before this change, even though both predate this
      session (confirmed via `git log`); this entry closes that gap, matching
      the precedent set by `cap-remote-cli-read-client`/`cap-remote-cli-write-client`
      for pre-existing-but-untraced functionality. #473 (an investigation
      issue under the #472 post-Stable product theme selected by #471)
      confirmed `command_center()`/`command-center-v1` as the canonical daily
      layer and recommended extending it rather than building a parallel
      aggregation, dashboard engine, or Web contract. #475 adds two bounded
      sections without introducing a second definition of either concern:
      `next_actions` delegates entirely to
      `lifetxt.nextaction.next_action_items` (the same actionable predicate
      `next`, the TUI `/next` view, and MCP `get_next_actions` already
      share), and `inbox` delegates counting/status-filtering to
      `lifetxt.inbox.inbox_summary`, only trimming the pending list to a
      bounded, minimal-field view (`id`/`source`/`created`/`summary`) rather
      than exposing the full operational proposal record. Existing fields,
      the schema's `required` list, and every current CLI/MCP consumer are
      unchanged; `lifetxt/cli.py`'s `command_today` text renderer was
      deliberately left untouched (out of #475's write scope) since its
      `--json` output and the MCP tool already expose the new fields without
      any code change there. A TUI `Today` view (#476) and a Web read
      endpoint (#477) are tracked as extensions of this same capability.
      #476 adds a `today` view/`/today` command to the interactive TUI,
      rendering NOW/ATTENTION/INBOX/UPCOMING groupings of the exact same
      `command_center()` result computed in `WorkspaceState.load()` -- no
      due/blocked/waiting/next-action/inbox rule is duplicated in
      `lifetxt/tui_app.py`. The existing `tasks/agenda/status` dashboard
      model (`lifetxt/tui.py`'s `dashboard_model()`) is untouched and
      remains the data source for every other view; `load()` performs one
      additional cheap re-parse via the already-imported `load_items()`
      specifically to obtain `Item` objects for `command_center()`, since
      `dashboard_model()`'s return value does not expose the items it
      already parsed. The view is read-only by design (per #476's own
      scope); accepting/editing Inbox proposals from the Today view is an
      explicit, unimplemented follow-up. #477 adds
      `GET /api/command-center` to `lifetxt/webapp.py`, delegating entirely
      to `command_center()` (no due/blocked/next-action/inbox logic
      duplicated in the route) and accepting the same `horizon`/`person`/
      `mode` parameters CLI `today` and MCP `get_command_center` already
      support; an out-of-range/non-integer `horizon` fails with the
      standard 400 error shape rather than a raised exception. No Web UI
      bundle change was made, per #477's own scope -- rendering this
      endpoint in the browser Dashboard is a separate, unimplemented
      follow-up. #479 adds that Web Today Dashboard as a distinct new
      `today` tab/page in `lifetxt/web_assets.html`, kept separate from the
      existing `dashboard` tab rather than replacing it: the existing
      Dashboard already has its own established KPI-tile/chart/project
      aggregation built from independent `/api/items`/`/api/agenda`/
      `/api/chart/tasks`/`/api/stats/summary` calls, and #479's own
      out-of-scope list ("Reimplementing Command Center aggregation or
      business rules in Web code") plus acceptance criterion (existing Web
      conventions "remain intact") ruled out rewriting that established
      view. The new Today page calls only `GET /api/command-center` and
      renders its response directly into four cards (Now/Attention/Inbox/
      Upcoming), matching the TUI `/today` grouping; `loadToday()` performs
      no due/blocked/waiting/next-action/inbox/project-attention
      calculation of its own, confirmed by both a real Node.js run of the
      extracted rendering functions against populated/empty/bounded/error
      fixtures and a served-page test asserting `loadToday()`'s body never
      references `/api/items`, `/api/agenda`, or `/api/stats`. All new
      static and dynamically-rendered chrome strings were added to
      `UI_STRINGS`/reused existing entries so the translation-coverage gate
      (`tests.test_release_policy.test_repository_translation_baseline_allows_known_debt_but_no_new_gap`)
      stayed green with no new gap. Because a `GET /api/command-center`-only
      view has no write path, no new auth/read-only exposure was introduced;
      the route already inherits the same bearer-auth/read-only middleware
      as every other route (established when #477 added it). Proposal
      accept/edit/reject actions and Saved Views/life-area navigation on this
      page remain explicit, unimplemented follow-ups per #479's own scope.
      #495 investigated which next Command Center attention signals were
      worth adding and found the existing `messages` bucket had a real
      defect: it never checked `ack:`/`snooze_until:`, so an acknowledged or
      actively-snoozed message never left the daily attention list (since
      acknowledging a message never changes its coarse status). #498 fixes
      this by adding `_message_suppressed(item, today)`, mirroring the
      ack/snooze suppression rule `lifetxt.notifier._notification_suppressed`
      already has correct for the due-notification path, at the coarser
      reference-*date* granularity `command_center()` already uses
      throughout (rather than importing `notifier`'s own instant-precision
      check, which needs a `datetime` this module does not receive). #499
      adds a bounded `ticket_attention` field covering open `record:ticket`
      items in `review` status, at or above a high severity, or stale beyond
      a configurable `ticket_stale_after_days` (default matches
      `lifetxt.ticket_project_values.DEFAULT_STALE_DAYS`), each row tagged
      with which reason(s) applied. No severity, workflow, or staleness rule
      is duplicated: every classification reuses `is_ticket`/`ticket_row`/
      `DEFAULT_HIGH_SEVERITIES`/`DEFAULT_TERMINAL_STATUSES` from
      `lifetxt.ticket_project_values` and `node_facts()` from
      `cap-temporal-context` unmodified, matching the pattern
      `next_actions`/`inbox` already established for this function. CLI
      `today`'s text renderer gained a matching "Tickets needing attention"
      section (mirroring the existing project-attention section) so the
      signal is visible without `--json`; MCP `get_command_center` picks it
      up automatically since it returns the raw result unchanged. TUI
      `/today` and the Web Today tab are deliberately **not** updated in
      this pass -- #495's own write scope covered only
      `lifetxt/command_center.py` plus tests/docs, and extending the
      curses/Web renderers to a new card is recorded here as an explicit,
      unimplemented follow-up rather than silently claimed complete.
      #508 (a flaky-test bug found while running the full suite during
      unrelated #502/#505/#507 work, filed as its own follow-up per this
      repository's Horizontal Review Scope Discipline) fixed a timezone-
      dependent flake in `TicketAttentionTests.
      test_configurable_stale_after_days_reaches_the_engine`: the test
      derived its "yesterday" fixture date from the local wall-clock
      `datetime.date.today()`, while `node_facts()` itself (the code under
      test) compares against `reference_time(None)` (UTC). In any timezone
      ahead of UTC, local "yesterday" frequently lands on the same UTC
      calendar day as "now", making the computed `age_days` `0` instead of
      the intended `1` and silently passing an unrelated code path rather
      than the intended `stale_after_days=0` boundary. Fixed by deriving
      "yesterday" from `reference_time(None).date()` instead, the same
      clock `node_facts()` itself uses -- test-only change, no production
      code touched, since `node_facts()`'s own UTC-based staleness formula
      was never wrong. Test-only fix; no other file in this capability
      changed.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-temporal-context
    name: Derived temporal context (temporal-context-v1)
    summary: >-
      A new, separate, bounded read-only result deriving date-based facts
      about one item (`overdue_by`/`due_in` from `due:`, `stale_since`
      reusing the existing ticket staleness rule generalized beyond
      tickets) plus `same_day`/`before`/`after` edges to nearby dated items
      within a bounded window -- never an all-pairs scan of the workspace.
      Deliberately kept as a separate contract from the authoritative
      relation graph (`lifetxt/links.py`) and from `command-center-v1`;
      every fact/edge carries `rule`/`source_field`/`reference_time` so a
      consumer can explain "why" without re-deriving it. First exposed
      through the CLI, then a read-only MCP tool, and now an opt-in
      (never default) overlay onto `GET /api/graph`/MCP `get_graph` bounded
      to one root item, distinct from every edge merged into the
      authoritative graph by default.
