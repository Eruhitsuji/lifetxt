name: Issue 556 traceability

on:
  push:
    branches:
      - issue-556-web-assets-source-split

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[issue-556-trace]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record traceability
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.ai/project/TRACEABILITY.yml')
          text = path.read_text(encoding='utf-8')
          marker = '\nrequired_chain:\n'
          if 'task_issue: https://github.com/Eruhitsuji/lifetxt/issues/556' in text:
              raise SystemExit('Issue #556 traceability already exists')
          entry = '''

    - requirement_id: req-module-structure-decomposition
      capability_id: cap-web-surface-structure
      epic: null
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/556
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/557
      changed_files_or_scope:
        - Split the packaged Web UI source into an HTML shell plus ordered CSS and JavaScript package resources without changing the served page
        - lifetxt/web_assets.html
        - lifetxt/web_assets.py
        - lifetxt/web_assets_css_*.css
        - lifetxt/web_assets_js_*.js
        - pyproject.toml
        - tests/test_web_assets.py
      tests_or_evidence:
        - generated source fragments reconstruct the pre-split pristine HTML with Git blob SHA a0ebf28f5e007f6481cd14ec87574c979b87b2ce
        - tests/test_web_assets.py locks exact reconstruction, packaged fragments, pristine/runtime rebound separation, and root-route behavior
        - PR #557 CI
      release_or_deployment: null
      notes: >-
        Standard assurance, S-sized source decomposition. Reuses
        cap-web-surface-structure and preserves the existing single served HTML,
        inline classic-script behavior, and surface_runtime revision bridge.
        No asset HTTP routes, ES modules, frontend framework, or build chain are
        introduced. CSS uses four ordered fragments and JavaScript uses eighteen
        ordered fragments; assembly is deterministic through importlib.resources.
      status: implemented
'''
          if marker not in text:
              raise SystemExit('required_chain marker missing')
          path.write_text(text.replace(marker, entry + marker, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai/project/TRACEABILITY.yml
          git commit -m "[issue-556-trace] Record Web asset split traceability (#556)"
          git push origin HEAD:${{ github.ref_name }}
