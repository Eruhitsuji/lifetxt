schema_version: 1

capabilities:
  - id: cap-ai-standard-guided-activation
    name: AI standard guided activation
    summary: Keep the AI Development Standard v0.1.0 Guided trial active with explicit project commands, cadence, ownership, traceability, and adoption evidence.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-ai-standard-guided-activation
    implementation_locations:
      - .ai/standard.lock.yml
      - .ai/project/
      - .ai/adoption/REPORT.md
      - AGENTS.md
      - CLAUDE.md
      - .kiro/steering/development-standard.md
      - .github/
    public_interfaces:
      - AGENTS.md
      - CLAUDE.md
      - .kiro/steering/development-standard.md
      - .github/ISSUE_TEMPLATE/
      - .github/PULL_REQUEST_TEMPLATE.md
    tests_or_evidence:
      - python -m lifetxt check examples/minimal_life.txt
      - latest main CI after PR #38 succeeded
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/35
      - https://github.com/Eruhitsuji/lifetxt/issues/39
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/37
      - https://github.com/Eruhitsuji/lifetxt/pull/40
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-local-test-compatibility
    name: Local test compatibility
    summary: Keep the local unittest suite runnable on the declared Python >=3.6 runtime, including Windows/PowerShell environments, without reducing the coverage that Linux CI executes.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-local-unittest-compatibility
    implementation_locations:
      - pyproject.toml
      - lifetxt/
      - tests/
      - .ai/project/COMMANDS.yml
    public_interfaces:
      - .ai/project/COMMANDS.yml
    tests_or_evidence:
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover'
      - python -m lifetxt check examples/minimal_life.txt
      - 'environment-dependent suites must skip with a diagnostic reason rather than fail; verify both guard branches (working bash runs them, unusable bash skips them)'
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/36
      - https://github.com/Eruhitsuji/lifetxt/issues/41
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/38
      - https://github.com/Eruhitsuji/lifetxt/pull/42
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-config-safe-writes
    name: Safe configuration writes
    summary: >-
      Refuse a configuration write that would clobber a concurrent change, and keep the
      refused edit recoverable. The precondition is compared inside the shared sidecar
      lock so no writer can commit between the check and the write.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-config-concurrent-write-safety
    implementation_locations:
      - lifetxt/config_writer.py
      - lifetxt/cli.py
    public_interfaces:
      - lifetxt.config_writer.write_config
      - lifetxt.config_writer.config_revision
      - lifetxt.config_writer.rejected_candidates
      - lifetxt config revision
      - lifetxt config set|unset|migrate --expected-revision
    tests_or_evidence:
      - tests/test_config_validation.py ConfigRevisionTests
      - 'the precondition must reach lifetxt.mutation.write_text so the comparison happens inside the lock; a check performed before the write is not sufficient'
      - 'a refused write must leave the file byte-identical, retain the candidate, and not consume a backup generation'
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover'
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/47
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/58
      - https://github.com/Eruhitsuji/lifetxt/pull/59
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      Configuration-driven enforcement (a ticketing.write.require_revision equivalent) is
      deliberately deferred: it needs a new configuration schema key. The write_config
      require_revision parameter already exists for callers that must not fall back to
      last-write-wins.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-workspace-resolution-safety
    name: Workspace resolution safety
    summary: >-
      Detect self-referential symlink/junction cycles before workspace source expansion
      and refuse resolved source sets whose unique source files exceed the configured
      total byte limit.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-workspace-source-integrity
    implementation_locations:
      - lifetxt/config.py
      - lifetxt/config_registry.py
      - lifetxt/schema_extensions_v5.py
      - dist/schemas/config-v1.schema.json
      - lifetxt/workspace.py
      - docs/en/config.md
      - docs/ja/config.md
      - tests/test_workspace_foundation.py
    public_interfaces:
      - workspace.max_total_source_bytes
      - lifetxt config explain workspace.max_total_source_bytes
      - lifetxt.workspace.resolve_workspace
      - lifetxt workspace validate
    tests_or_evidence:
      - tests/test_workspace_foundation.py WorkspaceResolutionTests cycle and source-size cases
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover'
      - python -m lifetxt check examples/minimal_life.txt
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/48
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/63
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-stable-diagnostics
    name: Stable diagnostics
    summary: >-
      Publish a stable parser/validator diagnostic JSON object shape for
      `lifetxt check --format json` and keep raw-line Web and MCP validation
      diagnostics aligned with the same shared contract.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-diagnostic-contract-stability
    implementation_locations:
      - lifetxt/model.py
      - lifetxt/diagnostic_contract.py
      - lifetxt/cli.py
      - lifetxt/webapp.py
      - lifetxt/mcp.py
      - tests/diagnostic_contract_fixtures.py
      - tests/test_diagnostic_contract.py
      - docs/en/cli.md
      - docs/ja/cli.md
    public_interfaces:
      - lifetxt check --format json
      - POST /api/check-line
      - MCP check_line
      - lifetxt.diagnostic_contract.diagnostic_to_output_dict
    tests_or_evidence:
      - tests/test_diagnostic_contract.py
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 1758 tests, OK (skipped=18)'
      - 'python -m lifetxt check examples/minimal_life.txt -> OK: 10 item(s)'
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/49
      - https://github.com/Eruhitsuji/lifetxt/issues/65
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/64
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      `span` remains deferred until parser-native end spans are implemented. At
      #64 merge time parser/validator diagnostics publish the stable `hint`
      field but rely on the absent representation (`""`); authoring actionable
      non-empty hint text is tracked separately by #65. Consumers must tolerate
      unknown added fields, while stable fields are not removed or renamed
      without a documented transition period.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-surface-capability-consistency
    name: Surface capability consistency
    summary: >-
      Keep live CLI, Web, and MCP capability documents aligned with the shared
      operation registry, and keep the live Web command catalog aligned with the
      TUI command registry. Undocumented drift fails tests with the affected
      surface and operation named.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-cross-surface-consistency
    implementation_locations:
      - lifetxt/safety_foundation.py
      - lifetxt/surface_runtime.py
      - lifetxt/extra_safety.py
      - lifetxt/remote_contracts_v6.py
      - tests/test_surface_runtime.py
      - .ai/project/CAPABILITY_DRIFT_EXCEPTIONS.json
    public_interfaces:
      - lifetxt capabilities
      - GET /api/capabilities
      - GET /api/commands
      - MCP get_capabilities
      - MCP resource lifetxt://capabilities
      - .ai/project/CAPABILITY_DRIFT_EXCEPTIONS.json
    tests_or_evidence:
      - tests/test_surface_runtime.py SurfaceRuntimeTests.test_cli_mcp_and_resource_capabilities_match_registry_gate
      - tests/test_surface_runtime.py WebSurfaceRuntimeTests.test_web_capabilities_match_registry_gate
      - tests/test_surface_runtime.py WebSurfaceRuntimeTests.test_live_web_command_catalog_matches_tui_registry_gate
      - python -m unittest tests.test_surface_runtime tests.test_safety_cli tests.test_safety_foundation tests.test_remote_compatibility_v21
      - python -m unittest tests.test_web_commands tests.test_remote_attachment_contracts_v6 tests.test_ticket_project_surfaces tests.test_ticket_revision_writes tests.test_ticket_custom_fields tests.test_ticket_workflow_surfaces
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/50
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/66
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      Current drift exceptions are intentionally empty. Any future exception must
      include reason, owner, removal_condition, and tracked_by in
      .ai/project/CAPABILITY_DRIFT_EXCEPTIONS.json.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null
