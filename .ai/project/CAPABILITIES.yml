      - "tests/test_cui_extensions.py WorkspaceKeyBindingsTests (12 tests): vim keymap default navigation unchanged with no tui.bindings config; a custom navigation key moves the selection; a custom mutation key (done) invokes the exact same existing action, verified by reading the written file content directly rather than the filtered row view; cmd_tui refuses to start with a conflicting bindings config; edit (e)/undo (u)/escape remain available and unassignable under a custom map; multiple keys may bind to one action; an unknown action id in config falls back to the built-in binding and is reported; the prompt keymap is unaffected by the bindings registry; the ? help reference matches the unmodified preset with no config and reflects a custom binding when one is configured"
      - python -m unittest tests.test_tui_bindings tests.test_cui_extensions.WorkspaceKeyBindingsTests tests.test_schema_extensions_v2 tests.test_config_validation tests.test_surface_runtime -> Ran 112 tests, OK
      - "live: real python -m lifetxt --config config.json tui --plain life.txt against a real disposable workspace with a deliberately conflicting tui.bindings config rendered the plain (non-interactive) dashboard successfully, confirming the documented design that the conflict preflight applies only to the interactive curses path and the plain/non-TTY dashboard has no keyboard interaction to conflict over"
      - python -m lifetxt check examples/minimal_life.txt -> OK 10 item(s)
      - ruff format --check / ruff check on changed files -> clean
      - 'scripts/validate_release_docs.py -> {"errors": 0, "ok": true}'
    related_issues:
