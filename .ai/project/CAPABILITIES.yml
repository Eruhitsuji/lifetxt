  - id: cap-git-historical-disclosure-policy
    name: Historical Git evidence disclosure policy (investigation)
    summary: >-
      Security/disclosure investigation defining the boundary between
      current-state Remote Safe Mode read permission and historical Git
      evidence disclosure: a conjunctive (current AND historical must both
      permit) authorization model, exact-revision/as-of-only v1 selectors,
      a server-configured-sources-only path boundary, reuse of every
      existing Remote Safe Mode role/scope/redaction/audit mechanism with
      no parallel policy engine, an audit contract, deterministic bounds,
      and a fail-closed rule for current/historical policy conflicts. No
      endpoint or runtime code is implemented; this is the Definition of
      Ready input for a future server implementation.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-git-historical-disclosure-policy-investigation
    implementation_locations:
