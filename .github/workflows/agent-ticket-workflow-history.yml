name: Diagnose ticket workflow payload

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/ticket-workflow-history-time'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ticket-workflow-history-time
          fetch-depth: 0
      - name: Record exact payload metadata
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          root = pathlib.Path('.agent_ticket_workflow')
          chunks = sorted(root.glob('part-*.txt'))
          rows = []
          for path in chunks:
              value = path.read_text(encoding='ascii')
              rows.append({
                  'name': path.name,
                  'length': len(value),
                  'sha256': hashlib.sha256(value.encode('ascii')).hexdigest(),
                  'first': value[:12],
                  'last': value[-12:],
              })
          payload = ''.join(path.read_text(encoding='ascii') for path in chunks)
          report = {
              'count': len(chunks),
              'length': len(payload),
              'sha256': hashlib.sha256(payload.encode('ascii')).hexdigest(),
              'chunks': rows,
          }
          pathlib.Path('agent-ticket-workflow-payload-report.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          pathlib.Path('.github/workflows/agent-ticket-workflow-history.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Diagnose ticket workflow payload'
          git push origin HEAD:agent/ticket-workflow-history-time
