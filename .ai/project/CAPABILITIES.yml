      - https://github.com/Eruhitsuji/lifetxt/issues/253
    related_pull_requests: []
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      Scoped via AskUserQuestion with the repository owner before starting,
      given issue #221's own horizontal-review list spans CLI/TUI/Web/MCP/
      Remote with no fixed task size (Task Decomposition Standard: an
      undecomposed L/XL cannot be Ready). Distilled into a lightweight
      requirements.md/design.md at
      .kiro/specs/fuzzy-search-first-slice/ (below the
      .ai/project/changes/README.md change-package threshold: Standard
      assurance -- read-only search behavior, opt-in, no data or write-path
      impact).

      Follow-up horizontal-review investigation (#251/#252/#253) found the
      MCP tool was the cheapest of the three deferred surfaces (it already
      called global_search() and only needed one extra kwarg threaded
      through the schema), while the Remote `search` resource turned out to
      be a separate, narrower, hand-rolled implementation -- not built on
      global_search() at all, covering only item/project/person of the six
      entity types -- so its fix reimplements the same
      exact-before-approximate ranking locally via the public
      fuzzy_search.fuzzy_contains/is_exact_match/similarity primitives
      rather than delegating. TUI search was found to have no dedicated
      command reaching entities outside `TUI_SECTIONS` (tasks/agenda/status)
      -- per this project's Horizontal Review Scope Discipline, building one
      is a new feature, not a small same-root-cause fix, so it was filed as
      its own follow-up (#253) rather than implemented here. #253's own
      closing investigation corrected an earlier mischaracterization here:
      the TUI's `/search` command and live-typing filter (`tui_app.py`'s
      `WorkspaceState.refresh()`, via `score_row()`/`fuzzy_match()`) already
      perform genuine per-field-weighted, subsequence-tolerant fuzzy
      matching over already-loaded rows -- not a "substring-only" or
      "simpler" filter as originally described here. It is a separate,
      independently-implemented matcher from `lifetxt.fuzzy_search`
      (confirmed: `tui_app.py` does not import it) and #253 declined to
      unify or replace it, since it is arguably more capable for its use
      case (per-field weighting, match-span highlighting) than delegating to
      the shared primitive would be. filter_items()'s fuzzy parameter is a
      pure pass/fail predicate preserving existing document order (no
      ranking added there or to /api/items, whose sort=/order= parameters
      are the existing, independent ordering contract); only
      global_search()'s per-entity-type result lists gained exact-first
      ranking, since that is the one in-scope surface already returning a
