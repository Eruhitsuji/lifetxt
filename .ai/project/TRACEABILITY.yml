schema_version: 1

traceability:
  chains:
    - requirement_id: req-ai-standard-guided-activation
      capability_id: cap-ai-standard-guided-activation
      epic: standard adoption / foundation setup
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/39
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/40
      changed_files_or_scope:
        - .ai/project/METHOD.yml
        - .ai/project/COMMANDS.yml
        - .ai/project/CAPABILITIES.yml
        - .ai/project/TRACEABILITY.yml
        - .ai/adoption/REPORT.md
      tests_or_evidence:
        - YAML project records parse successfully
        - python -m lifetxt check examples/minimal_life.txt
        - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover'
        - git diff --check
      release_or_deployment: null
      status: implemented
    - requirement_id: req-local-unittest-compatibility
      capability_id: cap-local-test-compatibility
      epic: null
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/36
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/38
      changed_files_or_scope:
        - Python 3.6 and Windows local unittest compatibility
        - pyproject.toml
        - .ai/project/COMMANDS.yml
      tests_or_evidence:
        - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover'
        - python -m lifetxt check examples/minimal_life.txt
      release_or_deployment: null
      status: implemented
    - requirement_id: req-local-unittest-compatibility
      capability_id: cap-local-test-compatibility
      epic: null
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/41
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/42
      changed_files_or_scope:
        - Skip bash completion execution tests when the resolved bash cannot run the fixture
        - tests/test_roundtrip_golden.py
      tests_or_evidence:
        - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 1729 tests, OK (skipped=14)'
        - 'same suite with Git Bash ahead of the WSL launcher on PATH -> BashCompletionExecutionTests Ran 4 tests, OK'
        - python -m lifetxt check examples/minimal_life.txt
        - python -m compileall tests/test_roundtrip_golden.py
        - git diff --check
      release_or_deployment: null
      status: implemented
    - requirement_id: req-ai-standard-guided-activation
      capability_id: cap-ai-standard-guided-activation
      epic: standard adoption / foundation setup
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/43
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/45
      changed_files_or_scope:
        - Create the eleven labels declared by the issue templates
        - repository label settings (GitHub, not a file)
        - .ai/project/RULES.md
      tests_or_evidence:
        - 'labels declared by .github/ISSUE_TEMPLATE/*.yml compared against gh label list -> 11 declared, 11 matched, 0 missing'
        - 'issues #43 and #44 relabelled to type:task + status:inbox and rendered correctly'
      release_or_deployment: null
      status: implemented
    - requirement_id: req-ai-standard-guided-activation
      capability_id: cap-ai-standard-guided-activation
      epic: standard adoption / foundation setup
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/44
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/46
      changed_files_or_scope:
        - Repoint the format/lint tracked exceptions at an open issue and record the rule that keeps them tracked
        - .ai/project/COMMANDS.yml
        - .ai/project/RULES.md
      tests_or_evidence:
        - 'no tracked_by in .ai/project/COMMANDS.yml references a closed issue'
        - 'pip download ruff --no-deps on Python 3.6.5 -> no compatible wheel; black resolves only to 22.8.0'
        - 'git ls-files "*.py" -> 237 files, ~86,900 lines, the scale a formatter adoption would rewrite'
      release_or_deployment: null
      status: implemented
    - requirement_id: req-ai-standard-guided-activation
      capability_id: cap-ai-standard-guided-activation
      epic: standard adoption / foundation setup
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/52
      pull_request: null
      changed_files_or_scope:
        - Create the seven missing status labels and record labels as the status mechanism
        - Add the three Definition of Ready fields missing from the task template
        - repository label settings (GitHub, not a file)
        - .github/ISSUE_TEMPLATE/task.yml
        - .ai/project/RULES.md
      tests_or_evidence:
        - 'all eight TASK_MANAGEMENT.md status values exist as status:* labels'
        - 'labels declared by .github/ISSUE_TEMPLATE/*.yml still all exist (11 declared, 11 present)'
        - 'task.yml parses and exposes lifecycle-phase, review-viewpoints, test-viewpoints'
        - 'issues #47-#50 brought to Definition of Ready and marked status:ready'
      release_or_deployment: null
      status: implemented

required_chain:
  - Requirement
  - Capability
  - Epic
  - Task
  - Pull Request
  - Test/Evidence
  - Release

gap_policy:
  missing_link_action: create_follow_up_issue_or_approved_exception
