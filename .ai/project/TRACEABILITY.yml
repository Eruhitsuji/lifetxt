    - requirement_id: req-ai-standard-guided-activation
      capability_id: cap-ai-standard-guided-activation
      epic: standard adoption / foundation setup
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/44
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/71
      changed_files_or_scope:
        - Raise the declared Python runtime baseline from >=3.6 to >=3.10
        - Adopt Ruff as the formatter and linter
        - Apply Ruff formatting to existing Python files
        - Remove the format and lint tracked exceptions from .ai/project/COMMANDS.yml
