preconditions:
  interpreter:
    requirement: pyproject.toml requires-python (currently >=3.10)
    why: >-
      Every command below assumes `python` resolves to a supported interpreter.
      On an older one the suite still runs, but modules using newer syntax fail
      to import, so it covers fewer tests than it appears to and the result is
      not evidence. tests/test_supported_runtime.py fails loudly in that case
      rather than letting the run look successful.
    verify:
      - python -c "import sys; print(sys.version)"
      - python -m unittest tests.test_supported_runtime
    note: >-
      A system `python` older than the baseline is common. Use a virtual
      environment created from a supported interpreter, for example
      `py -3.12 -m venv .venv`, and run the commands from it.

commands:
  setup:
    status: configured
    values:
      - python -m pip install -e .

  setup_dev:
    status: configured
    values:
      - python -m pip install -e ".[dev]"

  format:
    status: configured
    values:
      - ruff format lifetxt tests scripts

  lint:
    status: configured
    values:
      - ruff check lifetxt tests scripts

  unit_test:
    status: configured
    values:
      - MPLBACKEND=Agg python -m unittest discover

  unit_test_windows_powershell:
    status: configured
    values:
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover'

  unit_test_captured:
    status: configured
    description: >-
      Same run as unit_test, but the complete output is retained in
      .test-output.log and only the summary reaches the terminal. Use this when
      reporting a failure, and attach the file: a summary line alone is not a
      diagnosis. The log is already ignored by the leading `.*` rule in
      .gitignore.
    values:
      - 'MPLBACKEND=Agg python -m unittest discover > .test-output.log 2>&1; code=$?; tail -n 5 .test-output.log; echo "exit=$code  full output: .test-output.log"'

  unit_test_captured_windows_powershell:
    status: configured
    values:
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover *> .test-output.log; $code=$LASTEXITCODE; Get-Content .test-output.log -Tail 5; "exit=$code  full output: .test-output.log"'

  integration_test:
    status: configured
    values:
      - python -m lifetxt check examples/minimal_life.txt

  full_check:
    status: configured
    values:
      - MPLBACKEND=Agg python -m unittest discover
      - python -m lifetxt check examples/minimal_life.txt

  full_check_windows_powershell:
    status: configured
    values:
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover'
      - python -m lifetxt check examples/minimal_life.txt
