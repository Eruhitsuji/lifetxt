schema_version: 1
requirements:
- id: req-official-website-v1
  kind: ADDED
  owner: Eruhitsuji
  statement: Introduce the real product and provide bilingual paths to authoritative
    guides and releases without hosting the app.
  acceptance_criteria:
  - Six equivalent Japanese/English pages plus root and 404
  - Valid project-relative links/assets, canonical/hreflang/sitemap
  - Mobile/desktop, semantic landmarks, keyboard skip/focus, readable contrast
  - No tracking, user data, scripts, hosted app or API claims
  - Canonical brand bytes reused; current docs remain authoritative
- id: req-official-website-pages-v1
  kind: ADDED
  owner: Eruhitsuji
  statement: Validate PRs read-only and publish only a checked main artifact after
    manual dispatch and human environment approval.
  acceptance_criteria:
  - No push or PR deployment; non-main/fork dispatch rejected
  - Read-only build; privileged deploy never checks out source
  - Missing/invalid environment human reviewer or API failure refuses publication
  - Pinned Actions, scoped upload, dedicated concurrency, no live settings mutation
  - Bilingual local/deployment/smoke/incident/rollback runbook and tracked live gaps
- id: req-official-website-live-quality-v1
  kind: ADDED
  owner: Eruhitsuji
  statement: Verify the published artifact and promote official links, then render
    English at root while preserving stable bilingual routes.
  acceptance_criteria:
  - Live HTTP pages/assets/404/SEO/docs/releases and initial deployment approval evidence
  - English root, stable /ja/ and /en/, same-page switches, English deep x-default
  - README promotion only after verified publication
  - Record real-device, screen-reader, zoom, independent review and metadata gaps honestly
  - No live Settings, runtime, managed standards or publication change in this PR
