name: Repair PR13 implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/repair-pr13-implementation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-pr13-implementation
          fetch-depth: 0
      - name: Reconstruct and apply recovered implementation
        run: |
          cat .github/agent-patch/part-* | base64 -d | gzip -d > /tmp/lifetxt.patch
          git apply --check /tmp/lifetxt.patch
          git apply --index /tmp/lifetxt.patch
          rm -rf .github/agent-patch
          rm -f .github/workflows/agent-source-artifact.yml
          rm -f .github/workflows/repair-pr13.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply recovered PR13 implementation"
          git push origin HEAD:agent/repair-pr13-implementation
