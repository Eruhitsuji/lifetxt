      matching the issue's own example, with no change to the underlying
      ordering contract; (3) known before/after payload shapes
      (before_status/after_status, before_progress/after_progress,
      field+before/after, relation+target) get a compact transition chip;
      any other payload shape falls back to a generic expandable key/value
      list rather than hardcoding every ticket-event shape, so a payload
      shape this pass did not anticipate still renders safely as text
      instead of being silently dropped; (4) the bounded progress trend
      only considers whole-percentage progress values (matching
      lifetxt.progress's percentage representation) and is omitted
      entirely below two data points or for fraction-form values -- the
      exact value is always available via the event's own transition
      chip/details regardless. TUI/MCP timeline surfaces (#761/#719) and
      the underlying /api/native-timeline/{id} route (#762) are
      unchanged; a future analytics/summary layer remains explicitly out
      of scope per #769's own text. Landed on child branch
      issue-769-native-timeline-visual-explorer, merged locally into
      feature/769-770-batch.
