      (Format 1.0 compatibility baseline, core regression protection, no
      known release-blocking data-loss defect, a working clean-artifact
      install/smoke path, documented rather than exhaustively pre-verified
      known limitations, no known critical security defect) and defers
      exhaustive real-host OS/shell/terminal/browser/filesystem/SMTP/client
      verification (#288-#292, #297-#299, #304, #312-#318, #437/#453, and
      the broader real-host matrix) to post-Stable-1.0 quality work unless a
      concrete release-blocking defect is found. It supersedes #283 and
      #339's remaining gate criteria only for what is required before the
      first Stable 1.0 release; both trackers keep their completed work as
      historical stabilization evidence. This entry records: the bounded
