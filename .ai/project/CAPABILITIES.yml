      convention every tool handler already uses) rather than adding
      one-off validation inside a hypothetical `explain_item`-specific code
      path -- there is no such path, since prompts are pure template data,
      not handler functions. Confirmed via a dedicated regression test that
      every prior prompt with no required arguments is completely
      unaffected. `explain_item` is deliberately MCP-only (no CLI or Web
      exposure), per #490/#492's own scope: there is no AI client behind a
      CLI invocation to hand a composed prompt template to, and any
      CLI-side synthesis would need an actual provider call, which remains
      explicitly out of scope for lifetxt itself.
