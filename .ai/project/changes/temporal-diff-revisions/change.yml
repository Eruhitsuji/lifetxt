schema_version: 1

change:
  id: temporal-diff-revisions
  title: Semantic Temporal Diff between exact Git revisions
  status: implemented
  change_type: Feature
  assurance_level: High
  owner: Eruhitsuji
  accountable_owner: Eruhitsuji
  related_issue: https://github.com/Eruhitsuji/lifetxt/issues/708
  related_pull_request: pending
  base_commit: eb8748474915a43875e154ee9a9caefc9e7055c7
  target_release: next normal maintenance release

scope:
  in_scope:
    - Compare normalized historical thread membership, stable state, edges, warnings, and derived facts.
    - Expose bounded temporal-diff-v1 through thread CLI text and JSON.
    - Publish schema, tests, documentation, capability, and traceability evidence.
  out_of_scope:
    - Generic custom-detail or raw text diff.
    - Merge, restore, rollback execution, or mutation.
    - Non-Git historical reconstruction.
  write_scope:
    - lifetxt/temporal_diff.py
    - lifetxt/historical_temporal.py
    - lifetxt/cli.py
    - lifetxt/schema_extensions_v27.py
    - dist/schemas/temporal-diff-v1.schema.json
    - focused tests, EN/JA docs, capability, traceability, and this package
  forbidden_scope:
    - .ai/managed/**
    - generic file diff
    - authoritative mutation
  shared_files:
    - lifetxt/cli.py
    - .ai/project/CAPABILITIES.yml
    - .ai/project/TRACEABILITY.yml

human_approvals_required:
  - Independent review of the latest commit.
  - Merge Authority approval; the implementing AI must not merge the pull request.
