schema_version: 1
requirements:
  - id: req-browser-local-check-v1
    kind: MODIFIED
    owner: Eruhitsuji
    statement: Provide a local bilingual site candidate using the shared JavaScript syntax checker.
    acceptance_criteria:
      - Bilingual discovery, checker scope, and incomplete diagnostics are visible.
