    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/396
      - https://github.com/Eruhitsuji/lifetxt/pull/426
      - https://github.com/Eruhitsuji/lifetxt/pull/434
      - https://github.com/Eruhitsuji/lifetxt/pull/436
      - https://github.com/Eruhitsuji/lifetxt/pull/440
      - https://github.com/Eruhitsuji/lifetxt/pull/441
      - https://github.com/Eruhitsuji/lifetxt/pull/442
      - https://github.com/Eruhitsuji/lifetxt/pull/444
      - https://github.com/Eruhitsuji/lifetxt/pull/446
      - https://github.com/Eruhitsuji/lifetxt/pull/448
      - https://github.com/Eruhitsuji/lifetxt/pull/449
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      External-environment preparation now includes dependency-free host evidence
      collection that aggregates mechanical release checks into one sanitized JSON
      bundle. Interactive terminal, browser, Remote, SMTP, external filesystem,
      deployment, rollback, and release decisions remain dedicated real-environment
      or human-authority work and are never inferred passed by the collector.
      #430 found two real defects in real Windows/WSL evidence bundles collected
      under #425/#426: make_redactor()'s sequential str.replace() calls were
      case-sensitive (missing a differently-cased path a child tool such as pip
      emitted) and processed repo/home/temp in a fixed order, so %TEMP% nested
      inside %USERPROFILE% on a normal Windows host had its home prefix consumed
      first, silently absorbing temp's own marker. Rewritten as one case-insensitive,
      length-sorted-longest-first single-pass regex substitution
      (_path_replacement_entries/make_redactor), which is provably idempotent by
      construction and regression-tested as such. Added a persistence-time
      rescan-and-refuse safety net in write_bundle() (_redaction_candidates/
      _unredacted_candidate_count) as the defense-in-depth layer #430 explicitly
      asked for: even a future redaction-rule regression cannot silently persist
      leaked evidence, since the fully-serialized JSON is rescanned immediately
      before the write. Regenerating fresh Windows/WSL bundles after this fix
      (#430's own last acceptance criterion) is external-environment work outside
      this sandbox and remains open.
      #435 found that #429's native-Ubuntu discovery generalizes beyond a single
      cp932-style encoding defect: the collector's release-profile invocation
      always used sys.executable, so a host whose only available Python was not
      one of the stable-release matrix's three supported versions (3.10/3.11/3.12)
      could not run the flow at all, and a venv does not fix this since it
      inherits its creator's version. Fixed with a new pure-stdlib
      scripts/verification_python_bootstrap.py module (no new runtime
      dependency, since it must run under any host Python including unsupported
      ones): it prefers an already-installed supported interpreter (search order
      3.12 -> 3.11 -> 3.10, via the Windows py launcher or PATH probing, always
      checking the *reported* version rather than trusting the executable name),
      and otherwise provisions a verification-only interpreter from a pinned,
      SHA256-verified python-build-standalone release into
      .cache/lifetxt-verify-python/ -- never touching the host's system Python
      and never requiring administrator/root privileges on the normal path.
      Checksum verification happens strictly before any archive extraction; a
      mismatch is rejected and nothing is extracted. Two new one-command entry
      scripts (scripts/verify-external.ps1, scripts/verify-external.sh) find any
      Python 3 on the host to hand off to the collector, which then bootstraps a
      supported interpreter itself; a host with literally no Python 3 remains an
      explicit blocked/manual case. Escalated from the issue's preferred S size
      to M with justification recorded in the PR, per the issue's own explicit
      allowance, given the genuine cross-platform download/verify/extract scope.
      Real end-to-end verification (not mocked) was performed on this Windows
      host (actual download, checksum match, extraction, and python.exe
      --version) and on real WSL (actual interpreter discovery and a genuine
      ensurepip-less venv-creation failure correctly degrading to blocked rather
      than crashing the collector, matching this capability's established
      graceful-degradation design). Real re-verification on native Linux and
      macOS after merge remains external-environment work outside this sandbox
      and is recorded as open, matching the pattern already established for
      #429/#430/#432.
      #437 found that #435's fixed 7200-second release-profile timeout was too
      tight for real supported hosts: fresh runs at commit b57aa84 observed
      Windows completing in ~5316s and WSL in ~4959s, while native Linux and
      macOS both reached the full test run but were cut off by the collector
      itself at the 7200s boundary with no compatibility failure observed --
      the timeout was stopping the run, not the run failing. Fixed by raising
      the default to 14400s (roughly 2.7x headroom over the highest confirmed
      real duration) and, more importantly, by making a timeout a distinct,
      unambiguous result: run_command() now records status "timeout" (never
      "failed" or "passed") with an explicit timeout_seconds field and
      whatever partial stdout/stderr the process had already produced;
      bundle_exit_code() fails the collector's own exit code on a release-
      profile or git-identity timeout exactly like it already did for
      "failed", so a timeout can never be mistaken for a pass downstream. The
      independent, much shorter --probe-timeout (default 30s, for git
      rev-parse and fzf/peco version probes) is unchanged. verify-external.ps1
      and verify-external.sh already forwarded all arguments unconditionally
      (`@args`/`"$@"`), so no wrapper-script code change was needed for
      --release-timeout to reach them -- this was verified live on both
      Windows (PowerShell) and via a real bash-gated automated test, not
      merely assumed from reading the forwarding code. Real Linux/macOS
      reruns beyond the previous 7200s boundary, per the issue's own
      acceptance criterion, remain external-environment work outside this
      sandbox and are recorded as open.
      #438 found that #430's exact-value path matching was still not
      idempotent end to end: fresh real-host bundles collected after #430/
      #434 kept showing "<temp><temp>..." (WSL/Linux), "/private<temp>"
      (macOS), and residual "C:\Users\<redacted-user>\...\Temp" structure
      (Windows). Root-caused, not merely patched around, with three
      independent synthetic reproductions of the pre-fix code before writing
      any fix: (1) a raw temp-root value recurring as a substring immediately
      next to itself (e.g. "/tmp/tmp/subdir" -- matching Python's own
      tempfile.mkdtemp() default "tmp" prefix convention) makes re.sub's
      left-to-right non-overlapping match scan replace two adjacent
      occurrences independently with nothing between the two markers; (2)
      macOS resolves several default temp/home roots through a "/private"
      symlink, so a tool reporting the resolved form never textually matches
      this process's own unresolved tempfile.gettempdir() value; (3) a WSL
      collector's own POSIX HOME never matches a captured "/mnt/c/Users/..."
      or "C:\Users\..." path, so only the generic username pattern fires,
      leaving structure around <redacted-user> instead of one <temp> marker.
      Fixed with a new _canonicalize_markers() pass applied as the final step
      of every redact() call: an adjacent-same-marker collapse regex
      (handles case 1, and makes re-sanitizing already-canonical or nested
      subprocess output converge to one root regardless of how many times it
      recurs), a deterministic (not live-filesystem-realpath-dependent, so
      testable on any host) "/private" alias registered as an additional
      variant of each candidate (handles case 2), and a structural regex
      recognizing <redacted-user> immediately followed by the well-known
      Windows/WSL temp-directory suffix (handles case 3). All three fixes
      are exercised with synthetic paths only, per the issue's own scope, and
      confirmed via git stash to fail against the pre-fix code with the
      issue's exact described malformed forms before passing with the fix
      restored. A real (non-mocked) --skip-release run's serialized evidence
      bundle was also checked and contains zero doubled-marker sequences.
      #439 found a real macOS bundle recorded metadata.filesystem_type as
      "/" -- the mount path, not a filesystem type/class. The previous
      implementation called `stat -f "%T" root`, which does not reliably
      yield the filesystem type on BSD/macOS stat, whose "-f FORMAT"
      conversions describe *file* attributes (e.g. "Regular File",
      "Directory"), not filesystem attributes -- unlike GNU coreutils'
      stat, where "-f" has a different, filesystem-status meaning. Fixed by
      replacing it with `mount` output parsing (well-documented and
      portable across BSD/macOS mount implementations), mirroring
      _linux_filesystem_type()'s existing longest-matching-mountpoint
      algorithm over /proc/mounts so a nested mount (e.g. an external
      volume) correctly wins over its shorter parent. Failure at any stage
      (missing mount binary, non-zero exit, OSError, timeout, or no
      matching line) returns None explicitly, never a path value. Linux,
      WSL, and Windows filesystem-type detection are untouched; a live,
      non-mocked --skip-release run on this Windows host confirmed
      metadata.filesystem_type is still correctly "NTFS". Real macOS
      re-verification with the normal one-command entry path, per the
      issue's own last acceptance criterion, remains external-environment
      work outside this sandbox and is recorded as open.
      #443 found a real Windows full-profile run refused to persist its
      evidence at write_bundle() with "1 raw redaction candidate value(s)
      are still present," discarding a multi-hour run's entire result; a
      --skip-release smoke on the same host succeeded, narrowing the
      problem to data unique to the full-profile path. Root-caused before
      any fix: _redaction_candidates() includes usernames as short as two
      characters, and the persistence-time scan did an unconditional
      substring check for every candidate, while make_redactor()'s own
      username_patterns only ever redact a username in a bounded context
      (a labeled "user=" field, or a path segment). Across a full release
      profile's stdout/stderr -- easily megabytes, the entire test suite's
      own output -- a short username coincidentally appears as a substring
      of ordinary words (e.g. "an" inside "handle", "plan", "scan"), which
      redact() correctly leaves untouched, but the old unconditional scan
      still flagged and refused it: a false positive, not a true redaction
      miss. Reproduced exactly with a synthetic username and 5000-repetition
      large text before writing any fix. Fixed by making the persistence-time
      scan's username matching agree with make_redactor()'s own bounded
      patterns: _categorized_redaction_candidates() now returns
      (value, category) pairs; category "username" uses the new
      _username_leak_pattern (the same two bounded contexts), while
      repo/home/temp categories keep the original strict, unconditional
      substring check (#430's defense-in-depth strictness is unchanged for
      those). The refusal message and a new categorized persistence-time
      diagnostic name only the candidate category, never the raw value.
      _redaction_candidates() (flat strings) is preserved unchanged and
      reimplemented on top of the categorized function, so every existing
      caller/test keeps working without modification.
      Also added ProgressRecorder: incrementally-flushed, sanitized
      human-readable (.log) and machine-readable (.progress.jsonl) lifecycle
      events (collector start, host classification, git identity, Python
      bootstrap, release-profile start/result/timeout, tool probes,
      final-evidence persistence start/completed/refused, collector
      completion), sharing the final JSON's name stem. Every field is
      sanitized through the same redact() closure before it is ever
      written, and every write is flushed and fsynced immediately, so a
      process kill, a timeout, or a persistence refusal leaves the latest
      completed event durable even when the final JSON is never produced.
      main() now catches a persistence RuntimeError, records
      collector_complete/failed, prints the progress-artifact paths and the
      (already category-only) error message, and exits 1 -- a clean failure
      instead of an uncaught traceback, since the progress evidence is
      already durably on disk by the time the exception is raised. Both the
      false-positive fix and the progress-recorder mechanics were verified
      live end to end on this Windows host, including a forced real
      persistence refusal confirming the progress artifacts survive with a
      privacy-safe refused event and exit code 1. One real Windows
      full-profile verification run, per the issue's own explicit
      allowance to validate with synthetic fixtures first, remains
      external-environment work outside this sandbox and is recorded as
      open.
      #445 found that a subsequent real Windows full-verification run
      (#443's own merge commit) still failed, but only on
      VerifyExternalShWrapperTests.test_release_timeout_flag_propagates_through_the_wrapper
      with exit 127 -- final evidence persistence itself succeeded, so this
      was not a recurrence of #443. Root cause: the discovered bash
      resolved to WSL's bash.exe, which passes _bash_skip_reason()'s
      trivial ``bash -c "echo ..."`` probe (WSL bash runs inline commands
      fine) but cannot address a native Windows-style path
      (backslash-separated, drive-letter-prefixed) passed as a positional
      argument -- WSL's own filesystem view treats the whole string as a
      single, nonexistent literal filename rather than translating it, so
      the wrapper script could not be found by its native checkout path. A
      test-portability failure, not a lifetxt runtime incompatibility.
      Fixed entirely in tests/test_external_verification.py (no production
      code change): a new _bash_handles_native_windows_paths() probe writes
      a small temp file and confirms the discovered bash can `cat` it by
      its native Windows path before _bash_skip_reason() will treat that
      bash as usable for the POSIX-wrapper integration test; on POSIX hosts
      this returns True immediately without spawning a subprocess, so
      Linux/macOS coverage is completely unaffected. When the native-path
      probe fails, the skip reason explicitly names the path-model problem
      rather than implying bash is absent or generally unusable. Verified
      live on this Windows sandbox that the discovered bash here is Cygwin
      bash (not WSL bash.exe) and correctly translates native paths, so the
      wrapper test still runs (not skipped) and passes unchanged --
      confirming #437's POSIX-wrapper coverage is preserved on an actual
      POSIX-capable Windows shell, not merely skipped away. A subsequent
      real Windows external-verification run with WSL bash discoverable on
      PATH, per the issue's own last acceptance criterion, remains
      external-environment work outside this sandbox and is recorded as
      open.
      #438 was reopened from new real Windows full-profile evidence
      collected on merge commit 284a0cf: ResourceWarning path
      representations remained structurally expanded around
      <redacted-user> instead of collapsing to one <temp> root, even
      though the account name itself was correctly redacted. Root-caused
      before any fix: a ResourceWarning message's text is a Python repr()
      of a file object, and repr() escapes each backslash as two literal
      backslash characters, so the real separator there is "\\\\" (two
      characters), not "\\" (one). The username lookaround in
      username_patterns only checks the single character immediately
      adjacent, so it still matched and redacted the account name either
      way -- but the original _WINDOWS_USER_TEMP_PATTERN required exactly
      one separator character between each path segment and missed the
      doubled form, leaving the surrounding Users/AppData/Local/Temp
      structure unredacted around the already-redacted username. Fixed by
      broadening each "[\\/]" in that pattern to "[\\/]+" (one or more),
      which handles both the normal single-backslash case and the
      repr()-escaped doubled case uniformly, with no change to the
      username redaction itself. Reproduced exactly with a synthetic
      repr-style double-backslash fixture (no real account name or path)
      before writing any fix, and confirmed via git stash that the fix
      resolves it. While constructing this fixture, a separate, low-
      severity, non-privacy-impacting quirk was found and filed as its own
      follow-up (#447) rather than folded into this fix: a short/generic
      temp candidate's backslash-variant path_pattern registration can
      coincidentally match inside an unrelated tempfile.mkdtemp()-style
      "tmpXXXXXX" directory name, truncating (but never un-redacting) the
      result -- the primary fix's own test fixture was adjusted to avoid
      this unrelated coincidental collision so the two root causes are not
      conflated. Live-verified on this Windows sandbox that a real
      --skip-release run's evidence bundle contains zero doubled-marker
      sequences. A lightweight real-host sanitizer smoke on Windows/WSL/
      Linux/macOS confirming canonical output, per the issue's own last
      acceptance criterion, remains external-environment work outside this
      sandbox for the platforms not exercised live here and is recorded as
      open.
      #437 was reopened a second time from real-host verification on merge
      commit 2d99fc2: WSL completed in ~7427s (up from ~4959s on an
      earlier run of the same host class -- real host performance
      genuinely varies run to run), macOS completed in ~14225s (barely
      inside the prior 14400s boundary), and native Linux again hit the
      collector's timeout at 14400s while still inside the test run
      itself, with its true completion time unknown. This confirmed
      #440's timeout-recording semantics (distinct "timeout" status,
      retained partial output, never a fabricated pass) work correctly,
      but that the 14400s default itself -- already raised once from
      7200s -- still lacked sufficient headroom. Fixed by raising
      DEFAULT_RELEASE_TIMEOUT_SECONDS to 28800s (8h, roughly 2x headroom
      over the highest confirmed near-miss of ~14225s), with the
      module-level comment, docs/en/external-environment-verification.md,
      and the existing headroom-locking test all updated to cite this
      reopened run's real evidence in place of the superseded b57aa84-era
      figures. No change to the timeout-recording mechanism itself, which
      the reopening comment explicitly confirmed already works correctly.
      Confirmed via git stash that the updated test assertion fails
      against the prior 14400s default with the exact observed shortfall,
      then passes once the fix is restored; live-verified on this Windows
      sandbox that a real run reports release_timeout=28800. A subsequent
      real Linux rerun able to complete beyond the previous 14400s
      boundary, per the reopening comment's own explicit request, remains
      external-environment work outside this sandbox and is recorded as
      open.
