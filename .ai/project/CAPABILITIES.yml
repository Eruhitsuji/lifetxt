  - id: cap-recent-items-command
    name: "`lifetxt recent` recently changed items"
    summary: >-
      `lifetxt recent PATH` is a read-only, newest-first view of recently
      created or updated items -- a thin composition over existing
      parsing, `lifetxt.ids.short_id`, and `lifetxt.timeutil.relative_time`,
      not a new indexing/cache subsystem. Default basis is `updated:`,
      falling back to `created:` when absent; `--updated`/`--created`
      select one basis explicitly with no fallback, so an item missing
      that exact detail (or carrying an unparseable one) is
      deterministically excluded rather than guessed at or crashing the
      command. `--limit N` bounds output; `--format json` preserves full
      `id:` values and the raw absolute timestamp actually used, never a
      locale-dependent display string.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-recent-items-command
    implementation_locations:
      - lifetxt/extra_core.py
      - lifetxt/extra_cli.py
      - lifetxt/entrypoint.py
      - lifetxt/cli_taxonomy.py
      - tests/test_extra_cli.py
      - docs/en/new-cli-workflows.md
      - docs/ja/new-cli-workflows.md
      - docs/en/cli.md
      - docs/ja/cli.md
    public_interfaces:
      - lifetxt recent PATH
      - lifetxt recent PATH --updated
      - lifetxt recent PATH --created
      - lifetxt recent PATH --limit N
      - lifetxt recent PATH --format json
    tests_or_evidence:
      - "python -m unittest tests.test_extra_cli.RecentCliTests -> Ran 11 tests, OK"
      - "live-verified: newest-first ordering by updated: with created: fallback; --updated/--created exclude items missing that exact basis with no fallback; --updated and --created together rejected; --limit bounds output and rejects a non-positive value; a malformed timestamp is excluded rather than crashing; the table's short ID round-trips through done exactly like next's; --format json preserves the full id: and raw timestamp plus which basis was actually used per row"
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/668
    related_pull_requests: []
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      Registered through the existing extended-command dispatch
      (`entrypoint._EXTRA_COMMANDS` -> `extra_cli.py`), the same mechanism
      `next`/`show`/`tour` already use, rather than growing `cli.py`'s
      already very large argparse tree. Reuses `_load_items`/`_first`/
      `_item_record`/`_table`/`_emit`/`_json_text` from `extra_common.py`
      (the same helpers `next` already uses) and
      `lifetxt.ids.collect_item_ids`/`short_id` unmodified -- no new
      timestamp parsing, short-ID derivation, or table-rendering
      implementation. Part of the daily-cli-convenience-batch
      (#664-#668).
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-freebusy-detection
    name: "`lifetxt freebusy` free/busy interval and overlap detection"
    summary: >-
      `lifetxt freebusy` reports merged busy intervals, the complementary
      free gaps, and pairwise overlap conflicts for `E`/`R` items with
      `from:`/`to:`/`at:`/`on:` within a datetime range, reusing
      `lifetxt.agenda.item_time_matches` (the same occurrence-timing
      engine `agenda` already uses) rather than a second implementation
      of how those values resolve to concrete spans. Closes the
      `overlap`/near-window scope `cap-temporal-context` (#481) explicitly
      deferred. `notify_from:`/`notify_to:` (reminder windows) and point
      keys such as `due:`/`do:` are excluded from busy computation
      (deadlines/reminders, not attendance); a zero-duration match (a bare
      `at:` instant, or a `from:`/`to:` value with no matching
      counterpart) never occupies busy time but is reported as an
      `instants` entry rather than silently dropped; recurring items
      (`repeat:`) are excluded with a `skipped_recurring` diagnostic
      (recurring-occurrence expansion is out of scope for this first
      slice); missing/invalid `from:`/`to:`/`at:`/`on:` values are
      reported as diagnostics, never silently ignored.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-freebusy-detection
    implementation_locations:
      - lifetxt/freebusy.py
      - lifetxt/cli.py
      - lifetxt/cli_taxonomy.py
      - lifetxt/schema_extensions_v25.py
      - lifetxt/__init__.py
      - dist/schemas/freebusy-v1.schema.json
      - tests/test_freebusy.py
      - tests/test_freebusy_cli.py
      - tests/test_schema_extensions_v2.py
      - tests/test_safety_foundation.py
      - tests/test_safety_cli.py
      - tests/test_ticket_custom_field_public_contract.py
      - tests/test_ticket_workflow_surfaces.py
      - docs/en/cli.md
      - docs/en/life-hub.md
      - docs/ja/cli.md
      - docs/ja/life-hub.md
    public_interfaces:
      - lifetxt freebusy PATH --from START --to END
      - lifetxt freebusy PATH --around AROUND --window WINDOW
      - lifetxt freebusy PATH --day-start HH:MM --day-end HH:MM
      - lifetxt freebusy PATH --json
      - lifetxt.freebusy.compute_freebusy
      - freebusy-v1.schema.json
    tests_or_evidence:
      - "python -m unittest tests.test_freebusy -> Ran 16 tests, OK (no-items-free window, range-end-not-after-start rejection, full-window-coverage, kind restriction to E/R, notify/point-key exclusion, non-overlapping-with-gap not falsely merged, touching intervals merge into one continuous block with no conflict, genuine overlap reported as a conflict, an item never conflicts with its own occurrences, at:-only and from:-with-no-to: zero-duration instants, invalid/missing-value diagnostics, skipped_recurring diagnostic, day-window free clipping)"
      - "python -m unittest tests.test_freebusy_cli -> Ran 8 tests, OK (text output, --json schema marker, --day-start/--day-end must-be-used-together, day-window clipping in JSON, invalid day-start/end ordering rejected, range-end-before-start fails loudly, diagnostics rendered as NOTE lines, --help)"
      - "python -m unittest tests.test_schema_extensions_v2 tests.test_safety_foundation tests.test_safety_cli tests.test_ticket_custom_field_public_contract tests.test_ticket_workflow_surfaces -> OK (schema bundle count 78 -> 79 updated everywhere it was hardcoded)"
      - "python -m unittest tests.test_cli_taxonomy tests.test_completion_surfaces tests.test_completion_values tests.test_surface_runtime -> OK (freebusy categorized under Query / Explore; no capability/command-catalog drift)"
      - "MPLBACKEND=Agg python -W ignore::ResourceWarning -m unittest discover -> full repository suite, OK"
      - "live: real python -m lifetxt freebusy against a real fixture (two overlapping Events, one Reminder at:, one plain Task with due: only) correctly reported 2 busy intervals, the right free gaps, 1 conflict, and 1 instant in both text and --json form"
      - "live: --day-start 09:00 --day-end 17:00 against a 2-day range correctly clipped free intervals to each day's working-hours window while leaving busy/conflicts unaffected"
      - "live: an item with from:not-a-date, an item with no time detail at all, and a repeat:daily item each produced the correct, distinct diagnostic (invalid_time_value / missing_time_detail / skipped_recurring) rather than being silently dropped"
      - python -m lifetxt check examples/minimal_life.txt -> OK 10 item(s)
      - ruff format --check / ruff check on every changed file -> clean
      - scripts/validate_release_docs.py -> {"errors":0,"ok":true}
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/673
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/675
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      Implemented on its own worktree/branch per repository owner
      instruction. Reuses `lifetxt.agenda.item_time_matches` unmodified;
      no second occurrence-timing engine was introduced. Matches from
      `notify_from`/`notify_to`/point keys (`due`/`do`/`moved_to`/
      `notify_at`) are deliberately excluded from busy computation by
      filtering on `item_time_matches()`'s own `key` field
      (`BUSY_MATCH_KEYS`), so recognizing a new match kind there
      automatically flows through unchanged. Registered in
      `cli_taxonomy.CATEGORIES` under "Query / Explore" alongside
      `temporal`. TUI, Web UI, and MCP exposure, recurring-occurrence
      expansion, and cross-timezone display conversion are explicit,
      unimplemented follow-up candidates recorded in
      docs/en/life-hub.md and docs/ja/life-hub.md rather than silently
      dropped.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-cli-surface-capability-matrix
    name: Per-command CLI/Web UI/TUI/API/MCP capability matrix
    summary: >-
      An additive, read-only `lifetxt capabilities --surface-matrix` report
      giving, for every real top-level CLI command, a deterministic support
      state (full/partial/unsupported/not_applicable/unmapped) on the Web
      UI, interactive curses TUI, REST API, and MCP surfaces. Derived from
      the existing `cli_taxonomy.all_commands()` command catalog (#629) and
      `surface_runtime.OPERATION_REGISTRY` (#50) rather than a second
      hand-maintained feature table; never changes the default
      `lifetxt capabilities` remote-client capability document.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-cli-surface-capability-matrix
    implementation_locations:
      - lifetxt/capability_matrix.py
      - lifetxt/extra_cli.py
      - lifetxt/extra_safety.py
      - tests/test_capability_matrix.py
      - docs/en/release-safety-foundations.md
      - docs/ja/release-safety-foundations.md
    public_interfaces:
      - lifetxt capabilities --surface-matrix
      - lifetxt.capability_matrix.matrix_payload
      - lifetxt.capability_matrix.command_surface_states
      - lifetxt-capability-matrix-v1 JSON document
    tests_or_evidence:
      - "tests/test_capability_matrix.py (13 tests): every state is one of the stable enum, unmapped/not_applicable/full/unsupported classification, multi-operation aggregation for `today`, aliases never appear as independent rows, matrix payload shape and full command coverage, text rendering, and that the default `lifetxt capabilities` document is unaffected"
      - python -m unittest tests.test_capability_matrix tests.test_surface_runtime tests.test_completion_surfaces tests.test_cli_taxonomy -> Ran 111 tests, OK (skipped=1)
      - "live: lifetxt capabilities --surface-matrix (text and --format json) render correctly; lifetxt capabilities (default) unchanged"
      - 'scripts/validate_release_docs.py -> {"errors": 0, "ok": true}'
      - ruff format --check / ruff check on changed files -> clean
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/676
    related_pull_requests: []
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      #676 asked to prefer extending cap-surface-capability-consistency
      (#50) unless the user-visible matrix has a genuinely separate
      contract. Implementation confirmed a separate contract is warranted:
      OPERATION_REGISTRY's `surfaces` tuple only distinguishes
      cli/web/mcp (no `tui`, and `web` bundles the browser UI and the REST
      API together), so a new small curated model
      (command-to-operation mapping, a not-applicable command set, and a
      curated TUI operation set) was needed to answer the per-command
      question this issue asks. `web_ui` and `api` are reported as two
      independently computed columns but currently agree for every row
      (both read `"web" in operation.surfaces`); documented as a known
      limitation rather than fabricating a finer distinction not yet
      verified. The command-to-operation mapping intentionally covers only
      commands with a clear, defensible correspondence to an existing
      OPERATION_REGISTRY entry (~23 of 110 commands); everything else is
      either a curated CLI-only `not_applicable` command (interface
      launchers, local administration, import/export converters) or
      honestly `unmapped` rather than guessed. Widening the curated mapping
      as more commands are audited is an explicit, unimplemented follow-up.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-remote-tui
    name: Web API-backed remote curses TUI
    summary: >-
      A narrow backend/data-source boundary for the interactive curses
      `lifetxt tui`, letting the same presentation layer operate against
      either local files (unchanged default behavior, #678) or a remote
      `lifetxt serve` Web API workspace over HTTP(S) (#679), with bounded
      background polling refresh and connection-status UX (#680), plus an
      opt-in bounded read-only offline cache for disconnected sessions
      (#681), and client-side temporary editor sessions that apply one
      validated item through the remote backend (#683). Remote mode
      (`lifetxt tui --remote-url URL`) reuses the
      server's existing item REST routes and its existing whole-file
      `If-Match`/`X-Lifetxt-Revision` precondition contract for
      revision-safe concurrent writes -- no server route needed to change
      for this.
    status: active
