name: Inspect staged P0 x105 patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/p0-format-contract-batch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-format-contract-batch
      - name: Record patch metadata
        shell: bash
        run: |
          set -u
          PATCH_B64=.github/agent-patch/lifetxt-p0-x105.patch.gz.b64
          {
            echo 'base64-bytes:'
            wc -c "$PATCH_B64"
            echo 'base64-sha256:'
            sha256sum "$PATCH_B64"
            echo 'decode:'
            if base64 -d "$PATCH_B64" > /tmp/lifetxt-p0-x105.patch.gz; then
              echo success
              echo 'gzip-bytes:'
              wc -c /tmp/lifetxt-p0-x105.patch.gz
              echo 'gzip-sha256:'
              sha256sum /tmp/lifetxt-p0-x105.patch.gz
              echo 'gzip-test:'
              gzip -t /tmp/lifetxt-p0-x105.patch.gz && echo success || echo failure
            else
              echo failure
            fi
          } | tee /tmp/patch-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p0-x105-patch-metadata
          path: /tmp/patch-metadata.txt
          if-no-files-found: error
