        - '/security-review pass (research + false-positive-filtering subagents) found a real CWE-426/427 issue: the original bare-name Command::new() calls relied on Windows'' default unqualified-name search order, which checks the app''s own directory and the current working directory before PATH -- a planted python.exe/lifetxt.exe next to a portable build would have been silently executed'
        - 'fix: resolve_on_path() restricts resolution to the PATH environment variable only; the resolved absolute path, not the bare name, is what both the --version probe and the real serve spawn use'
        - 'live re-verification after the fix: a decoy lifetxt.exe (an actual copy of notepad.exe, so execution would be visually unmistakable) placed in the current working directory, with no real lifetxt on PATH -- the app correctly showed the "could not find lifetxt" error state and notepad never launched, confirming the CWD-planted decoy was not executed'
        - 'live re-verification of the happy path after the fix: with the venv on PATH, Get-CimInstance confirmed the spawned child''s CommandLine now used the full resolved absolute path (e.g. "E:\project\lifetxt\.venv\Scripts\lifetxt.EXE" serve --host 127.0.0.1 --port <port>) rather than the bare name; /api/health on that port returned 200/ok:true; graceful close still released the process and port cleanly'
        - cargo build and cargo build --release both succeed after the fix
      release_or_deployment: null
      notes: >-
        See cap-desktop-app-companion-shell's notes for full scoping
        rationale. The false-positive-filtering subagent scored this
        finding 6/10 (below the security-review skill's own 8/10 report
        threshold, given a portable-build CWD-planting attacker could
        often achieve code execution by simpler means too, such as
        replacing the app's own binary) and its formal verdict was still
        INCLUDE. Applied the fix anyway per this project's own standing
        instruction to fix noticed insecure code immediately rather than
        only act on findings that clear a reporting bar -- the fix was
        cheap, well-understood, and left the code more correct with no
        behavior change to the happy path (re-verified live above).
      status: implemented

