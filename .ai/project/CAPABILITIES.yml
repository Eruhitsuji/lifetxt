  - id: cap-supported-platform-install
    name: Supported platform install
    summary: >-
      Keep a clean install on every supported platform able to run the recorded commands,
      including resolving timezones on Windows where zoneinfo has no database to read.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-clean-install-runtime
      - req-release-policy-cli-console-encoding-safety
    implementation_locations:
      - pyproject.toml
      - lifetxt/safety_foundation.py
      - readme.md
      - .ai/project/RULES.md
      - scripts/check_release_policy.py
    public_interfaces:
      - pyproject.toml project.dependencies
    tests_or_evidence:
      - 'a clean environment built by the recorded setup command must pass integration_test on every supported platform'
      - 'the tzdata marker must evaluate true only on win32; verified by evaluating the PEP 508 marker, not by assuming it'
      - 'when no timezone database is available, the message must name the remedy; an unknown zone name must not be reported as a missing database'
      - 'resolution must use only the declared source: tests/test_safety_foundation.py fails if an undeclared dateutil or pytz fallback is reintroduced'
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 1765 tests, OK (skipped=14)'
      - 'tests/test_check_release_policy_cli.py: the release-policy CLI falls back instead of crashing when stdout cannot encode a manifest character (e.g. Windows cp932), verified against a real io.TextIOWrapper'
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/73
      - https://github.com/Eruhitsuji/lifetxt/issues/76
      - https://github.com/Eruhitsuji/lifetxt/issues/95
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/75
      - https://github.com/Eruhitsuji/lifetxt/pull/137
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      Linux CI cannot detect a regression here: the marker excludes tzdata there and the
      system database hides the defect, so removing the dependency would leave CI green
      while breaking clean Windows installs. Verification must be run on Windows.
      The release-policy CLI console-encoding fallback (#95) is a distinct failure mode
      on the same "supported platform must be able to run the recorded commands" theme
      but is otherwise unrelated to the timezone dependency; see
      .ai/project/changes/release-policy-cli-console-encoding/ for that change's own
      requirements, design, and verification record.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-web-surface-structure
    name: Web surface structure
    summary: >-
      Keep the Web page asset separate from the routes that serve it, while
      lifetxt.webapp.HTML_PAGE stays the rebindable name that surface_runtime
      patches to install the browser revision bridge.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-module-structure-decomposition
    implementation_locations:
      - lifetxt/web_assets.py
      - lifetxt/web_routes_git.py
      - lifetxt/webapp.py
      - tests/test_web_assets.py
      - tests/test_web_routes_git.py
    public_interfaces:
      - lifetxt.webapp.HTML_PAGE
      - lifetxt.web_assets.HTML_PAGE
      - lifetxt.web_routes_git.register_git_routes
    tests_or_evidence:
      - tests/test_web_assets.py
      - 'the served page must stay byte-identical across any restructuring: compare sha256 of GET / before and after'
      - 'surface_runtime must keep rebinding webapp.HTML_PAGE; the bridge marker lifetxt-revision-contract-v1 has to be present in what webapp exposes and absent from the pristine asset'
      - 'a restructuring that drops the rebinding fails nothing else: the suite stays green while the browser silently stops sending If-Match'
      - tests/test_web_routes_git.py
      - 'a route module must not import fastapi at module level: create_app imports it inside the function behind an ImportError guard, which is what keeps import lifetxt.webapp working without the Web extras and the no-Web CI job green'
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 1778 tests, OK (skipped=14)'
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/67
      - https://github.com/Eruhitsuji/lifetxt/issues/82
      - https://github.com/Eruhitsuji/lifetxt/issues/84
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/83
      - https://github.com/Eruhitsuji/lifetxt/pull/85
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      Slice 1 of the decomposition plan in docs/design/module-structure.md. The asset
      is a Python module rather than package data because pyproject declares only
      packages = ["lifetxt"] with no package-data, so a data file would be missing from
      the wheel. Route grouping is slice 2 and depends on this.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-durable-transaction-recovery
    name: Durable transaction recovery
    summary: >-
      Keep multi-target transaction journals durable and explicitly recoverable when
      filesystem boundaries interrupt journal writes, including transient Windows
      replace handle refusals.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-durable-transaction-recovery
    implementation_locations:
      - lifetxt/transaction_journal.py
    public_interfaces:
      - lifetxt.transaction_journal.prepare
      - lifetxt.transaction_journal.inspect_journal
      - lifetxt.transaction_journal.resume
      - lifetxt.transaction_journal.compensate
      - lifetxt.transaction_journal.abandon_with_backup
    tests_or_evidence:
      - tests/test_transaction_journal_v3.py replace PermissionError retry and recovery tests -> Ran 11 tests, OK
      - tests/test_fault_matrix_v6.py tests/test_fault_drill_v5.py -> Ran 5 tests, OK
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 1786 tests, OK (skipped=14)'
      - python -m lifetxt check examples/minimal_life.txt -> OK: 10 item(s)
      - ruff format --check lifetxt tests scripts -> 245 files already formatted
      - ruff check lifetxt tests scripts -> All checks passed
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/76
      - https://github.com/Eruhitsuji/lifetxt/issues/78
      - https://github.com/Eruhitsuji/lifetxt/issues/86
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/94
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      `_write_bytes_durable` retries `PermissionError` only when `os.name` is
      `nt`, using the initial replace attempt plus four retries after 0.01,
      0.05, 0.1, and 0.25 seconds. Exhausting that budget re-raises the
      `PermissionError`; the existing journal and target state remain available
      for inspect/resume/compensate/abandon instead of being silently swallowed.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-atomic-replace-retry
    name: Atomic replace retry
    summary: >-
      Retry a transient Windows os.replace PermissionError (WinError 5) with a single,
      shared bounded policy across the shared atomic write commit primitive and the
      configuration backup/rejected-candidate rotation, matching the pattern already
      established for the transaction journal.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-atomic-replace-retry-shared-primitive
      - req-config-rotation-replace-retry
      - req-atomic-replace-retry-policy-consistency
    implementation_locations:
      - lifetxt/atomic.py
      - lifetxt/config_writer.py
    public_interfaces:
      - lifetxt.atomic.replace_with_retry
    tests_or_evidence:
      - tests/test_mutation.py AtomicReplaceRetryTests -> unit coverage of replace_with_retry (success, retry-then-success, exhaustion, non-Windows skip, non-PermissionError no-retry)
      - tests/test_mutation.py MutationTests atomic_write_bytes retry integration tests
