name: Update todo x117

on:
  push:
    branches:
      - agent/ticket-exact-revision-writes
    paths:
      - .github/workflows/update-todo-x117.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ticket-exact-revision-writes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update roadmap
        run: python .github/scripts/update_todo_x117.py
      - name: Remove one-time updater
        run: rm .github/scripts/update_todo_x117.py .github/workflows/update-todo-x117.yml
      - name: Commit roadmap
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add todo.md .github/scripts/update_todo_x117.py .github/workflows/update-todo-x117.yml
          git commit -m "Update ticket revision roadmap"
          git push
