  - requirement_id: req-server-update-backup-coverage-diagnostic
    capability_id: cap-ubuntu-server-deployment
    epic: https://github.com/Eruhitsuji/lifetxt/issues/500
    task_issue: https://github.com/Eruhitsuji/lifetxt/issues/529
    pull_request: https://github.com/Eruhitsuji/lifetxt/pull/530
    tests_or_evidence:
      - "tests/test_server_update.py BackupCoverageWarningsTests (6 tests) and RunServerUpdateBackupCoverageTests (4 tests): legacy and workspaces-shaped config coverage/uncoverage; absolute write_file used as-is; missing/unreadable/None application config degrades to no warning; dry-run and up_to_date reports both carry the field; the warning never changes status/exit code; CLI text output includes the warning"
      - python -m unittest tests.test_server_update -> Ran 122 tests, OK (skipped=1)
      - "confirmed via git stash (production code only, tests kept) that all 9 original new tests (before a path-resolution bug fix found during live verification required rewriting 6 of them) fail against the pre-#529 code, then pass once the fix is restored"
      - "live: a real disposable bare-origin + checkout git repository with a real ahead-of-current-branch commit; a real `lifetxt server-update --server-config ...` dry-run against a workspaces-shaped .lifetxt.json with one covered and one uncovered workspace correctly printed a warning naming only the uncovered write target's absolute path; re-run with both paths in backup_paths printed no warning"
      - "found and fixed during that same live verification (not caught by the first pass of unit tests, which used bare relative-path backup_paths matching the raw unresolved config string): a relative `write_file` value in .lifetxt.json must be resolved against the application config file's own directory via lifetxt.workspace.config_base_dir() before comparison, exactly as lifetxt.workspace.iter_workspace_definitions() consumers do elsewhere -- comparing the raw relative string against backup_paths's (typically absolute) entries would have falsely flagged every relative write_file as uncovered even when it named the exact same file"
      - python -m lifetxt check examples/minimal_life.txt -> OK 10 item(s)
      - ruff format --check / ruff check on changed files -> clean
    release_or_deployment: null
    status: implemented

