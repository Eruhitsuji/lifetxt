  - id: cap-data-integrity-readonly-report
    name: Read-only data integrity report
    summary: >-
      A `lifetxt integrity` CLI command that aggregates existing read-only
      parser, validator, duplicate-ID/reference, attachment, workspace, and
      ticket diagnostics into one text or `integrity-v1` JSON report without
      repairing, rewriting, migrating, archiving, recovering, or deleting user
      data.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-data-integrity-readonly-report
      - req-data-integrity-suite-final
      - req-data-integrity-ai-context
    implementation_locations:
      - lifetxt/integrity.py
      - lifetxt/cli.py
      - tests/test_integrity.py
      - docs/en/cli.md
      - docs/ja/cli.md
      - .kiro/specs/data-integrity-suite/
    public_interfaces:
      - lifetxt integrity
      - lifetxt integrity --json
      - lifetxt integrity --verify-files
      - lifetxt integrity --profile strict
      - lifetxt integrity --ai-context
      - lifetxt integrity --graph
      - lifetxt integrity plan
      - lifetxt integrity apply
      - integrity-v1 JSON report
      - integrity-plan-v1 JSON repair plan
      - integrity-apply-v1 JSON apply result
    tests_or_evidence:
      - ".venv\\Scripts\\python.exe -m unittest tests.test_integrity -> Ran 4 tests, OK"
      - ".venv\\Scripts\\python.exe -m unittest tests.test_lifetxt.LifeTxtCheckLineTests tests.test_lifetxt.LifeTxtAiDoctorCliTests -> Ran 14 tests, OK"
      - ".venv\\Scripts\\python.exe -m lifetxt check examples\\minimal_life.txt -> OK 10 item(s)"
      - ".venv\\Scripts\\python.exe scripts\\validate_release_docs.py --output .cache\\release-doc-validation.json -> {\"errors\": 0, \"ok\": true}"
      - ".venv\\Scripts\\ruff.exe check lifetxt\\integrity.py tests\\test_integrity.py lifetxt\\cli.py -> All checks passed"
      - ".venv\\Scripts\\ruff.exe format --check lifetxt\\integrity.py tests\\test_integrity.py lifetxt\\cli.py -> 3 files already formatted"
      - ".venv\\Scripts\\python.exe -m unittest tests.test_integrity -> Ran 11 tests, OK"
      - ".venv\\Scripts\\python.exe -m unittest tests.test_integrity -> Ran 15 tests, OK"
      - ".venv\\Scripts\\python.exe -m unittest tests.test_integrity -> Ran 19 tests, OK"
      - "#565: tests/test_integrity.py graph tests (7 tests): --graph omitted by default (no category:graph rows), orphan/hub/component/longest-chain reporting against a real fixture, no-orphans-passed state, no-ids-skipped state, longest-chain check reported blocked with warning severity on a cycle, --graph works with the plan subcommand, every fixture file byte-unchanged"
      - "#565: python -m unittest tests.test_integrity -> Ran 25 tests, OK"
      - "#565: live: lifetxt integrity --graph against a real fixture (chain a<-b<-c plus two orphans) reported 2 orphans, correct hub ranking, 3 connected components (largest 3), and a 3-item longest chain; omitting --graph left output unchanged"
      - "#565: scripts/validate_release_docs.py -> {\"errors\": 0, \"ok\": true}"
      - "#565: ruff format --check / ruff check lifetxt/integrity.py lifetxt/cli.py tests/test_integrity.py -> clean"
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/517
      - https://github.com/Eruhitsuji/lifetxt/issues/520
      - https://github.com/Eruhitsuji/lifetxt/issues/522
      - https://github.com/Eruhitsuji/lifetxt/issues/524
      - https://github.com/Eruhitsuji/lifetxt/issues/565
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/518
      - https://github.com/Eruhitsuji/lifetxt/pull/521
      - https://github.com/Eruhitsuji/lifetxt/pull/523
      - https://github.com/Eruhitsuji/lifetxt/pull/566
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      cc-sdd data-integrity-suite working spec implementation. The suite remains
      read-only: strict profiles alter only effective severity, cross-file
      registry/source-UID/recovery checks report local evidence only, and
      repair planning emits deterministic JSON candidates without applying them.
      Issue #522 adds one high-assurance apply path for missing-ID assignment
      only, guarded by explicit confirmation and expected source revision.
      Issue #524 adds opt-in read-only AI-context diagnostics for #500/#503:
      named workspace shape evidence and Personal AI Memory convention checks.
      Recovery actions, sync reconciliation, archive cleanup, migration, and
      general repair application remain out of scope.
      #565 adds opt-in `category: graph` diagnostics (`G001`-`G005`) reusing
      `lifetxt.links.link_records`/`critical_path` unmodified rather than a
      second graph implementation: orphan items (a unique `id:` with no
      relation of any kind, bounded to 20 ids with a `truncated` flag),
      the top-10 most-referenced hub ids, connected-component count and
      largest-component size over the full relation graph, and the longest
      `depends_on`/`blocks` chain (reusing `cap-graph-link-foundation`'s
      #564 `critical_path()` directly). A dependency cycle reports `G005` as
      `blocked` with `warning` severity rather than raising, matching this
      module's existing graceful-degradation design; every other graph row
      is `info` severity, so `--graph` never adds a spurious "manual review"
      entry to `integrity plan`'s output via the existing generic
      `_plan_action` logic. `integrity-v1` has no published JSON Schema (only
      `backup-integrity-v1.schema.json` is unrelated and pre-existing), so no
      schema generator needed updating.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

