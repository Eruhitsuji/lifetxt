commands:
  setup:
    status: configured
    values:
      - python -m pip install -e .

  format:
    status: tracked_exception
    values: []
    exception:
      reason: >-
        No dedicated formatter is configured. Adoption is blocked on the Python
        baseline: the project declares requires-python >=3.6, ruff publishes no
        3.6-compatible wheel, and the newest black usable on 3.6 is 22.8.0.
        Adopting one would also reformat ~237 files / ~87k lines in a single
        change.
      removal_condition: >-
        Remove this exception when a formatter runs on the supported Python
        baseline and its command is recorded here.
      tracked_by: https://github.com/Eruhitsuji/lifetxt/issues/44

  lint:
    status: tracked_exception
    values: []
    exception:
      reason: >-
        No dedicated lint command is configured. Blocked on the same Python
        baseline as the formatter exception above; the pylint 1.8.4 present in
        the local 3.6 environment is too old to adopt as a project gate.
      removal_condition: >-
        Remove this exception when a linter runs on the supported Python
        baseline and its command is recorded here.
      tracked_by: https://github.com/Eruhitsuji/lifetxt/issues/44

  unit_test:
    status: configured
    values:
      - MPLBACKEND=Agg python -m unittest discover

  unit_test_windows_powershell:
    status: configured
    values:
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover'

  integration_test:
    status: configured
    values:
      - python -m lifetxt check examples/minimal_life.txt

  full_check:
    status: configured
    values:
      - MPLBACKEND=Agg python -m unittest discover
      - python -m lifetxt check examples/minimal_life.txt

  full_check_windows_powershell:
    status: configured
    values:
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover'
      - python -m lifetxt check examples/minimal_life.txt
