      - "#563: tests/test_lifetxt.py LifeTxtWebApiTests.test_graph_api_include_temporal_overlays_edges_tagged_by_kind, test_graph_api_include_temporal_without_root_has_no_effect; LifeTxtMcpTests.test_mcp_get_graph_include_temporal_overlays_edges_tagged_by_kind -- both confirm temporal_context() is reused unmodified via the new webapp._temporal_overlay_edges/mcp _tool_get_graph wiring, bounded to root's own neighborhood only"
