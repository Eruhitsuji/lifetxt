  - id: cap-desktop-app-companion-shell
    name: Tauri desktop app companion shell
    summary: >-
      A native desktop window wrapping lifetxt's existing Web UI via a
      Rust/Tauri v2 companion-process shell (desktop/src-tauri/): locates
      an already-installed lifetxt, reserves a free local port, spawns
      `lifetxt serve --host 127.0.0.1 --port <port>` as a child process
      unmodified, waits for /api/health, navigates the window to the real
      served UI, and kills the child on graceful app/window close. No
      Python code added or changed; no standalone Python-bundled
      distributable in this slice.
    status: active
    owner: Eruhitsuji
    source_requirements:
