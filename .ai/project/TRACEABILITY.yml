        Third implementation task of the ubuntu-server-deployment batch.
        Security/High assurance (production git/service mutation
        automation, same escalation basis as cap-lifetxt-self-update and
        cap-remote-single-worker-guard); requires independent security
        review and Merge Authority approval before merge to main. Git
        operations are exercised through a fake injected via
        server_update._git_helpers rather than a real git working tree,
        matching how LifeTxtUpdateCommandCliTests already covers the same
        underlying git plumbing with subprocess.run mocked (plus prior live
        disposable-clone verification recorded against that command); this
        entry does not repeat live git verification since the git mechanics
        are unchanged, reused code. #273 (risk classification and a
        pre-mutation review/approval gate for high-impact updates) remains
        a separate, not-yet-implemented follow-up issue extending this same
        capability.

        Independent review on PR #274 (CodeX plus this session's own
        /security-review) found and this session fixed three real gaps
        before merge: (1) `server-update` stopped and later restarted every
        configured service unconditionally -- `systemctl stop` on an
        already-inactive unit still exits 0, so a unit the operator had
        intentionally left stopped would get silently started; fixed by
        checking `systemctl is-active` first and only stopping/restarting
        units that were actually active. (2) The runbook documented #273's
        review gate and `--approve` flag as already shipped and used
        `--config` instead of the real `--server-config`; corrected, and
        added the `docs/en/cli.md` §22 reference this PR had linked to but
        never written. (3) `create_backup()` lacked the symlink-safe
        `O_CREAT|O_EXCL` pattern `UpdateLock` already used for its own lock
        file; own `/security-review` scored this finding 3/10 (EXCLUDE,
        requires a pre-existing directory-permission misconfiguration
        outside this code) but it was fixed anyway as cheap, well-understood
        hardening, per this project's standing practice of correcting
        noticed insecure code regardless of report thresholds.
      status: implemented

