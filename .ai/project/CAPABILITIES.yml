      - lifetxt.archive_plan_v1.verify_recovery_evidence_reachable
    tests_or_evidence:
      - tests/test_archive_plan_v1.py EmitPlanTests, ApplyPlanTests, ArchivePlanV1UnitTests (29 tests)
      - tests/test_schema_extensions_v2.py bundle-completeness gate (77 documents)
      - python -m unittest tests.test_archive_plan_v1 tests.test_schema_extensions_v2 tests.test_project_archive_safety_v3 tests.test_project_archive -> Ran 51 tests, OK
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> full suite green after fixing four other test files'' hardcoded schema-bundle document counts (76 -> 77)'
      - 'live: real lifetxt project archive --dry-run --emit-plan against a disposable fixture wrote a schema-valid plan matching live SHA-256 revisions and dry-run candidates'
      - 'live: real lifetxt project archive --apply-plan without --yes verifies and writes nothing; with --yes archives correctly, matching the equivalent --revision invocation'
      - 'live: a hand-edited plan and a plan applied after its source changed were both rejected before any write, with the source file confirmed byte-for-byte unchanged in each case'
      - '/security-review (research + false-positive-filtering subagents): 1 finding confirmed at 8/10 -- plan_hash was described as "tamper detection" but is a self-referential checksum with no external key; fixed by renaming to "self-consistency check" throughout and removing misleading "share it" doc language. A second candidate (unscoped plan source/destination paths) was excluded at 2/10, confirmed pre-existing in archive_safety_v3.py, not a regression'
      - python -m lifetxt check examples/minimal_life.txt -> OK: 10 item(s)
      - ruff format --check / ruff check lifetxt tests scripts -> clean (pre-existing drift in 3 unrelated files confirmed present on main already)
