      command: python -m unittest tests.test_mcp_expansion -v
      requirement_ids:
        - req-mcp-permission-profiles-selection
        - req-mcp-permission-profiles-read-enforcement
        - req-mcp-permission-profiles-assist-enforcement
        - req-mcp-permission-profiles-full-compat
