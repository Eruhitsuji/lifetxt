    - requirement_id: req-external-verification-redaction-hardening
      capability_id: cap-stable-external-verification-preparation
      epic: https://github.com/Eruhitsuji/lifetxt/issues/283
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/430
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/434
      changed_files_or_scope:
        - scripts/run_external_verification.py
        - tests/test_external_verification.py
      tests_or_evidence:
        - tests/test_external_verification.py RedactionHardeningTests (3 tests)
        - tests/test_external_verification.py WriteBundleSafetyNetTests (4 tests)
        - 'git stash confirmed all 5 new tests reproduce the original defects against the pre-fix code'
        - python -m unittest tests.test_external_verification -> Ran 13 tests, OK
        - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 2427 tests, 2426 OK plus 1 pre-existing unrelated failure (separately tracked/fixed as #432, not present on this branch)'
        - python -m lifetxt check examples/minimal_life.txt -> OK 10 item(s)
        - ruff format --check / ruff check on changed files -> clean
      release_or_deployment: null
      notes: >-
        Real Windows/WSL external-verification bundles collected under
        #425/#426 exposed two sanitizer defects before this fix: a Windows
        account-name path segment survived redaction (case-sensitive
        str.replace() missed a differently-cased path emitted by a child
        tool such as pip), and temp paths were repeatedly normalized as
        `<temp><temp>...` (56 occurrences in the supplied bundle), showing
        redaction was not idempotent/canonical. Root-caused by empirical
        reproduction rather than by guessing: (1) case-sensitive exact-match
        replacement, and (2) a fixed repo/home/temp processing order that let
        the shorter `home` path consume `temp`'s shared prefix when `%TEMP%`
        is nested inside `%USERPROFILE%` (the normal Windows layout), so
        `temp`'s own marker never had a chance to apply. Rewritten as one
        case-insensitive, longest-candidate-first, single-pass regex
        substitution, plus a persistence-time rescan-and-refuse safety net in
        `write_bundle()` as explicit defense in depth. The literal reported
        `<temp><temp>` byte sequence could not be reproduced without the
        original bundle (never pasted, per #430's own security note); the
        fix addresses the underlying ordering/case defect class it points at
        and adds the persistence-time safety net regardless. Regenerating
        fresh Windows/WSL bundles after this fix (#430's own last acceptance
        criterion) is external-environment work outside this sandbox and
        remains open.
      status: implemented

    - requirement_id: req-verification-python-bootstrap
      capability_id: cap-stable-external-verification-preparation
      epic: https://github.com/Eruhitsuji/lifetxt/issues/283
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/435
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/436
      changed_files_or_scope:
        - scripts/verification_python_bootstrap.py
        - tests/test_verification_python_bootstrap.py
        - scripts/run_external_verification.py
        - tests/test_external_verification.py
        - scripts/verify-external.ps1
        - scripts/verify-external.sh
        - docs/en/external-environment-verification.md
      tests_or_evidence:
        - tests/test_verification_python_bootstrap.py (18 tests: host_key normalization, existing-interpreter discovery priority and unsupported-only rejection, Windows py-launcher probing, managed-Python provision including verified download+extract/reuse/checksum-mismatch-rejection-before-extraction/unsupported-host/download-failure, venv creation/reuse, bootstrap-path redaction under the existing <repo> marker)
        - tests/test_external_verification.py: two new tests asserting a venv-creation failure degrades to a blocked release-profile check rather than crashing the collector, and that a bootstrap failure blocks the release profile without a fabricated pass
        - python -m unittest tests.test_verification_python_bootstrap tests.test_external_verification -> Ran 31 tests, OK
        - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 2453 tests, OK (skipped=5)'
        - python -m lifetxt check examples/minimal_life.txt -> OK 10 item(s)
        - ruff check / ruff format --check on every new and changed file -> clean (pre-existing unrelated drift confirmed present on main already, not introduced by this change)
        - scripts/validate_release_docs.py passes against the updated docs/en/external-environment-verification.md
        - 'live end-to-end on this Windows host: gh api resolved astral-sh/python-build-standalone''s real latest release tag (20260807); provision_managed_python() itself (not raw curl/tar) downloaded the real Windows 3.12.13 install_only asset, confirmed its SHA256 matched the manifest, extracted it, and ran the resulting python.exe --version -> Python 3.12.13; a second call reused the install (reused: true) instead of re-downloading'
        - 'live on WSL: find_existing_interpreter() discovered a real python3.10 on PATH; create_verification_venv() surfaced a real CalledProcessError from this host''s missing python3-venv ensurepip support; the wrapped try/except in build_bundle() correctly degraded to a blocked release-profile check with the real redacted error message instead of crashing, and the collector still wrote valid evidence JSON (exit=0)'
      release_or_deployment: null
      notes: >-
        Generalizes #429's finding: the collector's release-profile invocation
        always used sys.executable, so a host whose only available Python was
        not one of the stable-release matrix's three supported versions
        (3.10/3.11/3.12) could not run the flow at all, and a venv does not fix
        this since it inherits its creator's version. scripts/verification_python_bootstrap.py
        is pure stdlib (no new runtime dependency) since it must run under any
        host Python, including unsupported ones, to find or provision a
        supported one. It prefers an already-installed supported interpreter
        (search order 3.12 -> 3.11 -> 3.10, checking the *reported* version
        rather than trusting the executable name) and otherwise provisions a
        verification-only interpreter from a pinned, SHA256-verified
        python-build-standalone release into .cache/lifetxt-verify-python/ --
        checksum verification happens strictly before any archive extraction,
        and a mismatch is rejected without extracting anything. No new
        redaction category was needed: .cache/ lives inside repo_root, which
        the existing <repo> marker from #430 already covers, verified by a
        dedicated regression test rather than assumed. Two new one-command
        entry scripts (scripts/verify-external.ps1, scripts/verify-external.sh)
        find any Python 3 already on the host to hand off to the collector,
        which then bootstraps a supported interpreter itself; a host with
        literally no Python 3 remains an explicit blocked/manual case.
        Escalated from the issue's preferred S size to M, per the issue's own
        explicit allowance, given the genuine cross-platform download/verify/
        extract scope; justification recorded here and in the PR rather than
        forced smaller. Three real defects were found and fixed during live
        (non-mocked) testing rather than by inspection alone:
        _managed_python_executable() assumed a flat archive layout instead of
        python-build-standalone's python/ wrapper directory (which had also
        broken the reuse check, causing a re-download on every call); two test
        assertions checked Path.exists() after their own
        tempfile.TemporaryDirectory() context had already deleted the
        directory (always-false tautologies); and an uncaught
        subprocess.CalledProcessError from venv creation on a real
        ensurepip-less host would have crashed the entire collector before any
        evidence was written, fixed by wrapping that call site in build_bundle()
        with a try/except that degrades to a blocked check, matching this
        capability's established graceful-degradation design. Real
        re-verification on native Linux and macOS after merge remains
        external-environment work outside this sandbox and is recorded as
        open, matching the pattern already established for #429/#430/#432.
      status: implemented

    - requirement_id: req-external-verification-timeout-resilience
      capability_id: cap-stable-external-verification-preparation
      epic: https://github.com/Eruhitsuji/lifetxt/issues/283
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/437
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/440
      changed_files_or_scope:
        - scripts/run_external_verification.py
        - tests/test_external_verification.py
        - docs/en/external-environment-verification.md
      tests_or_evidence:
        - "tests/test_external_verification.py: run_command() records a real subprocess timeout as status \"timeout\" (never \"failed\"/\"passed\"), with timeout_seconds and retained partial stdout; bundle_exit_code() fails the run on a release-profile or git-identity timeout exactly like a failure; the default release_timeout has real headroom (>= 2x) over the highest confirmed real-host duration; --release-timeout/--probe-timeout parse and override independently; a bash-gated end-to-end test invokes scripts/verify-external.sh for real and asserts the printed summary and evidence bundle reflect the overridden --release-timeout"
        - python -m unittest tests.test_external_verification -> Ran 24 tests, OK
        - "confirmed via git stash (production code only, tests kept) that 5 of the new/changed tests fail against the pre-#437 code, then pass once the fix is restored"
        - "live end-to-end on this Windows host: run_command() against a real slow subprocess with a 2s timeout recorded status=timeout, exit_code=null, timeout_seconds=2, and retained the real partial stdout the process had already printed"
        - "live: real .\\scripts\\verify-external.ps1 --release-timeout 8765 --skip-release run printed release_timeout=8765 and wrote a real evidence bundle; real ./scripts/verify-external.sh with --release-timeout 4321 --skip-release did the same over a real bash subprocess, proving wrapper argv forwarding without needing to invoke the internal Python script directly"
        - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 2462 tests, OK (skipped=5)'
        - python -m lifetxt check examples/minimal_life.txt -> OK 10 item(s)
        - ruff format --check / ruff check on scripts/run_external_verification.py and tests/test_external_verification.py -> clean (pre-existing unrelated drift confirmed present on main already, not introduced by this change)
        - 'scripts/validate_release_docs.py -> {"errors": 0, "ok": true} against the updated docs/en/external-environment-verification.md'
      release_or_deployment: null
      notes: >-
        Real supported-host runs at commit b57aa84 (#435's own merge) showed
        the fixed 7200-second release-profile timeout was too tight: Windows
        completed in ~5316s, WSL in ~4959s, and native Linux/macOS both
        reached the full test run but were cut off by the collector itself at
        the boundary with no compatibility failure observed before the
        cutoff -- the timeout was stopping the run, not the run failing.
        Fixed by raising the default to 14400s (roughly 2.7x headroom over the
        highest confirmed real duration) and by making a timeout a distinct,
        unambiguous result: run_command() records status "timeout" (never
        "failed"/"passed") with an explicit timeout_seconds field and
        retained partial stdout/stderr; bundle_exit_code() fails the
        collector's exit code on a release-profile or git-identity timeout
        exactly like it already did for "failed". The independent, much
        shorter --probe-timeout (default 30s) is unchanged.
        verify-external.ps1/verify-external.sh already forwarded all
        arguments unconditionally, so no wrapper-script code change was
        needed for --release-timeout to reach them -- verified live on both
        Windows (PowerShell) and via a real bash-gated automated test rather
        than assumed from reading the forwarding code alone. Real Linux/macOS
        reruns beyond the previous 7200s boundary, per the issue's own
        acceptance criterion, remain external-environment work outside this
        sandbox and are recorded as open.
      status: implemented

