    status: passed
    result: 35 tests passed, no skips; includes non-TTY subprocess, FIFO, source BOM/CRLF
      hashes, 500-step and edge limits, closed cycles, cross-root targets, generic
      roundtrip and independent bilingual occurrences.
  - type: regression
    command: python -m unittest tests.test_procedure_definition tests.test_procedure_validation
