      any test, that cross-file parent:/depends_on: resolution and cycle detection,
      source-metadata (item.source) preservation through link_records, and the
      missing/permission-denied/symlinked-input policy were all already correct --
      the gap was missing regression coverage, not a defect. No production code
      in lifetxt/links.py, lifetxt/paths.py, lifetxt/cli.py, or lifetxt/entrypoint.py
      changed for #421; the missing/permission-denied fail-loudly policy (routed
      through entrypoint.main's top-level OSError handling) is now documented in
      docs/en/cli.md rather than left as unstated, correct-by-accident behavior.
      docs/ja/cli.md's Input Paths section was found already out of sync with
      docs/en/cli.md predating #421 (missing the #415/#418 deterministic-order
      and cross-file-reference paragraphs); rather than silently deepen that gap
      with an English-only addition, the whole-section sync was filed separately
      as #422 instead of folded into this capability's own change.
      #422 closes that drift: docs/ja/cli.md's "2.1 入力 path" section now
      carries the same three paragraphs docs/en/cli.md's "2.1 Input Paths"
      does (deterministic multi-file expansion order, cross-file reference/
      cycle-detection scope, and the missing/permission-denied/symlinked-
      input policy). No English content changed, and per #422's own scope a
      broader audit of the rest of docs/ja/cli.md against docs/en/cli.md was
      not attempted.
      #563 closes a concrete Web/MCP parity gap found by reading
      `lifetxt/webapp.py`'s `get_graph` route and `lifetxt/mcp.py`'s
      `_tool_get_graph` directly: neither accepted a relation-type filter,
      unlike `list_links`/CLI `links`, which already do via
      `link_records(..., relations=...)`. Both now accept a `relations`
      parameter reusing that same filtering, with no new engine code. It
      also closes a gap `cap-temporal-context`'s own notes had already
      recorded as an explicit, unimplemented follow-up ("any change to
      `/api/graph`... remain explicit, unimplemented follow-ups"): an opt-in
      `include_temporal` parameter (bounded to when `root` is given, matching
      `temporal_context()`'s own single-target design -- it is never an
      all-pairs scan) overlays that root's `same_day`/`before`/`after`
      neighbors as additional edges via a new shared
      `webapp._temporal_overlay_edges` helper (imported into `mcp.py` the
      same way `_subgraph` already is). Every edge gains a `kind` field
      (`structural`/`temporal`) only when `include_temporal` is actually
      used, so the default `/api/graph`/`get_graph` response stays
      byte-for-byte unchanged -- confirmed by a dedicated regression test.
      #564 adds `--topo`/`--critical-path`/`--path` to `lifetxt links`,
      three query modes over the graph's existing DAG rather than a second
      graph representation. `topological_order`/`critical_path` share a new
      `_dependency_ordering_edges` builder that generalizes
      `_dependency_cycle_diagnostics`'s own combined depends_on/inverse-blocks
      model (an edge `A -> B` means "A is waiting on B") to an explicit
      relation subset; both raise a new `LinksCycleError` (a `ValueError`
      subclass) naming the involved ids on a cycle, reusing the same
      fail-loudly convention `lifetxt.vm.VMProgramError` established.
      `critical_path`'s optional `estimate_sum` field is populated only when
      every item on the winning chain carries a plain numeric `estimate:`
      detail (not `elapsed:`'s duration syntax), and is `None` otherwise --
      deliberately not a new required schema field, matching the issue's own
      out-of-scope note. `shortest_path` BFS-traverses `link_records`'s edges
      bidirectionally (mirroring `webapp._subgraph`'s reachability model),
      since "how are these two items connected" does not depend on which
      direction a relation happens to be asserted in. All three CLI flags are
      mutually exclusive with each other and with `--id`, except that
      `--critical-path` accepts the existing `--chain ID` as its optional
      root. Web/MCP exposure of these three new queries is an explicit,
      unimplemented follow-up per #564's own scope.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

