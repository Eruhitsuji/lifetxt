name: Apply PR14 CI compatibility fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/repair-pr13-implementation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-pr13-implementation
          fetch-depth: 0
      - name: Verify, apply, and push compatibility fix
        run: |
          if [ ! -f .github/fix-patch/part-00 ]; then
            echo 'Compatibility fix patch is already consumed.'
            exit 0
          fi
          echo 'a42545c506ee10791f441ad96d4e568ec7d5a8625387421f5dc39f211d9da294  .github/fix-patch/part-00' | sha256sum --check
          base64 -d .github/fix-patch/part-00 | gzip -d > /tmp/pr14-ci-fix.patch
          echo 'd351360d4b1a4b792f417341856244b6c6ee5d83e8e81e15ac3bd7cb7d72d699  /tmp/pr14-ci-fix.patch' | sha256sum --check
          git apply --check /tmp/pr14-ci-fix.patch
          git apply --index /tmp/pr14-ci-fix.patch
          rm -rf .github/fix-patch
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix shared mutation routing compatibility'
          git push origin HEAD:agent/repair-pr13-implementation
