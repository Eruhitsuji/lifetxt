      Full-suite cleanup for the three unrelated/environment-sensitive
      failures that reproduced outside #617's write scope:
      tests.test_external_verification.ProcessTreeTimeoutTests x2 and
      tests.test_paths.MultiFileSourceIntegrityTests.
      test_permission_denied_file_among_multiple_sources_fails_loudly.
    owner: Eruhitsuji
  - description: >-
      Independent security review and Merge Authority approval, per this
      change's own human_approvals_required.
    owner: Eruhitsuji
