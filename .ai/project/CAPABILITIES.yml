      - https://github.com/Eruhitsuji/lifetxt/issues/974
      - https://github.com/Eruhitsuji/lifetxt/issues/976
      - https://github.com/Eruhitsuji/lifetxt/issues/977
      - https://github.com/Eruhitsuji/lifetxt/issues/981
