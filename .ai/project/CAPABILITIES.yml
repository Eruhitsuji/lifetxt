      replaced_by: null
      deprecation_issue: null

  - id: cap-local-test-compatibility
    name: Local test compatibility
    summary: Keep the local unittest suite runnable on the declared Python >=3.10 runtime, including Windows/PowerShell environments, without reducing the coverage that Linux CI executes.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-local-unittest-compatibility
    implementation_locations:
      - pyproject.toml
      - lifetxt/
      - tests/
      - .ai/project/COMMANDS.yml
    public_interfaces:
      - .ai/project/COMMANDS.yml
    tests_or_evidence:
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover'
      - python -m lifetxt check examples/minimal_life.txt
      - ruff check lifetxt tests scripts
      - 'environment-dependent suites must skip with a diagnostic reason rather than fail; verify both guard branches (working bash runs them, unusable bash skips them)'
      - 'tests/test_supported_runtime.py must fail, not skip, on an interpreter below requires-python; a run on an unsupported interpreter silently covers fewer tests and is not evidence'
      - 'the guard must read the baseline from pyproject.toml and raise when it cannot be parsed, so a reshuffle cannot disarm it'
      - 'the guard module must stay in syntax the rejected interpreters can import, or its message degrades into the import error it exists to explain'
      - 'a failing or flaky run must be reportable with complete output: unit_test_captured retains it in .test-output.log so a truncating display cannot destroy the evidence'
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/36
      - https://github.com/Eruhitsuji/lifetxt/issues/41
      - https://github.com/Eruhitsuji/lifetxt/issues/44
      - https://github.com/Eruhitsuji/lifetxt/issues/72
      - https://github.com/Eruhitsuji/lifetxt/issues/78
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/38
      - https://github.com/Eruhitsuji/lifetxt/pull/42
      - https://github.com/Eruhitsuji/lifetxt/pull/71
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-config-safe-writes
    name: Safe configuration writes
    summary: >-
      Refuse a configuration write that would clobber a concurrent change, and keep the
      refused edit recoverable. The precondition is compared inside the shared sidecar
      lock so no writer can commit between the check and the write. Optionally retain a
      bounded, metadata-only audit trail of write attempts that survives once the
      bounded .bak/.rejected rotation has overwritten the corresponding slot.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-config-concurrent-write-safety
      - req-config-workspace-write-excludes-injected-paths
      - req-config-write-audit-trail
    implementation_locations:
      - lifetxt/config_writer.py
      - lifetxt/cli.py
      - lifetxt/config_registry.py
      - lifetxt/schema_extensions_v5.py
      - dist/schemas/config-v1.schema.json
      - docs/en/config.md
      - docs/ja/config.md
    public_interfaces:
      - lifetxt.config_writer.write_config
      - lifetxt.config_writer.config_revision
      - lifetxt.config_writer.rejected_candidates
      - lifetxt config revision
      - lifetxt config set|unset|migrate --expected-revision
      - config.write.require_revision
      - config.write.audit_log
      - config.write.audit_max_bytes
      - lifetxt config explain config.write.require_revision
      - lifetxt config explain config.write.audit_log
    tests_or_evidence:
      - tests/test_config_validation.py ConfigRevisionTests
      - tests/test_config_validation.py ConfigWriteAuditTests
      - 'the precondition must reach lifetxt.mutation.write_text so the comparison happens inside the lock; a check performed before the write is not sufficient'
      - 'a refused write must leave the file byte-identical, retain the candidate, and not consume a backup generation'
      - 'an audit record must never contain configuration content or key values, verified with a marker string and a secret-referencing key absent from the audit line'
      - 'the audit log is disabled by default (unset audit_log produces no file) and trims to audit_max_bytes from the oldest end once forced past the cap'
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 1970 tests, OK (skipped=12) other than the traceability-gate entry this PR itself completes'
      - "tests/test_lifetxt.py LifeTxtConfigCliTests: config set|unset|migrate against a named-workspace config no longer writes back resolved paths/write_file; a legacy top-level paths/write_file config is unaffected"
      - "reproduced live via lifetxt.cli.main against a real workspace config: before the fix, config set defaults.person alice added absolute paths/write_file it never declared; after the fix it does not"
      - "reproduced live via the installed lifetxt console script: config set web.port 9000 against a config with config.write.audit_log set appends exactly the expected JSONL line"
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/47
      - https://github.com/Eruhitsuji/lifetxt/issues/90
      - https://github.com/Eruhitsuji/lifetxt/issues/91
      - https://github.com/Eruhitsuji/lifetxt/issues/136
      - https://github.com/Eruhitsuji/lifetxt/issues/157
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/58
      - https://github.com/Eruhitsuji/lifetxt/pull/59
      - https://github.com/Eruhitsuji/lifetxt/pull/98
      - https://github.com/Eruhitsuji/lifetxt/pull/141
      - https://github.com/Eruhitsuji/lifetxt/pull/159
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      Configuration-driven enforcement is available through
      config.write.require_revision, matching the ticketing.write.require_revision
      shape. Normal CLI config set|unset|migrate writes to the loaded file still
      discover and send the revision automatically; writes that cannot discover a
      revision, such as writing to a different --output file without
      --expected-revision, are refused when the setting is enabled.
      _maybe_apply_workspace() (lifetxt/cli.py) injects resolved paths/write_file/
      generated_paths into the loaded config for read-time convenience; it now
      records exactly which keys it injected on args._workspace_injected_keys so
      config set|unset|migrate can exclude them from the write, fixing #136
      (found while investigating #89). Legacy top-level paths/write_file configs
      never trigger workspace resolution, so they are unaffected.
      config.write.audit_log (#157) mirrors lifetxt.remote_access.append_audit's
      bounded-JSONL-append-and-trim shape rather than inventing a new one; it
      records only path/outcome/revision metadata for write attempts reaching the
      compare-and-set stage (accepted and rejected-as-stale), and is disabled by
      default. It does not audit validation-error or unsupported-version
      refusals, which mirrors _retain_rejected's existing scope (those never
      retain a candidate either, since they are user error rather than a lost
      concurrent edit). Policy is read from the pre-edit loaded config the same
      way require_revision already is.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-workspace-resolution-safety
    name: Workspace resolution safety
    summary: >-
      Detect self-referential symlink/junction cycles before workspace source expansion,
      refuse resolved source sets whose unique source files exceed the configured
      total byte limit, recognize ticket_event/time_entry as first-class source roles
      for development-ticket history and time-tracking Notes, and keep a broad set of
      schema-valid example workspaces and resolution edge cases (Unicode paths, unknown
      config keys, glob ordering, malformed configuration files) under regression
      coverage.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-workspace-source-integrity
      - req-workspace-ticket-history-source-roles
      - req-workspace-example-and-edge-case-coverage
    implementation_locations:
      - lifetxt/config.py
      - lifetxt/config_registry.py
      - lifetxt/schema_extensions_v5.py
      - dist/schemas/config-v1.schema.json
      - lifetxt/workspace.py
      - docs/en/config.md
      - docs/ja/config.md
      - tests/test_workspace_foundation.py
      - examples/config/
    public_interfaces:
      - workspace.max_total_source_bytes
      - lifetxt config explain workspace.max_total_source_bytes
      - lifetxt.workspace.resolve_workspace
      - lifetxt workspace validate
      - workspace source role: ticket_event
      - workspace source role: time_entry
    tests_or_evidence:
      - tests/test_workspace_foundation.py WorkspaceResolutionTests cycle and source-size cases
      - tests/test_workspace_foundation.py WorkspaceResolutionTests.test_ticket_event_and_time_entry_roles_resolve_without_warning, test_ticket_event_and_time_entry_roles_default_writable_and_visible
      - tests/test_workspace_foundation.py ExampleConfigTests.test_config_schema_accepts_ticket_event_and_time_entry_source_roles
      - tests/test_workspace_foundation.py WorkspaceResolutionTests.test_unicode_source_path_resolves_and_reads, test_unknown_top_level_config_keys_do_not_break_resolution, test_glob_order_is_deterministic_across_mixed_priority_sources, test_repeated_resolution_of_the_same_config_is_stable
      - tests/test_workspace_foundation.py LoadConfigMalformedFileTests
      - tests/test_workspace_foundation.py ExampleConfigTests (remote.lifetxt.json, integration-references.lifetxt.json, software-ticket-workspace.lifetxt.json added to EXAMPLE_NAMES)
      - tests.test_schema_extensions_v2.test_bundle_contains_seventy_six_generated_and_published_documents -> confirms the generated schema bundle still matches the checked-in dist/schemas files byte-for-byte after the enum change
      - python -m lifetxt check examples/minimal_life.txt -> OK: 10 item(s)
      - ruff format --check lifetxt tests scripts
      - ruff check lifetxt tests scripts -> All checks passed
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/48
      - https://github.com/Eruhitsuji/lifetxt/issues/144
      - https://github.com/Eruhitsuji/lifetxt/issues/148
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/63
      - https://github.com/Eruhitsuji/lifetxt/pull/145
      - https://github.com/Eruhitsuji/lifetxt/pull/149
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      ticket_event/time_entry default to writable and visible, identical to
      primary -- confirmed by reading lifetxt/ticket_activity.py's
      build_ticket_event/build_time_entry, which append these Notes to
      whatever file the calling mutation already resolved as its write
      target, and by confirming no code outside lifetxt/workspace.py reads a
      resolved source's role today. The two new roles are purely additive:
      no membership in _READONLY_ROLES, _HIDDEN_BY_DEFAULT_ROLES, or
      _NON_WRITE_TARGET_ROLES. The config-v1.schema.json role enum is
      generated from lifetxt/schema_extensions_v5.py's SOURCE_SCHEMA
      fragment (reused for both the workspaces.*.sources and legacy paths
      branches of the schema); the fragment, not the dist/schemas file
      directly, is the value's source of truth -- editing the dist file
      alone would pass a naive review but fail
      tests.test_schema_extensions_v2.test_bundle_contains_seventy_six_generated_and_published_documents.
      The three new example configurations use only real, already-implemented
      configuration shapes: remote.lifetxt.json's remote.* section matches
      docs/en/remote.md; software-ticket-workspace.lifetxt.json's
      ticketing.custom_fields entries were verified against
      lifetxt.ticket_custom_fields.custom_field_registry_report to avoid
      colliding with reserved canonical/relation field names (the first
      attempt used component/story_points, both reserved, caught before
      commit). No fictitious "integrations" configuration section was
      invented; integration-references.lifetxt.json instead demonstrates the
      existing reference/generated roles for externally-synced content.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-stable-diagnostics
    name: Stable diagnostics
    summary: >-
      Publish a stable parser/validator diagnostic JSON object shape for
      `lifetxt check --format json` and keep raw-line Web and MCP validation
      diagnostics aligned with the same shared contract.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-diagnostic-contract-stability
      - req-diagnostic-hint-content
    implementation_locations:
      - lifetxt/parser.py
      - lifetxt/validator.py
      - lifetxt/model.py
      - lifetxt/diagnostic_contract.py
      - lifetxt/cli.py
      - lifetxt/webapp.py
      - lifetxt/mcp.py
      - tests/diagnostic_contract_fixtures.py
      - tests/test_diagnostic_contract.py
      - docs/en/cli.md
      - docs/ja/cli.md
    public_interfaces:
      - lifetxt check --format json
      - POST /api/check-line
      - MCP check_line
      - lifetxt.diagnostic_contract.diagnostic_to_output_dict
    tests_or_evidence:
      - tests/test_diagnostic_contract.py
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 1758 tests, OK (skipped=18)'
      - 'python -m lifetxt check examples/minimal_life.txt -> OK: 10 item(s)'
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/49
      - https://github.com/Eruhitsuji/lifetxt/issues/65
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/64
      - https://github.com/Eruhitsuji/lifetxt/pull/68
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      `span` remains deferred until parser-native end spans are implemented.
      Parser and validator diagnostics with clear remediation now publish
      actionable non-empty `hint` text. No parser or validator diagnostic code is
      intentionally left empty; other diagnostic producers may still use the
      absent representation (`""`) when no safe generic guidance is available.
      Consumers must tolerate unknown added fields, while stable fields are not
      removed or renamed without a documented transition period.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

