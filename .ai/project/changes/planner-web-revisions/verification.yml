schema_version: 1
verification:
  executed:
    - type: regression
      command: python -m unittest tests.test_web_planner_revisions
      status: passed
      result: Both observe and required modes passed; real Planner JavaScript handlers against disposable ASGI servers, zero legacy fallback, successful capture/create/update/complete, stale snapshots, response token refresh, no replay, retained input and fail-closed discovery.
      notes: Node DOM shim exercises handlers, not browser rendering. Baseline main script fails both cases (empty capture source revision in observe; rejected capture in required). Restored implementation passes.
    - type: targeted
      command: python -m unittest tests.test_web_planner_revisions tests.test_web_planner tests.test_surface_runtime tests.test_revision_migration_metrics tests.test_revision_telemetry_v2 tests.test_web_mobile_capture tests.test_shared_surface_mutation_routing tests.test_web_assets tests.test_web_installability tests.test_web_i18n
      status: passed
      result: 116 tests passed before final shared Quick-input fixture repair; final expanded suite below passed.
    - type: static
      command: python -m ruff check lifetxt tests scripts; python -m ruff format --check tests/test_web_planner.py tests/test_web_planner_revisions.py; node --check lifetxt/web_planner.js; node --check tests/planner_revision_probe.mjs; python -m mypy --follow-imports=skip --ignore-missing-imports lifetxt/diagnostic_contract.py; git diff --check
      status: passed
      result: Lint, changed Python formatting, JavaScript syntax, configured typing boundary and whitespace checks passed.
    - type: integration
      command: python -m lifetxt check examples/minimal_life.txt
      status: passed
      result: OK, 10 items.
    - type: full_suite
      command: MPLBACKEND=Agg python -m unittest discover
      status: failed_then_targeted_repair_verified
      result: 5418 tests ran in 439.440 seconds; 8 failing subcases in the same Quick-input Planner harness, 66 skipped. All failures were missing captureRevision in the extracted-handler fixture; fixed in tests/quick_input_clients.mjs. No runtime change was needed after this run.
      environment: Python 3.12.14, Bash; BashCompletionExecutionTests enabled and ran; existing ResourceWarnings recorded in captured output.
      notes: Runtime/tests unchanged during the full run; PR-link/documentation metadata and git commits changed while it ran. Full suite not rerun after the fixture-only repair; affected tests plus final expanded regression suite passed. Full output retained locally in .test-output.log.
    - type: final_targeted
      command: python -m unittest tests.test_quick_input tests.test_web_planner_revisions tests.test_web_planner tests.test_surface_runtime tests.test_revision_migration_metrics tests.test_revision_telemetry_v2 tests.test_web_mobile_capture tests.test_shared_surface_mutation_routing tests.test_web_assets tests.test_web_installability tests.test_web_i18n tests.test_change_package_closeout tests.test_traceability_gate
      status: passed
      result: 149 tests passed, including every failing Quick-input subcase from the full run.
    - type: governance
      command: LIFETXT_TRACEABILITY_GATE_BASE=origin/main LIFETXT_TRACEABILITY_GATE_PR_URL=https://github.com/Eruhitsuji/lifetxt/pull/1163 python -m unittest tests.test_traceability_gate tests.test_change_package_closeout
      status: passed
      result: 17 tests passed after committing PR links; initial pre-link check correctly rejected the committed null PR URL.
  limitations:
    - Browser rendering and physical-device tests not run; Chromium unavailable and attempted download was truncated. Node test is not browser-engine evidence.
    - Deployment, metrics preservation/reset and new 14-day observation not performed; tracked by issue 290.
