name: Apply agent implementation

on:
  push:
    branches:
      - agent/p0-write-attachment-retention
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Add remaining write safety and attachment recovery') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-write-attachment-retention
          fetch-depth: 0
      - name: Apply implementation patch
        run: |
          cat .github/agent-patch/part-* | base64 -d | gzip -d > /tmp/lifetxt.patch
          git apply --index /tmp/lifetxt.patch
          rm -rf .github/agent-patch
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add remaining write safety and attachment recovery"
          git push origin HEAD:agent/p0-write-attachment-retention
