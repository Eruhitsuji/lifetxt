  - id: cap-temporal-review-read-surfaces
    name: Temporal review read surfaces
    summary: >-
      Bounded read-only decision outcome, meaningful change, and future
      intent projections exposed through the Personal Context CLI.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-decision-outcome-review
      - req-temporal-change-feed
      - req-future-intent-snapshot
    implementation_locations:
      - lifetxt/decision_outcome_review.py
      - lifetxt/temporal_change_feed.py
      - lifetxt/future_intent.py
      - lifetxt/personal_context_cli.py
      - docs/en/temporal-review-reads.md
      - docs/ja/temporal-review-reads.md
      - docs/en/future-intent-snapshot.md
      - docs/ja/future-intent-snapshot.md
    public_interfaces:
      - decision-review
      - change-feed
      - future-intent
    tests_or_evidence:
      - tests.test_batch_followups
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/812
      - https://github.com/Eruhitsuji/lifetxt/issues/817
      - https://github.com/Eruhitsuji/lifetxt/issues/818
      - https://github.com/Eruhitsuji/lifetxt/issues/819
    related_pull_requests: []
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      Review found `decision-review`/`change-feed`/`future-intent` all
      accepted `--person`/`--stale-after-days` (inherited from the shared
      `_add_common_read` helper) while silently never applying either --
      none of the three underlying engines is person-scoped or has a
      staleness concept. Fixed by giving these three a narrower
      `_add_bounded_read` helper that only registers the flags they
      actually consume; the flags are now rejected rather than silently
      ignored.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-personal-context-historical-field-reconstruction
    name: Historical Personal Context field reconstruction
    summary: >-
      Bounded, read-only field-level ``historical-personal-context-v1``
      projection composing the existing Personal Context Currentness
      resolver with the shared ``semantic-as-of-v1`` engine, so an item's
      per-field state (status/due/relations/on/from/to/at) can be
      reconstructed as of an explicit cutoff without ever falling back to
      current life.txt state. Exposed as `lifetxt context history --as-of`.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-historical-personal-context-projection
    implementation_locations:
      - lifetxt/historical_context.py
      - lifetxt/personal_context_cli.py
      - tests/test_batch_followups.py
      - tests/test_personal_context_cli.py
    public_interfaces:
      - lifetxt context history --as-of
    tests_or_evidence:
      - tests.test_batch_followups
      - tests.test_personal_context_cli.PersonalContextCliTests.test_context_history_reconstructs_fields_as_of_cutoff
      - tests.test_personal_context_cli.PersonalContextCliTests.test_context_history_requires_as_of
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/816
    related_pull_requests: []
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      Reuses lifetxt.personal_context_currentness.resolve_currentness/
      item_currentness and lifetxt.native_semantic_as_of.semantic_as_of
      unmodified; no second currentness or replay implementation. Found
      during review that the engine module had landed with tests but no
      CLI/MCP/Web surface at all (a real gap against this project's
      CLI-first pattern) and that its own limitation reporting was dead
      code (`if not as_of.get("source")` could never be true, since
      semantic_as_of() always returns the literal string
      "native_life_txt"); both were fixed in the same review pass -- the
      limitation check now inspects each field's own state, and
      `lifetxt context history` wires the engine into the existing
      Personal Context CLI (`context health|why|capsule|history`).
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

