name: Apply verified Remote v20 final patch

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: remote-v20-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/remote-browser-session-negotiation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remote-browser-session-negotiation
          fetch-depth: 0
      - name: Verify and apply exact Web and roadmap changes
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/chunks.sha256 <<'EOF'
          d4e27949bd678ecdbd49a54790934ae1c0a63a619d9d48f620e9604acc431d8e  .agent_remote_v20_patch/p00.txt
          627dc513dcebda1dd5484e18e097cde093974903efa792e7b5d711529cea5357  .agent_remote_v20_patch/p01.txt
          16e208b8c485332c726ab029184dbdbd8bc25c627e21b4d506d052caa0dd960a  .agent_remote_v20_patch/p02.txt
          aabc75deb9e3d6c929a65eaa88ebccf5fd4428569df2f5de05ac27182ee84304  .agent_remote_v20_patch/p03.txt
          db70f867a617b709d23c65210088c2453aa8db9fbf209cf1512670bb1bfb9fc9  .agent_remote_v20_patch/p04.txt
          36641ebc8428923c5db28e327e8190dc96d0dcdd00b10feb4a880c12d4ff17ab  .agent_remote_v20_patch/overview.txt
          60e57db9a41d4811a04f892c1f58bb37cd2b64e659ea6974806a1f84e09d1944  .agent_remote_v20_patch/remote-section.txt
          EOF
          sha256sum -c /tmp/chunks.sha256
          cat .agent_remote_v20_patch/p0{0,1,2,3,4}.txt > /tmp/remote-v20.patch
          test "$(wc -c < /tmp/remote-v20.patch)" = "32220"
          echo 'ad71be1c0a6d750b5b437300c135993200b41d7ed4ce7c3b7b233dc0bf3a9ce4  /tmp/remote-v20.patch' | sha256sum -c -
          git apply --check --include=lifetxt/webapp.py /tmp/remote-v20.patch
          git apply --include=lifetxt/webapp.py /tmp/remote-v20.patch
          python - <<'PY'
          from pathlib import Path

          path = Path('todo.md')
          lines = path.read_text(encoding='utf-8').splitlines()
          old_header = 'Last updated: 2026-07-26 (updated x121)'
          new_header = 'Last updated: 2026-07-26 (updated x122)'
          assert lines.count(old_header) == 1
          lines[lines.index(old_header)] = new_header

          overview_indexes = [i for i, line in enumerate(lines) if line.startswith('This is the active roadmap after ')]
          assert len(overview_indexes) == 1
          lines[overview_indexes[0]] = Path('.agent_remote_v20_patch/overview.txt').read_text(encoding='utf-8').rstrip('\n')

          replacements = {
              '8. ': '8. Harden the implemented Development Ticket Management Core: cross-surface custom-field search/privacy/role enforcement, reciprocal relation/event rules, registry-backed query/sort/completion, adverse-environment fixtures for the implemented multi-file/bulk contracts, and the remaining Web/TUI/saved-view/remote/command-center adoption of the shared ticket/project report.',
              '9. ': '9. Harden the implemented Ticket Workflow, History, Planning, and Time Tracking foundation: authenticated role/field enforcement, watcher-delivery and timer/work-session side-store transactions, provider-history administration, carry-over/release automation, timesheets, and deterministic planning metrics on top of the implemented cross-file revision-set and journal-recovery foundation.',
              '10. ': '10. Harden the implemented Remote Safe Mode v2: complete the shared local/remote read-backend adoption, capability/version compatibility matrix, durable session/audit deployment policy, bounded pagination/cache contracts, and real browser/TLS/reverse-proxy/multi-worker evidence.',
              '11. ': '11. Enable conflict-aware remote writes only for operations whose capability entries report complete exact revision, authenticated permission, privacy/redaction, event-history, clock, idempotency, multi-target recovery, and provider-side-effect enforcement.',
          }
          for prefix, replacement in replacements.items():
              indexes = [i for i, line in enumerate(lines) if line.startswith(prefix)]
              assert len(indexes) == 1, (prefix, indexes)
              lines[indexes[0]] = replacement

          ticket_prefix = '- [ ] Add revision-set and journal-backed recovery for split ticket/event/time/planning sources,'
          indexes = [i for i, line in enumerate(lines) if line.startswith(ticket_prefix)]
          assert len(indexes) == 1
          lines[indexes[0]] = '- [ ] Extend the implemented exact ticket revision-set and journal-backed recovery contract to notification/delivery stores, timer/work-session state, reciprocal relation events, attachment references/packages, version/sprint lifecycle side records, and project archive. Preserve the implemented stable transaction IDs, exact touched revisions, generated-record previews, inspect/resume/compensate/abandon actions, and one-winner/one-conflict behavior; add crash-boundary and adverse-filesystem evidence for each newly admitted side store before enabling the corresponding remote workflow write.'

          heading = '## P1: Remote Safe Mode and Remote Workspace Access'
          start = lines.index(heading)
          end = next(i for i in range(start + 1, len(lines)) if lines[i] == '---')
          section = Path('.agent_remote_v20_patch/remote-section.txt').read_text(encoding='utf-8').splitlines()
          lines[start:end] = section
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          grep -Fx 'Last updated: 2026-07-26 (updated x122)' todo.md
          grep -F '"/api/remote/v1/browser/login"' lifetxt/webapp.py
          grep -F 'request.url.path.startswith("/api/remote/v1/")' lifetxt/webapp.py
      - name: Validate generated source syntax and schema count
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q lifetxt tests
          python - <<'PY'
          from lifetxt.safety_foundation import schema_bundle
          bundle = schema_bundle()
          assert len(bundle) == 75, len(bundle)
          for name in (
              'remote-browser-session-v1.schema.json',
              'remote-capability-v2.schema.json',
              'remote-diagnostics-v1.schema.json',
              'remote-profile-v3.schema.json',
              'remote-read-response-v1.schema.json',
          ):
              assert name in bundle, name
          PY
      - name: Commit final source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .agent_remote_v20_patch
          rm -f .github/workflows/agent-apply-remote-v20-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Finalize Remote browser sessions and protocol negotiation'
          git push origin HEAD:agent/remote-browser-session-negotiation
