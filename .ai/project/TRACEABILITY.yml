      notes: >-
        Found while reviewing the #806-819 batch's three new
        decision-review/change-feed/future-intent commands, whose
        `lifetxt help NAME` text output showed the literal placeholder
        `command.summary.<name>` instead of a real summary. Root-caused to
        a pre-existing, wider bug in `cli_taxonomy.py`'s
        `translate(id) or default` idiom (six call sites), not something
        this batch introduced: `translate()` returns the raw message id
        rather than a falsy value for any unregistered id, so the `or`
        fallback never fires. Since `localized_command_summary` only has
        explicit translations for a small hand-picked command subset, this
        affected the text-help output of the large majority of commands
        project-wide (e.g. `lifetxt help check`), not only the three new
        ones. Fixed with `lifetxt.i18n.has_message()` and a local
        `_localized_or()` helper applied at all six affected sites
        (category/audience title/description, per-step goal, command
        summary); no change to `translate()`'s own documented
        fallback-to-raw-id behavior, which other callers may still rely on.
      status: implemented

