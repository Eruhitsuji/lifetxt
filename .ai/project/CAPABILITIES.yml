  - id: cap-lifetxt-self-update
    name: Safety-railed CLI self-update
    summary: >-
      Add `lifetxt update`, the only lifetxt command that mutates the git
      working tree the running install lives in. Git-based (lifetxt has no
      PyPI distribution); dry-run by default; requires `--yes` for any real
      change; refuses on a non-git install, a dirty working tree, or a
      detached HEAD; only ever runs `git fetch` and `git merge --ff-only`;
      never runs `pip install` or any other code. Explicitly flagged
      not-recommended during scoping and implemented anyway per repository
      owner instruction, with every safety rail as the condition of that
      acceptance.
