<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#27343d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="life.txt Planner">
<link rel="manifest" href="/planner.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="/assets/lifetxt-icon-180.png"><title>life.txt Planner</title>
<style>__PLANNER_CSS__</style></head><body>
<a class="skip" href="#main" data-i18n="skip">Skip to Planner</a>
<header><a href="/" class="brand">✓ life.txt</a><a href="/" data-i18n="web">Full Web UI</a><button id="customize" type="button" data-i18n="customize">Customize</button></header>
<main id="main"><section class="day-head"><div class="title-row"><div><p data-i18n="eyebrow">Your day, in one place</p><h1 id="title" data-i18n="title">Day Planner</h1></div><button id="today" data-i18n="today">Today</button></div>
<div id="view-switch" class="view-switch" role="group" aria-label="Planner view"><button id="view-day" type="button" data-i18n="day" aria-pressed="true">Day</button><button id="view-week" type="button" data-i18n="week" aria-pressed="false">Week</button><button id="view-month" type="button" data-i18n="month" aria-pressed="false">Month</button></div>
<div class="date-row"><button id="prev" aria-label="Previous day">‹</button><label for="date" data-i18n="choose">Choose date</label><input id="date" type="date" aria-label="Selected day"><button id="next" aria-label="Next day">›</button></div><p id="temporal-context" class="temporal-context" role="status" aria-live="polite"></p><p id="feedback" role="status" aria-live="polite"></p></section>
<div class="scope-row"><label for="scope" data-i18n="scope">Scope</label><select id="scope" aria-label="Planner scope"><option value="" data-i18n="all">All</option></select></div>
<div id="day-view">
<section id="flow-panel" class="panel" aria-labelledby="flow-heading"><details id="flow-disclosure">
<summary id="flow-heading" data-i18n="flowTitle">Suggested Daily Flow</summary>
<p data-i18n="flowUnsaved">Read-only suggestions, not saved or executed. Fixed appointments stay fixed.</p>
<form id="flow-form"><div class="flow-window"><label for="flow-start"><span data-i18n="flowStart">Window start</span><input id="flow-start" type="time" required step="60"></label><label for="flow-end"><span data-i18n="flowEnd">Window end (00:00 = next midnight)</span><input id="flow-end" type="time" required step="60"></label></div><button id="flow-request" type="submit" data-i18n="flowRequest">Get suggestions</button></form>
<p id="flow-status" role="status" aria-live="polite"></p><div id="flow-result" aria-busy="false"></div>
</details></section>
<section class="panel"><h2 data-i18n="schedule">Schedule</h2><div id="schedule" aria-live="polite"></div></section>
<section class="panel"><h2 data-i18n="tasks">Tasks</h2><div id="tasks" aria-live="polite"></div></section>
<section class="panel"><h2 data-i18n="habits">Habits</h2><div id="habits" aria-live="polite"></div></section>
<section class="panel"><h2><span data-i18n="notes">Notes</span> <small id="notes-count" aria-live="polite"></small></h2><div id="notes" aria-live="polite"></div><button id="more-notes" type="button" data-i18n="moreNotes" hidden>Load more</button><button id="new-note" data-i18n="newNote">＋ Add a note</button></section>
<section class="panel"><h2 data-i18n="journal">Journal</h2><div id="journal"></div><button id="edit-journal" data-i18n="writeJournal">Write today's journal</button></section>
<section id="review-panel" class="panel" hidden><h2 data-i18n="reviewActivity">Review / Activity</h2><p id="review-summary"></p><div id="review-activity" aria-live="polite"></div><button id="more-review" type="button" data-i18n="moreReview" hidden>Show more</button></section>
 </div>
 <section id="week-view" class="week-view" hidden aria-labelledby="week-range-heading"><div class="week-heading"><h2 id="week-range-heading" data-i18n="weekOf">Week of</h2><p id="week-range"></p></div><div id="week-days" class="week-days"></div></section>
 <section id="month-view" class="month-view" hidden aria-labelledby="month-heading"><h2 id="month-heading"></h2><div id="month-weekdays" class="month-weekdays" aria-hidden="true"></div><div id="month-grid" class="month-grid"></div></section></main>
<div id="dock" class="dock"><button id="open-capture" data-i18n="capture">＋ Quick Capture</button></div>
<dialog id="capture-dialog" aria-labelledby="capture-title"><form id="capture-form"><h2 id="capture-title" data-i18n="capture">Quick Capture</h2><label for="capture-text" data-i18n="prompt">What do you want to remember?</label><input id="capture-text" required><p id="capture-feedback" role="status" aria-live="polite"></p><button type="submit" data-i18n="submitCapture">Capture</button><button type="button" data-close="capture-dialog" data-i18n="close">Close</button></form></dialog>
<dialog id="editor" aria-labelledby="editor-heading"><form id="editor-form"><h2 id="editor-heading"></h2><label for="editor-title" data-i18n="labelTitle">Title</label><input id="editor-title" required><label for="editor-body" data-i18n="labelBody">Details / journal</label><textarea id="editor-body" rows="7"></textarea><p id="editor-feedback" role="status" aria-live="polite"></p><button type="submit" data-i18n="save">Save</button><button type="button" data-close="editor" data-i18n="close">Close</button></form></dialog>
<dialog id="detail-dialog" aria-labelledby="detail-heading"><section><h2 id="detail-heading">Details</h2><div id="detail-content"></div><button type="button" data-close="detail-dialog" data-i18n="close">Close</button></section></dialog>
<dialog id="customize-dialog" aria-labelledby="customize-heading"><form id="customize-form"><h2 id="customize-heading" data-i18n="customize">Customize</h2><fieldset><legend data-i18n="sections">Day sections</legend><div id="section-preferences"></div></fieldset><label for="density" data-i18n="density">Density</label><select id="density"><option value="comfortable" data-i18n="comfortable">Comfortable</option><option value="compact" data-i18n="compact">Compact</option></select><button type="submit" data-i18n="apply">Apply</button><button id="reset-customization" type="button" data-i18n="reset">Reset to workspace defaults</button><button type="button" data-close="customize-dialog" data-i18n="close">Close</button></form></dialog>
<script>__PLANNER_JS__</script></body></html>
