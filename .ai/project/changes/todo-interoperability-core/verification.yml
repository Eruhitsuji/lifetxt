schema_version: 1

verification:
  planned:
    - type: focused
      command: python -m unittest tests.test_conversion tests.test_extra_cli
      requirement_ids: [req-todo-interoperability-core]
      status: passed
    - type: regression
      command: MPLBACKEND=Agg python -m unittest discover
      requirement_ids: [req-todo-interoperability-core]
      status: partial
      note: >-
        Ran 6006 tests; 5485 passed and 517 skipped. Four failures were isolated
        to tests.test_git_commit_worker_cli subprocesses launched from temporary
        directories, where the checkout is absent from sys.path. Re-running that
        module with PYTHONPATH set to the checkout passed all 4 tests. A second
        full run with PYTHONPATH set passed those subprocesses but found one
        expected traceability-gate failure because this PR's traceability row
        had not yet been added; the focused gate is rerun after recording it.
    - type: static
      command: python -m ruff check lifetxt/conversion.py tests/test_conversion.py tests/test_extra_cli.py
      requirement_ids: [req-todo-interoperability-core]
      status: passed
    - type: integration
      command: python -m lifetxt check examples/minimal_life.txt
      requirement_ids: [req-todo-interoperability-core]
      status: passed
    - type: traceability
      command: python -m unittest tests.test_traceability_gate tests.test_change_package_closeout
      requirement_ids: [req-todo-interoperability-core]
      status: passed

  executed:
    - command: python -m unittest tests.test_conversion tests.test_extra_cli
      result: Ran 69 tests, OK.
    - command: python -m ruff check lifetxt/conversion.py tests/test_conversion.py tests/test_extra_cli.py
      result: All checks passed.
    - command: python -m ruff format --check lifetxt/conversion.py tests/test_conversion.py tests/test_extra_cli.py
      result: 3 files already formatted.
    - command: python -m lifetxt check examples/minimal_life.txt
      result: OK; 10 items.
    - command: python scripts/validate_release_docs.py --output .cache/issue1438-release-docs.json
      result: '{"errors": 0, "ok": true}'
    - command: PYTHONPATH="$PWD" python -m unittest tests.test_git_commit_worker_cli
      result: Ran 4 tests, OK; resolves checkout import for subprocess tests.
    - command: MPLBACKEND=Agg python -m unittest discover
      result: >-
        Ran 6006 tests in 370.512s; 4 failures, 517 skipped. Failures were
        tests.test_git_commit_worker_cli subprocess import failures caused by
        running child interpreters from temporary repositories without the
        checkout on PYTHONPATH; the same four tests passed with PYTHONPATH set.
    - command: PYTHONPATH="$PWD" MPLBACKEND=Agg python -m unittest discover
      result: >-
        Ran 6006 tests in 380.478s; one failure in
        tests.test_traceability_gate.RepositoryTraceabilityGateTests because the
        PR's global traceability row had not yet been added. 517 skipped; all
        four subprocess tests passed with PYTHONPATH set.

