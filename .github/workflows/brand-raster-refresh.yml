name: Temporary brand raster refresh

on:
  push:
    branches:
      - feature/brand-logo-assets
    paths:
      - .github/workflows/brand-raster-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/brand-logo-assets
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install raster generation tools
        run: python -m pip install cairosvg pillow
      - name: Regenerate canonical raster derivatives
        run: python scripts/generate_brand_rasters.py
      - name: Commit regenerated rasters
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/brand/lifetxt-app-icon-1024.png \
            assets/brand/favicon-32.png \
            assets/brand/apple-touch-icon-180.png \
            assets/brand/pwa-icon-192.png \
            assets/brand/pwa-icon-512.png \
            assets/brand/pwa-maskable-512.png \
            desktop/src-tauri/icons/icon.png \
            desktop/src-tauri/icons/icon.ico
          if git diff --cached --quiet; then
            echo "Raster assets are already current."
            exit 0
          fi
          git commit -m "Regenerate v3 brand raster assets (#575)"
          git push origin HEAD:feature/brand-logo-assets
