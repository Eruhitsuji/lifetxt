name: Update Remote client roadmap

on:
  push:
    branches:
      - agent/remote-cli-tui-permissions

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Update Remote client roadmap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remote-cli-tui-permissions
      - name: Update todo.md
        shell: python
        run: |
          from pathlib import Path

          path = Path('todo.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'Last updated: 2026-07-26 (updated x123)',
              'Last updated: 2026-07-27 (updated x124)',
              1,
          )
          summary_old = (
              'and add the first authoritative Remote ticket mutation contract for protocol v2 with explicit opt-in, authenticated write scope, project/visibility filtering, exact aggregate revision admission, per-file CAS, stable transaction IDs, replay-safe request hashing, append-only created/field-change/transition/comment/time events, Remote clock/CSRF enforcement, conservative field allow-listing, and one additional response schema, raising the generated/public Draft 2020-12 bundle to 76 documents.'
          )
          summary_new = summary_old + (
              ' The Remote client batch adds permission inspection and capability-gated ticket create, edit, transition, comment, and time-entry commands; fetches the current aggregate revision immediately before each write; preserves caller-stable transaction IDs and dry-run behavior; and adds an explicitly interactive TUI mutation path that remains read-only without server-granted write scope and requires confirmation immediately before authoritative mutation.'
          )
          if summary_old not in text:
              raise SystemExit('Remote summary anchor not found')
          text = text.replace(summary_old, summary_new, 1)

          order_10_old = '- 10. Harden the implemented Remote Safe Mode v2: complete the shared local/remote read-backend adoption, capability/version compatibility matrix, durable session/audit deployment policy, bounded pagination/cache contracts, and real browser/TLS/reverse-proxy/multi-worker evidence.'
          order_10_new = '- 10. Harden the implemented Remote Safe Mode v2 and permission-aware clients: complete shared local/remote read-backend adoption for every CLI and TUI query, add bounded pagination and cache freshness contracts, preserve capability/version refusal across older and newer clients, define durable browser-session and audit deployment policy, and collect real browser, TLS, reverse-proxy, disconnect, restart, and multi-worker evidence. The dependency-free client already provides profile management, permission inspection, filtered resource reads, diagnostics, snapshot export, ticket mutation commands, and an explicitly confirmed interactive TUI; do not rebuild those completed surfaces.'
          if order_10_old not in text:
              raise SystemExit('Feature-track item 10 anchor not found')
          text = text.replace(order_10_old, order_10_new, 1)

          order_11_old = '- 11. Harden and expand the implemented single-source Remote ticket write adapter: prove real-client one-winner/replay behavior, enforce private custom-field visibility/edit roles, then add version/sprint planning, relation/watcher/attachment side effects, all-or-none bulk operations, and journal-backed multi-file writes only where capability entries report complete exact revision, authenticated permission, privacy/redaction, event-history, clock, idempotency, recovery, and provider-side-effect enforcement.'
          order_11_new = '- 11. Harden and expand the implemented single-source Remote ticket write adapter after the permission-aware CLI/TUI client foundation: prove real-client one-winner, stale-revision refusal, lost-response replay, timeout, disconnect, and server-restart behavior; add ticket detail refresh and conflict presentation without automatic overwrite; enforce visible/editable roles for private typed custom fields; then add version and sprint planning, relations, watcher delivery, attachment metadata/content, timer side effects, and all-or-none bulk operations. Route every cross-file or side-store mutation through the implemented journal and revision-set contracts, publish exact operation and limitation metadata through capabilities, and require authenticated permission, project/group/visibility filtering, privacy/redaction, append-only event history, clock admission, stable idempotency, deterministic recovery, and provider-side-effect compensation before exposing each operation to CLI, TUI, Web, or MCP.'
          if order_11_old not in text:
              raise SystemExit('Feature-track item 11 anchor not found')
          text = text.replace(order_11_old, order_11_new, 1)

          marker = '\n---\n\n## P0: Release Safety and Correctness'
          detail = '''

### Remaining Remote CLI/TUI implementation plan

- [ ] Replace the current compact interactive prompt with a shared Remote ticket detail controller that can refresh one ticket, display its current revision and effective editable fields, preserve the server-returned event timeline, and return to the list without discarding filters. Keep the dependency-free line-oriented mode as the compatibility baseline; optional richer terminal rendering must consume the same controller and operation contracts.
- [ ] Add explicit conflict recovery UX for CLI and TUI. On `REVISION_CONFLICT`, fetch and display the new aggregate revision plus a bounded field-level comparison, never retry automatically, and require the operator to choose refresh, abandon, or construct a new mutation with a new transaction ID. Preserve identical-request replay only when the caller intentionally reuses the original stable transaction ID after a lost response.
- [ ] Extend permission inspection with per-operation denial reasons, effective project/group/visibility constraints, server read-only state, ticket-write configuration state, protocol/capability revision, and custom-field visible/editable-role summaries. Redact token values and private field definitions that the authenticated principal cannot discover.
- [ ] Add Remote ticket create/edit completion and validation driven by server capabilities and typed registries. Reject unsupported fields locally for usability while treating server validation as authoritative. Support repeatable values, explicit unset semantics, date/datetime/duration normalization, and tracker/project applicability without permitting arbitrary raw life.txt replacement.
- [ ] Add permission-aware Remote views for ticket detail, history, time entries, versions, sprints, dependencies, watchers, and attachments before adding their mutation commands. Every view must use the same principal filtering and aggregate revision as the resource backend and must expose truncation, pagination, and freshness metadata.
- [ ] Add mutation commands for planning, relations, watchers, attachments, timers, and bulk operations only after their server capability entries advertise complete permission, privacy, revision, idempotency, history, and recovery contracts. Cross-file operations must use journal-backed revision sets and return inspect/resume/compensate/abandon information instead of pretending to be filesystem-atomic.
- [ ] Add real integration fixtures using the packaged CLI against an HTTPS Remote server for owner, editor, reader, and auditor principals. Cover allowed and denied projects/visibilities, disabled writes, server read-only mode, stale revisions, concurrent writers, identical replay, conflicting transaction-ID reuse, clock skew, proxy identity, TLS verification failure, timeout, partial response, disconnect, server restart, and older/newer protocol combinations.
- [ ] Add real terminal evidence for the interactive TUI in Windows Terminal, WSL without VS Code Remote mode, macOS Terminal, Linux terminals, narrow widths, redirected stdin/stdout, non-UTF-8 locale failure, Ctrl-C at every prompt, and inaccessible profile/token environment variables. Document exact fallback behavior and keep non-interactive commands scriptable with stable JSON output and exit codes.
- [ ] Define credential and profile administration beyond environment-variable token lookup: token rotation diagnostics, missing/empty token refusal, optional OS credential-store adapters behind explicit dependencies, profile import/export with secrets excluded, profile file permission checks, and migration/refusal tests for future profile versions. Never persist Bearer secrets in life.txt, configuration, logs, command history, audit details, or exported profiles.
- [ ] Add audit correlation to client output by retaining request IDs, transaction IDs, negotiated protocol, capability revision, and server audit references without exposing sensitive audit detail. Provide a bounded diagnostic bundle suitable for incident handoff while preserving server-side redaction and path privacy.
- [ ] Add documentation and examples for least-privilege principal setup, read-only access, editor access limited by project and visibility, safe transaction-ID generation, dry runs, conflict resolution, replay after a lost response, reverse-proxy deployment, and recovery administration. Keep English and Japanese guides synchronized through release checks.
'''
          if marker not in text:
              raise SystemExit('P0 section marker not found')
          text = text.replace(marker, detail + marker, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit roadmap
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add todo.md
          git commit -m 'Update Remote client roadmap'
          git push
