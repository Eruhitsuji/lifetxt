name: Apply verified P0 x105 implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/p0-format-contract-batch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-format-contract-batch
          fetch-depth: 0
      - name: Verify and apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_B64=.github/agent-patch/lifetxt-p0-x105.patch.gz.b64
          test "$(wc -c < "$PATCH_B64")" -eq 46972
          base64 -d "$PATCH_B64" > /tmp/lifetxt-p0-x105.patch.gz
          echo 'd7852e8f6d3adcf7f86d32470f3864c1dfafa3e34fe1b32d84c2251de89fcad1  /tmp/lifetxt-p0-x105.patch.gz' | sha256sum --check
          gzip -dc /tmp/lifetxt-p0-x105.patch.gz > /tmp/lifetxt-p0-x105.patch
          echo '0155900d527cd2a3eb24a73ad50b818b45f9bf8ac048ec67472c77e6b3277615  /tmp/lifetxt-p0-x105.patch' | sha256sum --check
          git apply --check /tmp/lifetxt-p0-x105.patch
          git apply --index /tmp/lifetxt-p0-x105.patch
          rm -rf .github/agent-patch
          rm -f .github/agent-probe.txt
          rm -f .github/workflows/agent-source-export.yml
          git add -A
          git diff --cached --check
      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add safe process boundaries and transaction administration'
          git push origin HEAD:agent/p0-format-contract-batch
