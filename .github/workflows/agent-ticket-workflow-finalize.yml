name: Finalize ticket workflow implementation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'agent/ticket-workflow-history-time'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ticket-workflow-history-time
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused validation and clean diagnostics
        shell: bash
        run: |
          python -m compileall -q lifetxt tests
          python -m unittest \
            tests.test_ticket_workflow_history \
            tests.test_ticket_planning \
            tests.test_ticket_workflow_surfaces \
            tests.test_safety_cli \
            tests.test_safety_foundation \
            tests.test_schema_extensions_v2
          rm -f agent-ticket-workflow-test.log agent-ticket-workflow-result.txt
          rm .github/workflows/agent-ticket-workflow-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize ticket workflow history time and planning'
          git push origin HEAD:agent/ticket-workflow-history-time
