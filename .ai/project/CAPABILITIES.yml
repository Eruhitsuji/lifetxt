    tests_or_evidence:
      - 'a clean environment built by the recorded setup command must pass integration_test on every supported platform'
      - 'the tzdata marker must evaluate true only on win32; verified by evaluating the PEP 508 marker, not by assuming it'
      - 'when no timezone database is available, the message must name the remedy; an unknown zone name must not be reported as a missing database'
      - 'resolution must use only the declared source: tests/test_safety_foundation.py fails if an undeclared dateutil or pytz fallback is reintroduced'
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 1765 tests, OK (skipped=14)'
      - 'tests/test_check_release_policy_cli.py: the release-policy CLI falls back instead of crashing when stdout cannot encode a manifest character (e.g. Windows cp932), verified against a real io.TextIOWrapper'
      - 'tests/test_mutation.py WriteConsoleTextTests (4 tests): atomic.write_console_text falls back to backslashreplace on a narrow-codec (cp932) fake TextIOWrapper, leaves UTF-8/ASCII-safe text unchanged, and defaults to ascii when the stream has no encoding attribute'
      - 'tests/test_safety_cli.py ConsoleEncodingSafetyTests (2 tests): both stdout write boundaries (extra_common._write_output and cli.write_text) survive a narrow-codec stream with representative non-ASCII content'
      - 'confirmed via git stash that both ConsoleEncodingSafetyTests cases reproduce the original UnicodeEncodeError crash against the pre-fix code, then pass once the fix is restored'
      - python -m unittest tests.test_mutation tests.test_safety_cli -> pass
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 2426 tests, OK (skipped=5)'
      - python -m lifetxt check examples/minimal_life.txt -> OK 10 item(s)
      - ruff format --check / ruff check on all changed files -> clean
      - 'tests/test_traceability_gate.py RepositoryTraceabilityGateTests.test_current_change_set_satisfies_traceability_gate_when_base_is_known now passes on a real cp932-locale Windows host from a feature branch with origin/main fetched; reproduced the UnicodeDecodeError/None-stdout failure directly against a bare subprocess.run call before the fix, confirmed encoding="utf-8" resolves it'
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 2420 tests, OK (skipped=5)'
      - ruff check tests/test_traceability_gate.py -> All checks passed
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/73
      - https://github.com/Eruhitsuji/lifetxt/issues/76
      - https://github.com/Eruhitsuji/lifetxt/issues/95
      - https://github.com/Eruhitsuji/lifetxt/issues/429
      - https://github.com/Eruhitsuji/lifetxt/issues/432
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/75
      - https://github.com/Eruhitsuji/lifetxt/pull/137
      - https://github.com/Eruhitsuji/lifetxt/pull/431
      - https://github.com/Eruhitsuji/lifetxt/pull/433
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      Linux CI cannot detect a regression here: the marker excludes tzdata there and the
      system database hides the defect, so removing the dependency would leave CI green
      while breaking clean Windows installs. Verification must be run on Windows.
      The release-policy CLI console-encoding fallback (#95) is a distinct failure mode
      on the same "supported platform must be able to run the recorded commands" theme
      but is otherwise unrelated to the timezone dependency; see
      .ai/project/changes/release-policy-cli-console-encoding/ for that change's own
      requirements, design, and verification record.
      #429 found the identical defect class recurring inside the `lifetxt`
      package itself: `lifetxt safety release-gate` (via
      extra_common.py::_write_output) and every legacy command writing to
      stdout without -o (via cli.py::write_text, e.g. `check`) both had the
      same unguarded `sys.stdout.write(text)` that #95 already fixed once in
      the standalone `scripts/check_release_policy.py`. Since the fix was now
      needed a second and third time inside the package, it was consolidated
      into one shared `lifetxt.atomic.write_console_text` helper (reusing the
      exact `_write_stdout` fallback pattern from #95) rather than a third
      copy-paste, so a fourth unguarded site cannot silently reappear.
      `scripts/check_release_policy.py`'s own standalone `_write_stdout` was
      deliberately left untouched -- it lives outside the `lifetxt` package
      boundary and already works; refactoring it to import the package was
      judged unnecessary risk for this fix.
      #432 found the same encoding-locale theme in test infrastructure itself:
      tests/test_traceability_gate.py::_git()'s subprocess.run used text=True
      with no explicit encoding, so Python decoded git subprocess output using
      the host's locale-preferred encoding (cp932 here) rather than UTF-8.
      .ai/project/TRACEABILITY.yml already contains non-ASCII typographic
      characters valid in UTF-8 but not cp932, which crashed the background
      reader thread and silently left completed.stdout as None (returncode
      still 0) rather than raising, so the failure surfaced as an unrelated
      AttributeError deep in _traceability_mapping_records. Invisible in CI
      (shallow checkouts typically lack a fetchable origin/main, so
      infer_local_base() returns None and the test no-ops) and invisible on
      UTF-8-locale hosts -- reproducible only on this project's own local
      non-UTF-8-locale Windows development environment. Fixed with one
      explicit encoding="utf-8" argument; no other git-subprocess helper in
      tests/*.py matched this text=True-without-encoding pattern at
      investigation time, so no broader audit was undertaken.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

