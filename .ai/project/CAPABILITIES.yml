  - id: cap-web-beginner-first-ux
    name: Beginner-first Web UI information architecture
    summary: >-
      A progressive-disclosure navigation contract for the Web UI: a small
      primary tab group (Today/Items/Dashboard/Create) always visible, every
      other view collapsed behind a "More" disclosure that auto-expands when
      a direct URL or #view= link targets one of them; contextual empty-state
      guidance distinguishing "no data yet" from "no matching result", each
      with a safe next action; inline contextual help for common workflows;
      and actionable, retryable error presentation reusing the existing
      api()/showToast() error path instead of a bare "Save failed: <message>"
      string.
