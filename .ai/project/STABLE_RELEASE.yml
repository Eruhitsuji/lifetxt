schema_version: 1

stable_release:
  tracker_issue: https://github.com/Eruhitsuji/lifetxt/issues/283
  phase: stabilization
  stabilization_start:
    trigger: >-
      The stabilization phase starts when the first child issue under #283 is
      moved to status:in-progress on a dedicated stabilization branch.
    first_issue: https://github.com/Eruhitsuji/lifetxt/issues/284
    parent_branch: stabilize/issue-283
    branch_policy: >-
      Use one integration branch for the tracker and one dedicated branch per
      child issue. Child branches target the integration branch; the integration
      branch targets main after the tracker-level release evidence is complete.

  minimal_stabilization_rescope:
    tracker_issue: https://github.com/Eruhitsuji/lifetxt/issues/454
    supersedes: >-
      #454 supersedes #283 and #339's remaining gate criteria only for
      deciding what must be completed before the first Stable 1.0 release.
      #283 and #339 remain the historical trackers for the original broad
      stabilization plan and retain their completed work; this section does
      not remove or invalidate anything already recorded elsewhere in this
      file.
    minimum_stable_meaning:
      - Format 1.0 has an explicit, documented compatibility contract.
      - Core parse/read/write/canonicalization behavior is protected against regressions.
      - Normal mutations and recovery behavior do not have a known release-blocking data-loss defect.
      - Release artifacts can be built, installed into a clean environment, and execute a small representative smoke workflow.
      - Known limitations and intentionally unverified/optional surfaces are documented instead of requiring exhaustive pre-release proof.
      - No known critical security or data-integrity defect remains open.
    not_required_for_first_stable_release: >-
      Exhaustive real-host verification of every supported shell, terminal,
      browser, filesystem class, SMTP provider, optional client, or
      OS/Python combination before release.
    deferred_from_gate:
      - real Web revision deployment evidence (#288-#292)
      - exhaustive remote attachment failure/restart evidence (#297-#299)
      - cloud-sync/removable/network filesystem verification (#304)
      - real terminal and selector matrix verification (#312-#314)
      - real SMTP provider verification (#315-#316)
      - real browser-engine verification (#317-#318)
      - exhaustive external-host verification and its supporting release-harness hardening, including #437/#453
      - exhaustive real-host OS/Python matrix evidence beyond normal CI and the minimal clean-install smoke
    deferred_item_disposition: >-
      Deferred issues are not invalidated. They become post-Stable quality
      work unless a concrete release-blocking defect (see
      reduced_blocker_definition below) is found.
    reduced_blocker_definition: >-
      After #454, a newly discovered issue blocks Stable 1.0 only when it is
      reasonably capable of causing data loss or silent data corruption,
      violation of the declared Format 1.0 compatibility contract, inability
      to build/install/start the release artifact, a critical security
      vulnerability, or a deterministic failure of the representative core
      workflow that makes the release materially unusable. Missing
      exhaustive evidence is not by itself a blocker.
    required_now:
      format_1_0_finalization_review: >-
        One bounded release-contract review confirming the documented
        Format 1.0 grammar/version semantics match the implemented parser
        and canonical serializer, unsupported versions fail safely before
        mutation, migration/downgrade behavior is documented sufficiently,
        and round-trip/idempotency regression tests pass. See
        docs/en/format-1.0-finalization-review.md. The compatibility
        baseline decision itself is a human release-authority sign-off, not
        an AI-asserted conclusion.
      release_metadata_and_docs: >-
        #325 reused under the reduced policy: consistent version metadata,
        release notes, upgrade/downgrade guidance, documented known
        limitations, and installation examples that describe the release
        artifacts rather than editable-development assumptions. See
        docs/en/stable-release-notes-draft.md and its Japanese counterpart.
      minimal_clean_artifact_verification: >-
        #326 reused for the release-critical minimum only: build wheel and
        sdist from a clean checkout, install into at least one fresh
        supported Python environment, confirm both entry points start,
        run a representative core smoke (parse/read, mutate, serialize/
        write, re-read, and a basic recovery-safe path where practical),
        and confirm packaged artifacts exclude development caches, secrets,
        or generated local state. A full real-host OS/Python matrix is not
        a prerequisite; rely on normal CI for the broader regression
        matrix and record any known gap as a documented limitation. See
        docs/en/stable-release-artifact-verification.md.
      release_candidate_and_promotion: >-
        #327/#328 remain useful release-operation references, but their
        earlier exhaustive real-environment gates are superseded by #454
        for the first Stable 1.0 release. Cut 1.0.0rc1 once the Format 1.0
        review, the reduced #325 minimum, and the reduced #326 minimum are
        complete; run normal required CI and the minimal installed-artifact
        smoke against the RC; fix only release-blocking defects found
        during this bounded check; promote to 1.0.0 once no blocker
        remains. Both RC cutting and stable promotion require explicit
        human release authority approval.
    format_1_0_baseline_decision:
      status: approved
      decided_by: Eruhitsuji
      decided_on: "2026-08-21"
      decision_issue: https://github.com/Eruhitsuji/lifetxt/issues/457
      evidence: https://github.com/Eruhitsuji/lifetxt/pull/455
      record: docs/en/format-1.0-finalization-review.md
      statement: >-
        Format 1.0, as reviewed by the #454 Format 1.0 finalization review
        (grammar/parser alignment, unsupported-version refusal-before-write,
        migration/downgrade documentation sufficiency, and passing
        round-trip/idempotency regression tests), is accepted as the
        compatibility baseline for the first Stable 1.0 release.

  feature_freeze:
    purpose: >-
      Keep the first stable-release surface from expanding while release
      blockers, compatibility contracts, and real-environment evidence are still
      being resolved.
    task_source_of_truth: github_issues
    status_gate: >-
      Existing status:* label gates remain authoritative. Implementation must
      not start from status:inbox or status:blocked issues.
    allowed_change_classes:
      - release_blocking_bug_fix
      - security_fix
      - compatibility_fix
      - migration_or_downgrade_safety
      - recovery_or_data_loss_prevention
      - release_required_test_or_fixture
      - release_required_documentation
      - release_engineering
      - stabilization_governance
    release_blocker_definition: >-
      A release blocker is a defect, missing contract, missing migration or
      recovery path, unsupported advertised surface, or unverified required
      environment that would make the first stable release unsafe, misleading,
      or impractical to support.
    post_stable_definition: >-
      Post-stable work is useful product or platform work that can wait without
      making the first stable release unsafe or falsely advertised.
    deferred_work_policy: >-
      Deferred work must remain represented by a GitHub Issue, roadmap item, or
      explicit known limitation. Deferral is not permission to ignore a release
      blocker; it must state why the work is outside the first stable support
      surface or why the limitation is acceptable.

  compatibility_policy:
    document: docs/en/release-compatibility-policy.md
    initial_stable_version: 1.0.0
    versioning:
      pre_stable: >-
        0.y.z is development software. It may change public behavior without
        the stable compatibility promise, but compatibility-impacting changes
        must still be documented and tested under the stabilization rules.
      patch: >-
        X.Y.Z patch releases preserve documented stable contracts and contain
        compatible fixes, security fixes, and documentation corrections.
      minor: >-
        X.Y.0 minor releases preserve existing stable contracts and may add
        backward-compatible commands, fields, or capabilities.
      major: >-
        A new major version may remove or alter stable contracts only after the
        deprecation and migration process has been completed.
    covered_contracts:
      - life.txt format and declared format-version behavior
      - LIFETXT_CANON_V1 canonical serialization rules
      - stable CLI command names, flags, output modes, and exit semantics
      - versioned machine-readable schemas, capability documents, and diagnostic codes
      - stable configuration keys, types, defaults, and documented migration behavior
      - surfaces classified supported in support_matrix, including read-only clients
    not_byte_stable_by_default:
      - human-readable diagnostic messages
      - terminal layouts, colors, glyph choices, and interactive presentation
      - Web visual layout and non-contractual accessibility wording
    deprecation_lifecycle:
      announce: >-
        Mark the contract deprecated in release notes and the relevant English
        and Japanese documentation, and link the replacement or migration path.
      warn: >-
        Emit a stable diagnostic or warning when the deprecated behavior is
        used, without exposing secrets or changing the successful result solely
        because the warning is present.
      remove: >-
        Remove or change the behavior only in a later major version after at
        least one minor release has carried the deprecation, unless the unsafe
        compatibility exception applies.
    unsafe_compatibility_exception: >-
      A security or data-loss risk may shorten the normal deprecation lifecycle.
      The issue and release notes must explain the risk, affected contracts,
      migration or mitigation, and required human approval before release.
    excluded_until_promoted:
      - experimental surfaces
      - deferred surfaces
      - unsupported surfaces
      - writable Remote and MCP operations without stable-release evidence

  exception_path:
    required_for:
      - new_feature
      - expansion_of_supported_surface
      - new_external_dependency
      - new_provider_or_integration_write_surface
      - public_contract_change_not_required_by_stabilization
    approval: human_maintainer
    required_evidence:
      - issue_links_to_tracker
      - reason_the_change_is_needed_before_stable_release
      - affected_support_surface
      - compatibility_and_migration_impact
      - assurance_level_and_required_review
      - test_or_real_environment_evidence_plan
      - explicit_deferred_alternatives_considered
    recording_location: >-
      Record the exception in the issue or pull request before implementation.
      High, Regulated, migration, data, security-sensitive, or operations changes
      also need the normal project approval and change-package evidence.

  release_boundary:
    stable_release_may_include:
      - completed_child_issues_under_283
      - explicitly approved feature-freeze exceptions
      - documentation of unsupported, experimental, or deferred surfaces
    stable_release_must_not_include:
      - unreviewed broad feature work
      - writable adapters without a verified proposal or mutation contract
      - advertised support for environments without the evidence required by the
        support matrix
      - compatibility-breaking changes without a documented migration or
        downgrade decision

  support_matrix:
    classification_values:
      supported: >-
        Included in the first stable-release support surface once the named
        evidence is recorded.
      experimental: >-
        Available for trial use, but not a stable compatibility promise for the
        first stable release.
      deferred: >-
        Intentionally outside the first stable-release support promise; may be
        completed after stable release without blocking it.
      unsupported: >-
        Not supported for the first stable release; documentation must avoid
        advertising it as stable.
    evidence_types:
      simulated_or_subprocess: >-
        Unit, integration, subprocess, fixture, or disposable-local checks that
        do not prove behavior in the real target environment.
      real_environment: >-
        Evidence from the actual OS, terminal, browser engine, provider, server,
        or filesystem class named by the matrix entry.
    entries:
      - id: python-3-10
        category: runtime
        classification: supported
        minimum_evidence:
          - CI or local clean-environment test run on Python 3.10
          - release artifact install smoke for core CLI
        evidence_type: simulated_or_subprocess
        limitation: null
      - id: python-3-11
        category: runtime
        classification: supported
        minimum_evidence:
          - CI or local clean-environment test run on Python 3.11
          - release artifact install smoke for core CLI
        evidence_type: simulated_or_subprocess
        limitation: null
      - id: python-3-12
        category: runtime
        classification: supported
        minimum_evidence:
          - CI or local clean-environment test run on Python 3.12
          - release artifact install smoke for core CLI
        evidence_type: simulated_or_subprocess
        limitation: null
      - id: windows
        category: os
        classification: supported
        minimum_evidence:
          - Windows PowerShell CLI smoke with declared tzdata behavior
          - Windows file-replacement and recovery smoke for authoritative writes
        evidence_type: real_environment
        limitation: null
      - id: wsl
        category: os
        classification: supported
        minimum_evidence:
          - WSL CLI smoke
          - WSL terminal TUI smoke if TUI is in the supported surface
        evidence_type: real_environment
        limitation: null
      - id: linux
        category: os
        classification: supported
        minimum_evidence:
          - Linux CLI release artifact smoke
          - Linux filesystem recovery smoke for local authoritative writes
        evidence_type: real_environment
        limitation: null
      - id: macos
        category: os
        classification: supported
        minimum_evidence:
          - macOS CLI release artifact smoke
          - macOS terminal TUI smoke if TUI is in the supported surface
        evidence_type: real_environment
        limitation: null
      - id: dependency-free-cli
        category: public_surface
        classification: supported
        minimum_evidence:
          - core-only release artifact install has no optional Web/TUI packages
          - lifetxt entry point and python -m lifetxt both run stable smoke commands
        evidence_type: simulated_or_subprocess
        limitation: null
      - id: tui-extra
        category: public_surface
        classification: supported
        minimum_evidence:
          - real terminal smoke on Windows Terminal or WSL
          - real terminal smoke on macOS or Linux
          - documented unsupported terminal and locale cases
        evidence_type: real_environment
        limitation: >-
          Stable support is limited to terminal environments verified by #312
          and #313; other terminals are best-effort.
      - id: web-extra
        category: public_surface
        classification: supported
        minimum_evidence:
          - real browser-engine smoke for revision and recovery workflows
          - real browser-engine smoke for core UI interaction and accessibility
          - strict Web revision migration evidence where Web writes are stable
        evidence_type: real_environment
        limitation: >-
          Stable writable Web support depends on completing the strict revision
          evidence chain; otherwise Web writes must remain experimental or
          documented with a limitation before stable promotion.
      - id: browser-engines
        category: client
        classification: supported
        minimum_evidence:
          - at least one named browser engine passes the stable Web smoke suite
          - unsupported engines are documented as unverified
        evidence_type: real_environment
        limitation: >-
          Only browser engines named in release evidence are stable-supported.
      - id: mcp-client-read
        category: client
        classification: supported
        minimum_evidence:
          - MCP read-only resource smoke against installed release artifacts
          - schema/capability contract validation for stable MCP responses
        evidence_type: simulated_or_subprocess
        evidence_reference: docs/en/stable-mcp-read-artifact-smoke.md
        limitation: >-
          MCP write surfaces are not stable-supported unless selected and
          verified through the delegated proposal contract.
      - id: remote-read-client
        category: client
        classification: supported
        minimum_evidence:
          - remote read client smoke against a supported server setup
          - revision-aware pagination and resource response contract evidence
        evidence_type: real_environment
        evidence_reference: docs/en/stable-remote-read-smoke.md
        limitation: null
      - id: remote-write-client
        category: client
        classification: experimental
        minimum_evidence:
          - delegated mutation proposal and permission evidence before promotion
          - remote clock, authorization, privacy, and recovery evidence before promotion
        evidence_type: real_environment
        limitation: >-
          Writable Remote clients remain experimental until #293-#296 and #311
          classify and verify the stable writable scope.
      - id: fzf-peco-selectors
        category: client
        classification: supported
        minimum_evidence:
          - PowerShell real-shell selector action smoke
          - Unix-like real-shell selector action smoke
          - stable exit-code and quoting evidence
        evidence_type: real_environment
        limitation: >-
          Only selector and shell combinations verified by #314 are stable.
      - id: smtp-delivery
        category: integration
        classification: experimental
        minimum_evidence:
          - STARTTLS and authentication failure evidence with safe accounts
          - retry, recipient, watcher state, quiet-hours, and provider-limit evidence
        evidence_type: real_environment
        limitation: >-
          SMTP remains experimental until #315 and #316 record provider-safe
          evidence without committing credentials or private message content.
      - id: local-filesystems
        category: filesystem
        classification: supported
        minimum_evidence:
          - local filesystem transaction and recovery smoke
          - Windows file-interference evidence where Windows is supported
        evidence_type: real_environment
        limitation: null
      - id: cloud-sync-removable-network-filesystems
        category: filesystem
        classification: deferred
        minimum_evidence:
          - cloud-sync, removable, and network filesystem recovery procedures
          - documented support limits and refusal behavior
        evidence_type: real_environment
        limitation: >-
          These filesystem classes are not stable-supported until #304 records
          support limits or explicit refusal guidance.

  release_gates:
    rc_entry:
      purpose: >-
        Decide whether a reviewed commit may become a release candidate for the
        first stable release.
      required_evidence:
        ci:
          - required branch protection checks pass on the RC candidate commit
          - project release-gate commands pass on a supported interpreter
          - traceability and change-package close-out checks pass
        real_environment:
          - every support_matrix entry classified as supported has recorded the
            minimum evidence named for that entry, or has an explicit limitation
          - real Web, terminal, SMTP, Remote, and filesystem evidence is recorded
            where those surfaces remain in the stable support matrix
        migration:
          - format, configuration, policy, journal, and Web revision migration or
            refusal behavior is documented for the stable support surface
          - downgrade inspection or limitation is recorded where downgrade is not
            supported
        recovery:
          - transaction, attachment, archive, recovery-evidence, and filesystem
            recovery procedures required by supported surfaces have recorded
            evidence or documented limitations
        documentation:
          - release notes draft lists supported, experimental, deferred, and
            unsupported surfaces from the support matrix
          - upgrade, downgrade, known limitation, and installation guidance is
            consistent with the support matrix
          - English and Japanese documentation do not contradict the matrix for
            release-critical support claims
      blockers:
        - open stable-release-blocker known issue
        - missing required evidence for a supported matrix entry
        - failed or flaky required check without resolution or accepted limitation
        - unreviewed feature-freeze exception
        - security, data-loss, migration, or recovery finding without explicit
          human disposition

    stable_promotion:
      purpose: >-
        Decide whether a validated release candidate may be promoted to the
        first stable release.
      required_evidence:
        - all rc_entry evidence remains valid for the promoted commit
        - the promoted commit is identical to the validated RC code, or differs
          only by reviewed release-metadata-only changes with re-run smoke
          evidence
        - no open stable-release-blocker issue remains unresolved
        - required RC-cycle findings are classified as stable-release blocker,
          RC blocker, supported limitation, or post-stable
        - final release notes, version metadata, artifact integrity evidence,
          installation smoke evidence, and known limitations are linked from the
          release record
        - human release authority approves promotion after reviewing CI,
          real-environment, migration, recovery, and documentation evidence
      blockers:
        - any unresolved stable-release blocker
        - any required RC validation check failed, flaky, stale, or not run
        - any accepted limitation missing from release notes or support docs
        - artifact build or install evidence not tied to the promoted commit
        - release authority approval missing

    required_check_policy:
      failed_check: >-
        A failed required check blocks RC entry and stable promotion until the
        underlying issue is fixed, the check is re-run successfully, or a human
        maintainer records an explicit stable-release limitation or deferral.
      flaky_check: >-
        A flaky required check is treated as failed evidence. Promotion remains
        blocked until the flake is diagnosed and resolved, or explicitly accepted
        as a documented limitation with the affected support surface named.
      stale_check: >-
        Evidence collected against an older commit is stale when code,
        dependencies, packaging, support classification, migration behavior, or
        recovery behavior relevant to that evidence has changed.

    known_issue_severity:
      stable_release_blocker: >-
        Must be fixed or explicitly removed from the stable support surface
        before stable promotion.
      rc_blocker: >-
        Must be fixed or intentionally deferred before the first RC can be cut,
        because it prevents meaningful RC validation.
      supported_limitation: >-
        May ship only when the limitation is user-facing, linked from release
        notes, and does not contradict the support matrix.
      post_stable: >-
        Useful work outside the first stable-release promise; must remain
        tracked without blocking RC or stable promotion.
      not_release_relevant: >-
        Does not affect supported stable behavior, release artifacts,
        migration, recovery, security, or documentation claims.

  roadmap_classification:
    source: todo.md
    classified_by_issue: https://github.com/Eruhitsuji/lifetxt/issues/287
    authority_boundary: >-
      These entries classify release relevance only. They do not replace
      GitHub Issues as the source of truth for task execution, ownership,
      review state, or completion status.
    p0_items:
      - id: p0-strict-web-revision-migration
        todo_summary: Execute and finish the strict Web revision migration in a real deployment.
        classification: stable_release_blocker
        issue_links:
          - https://github.com/Eruhitsuji/lifetxt/issues/288
          - https://github.com/Eruhitsuji/lifetxt/issues/289
          - https://github.com/Eruhitsuji/lifetxt/issues/290
          - https://github.com/Eruhitsuji/lifetxt/issues/291
          - https://github.com/Eruhitsuji/lifetxt/issues/292
        rationale: >-
          Stable writable Web support requires real observe-to-required revision
          evidence, client preconditions, zero-legacy-write observation, strict
          mode, and upgrade/rollback behavior before promotion.
      - id: p0-delegated-mutation-contract-adoption
        todo_summary: Finish adapter-specific adoption of the delegated-process mutation contract.
        classification: stable_release_blocker
        issue_links:
          - https://github.com/Eruhitsuji/lifetxt/issues/293
          - https://github.com/Eruhitsuji/lifetxt/issues/294
          - https://github.com/Eruhitsuji/lifetxt/issues/295
          - https://github.com/Eruhitsuji/lifetxt/issues/296
        rationale: >-
          No delegated adapter may be advertised as stable writable until its
          writable scope, provenance, permission, lifecycle, sandbox, and
          proposal-contract behavior are verified.
      - id: p0-remote-attachment-recovery-evidence
        todo_summary: Finish real-client and adverse-recovery evidence for remote directory/package attachments.
        classification: stable_release_blocker
        issue_links:
          - https://github.com/Eruhitsuji/lifetxt/issues/297
          - https://github.com/Eruhitsuji/lifetxt/issues/298
          - https://github.com/Eruhitsuji/lifetxt/issues/299
        rationale: >-
          Remote attachment/package behavior affects privacy, authorization,
          transaction recovery, and large-file bounds for supported Web/MCP
          clients.
      - id: p0-transaction-durability-filesystem-recovery
        todo_summary: Prove durable recovery under real power, storage, and platform failures.
        classification: stable_release_blocker
        issue_links:
          - https://github.com/Eruhitsuji/lifetxt/issues/300
          - https://github.com/Eruhitsuji/lifetxt/issues/301
          - https://github.com/Eruhitsuji/lifetxt/issues/302
          - https://github.com/Eruhitsuji/lifetxt/issues/303
          - https://github.com/Eruhitsuji/lifetxt/issues/304
        rationale: >-
          Authoritative write and recovery claims cannot be stable without
          crash-boundary, corrupted-artifact, adverse-filesystem, Windows, and
          documented support-limit evidence.
        evidence_notes:
          - >-
            #300 extends the deterministic subprocess crash-boundary matrix
            through delete, verification, compensation write/verify, terminal
            cleanup, backup copy, and restore-working-copy paths. This evidence
            is explicitly simulated subprocess termination, not physical
            power-loss evidence.
          - >-
            #301 verifies corrupted or missing journal metadata, recovery
            artifacts, and backup manifests fail safely before recovery mutates
            authoritative targets, with deterministic repeat attempts and
            inspect output retained where possible.
          - >-
            #302 verifies simulated disk-full, quota, and permission-denied
            transaction failures before journal publication and during recovery,
            distinguishing capacity from permission diagnostics without relying
            on POSIX-only permission behavior.
          - >-
            #303 records real Windows 10.0.19045 / NTFS evidence using a safe
            `msvcrt.locking` byte-range target-file lock: replace is refused
            as PermissionError/WinError 5, no false committed state is reported,
            and recovery succeeds after the lock is released.
      - id: p0-protected-recovery-evidence-authorization
        todo_summary: Complete protected evidence storage, authenticated authorization, and future policy/journal migration operations.
        classification: stable_release_blocker
        issue_links:
          - https://github.com/Eruhitsuji/lifetxt/issues/305
          - https://github.com/Eruhitsuji/lifetxt/issues/306
          - https://github.com/Eruhitsuji/lifetxt/issues/307
          - https://github.com/Eruhitsuji/lifetxt/issues/308
          - https://github.com/Eruhitsuji/lifetxt/issues/309
        rationale: >-
          Recovery evidence, destructive restore authority, policy/journal
          migration, redaction/export, and drill evidence are release-critical
          for safe recovery operations.
        evidence_notes:
          - >-
            #305 defines `os-private-v1` as the stable recovery-evidence
            storage profile: OS current-user private permissions plus integrity
            manifests for transaction, backup, archive, and restore evidence.
            Encryption-at-rest is not advertised as supported; unsupported
            encrypted profiles fail preflight or journal preparation before
            authoritative mutation.
          - >-
            #306 requires authenticated principal-derived recovery
            authorization for remote or multi-user recovery surfaces, enforces
            configured role/scope/project restrictions before restore mutation,
            and supports separate approval identity checks for destructive
            backup restore actions. Local single-operator administration
            remains a documented limitation when these settings are disabled.
          - >-
            #307 makes policy version 1 and journal schema version 1 migration
            and refusal paths explicit. Newer policy/journal data is refused
            before mutation, newer journals remain inspect/export-only, and
            unsupported downgrade paths are documented rather than inferred.
          - >-
            #308 defines the shareable recovery-evidence boundary: transaction
            identifiers, revision hashes, timestamps, and target relations are
            retained; raw paths, error text, artifact payloads, authored content,
            credentials, and tokens are redacted or prohibited.
          - >-
            #309 exercises the operator escalation path in a temporary
            workspace: safe compensation, diverged-target refusal, immutable
            backup handoff, manifest verification, and separate restore
            inspection. No production data is used.
      - id: p0-timezone-fixtures-remote-clock
        todo_summary: Complete deterministic timezone fixtures and operationalize the implemented remote clock precondition.
        classification: stable_release_blocker
        issue_links:
          - https://github.com/Eruhitsuji/lifetxt/issues/310
          - https://github.com/Eruhitsuji/lifetxt/issues/311
        rationale: >-
          Stable public surfaces need shared timezone fixtures, and remote clock
          enforcement must bind to authenticated sessions and audit evidence.
        evidence_notes:
          - >-
            #310 centralizes timezone and clock expectations for precedence,
            normalization, DST behavior, historical rules, and skew boundaries.
            Core CLI/TUI/Web/MCP interpretation shares timezone_policy; Windows
            named-zone resolution is constrained to zoneinfo plus declared tzdata.
          - >-
            #311 moves Remote Safe Mode clock enforcement inside authenticated
            Web request handling and records bounded principal/session clock
            evidence for accepted and denied writes. MCP records the same
            evidence only when its host supplies authenticated context.
      - id: p0-real-terminal-tui
        todo_summary: Verify the dependency-free TUI in real WSL, Windows Terminal, macOS, and Linux terminals.
        classification: stable_release_blocker
        issue_links:
          - https://github.com/Eruhitsuji/lifetxt/issues/312
          - https://github.com/Eruhitsuji/lifetxt/issues/313
        rationale: >-
          The support matrix classifies TUI as supported only with real-terminal
          evidence; missing evidence blocks stable support or must become a
          documented limitation.
      - id: p0-fzf-peco-real-shells
        todo_summary: Verify fzf and peco actions end to end on Windows PowerShell and Unix-like shells.
        classification: stable_release_blocker
        issue_links:
          - https://github.com/Eruhitsuji/lifetxt/issues/314
        rationale: >-
          Supported selector/shell combinations need real-shell quoting,
          stale-revision, all-or-none, and exit-code evidence.
      - id: p0-smtp-safe-account-verification
        todo_summary: Verify SMTP delivery with safe test accounts.
        classification: supported_limitation
        issue_links:
          - https://github.com/Eruhitsuji/lifetxt/issues/315
          - https://github.com/Eruhitsuji/lifetxt/issues/316
        rationale: >-
          The support matrix keeps SMTP experimental until safe-provider
          evidence exists. Stable promotion may proceed only if release
          documentation does not advertise SMTP as stable before these issues
          complete.
      - id: p0-browser-engine-smoke-tests
        todo_summary: Add browser-engine smoke tests for the Web UI.
        classification: stable_release_blocker
        issue_links:
          - https://github.com/Eruhitsuji/lifetxt/issues/317
          - https://github.com/Eruhitsuji/lifetxt/issues/318
        rationale: >-
          Stable Web support requires real browser-engine evidence for revision,
          recovery, interaction, accessibility, and browser-specific failure
          handling.
    format_1_0_public_compatibility:
      - id: p1-format-version-migration
        todo_summary: Complete Format 1.0 enforcement beyond the mutation guard.
        classification: stable_release_blocker
        issue_links:
          - https://github.com/Eruhitsuji/lifetxt/issues/319
          - https://github.com/Eruhitsuji/lifetxt/issues/320
        rationale: >-
          Parser-authoritative format version metadata, unsupported-version
          behavior, explicit migration, and downgrade inspection are public
          compatibility boundaries.
      - id: p1-canonical-serialization
        todo_summary: Complete LIFETXT_CANON_V1.
        classification: stable_release_blocker
        issue_links:
          - https://github.com/Eruhitsuji/lifetxt/issues/321
        rationale: >-
          Canonical serialization defines a stable byte-level contract that is
          costly to change after the first stable release.
      - id: p1-multi-file-semantics
        todo_summary: Enforce documented multi-file semantics.
        classification: stable_release_blocker
        issue_links:
          - https://github.com/Eruhitsuji/lifetxt/issues/322
        rationale: >-
          Deterministic source ordering, workspace-wide IDs, references, and
          write targets affect stable reads and authoritative writes.
      - id: p1-stable-schema-contracts
        todo_summary: Expand the schema bundle where real contracts exist.
        classification: stable_release_blocker
        issue_links:
          - https://github.com/Eruhitsuji/lifetxt/issues/323
        rationale: >-
          Stable public machine-readable contracts require versioned schemas or
          explicit documented exceptions.
      - id: p1-stable-diagnostics
        todo_summary: Extend stable diagnostics and route legacy check --format json to the stable shape.
        classification: stable_release_blocker
        issue_links:
          - https://github.com/Eruhitsuji/lifetxt/issues/324
        rationale: >-
          Release-critical validation and recovery failures need stable
          diagnostic codes and compatibility expectations.
    p1_deferred_groups:
      - id: p1-remote-safe-mode-follow-up
        classification: post_stable
        limitation: >-
          Remote hardening and richer Remote ticket/client views remain tracked
          P1 work, but are not first-stable blockers unless #293-#311 or the
          support matrix makes a specific writable or real-environment claim
          release-critical.
      - id: p1-project-ticket-timer-notification-workflow-ui
        classification: post_stable
        limitation: >-
          Project, ticket, timer, notification, workflow, UI, integration, and
          documentation expansion remains post-stable unless a child issue under
          #283 explicitly classifies the work as a stable-release blocker.
      - id: p1-format-adjacent-future-tools
        classification: post_stable
        limitation: >-
          check --fix, second corpus versions, broad operation-registry
          expansion, additional public-contract matrices, and direct-write
          baseline reduction stay post-stable unless required to satisfy
          #319-#324.

  delegated_mutation_inventory:
    classified_by_issue: https://github.com/Eruhitsuji/lifetxt/issues/293
    authority_boundary: >-
      This inventory classifies delegated or externally mediated mutation
      surfaces for the first stable release. It does not classify ordinary
      in-process CLI writes, and it does not promote an adapter to stable
      writable support without linked proposal-contract, permission,
      lifecycle, or real-environment evidence.
    classification_values:
      stable_writable: >-
        May be advertised as a stable writable path after the linked evidence
        proves the mutation contract for the concrete surface.
      read_only_disabled: >-
        Must remain read-only or have write behavior disabled for the first
        stable release.
      experimental: >-
        Existing implementation may remain available, but release
        documentation must not advertise stable writable support.
      deferred: >-
        Outside the first stable writable support surface.
    entries:
      - id: delegated-proposal-contract
        surface: CLI delegated mutation proposal prepare/apply/reject workflow
        implementation_paths:
          - lifetxt/delegated_mutation.py
          - tests/test_delegated_mutation_v6.py
          - tests/test_p0_cli_v6.py
        classification: stable_writable
        verification:
          - tests/test_delegated_mutation_v6.py
          - tests/test_p0_cli_v6.py::test_delegated_prepare_inspect_and_apply_cli
          - https://github.com/Eruhitsuji/lifetxt/issues/294
          - https://github.com/Eruhitsuji/lifetxt/issues/295
          - https://github.com/Eruhitsuji/lifetxt/issues/296
        related_issues:
          - https://github.com/Eruhitsuji/lifetxt/issues/293
          - https://github.com/Eruhitsuji/lifetxt/issues/294
          - https://github.com/Eruhitsuji/lifetxt/issues/295
          - https://github.com/Eruhitsuji/lifetxt/issues/296
        notes: >-
          External programs receive only a private temporary copy. Applying the
          result requires a validated proposal object and an authoritative
          revision precondition. Proposal records include validated adapter,
          provenance, authorization, lifecycle, sandbox, and contract hash
          metadata from #294 and #295; unsafe override is present but not part
          of the stable advertised path. #296 routes the stable editor-session
          adapter path through the same delegated proposal prepare/apply
          contract instead of calling a direct editor write path.
      - id: editor-session-contract
        surface: Existing CLI, TUI, fzf, and peco editor sessions
        implementation_paths:
          - lifetxt/editor_safety.py
          - lifetxt/fzf_helper.py
          - lifetxt/tui.py
          - lifetxt/tui_app.py
          - tests/test_editor_safety_v5.py
        classification: stable_writable
        verification:
          - tests/test_editor_safety_v5.py
          - https://github.com/Eruhitsuji/lifetxt/issues/314
        related_issues:
          - https://github.com/Eruhitsuji/lifetxt/issues/293
          - https://github.com/Eruhitsuji/lifetxt/issues/314
        notes: >-
          The existing editor path uses a temporary file, validation, revision
          checks, and optional conservative reconciliation before writing the
          authoritative source. Stable selector/shell combinations still depend
          on #314 real-shell evidence.
      - id: mcp-local-write-tools
        surface: MCP tools that mutate local life.txt state
        implementation_paths:
          - lifetxt/mcp.py
          - tests/test_mcp_expansion.py
        classification: experimental
        verification:
          - https://github.com/Eruhitsuji/lifetxt/issues/296
        related_issues:
          - https://github.com/Eruhitsuji/lifetxt/issues/293
          - https://github.com/Eruhitsuji/lifetxt/issues/296
        notes: >-
          MCP read-only tools remain separately supported by the support
          matrix. MCP write tools expose dry-run/propose controls in code, but
          are not stable writable until adapter-specific proposal-contract
          evidence is recorded.
      - id: remote-ticket-write-adapter
        surface: Remote protocol-v2 authenticated ticket mutation adapter and CLI client
        implementation_paths:
          - lifetxt/remote_ticket_writes.py
          - lifetxt/remote_ticket_write_core.py
          - lifetxt/remote_ticket_write_operations.py
          - lifetxt/remote_client_writes.py
          - tests/test_remote_ticket_writes_v22.py
          - tests/test_remote_client_writes_v23.py
          - tests/test_remote_client_writes_compat_v25.py
        classification: experimental
        verification:
          - https://github.com/Eruhitsuji/lifetxt/issues/294
          - https://github.com/Eruhitsuji/lifetxt/issues/295
          - https://github.com/Eruhitsuji/lifetxt/issues/296
          - https://github.com/Eruhitsuji/lifetxt/issues/311
        related_issues:
          - https://github.com/Eruhitsuji/lifetxt/issues/293
          - https://github.com/Eruhitsuji/lifetxt/issues/294
          - https://github.com/Eruhitsuji/lifetxt/issues/295
          - https://github.com/Eruhitsuji/lifetxt/issues/296
          - https://github.com/Eruhitsuji/lifetxt/issues/311
        notes: >-
          The implementation requires authenticated write scope, exact
          If-Match revision, transaction idempotency, capability advertisement,
          and dry-run support. It remains experimental for the first stable
          boundary until the follow-up evidence issues close.
      - id: web-record-editor
        surface: Web browser record editor and Web write routes
        implementation_paths:
          - lifetxt/webapp.py
          - lifetxt/web_assets.py
        classification: experimental
        verification:
          - https://github.com/Eruhitsuji/lifetxt/issues/288
          - https://github.com/Eruhitsuji/lifetxt/issues/289
          - https://github.com/Eruhitsuji/lifetxt/issues/290
          - https://github.com/Eruhitsuji/lifetxt/issues/291
          - https://github.com/Eruhitsuji/lifetxt/issues/292
          - https://github.com/Eruhitsuji/lifetxt/issues/317
          - https://github.com/Eruhitsuji/lifetxt/issues/318
        related_issues:
          - https://github.com/Eruhitsuji/lifetxt/issues/293
          - https://github.com/Eruhitsuji/lifetxt/issues/288
          - https://github.com/Eruhitsuji/lifetxt/issues/289
          - https://github.com/Eruhitsuji/lifetxt/issues/290
          - https://github.com/Eruhitsuji/lifetxt/issues/291
          - https://github.com/Eruhitsuji/lifetxt/issues/292
        notes: >-
          Web writes are not delegated-process mutations, but they are
          externally mediated browser writes. Stable writable Web support is
          blocked on the strict revision migration and real browser-engine
          evidence chain.
      - id: web-git-routes
        surface: Web routes that run git operations for repository sync
        implementation_paths:
          - lifetxt/web_routes_git.py
          - tests/test_web_routes_git.py
        classification: experimental
        verification:
          - https://github.com/Eruhitsuji/lifetxt/issues/288
          - https://github.com/Eruhitsuji/lifetxt/issues/300
          - https://github.com/Eruhitsuji/lifetxt/issues/303
        related_issues:
          - https://github.com/Eruhitsuji/lifetxt/issues/293
        notes: >-
          These routes can mutate repository state through git, but they are
          not a stable life.txt writable adapter. They must not be documented as
          stable writable until Web revision, recovery, and deployment evidence
          explicitly includes them.
      - id: plugin-sdk-mutation-adapters
        surface: Future plugin or third-party adapter mutation API
        implementation_paths: []
        classification: deferred
        verification: []
        related_issues:
          - https://github.com/Eruhitsuji/lifetxt/issues/293
        notes: >-
          No concrete stable plugin mutation adapter is implemented or
          advertised for the first stable release. Future adapters need their
          own issue, contract, and verification before becoming writable.
      - id: provider-side-effect-integrations
        surface: External provider integrations with side effects, including SMTP
        implementation_paths:
          - lifetxt/delivery.py
        classification: experimental
        verification:
          - https://github.com/Eruhitsuji/lifetxt/issues/315
          - https://github.com/Eruhitsuji/lifetxt/issues/316
        related_issues:
          - https://github.com/Eruhitsuji/lifetxt/issues/293
          - https://github.com/Eruhitsuji/lifetxt/issues/315
          - https://github.com/Eruhitsuji/lifetxt/issues/316
        notes: >-
          Provider side effects are not authoritative life.txt mutations, but
          they are externally mediated writes to another system. They remain
          experimental until safe-account provider evidence is recorded.
