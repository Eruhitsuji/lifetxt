      backup/restore/validation procedures), plus `lifetxt server-update`: a
      guarded production-update CLI command wrapping `lifetxt update`'s
      existing git fast-forward logic with backup, service stop/start,
      dependency reinstall, pre/post-update data-hash verification,
      configurable integrity checks, and a pre-mutation risk-classification
