schema_version: 1
verification:
  checks:
  - type: site_build_links
    command: python scripts/build_website.py --output .cache/website-v1; python scripts/check_website.py
      .cache/website-v1; python -m lifetxt check website/example.txt
    source_commit: a3c9e23d + scoped website working tree
    status: passed
    result: 14 HTML pages; internal links/assets/fragments/meta valid; 4 synthetic
      records accepted.
  - type: unit_integration
    command: python -m unittest tests.test_website tests.test_traceability_gate tests.test_change_package_closeout
    source_commit: a3c9e23d + scoped website working tree
    status: passed
    result: 22 tests OK. Initial fixture-only artifact-count assertion failed (25
      vs 24); replaced brittle count with public artifact exclusions, rerun green.
  - type: browser
    command: Optional Playwright 1.51 with installed Chromium Headless Shell over
      real local HTTP /lifetxt/
    source_commit: a3c9e23d + scoped website working tree
    status: passed
    result: '36 page/width combinations: six pages in both languages at 320/390/1280px;
      HTTP 200, no horizontal overflow, corresponding language links, keyboard Tab/Enter
      skip to main and root English navigation. Desktop EN and mobile screenshots
      inspected; this host lacks Japanese glyph fonts, so JA text/codepoints/layout
      were checked but glyph appearance remains a live/real-device gap.'
  - type: static
    command: ruff check lifetxt tests scripts; approved mypy diagnostic_contract.py
      boundary
    source_commit: a3c9e23d + scoped website working tree
    status: passed
    result: Lint and type boundary passed.
  - type: pages_guard
    command: python -m unittest tests.test_website tests.test_website_pages_workflow
      tests.test_traceability_gate tests.test_change_package_closeout
    source_commit: 3a71a461 + operations scoped working tree
    status: passed
    result: 26 tests OK, no skips. Executes actual inline guard with fake read-only
      HTTP for owner reviewer, missing/malformed/bot/other reviewer and API failure.
      PR/non-main/fork denied; branch/event/permission/artifact/Action pin/checkout
      isolation policies checked.
  - type: operations_static
    command: ruff check lifetxt tests scripts; mypy --follow-imports=skip --ignore-missing-imports
      lifetxt/diagnostic_contract.py; python -m lifetxt check examples/minimal_life.txt
    source_commit: 3a71a461 + operations scoped working tree
    status: passed
    result: All lint, approved type boundary and baseline 10 records passed. YAML
      parsed; real Actions build and deployment remain CI/Owner gates.
  - type: pages_coverage_ci_repair
    command: COVERAGE_FILE=<temporary-data> python -m coverage run --branch -m unittest
      tests.test_website_pages_workflow; python -m coverage report; python -m coverage
      json; python -m unittest discover -s tests -p test_website_pages_workflow.py
    source_commit: a66c62e5 plus scoped CI-repair working tree; main 770c0bc6 integration checked
    status: passed
    result: Reproduced the CI missing-source error with coverage 7.16.2 after all
      four original tests passed. Both dynamic compile sites now use a virtual
      angle-bracket source name, without weakening coverage or publication gates.
      Five workflow tests now pass under coverage, report and JSON export succeed,
      and discovery-mode invocation passes. A subprocess regression independently
      exercises positive/refusal guards then requires successful report and JSON.
      Combined site/workflow/traceability/package suite is 27 tests OK; lint and
      approved mypy boundary pass. CI run 38922993874 failure is retained as the
      original evidence; latest-head CI must be checked separately.
  - type: public_http_acceptance
    command: Concurrent urllib GET of all 23 recorded URLs plus 18 external links;
      deployed-commit build and byte SHA-256 comparison
    source_commit: a64e38b373bc95f616babc3b3149a4b038807b8e
    status: passed
    result: 22 HTTP 200 artifacts exactly match deployed build; unknown nested path
      returns matching 404 body. Metadata and local links validated by deployed
      checker. Public evidence in live-http-20261017.json and public-acceptance.md.
  - type: english_root_regression
    command: python -m unittest tests.test_supported_runtime tests.test_website
      tests.test_website_pages_workflow tests.test_traceability_gate tests.test_change_package_closeout;
      Ruff lint and focused format; approved mypy boundary; build/check; sample checks
    source_commit: 85cc45ebe8a5cb59bc2d26cd95fe61c4e4b228c4 (same code/tests; traceability finalized afterward)
    status: passed
    result: 31 tests OK; lint, format, mypy, build/check and synthetic/baseline samples
      pass. Live browser skip/focus and language switch pass; no screenshot/zoom or
      real-device/screen-reader success claimed. Required CI and independent review
      are pending. Full runtime suite not run for this static-only change.
  gaps:
  - description: Independent latest-head review and required CI remain human/PR gates;
      full runtime suite not run locally for a static-only runtime-neutral change.
    tracked_by: https://github.com/Eruhitsuji/lifetxt/issues/1353
  - description: Initial deployment and live HTTP links verified; new English-root
      deployment, real-device visual acceptance, Safari, screen-reader and 200% zoom
      remain unverified. See public-acceptance.md.
    tracked_by: https://github.com/Eruhitsuji/lifetxt/issues/1353
  - description: High latest-head review history remains human evidence; first
      deployment success does not substitute for independent implementation and
      integration review. No Settings or deployment action performed by Codex.
    tracked_by: https://github.com/Eruhitsuji/lifetxt/issues/1352
