name: Diagnose verified P0 remote safety patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/p0-remote-safety-batch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-remote-safety-batch
          fetch-depth: 0
      - name: Diagnose verification and application
        shell: bash
        run: |
          set +e
          REPORT=/tmp/pr22-diagnostic.txt
          : > "$REPORT"
          stage() {
            name="$1"
            shift
            echo "== ${name} ==" >> "$REPORT"
            "$@" >> "$REPORT" 2>&1
            code=$?
            echo "exit=${code}" >> "$REPORT"
          }
          stage chunk_hashes sha256sum .github/agent-patch/part-00 .github/agent-patch/part-01 .github/agent-patch/part-02 .github/agent-patch/part-03 .github/agent-patch/part-04 .github/agent-patch/part-05 .github/agent-patch/part-06 .github/agent-patch/part-07
          stage chunk_sizes wc -c .github/agent-patch/part-00 .github/agent-patch/part-01 .github/agent-patch/part-02 .github/agent-patch/part-03 .github/agent-patch/part-04 .github/agent-patch/part-05 .github/agent-patch/part-06 .github/agent-patch/part-07
          cat .github/agent-patch/part-* > /tmp/pr22.patch.gz.b64
          stage joined_hash sha256sum /tmp/pr22.patch.gz.b64
          base64 -d /tmp/pr22.patch.gz.b64 > /tmp/pr22.patch.gz 2>> "$REPORT"
          echo "decode_exit=$?" >> "$REPORT"
          stage gzip_hash sha256sum /tmp/pr22.patch.gz
          stage gzip_test gzip -t /tmp/pr22.patch.gz
          gzip -dc /tmp/pr22.patch.gz > /tmp/pr22.patch 2>> "$REPORT"
          echo "decompress_exit=$?" >> "$REPORT"
          stage patch_hash sha256sum /tmp/pr22.patch
          stage apply_check git apply --check --verbose /tmp/pr22.patch
          stage apply_index git apply --index --whitespace=fix --verbose /tmp/pr22.patch
          rm -rf .github/agent-patch
          rm -f .github/agent-probe*.txt .github/agent-note.md .github/agent-trigger.txt
          rm -f .github/workflows/agent-source-export.yml
          git add -A >> "$REPORT" 2>&1
          echo "git_add_exit=$?" >> "$REPORT"
          stage diff_check git diff --cached --check
          stage status git status --short
          stage stat git diff --cached --stat
          cat "$REPORT"
      - uses: actions/upload-artifact@v4
        with:
          name: pr22-patch-diagnostic
          path: /tmp/pr22-diagnostic.txt
          if-no-files-found: error
