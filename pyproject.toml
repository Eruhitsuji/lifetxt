[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lifetxt"
version = "0.1.0"
description = "Parser, validator, converter, CLI, and optional web UI for life.txt."
readme = "readme.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "lifetxt contributors" }
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Text Processing"
]
# Windows has no IANA timezone database for `zoneinfo` to read, so a clean
# install cannot resolve any zone without this. Data only, no transitive
# dependencies, and the marker keeps every other platform dependency-free.
dependencies = [
  "tzdata; sys_platform == 'win32'"
]
[project.scripts]
lifetxt = "lifetxt.entrypoint:main"

[project.optional-dependencies]
web = [
  "fastapi>=0.95,<1.0",
  "uvicorn[standard]>=0.22,<1.0"
]
tui = [
  "textual>=0.24,<1.0",
  "watchdog>=3,<7"
]
dev = [
  "coverage>=7,<8",
  "ruff>=0.16.1",
  "httpx2",
  "tomli; python_version < '3.11'"
]

[tool.setuptools]
packages = ["lifetxt"]

[tool.ruff]
required-version = ">=0.16.1"
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
  "E9",
  "F63",
  "F7",
  "F82"
]
