name: brand-traceability-fix

on:
  push:
    branches:
      - feature/brand-logo-assets

permissions:
  contents: write

jobs:
  append-traceability-exception:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/brand-logo-assets
          fetch-depth: 0
      - name: Append approved traceability exception
        shell: bash
        run: |
          cat >> .ai/project/TRACEABILITY.yml <<'EOF'

          exceptions:
            - exception_type: traceability_not_applicable
              task_issue: https://github.com/Eruhitsuji/lifetxt/issues/575
              pull_request: https://github.com/Eruhitsuji/lifetxt/pull/576
              scope: assets/brand plus existing Web favicon/header branding, Tauri Desktop icon derivatives, and focused validation
              reason: Presentation-only brand integration; no runtime behavior, data model, public interface, or independently callable capability changed
              approved_by: Eruhitsuji
              status: accepted
          EOF
          rm .github/workflows/brand-traceability-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai/project/TRACEABILITY.yml .github/workflows/brand-traceability-fix.yml
          git commit -m "Record brand traceability exception (#575)"
          git push origin HEAD:feature/brand-logo-assets
