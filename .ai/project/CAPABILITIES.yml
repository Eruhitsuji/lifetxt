      absolute paths, remote targets, and raw adapter errors remain
      server-side. Self-review also made incomplete/disabled configuration
      return before destination I/O and validates persisted timestamps and
      generated archive names before projection. The responsive Web Server
      view consumes only that API and
      keeps local and off-host results in separate cards. The scheduled-backup
      systemd generator mirrors the established
      git-commit-worker/report-job unit-generation pattern in
      lifetxt/server_init.py. Issue #868 records the High-assurance design for
