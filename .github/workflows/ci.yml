name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install optional Web test dependencies
        run: python -m pip install -r requirements-web.txt httpx

      - name: Compile Python files
        run: python -m compileall lifetxt tests scripts

      - name: Run unit tests
        run: python -m unittest discover

      - name: Validate examples
        run: |
          python -m lifetxt check examples/minimal_life.txt
          python -m lifetxt check examples/status_presence.txt
          python -m lifetxt check examples/messages_life.txt

      - name: Run release smoke test
        run: python scripts/smoke_test.py
