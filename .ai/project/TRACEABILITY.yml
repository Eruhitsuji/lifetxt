    - requirement_id: req-server-update-git-worker-coordination
      capability_id: cap-server-init-git-commit-worker
      epic: https://github.com/Eruhitsuji/lifetxt/issues/806
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/814
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/820
      changed_files_or_scope:
        - Fix server-update to stop/restore the opt-in Git-commit worker's
          systemd units (timer + oneshot service) alongside the existing
          calendar-sync/web units, sourced from one shared
          _managed_service_units() helper reused by both
          _server_update_config() and the generated least-privilege
          service-control wrapper, so an enabled worker cannot be silently
          omitted from either.
        - lifetxt/server_init.py
        - tests/test_server_init.py
        - docs/deployment/ubuntu-server.md
        - .ai/project/changes/server-update-git-worker-coordination/
      tests_or_evidence:
        - ".venv/Scripts/python.exe -m unittest tests.test_server_init -> 41 tests passed"
        - ".venv/Scripts/python.exe -m unittest tests.test_server_update -> 125 tests passed, 1 skipped"
        - ".venv/Scripts/ruff.exe check lifetxt/server_init.py tests/test_server_init.py -> clean"
      notes: >-
        Before this fix, server-update's stop-before-update/restore-after-
        update sequence and the generated service-control wrapper's
        authorized systemctl operations both derived their unit list
        independently of the worker, so an enabled worker's timer/service
        could keep running (and racing its own git operations against
        server-update's own checkout) during an update, or the wrapper
        could refuse to grant the sudoers-scoped is-active/stop/start calls
        server-update needs for those units. _managed_service_units() is
        now the single source both call sites read from. Review found this
        requirement had a per-package traceability.yml
        (.ai/project/changes/server-update-git-worker-coordination/) but no
        entry in the central TRACEABILITY.yml; added here.
      status: implemented

