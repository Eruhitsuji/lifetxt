gaps:
  - requirement_id: req-archive-plan-v1-schema-and-emit
    description: >-
      selected_item_ids is populated only from items carrying an explicit
      id: (or configured id_key) detail; an id-less item is archived
      correctly but is invisible in that field, so a workspace without
      ids.auto enabled can emit a plan with an empty selected_item_ids
      even though real candidates exist. The underlying safety property
      (byte-identical revision implies identical selection) is unaffected;
      this is a plan-readability/audit gap, not a write-safety gap.
    tracked_by: null
    severity: low
