    related_pull_requests: []
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      No existing capability entry covered `lifetxt/inbox.py` before this
      change, even though the proposal store, staging, and accept/reject/
      defer/batch-apply mechanism predates this session (confirmed by
      searching this file); this entry closes that gap, matching the
      precedent set by `cap-remote-cli-read-client`/`cap-mcp-prompts` for
      pre-existing-but-untraced functionality. #494 investigated Unified
      Inbox proposal-contract hardening and found, by reading the actual
      call chain rather than the schema field names alone, that
      `expected_revision` was captured on the schema but never read back by
      any accept path (no caller ever supplied one), and that
      `provenance` was a documented field no caller ever populated. #496
      fixes both: `stage_create()` now resolves the same default target
      `command_proposal_accept` would use, snapshots its real content-hash
      revision, and records `staged_target`/`expected_revision`/`provenance`;
      `apply_proposal()` uses the proposal's own stage-time revision (when
      the caller supplies no explicit override and the accept target
      matches `staged_target`) and refuses with a distinct stale-proposal
      error on a mismatch, rather than silently rebasing onto whatever the
      file currently contains. `batch_apply()` gained a `use_staged_revision`
      flag, true only for the first proposal in a batch, since otherwise
      several proposals staged before any of them were applied would each
      see an earlier batch member's own just-written change as external
      staleness and incorrectly fail -- found and fixed during
      implementation by re-running the pre-existing `test_batch_apply` test,
      which failed against the naive per-proposal-revision design before
      this flag was added. #494 also assumed `ticket new` already emits a
      `created` `record:ticket_event`, generalizing from the fact that
      ticket *transitions* do; on closer reading this was incorrect --
      `ticket_activity.EVENT_TYPES` declares `"created"` but nothing in the
      codebase ever constructed one. #497 corrects this rather than silently
      keeping #497's own premise: adds `build_creation_event()`, a thin
      wrapper around the existing `build_ticket_event()` supplying the fixed
      `sequence=1` and an auto-generated transaction id a brand-new ticket
      with no prior history needs (no event-construction logic duplicated;
      `build_ticket_event()` itself is unmodified). Wires it into **both**
      `command_ticket_new` (`lifetxt/cli.py`) and its
      `lifetxt/ticket_custom_fields.py` monkey-patched duplicate -- found
      during implementation that the latter is what actually runs on every
      normal `lifetxt` invocation, since `lifetxt/__init__.py` installs it
      unconditionally at import time, silently overriding the former; fixing
      only the original would have left the feature dead in practice. Also
      wires it into `inbox.apply_proposal()` for a ticket-shaped create
      proposal (`record:ticket` on a `T` item, with `id:`) so acceptance
      produces the same creation-event audit trail; a ticket-shaped proposal
      missing `id:` (staging does not auto-generate one the way `ticket new`
      does) and every non-ticket proposal are unaffected. `ticket_revision`
      on the new event uses the fixed marker `"new"` rather than a content
      hash, since -- unlike a transition, which records the file's revision
      immediately before an existing ticket changed -- there is no
      meaningful "before" ticket state for a creation event to describe;
      confirmed this is schema-valid (`{"type": "string"}`, no format
      constraint) and passes `validate_ticket_event`'s presence-only check.
      Update/delete proposal representation and permission checks on accept
      remain deliberately out of scope for this pass, per #494's own
      recommendation -- no evidence of a gap justifies either given today's
      CLI-only, local-operator exposure surface.
      #512 (an investigation under the #500 epic's Phase 2 item 3, "canonical
      AI operation/proposal envelope") found `stage_create()` had no dedup
      mechanism at all: calling it twice with identical arguments -- for
      example an MCP client retrying `stage_proposal` after a dropped or
      timed-out response -- created two distinct `pending` proposals, and
      accepting both produced duplicate life.txt lines. It also confirmed
      `proposal-v1` should remain the canonical envelope for MCP's current
      synchronous use (Cloud Mailbox, #500 Phase 5, is unimplemented and has
      no exercised idempotency/expiry/replay requirement against this
      contract yet); a future Cloud Mailbox should wrap `proposal-v1` rather
      than add its own fields to it, mirroring the `conflict-v1.schema.json`/
      `mutation_response()` wrap-precedent in
      `lifetxt/remote_ticket_write_core.py`. #514 fixes the concrete
      duplicate-staging gap only, independent of that larger envelope
      question: `stage_create()` gained an optional `idempotency_key`
      parameter (persisted on the proposal record, default `""`). Retrying
      with the same key and identical title/kind/details returns the
      already-staged proposal (even after it was separately accepted, since
      "the same request happened again" should not care whether a human
      already reviewed it); reusing the key for a materially different
      request fails loudly instead of silently duplicating or silently
      reusing a mismatched proposal, mirroring the
      `REMOTE_TRANSACTION_REUSED`/`event_matches` precedent already proven in
      `lifetxt/remote_ticket_write_core.py`. Omitting the key preserves
      today's behavior exactly (locked in by a dedicated regression test) --
      `proposal add`/every other existing caller of `stage_create()` is
      unaffected. `lifetxt/delegated_mutation.py`'s separate, independently-
      evolved proposal contract is unmodified; #512 confirmed the two
      contracts are deliberately distinct (external-adapter text mutation vs.
      human-reviewed record creation), not an oversight to unify.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

