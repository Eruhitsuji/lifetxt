  - id: cap-mcp-context-revision
    name: Local MCP context-read revision
    summary: >-
      A `revision` field (a SHA-256 over every source file's path and bytes,
      reusing `lifetxt.remote_backend.source_revision()` unmodified)
      attached to six local, bounded MCP context-read tools --
      `get_command_center`, `get_temporal_context`, `get_next_actions`,
      `get_backlinks`, `get_ticket`, `get_project` -- so a client composing
      several of them for one purpose (e.g. the `explain_item` prompt) can
      detect that the workspace changed partway through, instead of
      silently mixing facts read at different points in time.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-mcp-context-revision
    implementation_locations:
      - lifetxt/mcp.py
      - lifetxt/schema_extensions_v7.py
      - lifetxt/schema_extensions_v24.py
      - dist/schemas/command-center-v1.schema.json
      - dist/schemas/temporal-context-v1.schema.json
      - tests/test_mcp_expansion.py
      - docs/en/ai-integration.md
      - docs/ja/ai-integration.md
      - docs/en/life-hub.md
      - docs/ja/life-hub.md
    public_interfaces:
      - lifetxt.mcp._attach_revision
      - MCP tools get_command_center, get_temporal_context, get_next_actions, get_backlinks, get_ticket, get_project (revision field)
      - command-center-v1.schema.json (revision field)
      - temporal-context-v1.schema.json (revision field)
    tests_or_evidence:
      - "tests/test_mcp_expansion.py ContextRevisionTests (7 tests): each of the six tools carries a revision matching a direct source_revision() computation on the same paths; the revision changes when the source file's content changes"
      - "tests/test_mcp_expansion.py GetTemporalContextToolTests.test_matches_a_direct_call_to_the_canonical_engine updated to pop and separately assert the new revision field, keeping the rest of the fact-for-fact equality assertion intact"
      - python -m unittest tests.test_mcp_expansion -> Ran 129 tests, OK
      - python -m unittest tests.test_schema_extensions_v2 tests.test_surface_runtime tests.test_temporal_context tests.test_temporal_cli tests.test_life_hub tests.test_ticket_project_surfaces tests.test_ticket_workflow_surfaces -> Ran 89 tests, OK
      - python -m lifetxt check examples/minimal_life.txt -> OK 10 item(s)
      - ruff format --check / ruff check on changed files -> clean
      - 'scripts/validate_release_docs.py -> ok true'
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/500
      - https://github.com/Eruhitsuji/lifetxt/issues/511
      - https://github.com/Eruhitsuji/lifetxt/issues/513
    related_pull_requests: []
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      #511 investigated #500's Phase 2 item 2 ("bounded AI context
      contract") and found, re-confirming #490's prior conclusion, that no
      new shared context contract is justified: `command_center()`/
      `temporal_context()` are already independently bounded and
      provenance-carrying, and composing several of them client-side (the
      `explain_item` prompt) is already the established pattern. The one
      concrete, evidenced gap #511 found is narrower: Remote Safe Mode's
      `remote_backend.py` already attaches a uniform `source_revision()` to
      every one of its 10 read resources, but none of the local MCP
      context-read tools reused that existing mechanism, despite reading
      the same underlying files. #513 closes exactly that gap by reusing
      `source_revision()` unmodified at the MCP tool boundary -- via a
      shared `_attach_revision()` helper -- rather than adding a second
      revision scheme or threading a new parameter through
      `command_center()`/`temporal_context()` themselves. This keeps blast
      radius minimal: `revision` is populated only when these shapes are
      returned through MCP; direct library callers (CLI `today`/`temporal`,
      the TUI Today view, the Web `/api/command-center` route, and Remote
      Safe Mode's own resource builders) are unaffected and continue to
      omit the field, confirmed by not modifying
      `lifetxt/command_center.py`, `lifetxt/temporal_context.py`,
      `lifetxt/projects.py`, or `lifetxt/tickets.py` at all.
      `get_next_actions`/`get_backlinks` reuse the shared
      `items_response()`/plain-dict shapes also used by other surfaces
      (e.g. Web's `/api/items`); the revision is attached to the dict
      returned by the MCP tool function only, after those shared builders
      already returned, so no other caller of those builders is affected.
      Nothing currently enforces or rejects a stale revision -- the field
      is exposed for the client to check, matching the narrower precedent
      the Remote `tickets` resource's `since_revision` parameter already
      established for one case; automatic rejection elsewhere remains an
      explicit, unimplemented follow-up if evidence later shows it is
      needed.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

  - id: cap-personal-ai-memory-convention
    name: Personal AI Memory convention
    summary: >-
      A documented convention -- not a new Format, Query, schema, or MCP
      contract -- for capturing a durable personal fact (preference, goal,
      standing decision) from AI conversation using only existing lifetxt
      mechanisms: the generic `N` (Note) kind, the already general-purpose
      `person:` field, freeform intent tags, the existing Unified Inbox
      `stage_proposal`/review/accept lifecycle, and the existing
      `temporal_context()` staleness rule. Selected by the Personal Context
      Engine investigation (#503) as the smallest first product slice.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-personal-ai-memory-convention-docs
    implementation_locations:
      - docs/en/ai-integration.md
      - docs/ja/ai-integration.md
    public_interfaces:
      - docs/en/ai-integration.md section 10, Personal AI Memory
      - docs/ja/ai-integration.md section 10, Personal AI Memory
    tests_or_evidence:
      - "live, real disposable workspace, driven both via a direct lifetxt.mcp.McpContext/call_tool script and the real installed lifetxt CLI: stage_proposal(kind=N, details={person: self, tag: preference}) staged correctly; proposal list/accept produced exactly the output now documented; the accepted life.txt line, including the W102 non-blocking status hint from lifetxt check/search (stage_proposal has no status argument, so a staged Note always lands with the default open status), was captured and reproduced byte-for-byte in both English and Japanese documentation rather than presented as illustrative"
      - "live: lifetxt search and lifetxt query against the accepted record both returned the fact with no new tooling"
      - 'scripts/validate_release_docs.py -> ok true'
      - manual balanced-code-fence check on both documents after editing
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/500
      - https://github.com/Eruhitsuji/lifetxt/issues/503
      - https://github.com/Eruhitsuji/lifetxt/issues/515
    related_pull_requests: []
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      #503 (a 10-question Personal Context Engine / Personal DB
      investigation under the #500 epic) concluded that no new record
      kind, Format key, Query field, workspace role, or schema is required
      for a first Personal Context slice: `N` already accepts arbitrary
      preserved custom detail keys; `person:` is already general-purpose
      (not Status-only), so no new `subject:` field is adopted; `source:`
      is reused as-is for provenance; `temporal_context()`'s existing
      staleness formula already generalizes to any item carrying an
      `updated:` detail; and `stage_create()` has no kind restriction, so
      an AI-suggested personal fact stages as an ordinary create proposal
      today. Per an explicit owner decision recorded on #503, no new
      custom key (assertion, confidence, etc.) is added to
      `lifetxt/query.py`'s `CUSTOM_DETAIL_FIELDS` allowlist for this slice
      -- personal-context keys stay freeform and unqueried-by-name
      (Q001-reported, not rejected) until real usage justifies promotion,
      matching the bar `area`/`record`/`severity` already met. #515
      implements #503's "recommend exactly one smallest first
      implementation slice" deliverable as documentation only, per the
      owner-approved "Personal AI Memory" selection: an explicit
      preference/goal captured from conversation, staged via
      `stage_proposal`, reviewed via existing `proposal accept`/`reject`,
      retrievable via existing `search`/`query`/`list_items`/`get_item` --
      zero production code change. While verifying the worked example
      live, found and corrected two inaccuracies in the original draft
      before publishing: the serialized line format (quoted title, no
      underscore-joining) did not match actual serializer output, and a
      claimed automatic `updated:` detail is not actually set by anything
      -- staleness applies only once one is added (manually, or via a
      later edit), which the published documentation now states directly.
      Also found and documented, rather than silently working around,
      that `stage_proposal` has no `status` argument, so every staged
      Note triggers a harmless non-blocking W102 validator hint
      recommending `[N]` status; fixing that tool argument gap is an
      out-of-scope, unfiled candidate follow-up, not something this
      docs-only task should absorb.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

