    notes: >-
      Presentation-only responsive bug fix. Desktop keeps the compact two-column
      property grid. At phone widths the existing drawer becomes an explicit
      single-column content contract while the three semantic tabs, ARIA roles,
      keyboard focus behavior, bottom-sheet height, and safe-area rules remain
      unchanged. Follow-up #849 removes a class-specific tab height that defeated
      the coarse-pointer 44px target and adds visible row spacing and grouping.
      The iPhone 12 follow-up adds outer list spacing, roomier rows, and scroll-end
      clearance so the last property does not sit against the sheet boundary.
      The iOS scroll follow-up makes the sheet height definite, keeps one vertical
      scroll owner, enables momentum touch panning, and prevents stale inline UI
      assets from being reused after an update.
      #856 found that even after #855, a global, unscoped `section { overflow:
      hidden; border-radius: var(--r-lg); ...}` page-chrome rule (originally
      meant for top-level `data-page` panels) still matched every drawer tab
      panel too, since they are also rendered as plain `<section>` elements.
      That silently reintroduced a clipping/rounding box nested inside
      `.drawer-body`'s own scrollport, so content past the fold was clipped
      instead of scrolled to and the "FIELDS" heading's leading edge was cut by
      the inherited rounded corner. Fixed by scoping every such rule (in
      `web_assets_css_01.css`, `web_assets_css_03.css`, and
      `web_assets_css_04.css`) to `section.page`, the class every real
      top-level page section already carries, rather than adding a second,
      narrower `.drawer-tab-panel` override that could drift from the panel
      element again in the future.
      #858 found a separate, unrelated bug reported right after #856/#857
      merged: the tab bar itself (the row of Overview/Timeline/Relations
      buttons) changed height depending on which tab was active. Root-caused
      to `.drawer-body`'s CSS Grid `align-content` default (`normal`, which
      resolves to `stretch` in the block axis for a definite-height grid
      container with auto-sized rows): whenever a tab's content was shorter
      than the fixed-height sheet, the leftover vertical space was
      distributed into every auto-sized grid row -- including the tab bar's
      own row -- stretching its buttons far past their natural size and
      separating the active tab's underline from its label by a wide gap.
      Confirmed via reproduction on the pre-#856 commit and an A/B test that
      #856's `overflow` change made no difference, so this was not a
      regression from #856/#857 -- an independent, pre-existing defect only
      now noticed. Fixed with one `align-content: start` declaration on
      `.drawer-body`, so its rows always size to their own content and any
      leftover space stays blank below it.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

