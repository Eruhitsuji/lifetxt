name: Issue 554 governance update

on:
  push:
    branches:
      - feature/554-periodic-markdown-reports

permissions:
  contents: write

jobs:
  update-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Insert capability and traceability records
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          capability_path = Path('.ai/project/CAPABILITIES.yml')
          traceability_path = Path('.ai/project/TRACEABILITY.yml')
          capability_id = 'cap-periodic-markdown-reports'
          requirement_id = 'req-periodic-markdown-report-profiles'

          capability_lines = [
              '',
              '  - id: cap-periodic-markdown-reports',
              '    name: Named periodic Markdown report profiles',
              '    summary: >-',
              '      Configured daily, weekly, and monthly Markdown report profiles exposed',
              '      through lifetxt report list|preview|run, reusing the existing Markdown',
              '      share renderer with timezone-aware periods and deterministic file targets.',
              '    status: active',
              '    owner: Eruhitsuji',
              '    source_requirements:',
              '      - req-periodic-markdown-report-profiles',
              '    implementation_locations:',
              '      - lifetxt/report_cli.py',
              '      - lifetxt/report_config.py',
              '      - lifetxt/entrypoint.py',
              '      - lifetxt/schema_extensions_v5.py',
              '      - dist/schemas/config-v1.schema.json',
              '      - tests/test_report_cli.py',
              '      - docs/en/reports.md',
              '      - docs/ja/reports.md',
              '      - docs/en/config.md',
              '      - docs/ja/config.md',
              '      - examples/report_profiles.config.json',
              '    public_interfaces:',
              '      - lifetxt report list',
              '      - lifetxt report preview NAME',
              '      - lifetxt report run NAME',
              '      - reports.* configuration profiles',
              '      - generated report frontmatter schema lifetxt-report-v1',
              '    tests_or_evidence:',
              '      - tests/test_report_cli.py',
              '      - PR #555 CI',
              '    related_issues:',
              '      - https://github.com/Eruhitsuji/lifetxt/issues/554',
              '    related_pull_requests:',
              '      - https://github.com/Eruhitsuji/lifetxt/pull/555',
              '    reuse_policy: prefer_reuse_or_extension_before_new_implementation',
              '    notes: >-',
              '      Reuses the existing share --format markdown renderer instead of defining',
              '      a second report engine. Generated Markdown is derived output; life.txt',
              '      remains authoritative. OS schedulers own recurrence. Notion API sync,',
              '      Obsidian-specific APIs, Web/TUI/MCP surfaces, and arbitrary report',
              '      templates are explicitly deferred. config_template() intentionally does',
              '      not emit an empty reports object because no built-in profile or output',
              '      destination has a meaningful default; schema, registry/explain metadata,',
              '      bilingual docs, and example config define the optional surface instead.',
              '    replacement:',
              '      replaces: []',
              '      replaced_by: null',
              '      deprecation_issue: null',
          ]
          capability = '\n'.join(capability_lines) + '\n'

          traceability_lines = [
              '',
              '    - requirement_id: req-periodic-markdown-report-profiles',
              '      capability_id: cap-periodic-markdown-reports',
              '      epic: null',
              '      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/554',
              '      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/555',
              '      changed_files_or_scope:',
              '        - Add named daily/weekly/monthly Markdown report profiles and report list|preview|run CLI',
              '        - Reuse existing share --format markdown with concrete period filters',
              '        - Register reports config schema/metadata and bilingual report/config docs/examples',
              '        - lifetxt/report_cli.py',
              '        - lifetxt/report_config.py',
              '        - lifetxt/entrypoint.py',
              '        - lifetxt/schema_extensions_v5.py',
              '        - dist/schemas/config-v1.schema.json',
              '        - tests/test_report_cli.py',
              '        - docs/en/reports.md',
              '        - docs/ja/reports.md',
              '        - docs/en/config.md',
              '        - docs/ja/config.md',
              '        - examples/report_profiles.config.json',
              '      tests_or_evidence:',
              '        - tests/test_report_cli.py targeted profile, period, output, schema, and routing coverage',
              '        - PR #555 CI',
              '      release_or_deployment: null',
              '      notes: >-',
              '        Standard assurance, S-sized additive CLI-first feature. Scheduling remains',
              '        an external OS concern; Notion support is Markdown-import compatibility,',
              '        not remote API publishing. Removing the optional reports section is the',
              '        downgrade path and requires no migration.',
              '      status: implemented',
          ]
          traceability = '\n'.join(traceability_lines) + '\n'

          capability_text = capability_path.read_text(encoding='utf-8')
          if capability_id not in capability_text:
              capability_path.write_text(
                  capability_text.rstrip() + capability + '\n',
                  encoding='utf-8',
                  newline='\n',
              )

          traceability_text = traceability_path.read_text(encoding='utf-8')
          if requirement_id not in traceability_text:
              marker = '\nrequired_chain:\n'
              if traceability_text.count(marker) != 1:
                  raise SystemExit('TRACEABILITY required_chain marker is not unique')
              traceability_path.write_text(
                  traceability_text.replace(marker, traceability + marker, 1),
                  encoding='utf-8',
                  newline='\n',
              )
          PY

      - name: Validate bounded governance diff
        shell: bash
        run: |
          git diff --check
          git diff --numstat -- .ai/project/CAPABILITIES.yml .ai/project/TRACEABILITY.yml
          grep -q '^  - id: cap-periodic-markdown-reports$' .ai/project/CAPABILITIES.yml
          grep -q '^    - requirement_id: req-periodic-markdown-report-profiles$' .ai/project/TRACEABILITY.yml
          grep -q '^      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/555$' .ai/project/TRACEABILITY.yml

      - name: Commit governance records and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/issue-554-governance-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai/project/CAPABILITIES.yml .ai/project/TRACEABILITY.yml .github/workflows/issue-554-governance-update.yml
          git diff --cached --check
          git commit -m "Record periodic Markdown report governance"
          git push origin HEAD:feature/554-periodic-markdown-reports
