name: Fix ticket activity clock boundary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'agent/ticket-workflow-history-time'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ticket-workflow-history-time
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Route activity timestamps through shared clock
        shell: bash
        run: |
          python - <<'PY'
          import pathlib

          path = pathlib.Path('lifetxt/ticket_activity.py')
          text = path.read_text(encoding='utf-8')
          needle = 'from .surface_runtime import normalize_revision\n'
          replacement = needle + 'from .timezone_policy import today as timezone_today, utcnow\n'
          if needle not in text or 'from .timezone_policy import today as timezone_today, utcnow' in text:
              raise SystemExit('ticket activity import insertion point missing or already patched')
          text = text.replace(needle, replacement, 1)
          text = text.replace(
              '        parsed = datetime.datetime.now(datetime.timezone.utc)\n',
              '        parsed = utcnow()\n',
              1,
          )
          text = text.replace(
              '        return datetime.datetime.now(datetime.timezone.utc).date().isoformat()\n',
              '        return timezone_today("UTC").isoformat()\n',
              1,
          )
          if 'datetime.datetime.now(datetime.timezone.utc)' in text:
              raise SystemExit('direct UTC clock call remains in ticket_activity.py')
          path.write_text(text, encoding='utf-8')
          pathlib.Path('.github/workflows/agent-ticket-clock-boundary-fix.yml').unlink()
          PY
          python -m compileall -q lifetxt tests
          python -m unittest \
            tests.test_clock_contract_v4 \
            tests.test_release_policy.ReleasePolicyTests.test_release_manifest_has_deterministic_fingerprint \
            tests.test_ticket_custom_field_public_contract \
            tests.test_ticket_workflow_history \
            tests.test_ticket_planning \
            tests.test_ticket_workflow_surfaces
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Route ticket activity through shared clock'
          git push origin HEAD:agent/ticket-workflow-history-time
