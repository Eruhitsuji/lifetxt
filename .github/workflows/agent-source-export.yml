name: Diagnose P0 x105 patch application

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/p0-format-contract-batch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-format-contract-batch
          fetch-depth: 0
      - name: Diagnose application stages
        shell: bash
        run: |
          set +e
          REPORT=/tmp/p0-apply-diagnostic.txt
          : > "$REPORT"
          run_stage() {
            name="$1"; shift
            echo "== $name ==" >> "$REPORT"
            "$@" >> "$REPORT" 2>&1
            code=$?
            echo "exit=$code" >> "$REPORT"
            return 0
          }
          run_stage part_hashes sha256sum .github/agent-patch/part-00 .github/agent-patch/part-01 .github/agent-patch/part-02 .github/agent-patch/part-03 .github/agent-patch/part-04 .github/agent-patch/part-05 .github/agent-patch/part-06
          cat .github/agent-patch/part-* > /tmp/joined.b64
          run_stage joined_hash sha256sum /tmp/joined.b64
          run_stage decode base64 -d /tmp/joined.b64
          base64 -d /tmp/joined.b64 > /tmp/patch.gz 2>> "$REPORT"
          run_stage gzip_hash sha256sum /tmp/patch.gz
          run_stage gzip_test gzip -t /tmp/patch.gz
          gzip -dc /tmp/patch.gz > /tmp/patch 2>> "$REPORT"
          run_stage patch_hash sha256sum /tmp/patch
          run_stage apply_check git apply --check --verbose /tmp/patch
          run_stage status git status --short
          cat "$REPORT"
      - uses: actions/upload-artifact@v4
        with:
          name: p0-x105-apply-diagnostic
          path: /tmp/p0-apply-diagnostic.txt
          if-no-files-found: error
