    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      Configuration-driven enforcement is available through
      config.write.require_revision, matching the ticketing.write.require_revision
      shape. Normal CLI config set|unset|migrate writes to the loaded file still
      discover and send the revision automatically; writes that cannot discover a
      revision, such as writing to a different --output file without
      --expected-revision, are refused when the setting is enabled.
      _maybe_apply_workspace() (lifetxt/cli.py) injects resolved paths/write_file/
      generated_paths into the loaded config for read-time convenience; it now
      records exactly which keys it injected on args._workspace_injected_keys so
      config set|unset|migrate can exclude them from the write, fixing #136
      (found while investigating #89). Legacy top-level paths/write_file configs
      never trigger workspace resolution, so they are unaffected.
      config.write.audit_log (#157) mirrors lifetxt.remote_access.append_audit's
      bounded-JSONL-append-and-trim shape rather than inventing a new one; it
      records only path/outcome/revision metadata for write attempts reaching the
      compare-and-set stage (accepted and rejected-as-stale), and is disabled by
      default. It does not audit validation-error or unsupported-version
      refusals, which mirrors _retain_rejected's existing scope (those never
      retain a candidate either, since they are user error rather than a lost
      concurrent edit). Policy is read from the pre-edit loaded config the same
      way require_revision already is.
    replacement:
      replaces: []
      replaced_by: null
