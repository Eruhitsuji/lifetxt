        un-redacting) the result -- the primary fix's own test fixture was
        adjusted to avoid this unrelated coincidental collision so the two
        root causes are not conflated. A lightweight real-host sanitizer
        smoke on Windows/WSL/Linux/macOS confirming canonical output, per
        the issue's own last acceptance criterion, remains
        external-environment work outside this sandbox for the platforms
        not exercised live here and is recorded as open.
      status: implemented

