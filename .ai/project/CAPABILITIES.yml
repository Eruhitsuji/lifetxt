schema_version: 1

capabilities:
  - id: cap-web-state-surface
    name: Dedicated mobile State surface
    summary: Self-only current presence, one-tap state transitions and optional title/note editing, discoverable from More and independently launchable from the home screen.
    status: implemented
    owner: Eruhitsuji
    source_requirements:
      - req-web-state-surface-v1
    implementation_locations:
      - lifetxt/web_state.html
      - lifetxt/web_state.css
      - lifetxt/web_state.js
      - lifetxt/web_assets.html
      - lifetxt/state_app_manifest.json
      - lifetxt/web_assets.py
      - lifetxt/webapp.py
      - pyproject.toml
    public_interfaces:
      - GET /state
      - GET /state.webmanifest
      - Existing self Status/config/health read APIs and POST /api/status
    tests_or_evidence:
      - tests/test_web_state.py
      - tests/test_web_state_ui.py
      - tests/state_ui_probe.mjs
      - tests/browser_state_probe.mjs
      - tests/browser_state_live_probe.mjs
      - tests/test_web_installability.py
      - .ai/project/changes/web-state-surface/verification.yml
      - .ai/project/changes/web-state-installability/verification.yml
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/1377
      - https://github.com/Eruhitsuji/lifetxt/issues/1379
      - https://github.com/Eruhitsuji/lifetxt/issues/1380
      - https://github.com/Eruhitsuji/lifetxt/issues/1383
      - https://github.com/Eruhitsuji/lifetxt/issues/1385
      - https://github.com/Eruhitsuji/lifetxt/issues/1387
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/1388
      - https://github.com/Eruhitsuji/lifetxt/pull/1382
      - https://github.com/Eruhitsuji/lifetxt/pull/1384
    reuse_policy: Reuse Status Core and API, Web revision/CAS and Planner standalone-page assembly; no new parser, mutation model, authentication or dependency.
    notes: Separate self-only page; six primary and three secondary tiles plus custom form. More uses a native State link without replacing Status/Team tabs. Dedicated manifest reuses existing icons/auth/no-store; online only, no worker or queue. Native Chromium viewport/AX/safe-area emulation and API probes do not certify physical Safari/Android/home-screen/assistive-technology acceptance; those gaps are tracked in issue 1383. Issue 1385 accepts mock/API evidence by Owner decision; this does not certify physical-device negative paths. Uncertain writes require successful manual Refresh before another mutation; background refresh cannot clear the block (issue 1387). Independent final-head review remains required.
  - id: cap-editor-language-support
    name: Optional editor language support
    summary: Format-aligned static editor assistance and a Core-backed read-only language server.
    status: implemented
    owner: Eruhitsuji
    source_requirements:
      - req-editor-static-format1
      - req-editor-readonly-lsp
      - req-editor-open-buffer-workspace
      - req-editor-windows-approved-release
    implementation_locations:
      - editors/vscode/lifetxt
      - editors/neovim
      - lifetxt/lsp.py
      - lifetxt/lsp_document.py
      - lifetxt/lsp_features.py
      - lifetxt/lsp_workspace.py
      - scripts/release_preflight_editor.py
      - scripts/release_preflight_collect.py
      - scripts/release_channels.py
      - .github/workflows/release-preflight-editor.yml
    public_interfaces:
      - VS Code lifetxt language and static snippets
      - python -m lifetxt.lsp --stdio
    tests_or_evidence:
      - tests/test_editor_static.py
      - tests/test_lsp.py
      - tests/test_lsp_workspace.py
      - editors/vscode/lifetxt/test/grammar.cjs
      - tests/test_release_preflight_editor.py
      - tests/test_release_preflight_collect.py
      - tests/test_release_publication.py
      - .ai/project/changes/editor-release-distribution/verification.yml
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/1348
      - https://github.com/Eruhitsuji/lifetxt/issues/1369
      - https://github.com/Eruhitsuji/lifetxt/issues/1389
      - https://github.com/Eruhitsuji/lifetxt/issues/1390
      - https://github.com/Eruhitsuji/lifetxt/issues/1391
      - https://github.com/Eruhitsuji/lifetxt/issues/1392
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/1393
    notes: >-
      Static highlighting is display assistance. LSP scope is explicitly opened
      buffers only (32 documents, 256 KiB each, 200 results), without disk scan,
      network or writes. Actual Neovim and Microsoft protocol parity verified;
      Windows VS Code/Neovim representative actual-client acceptance recorded
      in issue 1373 (additional cases unexecuted); other operating systems and
      ordinary Vim are not in the editor support guarantee. Editor Release
      assets are immutable, preflight-gated and separately human-authorized;
      no public distribution is claimed before a successful approved Release.
