name: lifetxt-mini Release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        required: true
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0
      - run: cargo install cargo-zigbuild --locked
      - run: cargo test --locked
        working-directory: lifetxt-mini
      - run: cargo zigbuild --locked --release --target ${{ matrix.target }}
        working-directory: lifetxt-mini
      - name: Verify native static artifact
        shell: bash
        working-directory: lifetxt-mini
        run: |
          binary="target/${{ matrix.target }}/release/lifetxt-mini"
          file "$binary"
          ldd "$binary" 2>&1 | tee artifact-ldd.txt || true
          grep -Eqi 'statically linked|not a dynamic executable' artifact-ldd.txt
          "$binary" --version
          "$binary" --help
          "$binary" check fixtures/mixed-life.txt
          "$binary" today --date 2026-09-24 fixtures/mixed-life.txt
      - name: Package and checksum
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/lifetxt-mini
          name="lifetxt-mini-${TAG}-linux-${TARGET%%-*}"
          cp "lifetxt-mini/target/${TARGET}/release/lifetxt-mini" "dist/lifetxt-mini/${name}"
          sha256sum "dist/lifetxt-mini/${name}" > "dist/lifetxt-mini/${name}.sha256"
          rustc -Vv > "dist/lifetxt-mini/${name}.build-info"
      - uses: actions/upload-artifact@v6
        with:
          name: lifetxt-mini-${{ matrix.arch }}
          path: dist/lifetxt-mini/*
          if-no-files-found: error
  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: lifetxt-mini-*
          path: dist/lifetxt-mini
          merge-multiple: true
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist/lifetxt-mini
          for checksum in *.sha256; do sha256sum -c "$checksum"; done
          cat *.sha256 > SHA256SUMS
          printf '%s\n' "lifetxt-mini $TAG" "Python-free strict-subset Mini Runtime Profile" "Official targets: Linux x86_64 and AArch64" "Verify: sha256sum -c SHA256SUMS" > RELEASE-NOTES.md
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" * --clobber