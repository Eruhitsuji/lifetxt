      one explicit parent:/related:/ref: choice are ever prefilled -- the
      exact bounded relation subset #770 names -- with no new relation
      vocabulary and no combination beyond those two concerns; (2) the Web
      "+ Related" action lives in the item drawer's existing head-button
      row (next to Edit) and reuses the existing plain-text edit-details
      textarea as the review/edit surface, since that textarea is already
      the project's own visible-and-editable mechanism for every other
      detail value -- no new modal or richer relation-picker UI was
      introduced; the relation field choice itself is collected via the
      existing prompt() pattern already used elsewhere in this codebase
      (e.g. bulk "Set project..."), not a new custom widget; (3) the
      Dashboard's per-project "+" button is the chosen project-scoped Web
      UI context entry point, since this Web UI's Items view filter bar
      has no dedicated single-project-scoped page of its own to attach a
      create action to; (4) the TUI command was named /related rather than
      the issue's own suggested /new-related, because the existing
      _TUI_DOC_ROW documentation-drift-gate regex
      (tests.test_surface_runtime.TuiDocumentationDriftTests) only accepts
      [a-z_]+ command names and no existing TUI command uses a hyphen --
      /related avoids introducing the first hyphenated command name while
      keeping the same [parent|related|ref] TITLE argument shape the
      issue itself proposes; (5) an explicit capture-shorthand token (e.g.
      an @project sigil) always wins over a context-supplied prefill for
      the same key, satisfying #770's own "can be reviewed, changed, or
      removed" requirement for the TUI path the same way the Web textarea
      already does for its path. Remote TUI parity is achieved with zero
      new server-side code: _cmd_new_related branches on the pre-existing
      state.backend.is_remote/state.backend.create_item() seam _cmd_add
