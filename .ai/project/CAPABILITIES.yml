    related_pull_requests: []
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      #687 is an umbrella/planning-only issue (not directly implementable);
      this entry and its sibling requirement chain entries record its six
      child issues (#688-#693) as they land. EXPORT_FORMAT_HANDLERS is
      populated at the bottom of lifetxt/cli.py (after every handler
      function is defined) via register_export_format calls, avoiding a
      forward-reference NameError at import time while keeping the registry
      a single small dict with no duplicated serializer logic. #689's native
      `life` format, #691's `sqlite` format, and #693's `lifetxtz` format
      each register into this same dict rather than growing a second export
      framework, per #688's own scope contract. #691 implements the
      `lifetxt-sqlite-v1` schema #690 froze, unmodified: sqlite_codec.py is
      dependency-free (stdlib `sqlite3` only), canonicalizes hierarchy at
      export time via native_codec.canonical_hierarchy_items (#689) rather
      than a second hierarchy model, is transactional (builds at a private
      temp path, commits via the shared atomic_write_bytes primitive, never
      leaves a partial destination on failure), and refuses a foreign/
      corrupt/version-mismatched database before returning any item. #693
      implements the `lifetxtz-v1` container #692 froze, unmodified:
      lifetxtz_codec.py is dependency-free (stdlib `zipfile`/`hashlib`
      only), builds the archive in memory and commits it through the same
      shared `atomic_write_bytes` primitive #691 uses, reuses #689's
      native_codec for the payload (no second item serialization), and
      never calls `ZipFile.extract()`/`extractall()` -- only the two fixed,
      literal member names are ever read into memory, which makes path
      traversal impossible by construction. This closes all six #687 child
      issues (#688-#693); #687 itself is a planning-only umbrella with no
      independent implementation.
