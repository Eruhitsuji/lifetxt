        - "python -m ruff format --check lifetxt/tui_app.py tests/test_cui_extensions.py; python -m ruff check lifetxt tests scripts; git diff --check -> clean"
      release_or_deployment: next normal maintenance release
      notes: >-
        Standard-assurance bug fix extending the existing curses runner and
        shared local/remote WorkspaceState input path. No dependency, grammar,
        localization, Web, CLI parser, remote API, or data migration change.
