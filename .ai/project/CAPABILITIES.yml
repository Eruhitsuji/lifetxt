      - https://github.com/Eruhitsuji/lifetxt/pull/718
      - https://github.com/Eruhitsuji/lifetxt/pull/722
    reuse_policy: >-
      Reuse normal Note records, existing exact-revision mutation paths,
      specialized progress/ticket validators, parent access inheritance, and
      temporal readers. Do not add a second grammar, generic event database,
      inferred backfill, or duplicate Git revision reconstruction.
    notes: >-
      Investigation #712 selects a common record:item_event envelope with a
      closed typed payload registry for ordinary-item lifecycle events; #713
      implements that envelope, validators, adapters, and access inheritance;
      #714 implements selected atomic capture routes. History remains optional,
      and completeness is evaluated per item and semantic domain. #715 adds a
      bounded Git-independent Timeline without changing exact-revision thread
      commands. #717 composes Native normalization with bounded Git semantic
      transitions only for verification; neither source replaces the other.
      #761 exposes the existing, unmodified native_timeline() reader through
      a new TUI /timeline command (mirroring how /thread already delegates
      to lifetxt.temporal_thread): no history/filtering/analytics logic is
      duplicated in lifetxt/tui_app.py, and the inspector panel renders
      events/bounds/invalid-event-count/limitations/diagnostics directly
      from the unmodified result. #762 adds GET /api/native-timeline/{id}
      (bounded since/until/event/limit query parameters matching the
      CLI/MCP contract) mirroring the existing GET /api/temporal-thread/{id}
      route (#704), plus a minimal Native Timeline section in the item
      drawer's dependency-links panel -- no new Web-specific temporal logic.
      #759 is an investigation only (no runtime code): it produced
      docs/en/native-semantic-as-of-investigation.md's reconstructability
      matrix for a proposed, separate semantic-as-of-v1 contract (per-field
      known/partial/unavailable projection at a point in time, distinct
      from this capability's existing temporal-timeline-v1 event list) and
      filed three follow-up issues (#763 engine, #764 CLI exposure, #765
      schema/docs) rather than building it unscoped in this pass. #763/#764/
      #765 are recorded under the new, separate `cap-native-semantic-as-of`
      capability rather than extended into this one, matching this
      project's own precedent of a dedicated capability entry for a new
      bounded contract (e.g. `cap-temporal-context`/`cap-lifecycle-temporal-
      thread`/`cap-temporal-diff` alongside this capability).
      #767 investigated cross-surface Native History capture parity and
      found a real, evidenced gap: only CLI (done/complete/reopen/due) calls
      a Native History producer today. Web UI/API's `update_item_in_file`
      (also Remote TUI's authoritative write route), `write_operations.
      mutate_items`/`mutate_item_files` (shared by CLI's own generic paths
      and local TUI), and Remote TUI's own edit route never emit a
      `record:item_event`. #767 adds `lifetxt.native_history_mutation.
      infer_item_event_specs(before, after)`, a pure, file-I/O-free
      classifier reusing the exact event vocabulary/field scope
      `augment_item_mutation_with_event` already emits, fully unit-tested
      but deliberately not yet wired into any live write path: doing so
      safely requires each write path to build its replacement text and
      commit it together with the inferred event(s) in one atomic write --
      a change to this project's shared, heavily-used mutation primitives
      themselves, which this project's Task Decomposition Standard's own
      "split when independent write paths cannot be safely reviewed
      together" guidance argues against attempting unscoped in one pass.
      Recorded as an explicit, documented follow-up in
      docs/en+ja/native-semantic-history.md rather than silently dropped or
      claimed complete.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

