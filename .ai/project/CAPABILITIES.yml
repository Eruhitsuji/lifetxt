    tests_or_evidence:
      - tests/test_nextaction.py IsActionableTests, NextActionItemsTests, BlockedMapTests
      - "tests/test_extra_cli.py: next now includes Deferred/Recurring/Habit kinds, excludes someday-tagged open items, includes an item once its closed dependency is resolved, still excludes a dangling depends_on reference, and resolves blocking across multiple files passed on one invocation"
      - tests/test_cui_extensions.py (full suite, including the TUI /next blocked-row regression this convergence fixes) -> Ran 145 tests, OK
      - tests/test_mcp_expansion.py (full suite) -> Ran 68 tests, OK
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 1913 tests, OK (skipped=11)'
      - python -m lifetxt check examples/minimal_life.txt -> OK: 10 item(s)
      - ruff format --check lifetxt tests scripts
      - ruff check lifetxt tests scripts -> All checks passed
      - "manual verification via the real installed lifetxt console script: next against a fixture covering all convergence cases (T/D/R/H/E kinds, someday tag, closed and dangling dependencies) returns exactly the expected set"
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/138
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/141
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      No existing capability entry covered lifetxt/nextaction.py before this
      issue. Fixed a real bug in is_actionable() discovered while converging:
      it unconditionally excluded any item with a depends_on detail even once
      resolved, previously masked because the TUI's dashboard_model never
      actually computed a blocked value for any row (row.get("blocked") was
      always falsy) -- the TUI's blocking exclusion had relied entirely on
      that buggy line. Fixed both together: is_actionable now treats blocked
      as the sole source of truth, and dashboard_model computes real blocking
      via the new shared blocked_map(), which also adds a conservative check
      for depends_on references that resolve to no known item (a related gap
      found in lifetxt.links.dependency_blockers_by_item, which treats a
      dangling reference as "no blocker"; that shared library function is
      deliberately left unchanged since it is used beyond next-actions --
      the conservative reading lives only in blocked_map). Sort order
      (_priority_key-based) is intentionally not converged onto
      nextaction.PRIORITY_ORDER; see cap-next-priority-ranking, which already
      depends on _priority_key's current behavior.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

