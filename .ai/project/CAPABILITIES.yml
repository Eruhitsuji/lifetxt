  - id: cap-lifetxt-vm
    name: Opt-in Turing-complete lifetxt VM
    summary: >-
      A separate, explicitly opt-in `lifetxt vm run` interpretation layer
      over already-legal life.txt custom keys (`value:`, `op:`, `var:`,
      `next:`, `zero:`, `nonzero:`), implementing a minimal 2-counter
      Minsky machine (`INC`, `DEC_JZ` with zero test, `HALT`) addressed
      through the existing `id:` mechanism. Turing-complete as a
      computation model; Format 1.0 itself is not made a programming
      language, and no other command (`check`, `agenda`, `filter`, the Web
      API, MCP, the TUI) ever executes VM records.
