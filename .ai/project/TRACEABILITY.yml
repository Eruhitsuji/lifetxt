      notes: >-
        A real macOS bundle recorded metadata.filesystem_type as "/" -- the
        mount path, not a filesystem type/class. The previous implementation
        called `stat -f "%T" root`, which does not reliably yield the
        filesystem type on BSD/macOS stat, whose "-f FORMAT" conversions
        describe *file* attributes (e.g. "Regular File", "Directory"), not
        filesystem attributes -- unlike GNU coreutils' stat, where "-f" has a
        different, filesystem-status meaning. Fixed by replacing it with
        `mount` output parsing (well-documented and portable across
        BSD/macOS mount implementations), mirroring
        _linux_filesystem_type()'s existing longest-matching-mountpoint
        algorithm over /proc/mounts so a nested mount (e.g. an external
        volume) correctly wins over its shorter parent. Failure at any stage
        (missing mount binary, non-zero exit, OSError, timeout, or no
        matching line) returns None explicitly, never a path value. Linux,
        WSL, and Windows filesystem-type detection are untouched; a live,
        non-mocked --skip-release run on this Windows host confirmed
        metadata.filesystem_type is still correctly "NTFS". Real macOS
        re-verification with the normal one-command entry path, per the
        issue's own last acceptance criterion, remains external-environment
        work outside this sandbox and is recorded as open.
