schema_version: 1
verification:
  checks:
    - type: focused_input_regression
      command: python -W error::ResourceWarning -m unittest -v tests.test_hkscs_verification_inputs
      status: passed
      result: Four tests; original and cache exclusion accepted; profile-only, receipt/archive/compiler forgeries, changed/missing tools/patch/config files, extra tools and symlink rejected; archive diagnostic includes host and keeps fail-closed.
    - type: fixed_upstream_staging
      command: prepare_build(FIXED_CACHE, NEW_STAGE); verify_staging(BUILD, CURATED, FIXED_CACHE); compare both receipts against profiles/hkscs-free-1
      status: passed
      result: 68 bounded support inputs match; original fixed build/removal receipts remain identical. Host Python 3.12.14 and zlib build/runtime 1.3.2. No actual custom compiler/runtime execution.
      evidence: staging-proof.json
    - type: complete_focused_regression
      command: LIFETXT_RUN_SOURCE_AUDIT=1 LIFETXT_SOURCE_CACHE=CACHE LIFETXT_SOURCE_RUNTIME=OFFICIAL_RUNTIME LIFETXT_PERMISSION_CACHE=ICU_CACHE python -W error::ResourceWarning -m unittest -v tests.test_hkscs_verification_inputs tests.test_custom_distribution tests.test_browser_permission_evidence tests.test_hkscs_free tests.test_browser_review_remediation tests.test_browser_source_delivery tests.test_browser_distribution_audit tests.test_browser_check_poc tests.test_website_checker tests.test_website tests.test_website_pages_workflow tests.test_traceability_gate tests.test_change_package_closeout
      status: passed
      result: 86 collected, 83 successful, 3 skipped; includes real original source/patch/567 stdlib and ICU comparisons. Two actual-custom-artifact tests and one configured npm-runtime test skipped. Captured full child output and asserted successful exit plus final summary.
      evidence: test-output.txt
    - type: static_and_intro
      command: ruff check contrib/browser_check_poc lifetxt tests scripts; ruff format --check CHANGED_PYTHON; python -m lifetxt check examples/minimal_life.txt; python scripts/build_website.py --output NEW; python scripts/check_website.py NEW; git diff --check
      status: passed
      result: Lint/format/diff clean, native 10 items, introduction 14 pages with links/assets/fragments/metadata valid.
  gaps:
    - description: Actual previously built custom runtime/object tree unavailable; no fresh custom WASM/object/browser execution claimed. Whole compiler-tree and cross-host reproducibility are not attested.
      tracked_by: https://github.com/Eruhitsuji/lifetxt/issues/1398
    - description: Independent latest-head review, merge and separate public distribution approval remain required.
      tracked_by: https://github.com/Eruhitsuji/lifetxt/issues/1423
review_ledger:
  - reviewer: Codex implementer
    review_type: informational_self_review
    result: informational_only
    finding_count: 0
    completed_at: '2026-10-25'
  - reviewer: separate reviewer
    review_type: implementation-and-integration
    result: pending
