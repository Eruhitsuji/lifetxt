    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      `_write_bytes_durable` retries `PermissionError` only when `os.name` is
      `nt`, using the initial replace attempt plus four retries after 0.01,
      0.05, 0.1, and 0.25 seconds. Exhausting that budget re-raises the
      `PermissionError`; the existing journal and target state remain available
      for inspect/resume/compensate/abandon instead of being silently swallowed.
      #300 extends the subprocess fault drill beyond initial journal/commit
      boundaries into delete, verification, compensation, terminal cleanup,
      backup-copy, and restore-working-copy paths. The matrix scope remains
      simulated subprocess termination and deliberately does not claim physical
      power-loss portability.
      #301 verifies that corrupted or missing journal/payload/backup evidence
      is refused before authoritative recovery mutation, with deterministic
      retry behavior and actionable transaction-journal diagnostics.
      #302 adds platform-neutral simulated capacity and permission failure
      coverage using explicit errno fixtures. It confirms pre-publication
      failure does not claim success, post-publication recovery remains
      inspectable, and retry after restored capacity/access is deterministic.
      #303 adds real Windows evidence on this local Windows 10.0.19045 / NTFS
      workspace using an `msvcrt.locking` byte-range lock as a safe stand-in
      for transient file-preview/indexer-style target interference. The locked
      replace fails as PermissionError/WinError 5 without reporting committed
      state, then resumes successfully after the lock is released.
      #305 defines `os-private-v1` as the stable protected recovery-evidence
      profile: current OS-user private permissions plus integrity manifests.
      Encryption is intentionally not advertised as supported; an unsupported
      encrypted profile fails startup/preflight or journal preparation before
      mutating authoritative targets.
      #306 extends recovery authorization beyond caller-supplied operator
      strings. Remote or multi-user recovery derives identity, roles, scopes,
      and project restrictions from authenticated context, and destructive
      backup restore actions can require a separate approval identity. Local
      single-operator administration remains available as an explicit
      stable-release limitation when authenticated recovery authorization is not
      configured.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

