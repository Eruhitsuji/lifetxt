schema_version: 1
requirements:
- id: req-browser-runtime-inventory-v1
  kind: ADDED
  owner: Eruhitsuji
  statement: Retain source-based component candidates, actual runtime observations
    and additional notices without claiming complete distribution clearance.
  acceptance_criteria:
  - Distinguish recipe pins, observed versions and unresolved binary attribution
  - Sixteen provenance-bound notice texts and component map enter isolated artifact
  - Reject missing or tampered notices, references and runtime hash drift before build
  - Preserve incomplete audit and publication gates and reproduction instructions
- id: req-browser-local-check-acceptance-v1
  kind: ADDED
  owner: Eruhitsuji
  statement: Validate the isolated PoC in actual Chromium and identify distribution
    licence readiness without approving public integration.
  acceptance_criteria:
  - Actual HTTP browser executes the native corpus with unchanged CSP and correct MIME
  - Inspect bounded startup, warm, offline, cancellation, failure and timeout paths
  - Retain network and storage observations without overstating universal privacy
  - Identify mobile emulation, keyboard, visual and physical-device limitations
  - Copy provenance-bound upstream notices and retain incomplete binary-audit gate
  - Repeatable tests and hash-bound evidence with independent review pending
- id: req-browser-local-check-feasibility-v1
  kind: ADDED
  owner: Eruhitsuji
  statement: Probe existing Python parser checking in isolated WASM without modifying
    the public site's script policy or claiming full CLI equivalence.
  acceptance_criteria:
  - Reproducible local browser PoC with pinned runtime and authoritative Core
  - Native and WASM diagnostics compared with the real CLI and gaps retained
  - Size, startup, workload, memory observations identify their execution environment
  - Worker, cancellation, size limits, text rendering and privacy boundary investigated
  - Actual browser/mobile and distribution licence gaps remain explicit
  - Conditional decision and scoped adoption proposal before any public integration
