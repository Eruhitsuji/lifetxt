      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/335
      changed_files_or_scope:
        - Add platform-neutral storage/access failure classification for capacity, permission, and generic I/O failures
        - Record classified recovery failure diagnostics in transaction resume and compensation terminal error fields
        - Add simulated capacity preflight, disk-full before journal publication, quota failure during resume, and permission failure during compensation tests
        - Verify restored capacity/access retries complete deterministically
        - lifetxt/transaction_policy.py
        - lifetxt/transaction_journal.py
        - tests/test_transaction_policy_v4.py
        - tests/test_transaction_journal_v3.py
