        - lifetxt/command_center.py
        - tests/test_life_hub.py
      tests_or_evidence:
        - tests/test_life_hub.py CommandCenterTests (3 new tests: acked message excluded, actively-snoozed message excluded, snooze_until in the past no longer suppresses)
        - python -m unittest tests.test_life_hub -> Ran 30 tests, OK
        - python -m unittest tests.test_nextaction tests.test_inbox tests.test_mcp_expansion -> Ran 158 tests, OK (no regression in reused engines or the unmodified MCP get_command_center tool)
        - python -m lifetxt check examples/minimal_life.txt -> OK 10 item(s)
        - ruff format --check / ruff check on changed files -> clean
        - "confirmed via git stash (production code only, tests kept) that the 3 new tests fail against the pre-#498 code (an acked/snoozed message still appears in command_center()['messages']), then pass once the fix is restored"
      release_or_deployment: null
      notes: >-
        Found during #495's investigation into command_center()'s messages
        bucket: it filtered only on `item.status in OPEN_STATUSES` and
        `_message_needs_attention`, never checking `ack`/`snooze_until`,
        while `lifetxt.notifier._notification_suppressed()` already
        implements the correct ack/active-snooze suppression rule for the
        due-notification path (`list_notifications`/`get_agenda`). Rather
        than importing `notifier`'s instant-precision suppression check
        unmodified, `_message_suppressed()` is a new, small function at the
        same reference-*date* granularity `command_center()` already uses
        for every other bucket (`command_center` takes a reference date, not
        a reference instant): it compares `snooze_until`'s date against
        `today`'s date rather than an exact timestamp, so a snooze expiring
        earlier today is treated consistently with the rest of this
        aggregation's day-boundary semantics rather than introducing a
        second, finer-grained time model into one bucket only.
      status: implemented

