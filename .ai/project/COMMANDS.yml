preconditions:
  interpreter:
    requirement: pyproject.toml requires-python (currently >=3.10)
    why: >-
      Every command below assumes `python` resolves to a supported interpreter.
      On an older one the suite still runs, but modules using newer syntax fail
      to import, so it covers fewer tests than it appears to and the result is
      not evidence. tests/test_supported_runtime.py fails loudly in that case
      rather than letting the run look successful.
    verify:
      - python -c "import sys; print(sys.version)"
      - python -m unittest tests.test_supported_runtime
    note: >-
      A system `python` older than the baseline is common. Use a virtual
      environment created from a supported interpreter, for example
      `py -3.12 -m venv .venv`, and run the commands from it.
    activate:
      why: >-
        Creating the environment is not enough: every command below starts with
        a bare `python`, so the environment has to be entered first or those
        commands still reach the system interpreter. An existing, fully
        provisioned .venv that is simply not on PATH fails exactly like a
        missing one.
      values:
        - . .venv/bin/activate
      windows_powershell:
        - . .\.venv\Scripts\Activate.ps1
      note: >-
        Activation lasts for the shell session. Tools that run each command in a
        fresh shell must either activate in every invocation or call the
        interpreter by path, for example `.venv/Scripts/python -m unittest discover`.

commands:
  setup:
    status: configured
    values:
      - python -m pip install -e .

  setup_dev:
    status: configured
    values:
      - python -m pip install -e ".[dev]"

  setup_spec_skills:
    status: configured
    description: >-
      Install the cc-sdd agent skills. They are deliberately not committed: only
      `.kiro/settings/` is tracked, because that defines what generated specs look
      like, while `.claude/skills/`, `.agents/skills/`, and `.codex/agents/` are
      per-executor install artifacts covered by the leading `.*` rule in
      .gitignore. A fresh checkout therefore has no skills until this runs (#101,
      #104).
    why_the_restore_step: >-
      cc-sdd rewrites CLAUDE.md and AGENTS.md, which are the adapter entry points
      that import the standard. `--overwrite skip` protects them but also skips
      every new file, so the install does nothing. Use `force` and restore the two
      tracked adapters immediately afterwards. Omitting the restore silently
      replaces them with a 50-line cc-sdd workflow document.
    requires: Node 18 or newer. cc-sdd declares no `engines` field, so an older Node fails with an internal ESM loader error rather than a version message.
    values:
      - npx cc-sdd@latest --claude-skills --overwrite force
      - npx cc-sdd@latest --codex-skills --overwrite force
      - git checkout -- CLAUDE.md AGENTS.md
    verify:
      - git diff --quiet -- CLAUDE.md AGENTS.md
      - git status --porcelain .kiro/settings

  format:
    status: configured
    values:
      - ruff format lifetxt tests scripts

  lint:
    status: configured
    values:
      - ruff check lifetxt tests scripts

  unit_test:
    status: configured
    values:
      - MPLBACKEND=Agg python -m unittest discover

  unit_test_windows_powershell:
    status: configured
    values:
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover'

  unit_test_captured:
    status: configured
    description: >-
      Same run as unit_test, but the complete output is retained in
      .test-output.log and only the summary reaches the terminal. Use this when
      reporting a failure, and attach the file: a summary line alone is not a
      diagnosis. The log is already ignored by the leading `.*` rule in
      .gitignore.
    values:
      - 'MPLBACKEND=Agg python -m unittest discover > .test-output.log 2>&1; code=$?; tail -n 5 .test-output.log; echo "exit=$code  full output: .test-output.log"'

  unit_test_captured_windows_powershell:
    status: configured
    values:
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover *> .test-output.log; $code=$LASTEXITCODE; Get-Content .test-output.log -Tail 5; "exit=$code  full output: .test-output.log"'

  integration_test:
    status: configured
    values:
      - python -m lifetxt check examples/minimal_life.txt

  full_check:
    status: configured
    values:
      - MPLBACKEND=Agg python -m unittest discover
      - python -m lifetxt check examples/minimal_life.txt

  full_check_windows_powershell:
    status: configured
    values:
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover'
      - python -m lifetxt check examples/minimal_life.txt
