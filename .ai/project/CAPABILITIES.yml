    reuse_policy: reuse_existing_timezone_policy_and_due_parser
    notes: >-
      The #976 coexistence contract extends this capability: explicit priority
      remains independent of importance, derived urgency, and quadrant; matrix
      classification preserves source order and does not calculate a unified
      score or recommended execution order.
      The Web surface reuses this classifier and preserves read-only behavior;
      its task rows expose explicit priority only as separate metadata.
      Priority Horizon reuses the same urgency boundary and stores no
      time-derived state in life.txt; it is opt-in on the CLI matrix.
      Priority Thread Overlay composes that classifier/horizon onto bounded
      Temporal Thread task nodes without changing graph structure.
