name: Repair and apply typed ticket custom fields

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ticket-typed-custom-fields'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ticket-typed-custom-fields
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repair, extract, and test
        id: apply
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import base64
          import hashlib
          import io
          import pathlib
          import shutil
          import subprocess
          import tarfile
          import traceback

          workflow = pathlib.Path('.github/workflows/agent-ticket-custom-fields-repair.yml')
          error_path = pathlib.Path('agent-ticket-custom-fields-error.log')
          test_path = pathlib.Path('agent-ticket-custom-fields-test.log')
          result_path = pathlib.Path('agent-ticket-custom-fields-result.txt')
          try:
              directory = pathlib.Path('.agent_payload')
              a_path = directory / 'part-001a.txt'
              b_path = directory / 'part-001b.txt'
              damaged = a_path.read_text(encoding='ascii') + b_path.read_text(encoding='ascii')
              target = '8931af82ed6bb2549fe58d2a5ad3290ad1da991e58651c862b8377d008278807'
              alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
              repaired = None
              for position in range(len(damaged) + 1):
                  prefix = damaged[:position]
                  suffix = damaged[position:]
                  for character in alphabet:
                      candidate = prefix + character + suffix
                      if hashlib.sha256(candidate.encode('ascii')).hexdigest() == target:
                          repaired = candidate
                          break
                  if repaired is not None:
                      break
              if repaired is None:
                  raise RuntimeError('could not recover missing base64 character from known chunk hash')
              a_path.write_text(repaired[:3500], encoding='ascii')
              b_path.write_text(repaired[3500:], encoding='ascii')

              chunks = sorted(directory.glob('part-*.txt'))
              payload = ''.join(path.read_text(encoding='ascii') for path in chunks)
              if len(payload) != 31760:
                  raise RuntimeError('repaired payload length is %d, expected 31760' % len(payload))
              data = base64.b64decode(payload, validate=True)
              with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
                  archive.extractall('.')

              compile_result = subprocess.run(
                  ['python', '-m', 'compileall', '-q', 'lifetxt', 'tests'],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              test_result = subprocess.run(
                  ['python', '-m', 'unittest', '-v', 'tests.test_ticket_custom_fields'],
                  stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
              )
              test_path.write_text(
                  compile_result.stdout + test_result.stdout, encoding='utf-8'
              )
              if compile_result.returncode or test_result.returncode:
                  raise RuntimeError('typed custom field tests failed')

              shutil.rmtree(directory)
              for name in (
                  'agent-ticket-custom-fields-error.log',
                  'agent-ticket-custom-fields-test.log',
                  'agent-ticket-custom-fields-result.txt',
                  'agent-payload-report.json',
              ):
                  path = pathlib.Path(name)
                  if path.exists():
                      path.unlink()
          except Exception:
              error_path.write_text(traceback.format_exc(), encoding='utf-8')
              result_path.write_text('failed\n', encoding='utf-8')
              raise
          finally:
              if workflow.exists():
                  workflow.unlink()
          PY
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply typed ticket custom fields'
          git push origin HEAD:agent/ticket-typed-custom-fields
      - name: Fail when implementation tests failed
        if: steps.apply.outputs.status != '0'
        run: exit 1
