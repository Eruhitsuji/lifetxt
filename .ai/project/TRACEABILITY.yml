        - tests/test_cui_extensions.py
        - .ai/project/CAPABILITIES.yml
        - .ai/project/TRACEABILITY.yml
      tests_or_evidence:
        - "python -m unittest tests.test_cui_extensions -> Ran 179 tests, OK; includes Japanese input-buffer/live-filter, wide-character read, timeout, control/special-key, and getch fallback regressions"
        - "python -m unittest tests.test_tui_backend tests.test_tui_remote_client tests.test_tui_remote_backend tests.test_tui_remote_cache tests.test_tui_bindings tests.test_surface_runtime -> Ran 115 tests, OK (skipped=8)"
        - "MPLBACKEND=Agg python -m unittest discover -> Ran 3918 tests, OK (skipped=197)"
        - "python -m unittest tests.test_traceability_gate tests.test_schema_extensions_v2.RealCapabilitySchemaTests -> Ran 16 tests, OK (skipped=2)"
