schema_version: 1
requirements:
- id: req-browser-local-check-feasibility-v1
  kind: ADDED
  owner: Eruhitsuji
  statement: Probe existing Python parser checking in isolated WASM without modifying
    the public site's script policy or claiming full CLI equivalence.
  acceptance_criteria:
  - Reproducible local browser PoC with pinned runtime and authoritative Core
  - Native and WASM diagnostics compared with the real CLI and gaps retained
  - Size, startup, workload, memory observations identify their execution environment
  - Worker, cancellation, size limits, text rendering and privacy boundary investigated
  - Actual browser/mobile and distribution licence gaps remain explicit
  - Conditional decision and scoped adoption proposal before any public integration
