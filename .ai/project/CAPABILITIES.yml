    notes: >-
      #481 investigated a derived Temporal Context Graph combining
      lifetxt's existing explicit relation graph inputs with time
      semantics. It found `lifetxt/links.py` already owns the
      authoritative relation graph (parent/ref/depends_on/blocks/related/
      duplicate_of/replaced_by) and left it untouched; found
      `lifetxt/ticket_project_report.py` already has a real, generalizable
      threshold-based staleness rule (`last_activity`/`reference_time`/
      `DEFAULT_STALE_DAYS` in `lifetxt/ticket_project_values.py`), reused
      here verbatim rather than reimplemented; and recommended a new,
      separate, explicitly-versioned contract over extending `GET
      /api/graph`'s edge list (which would mix authoritative structural
      links with inferred facts in the one list every current graph
      consumer already treats as "real relations") or `command-center-v1`
      (a single-reference-date daily digest, not a general pairwise-relation
      contract). The repository owner approved this recommendation --
      including the deliberately narrow v1 vocabulary (`overlap` and
      near-window proximity are explicitly deferred) and CLI as the first
      consumer, matching this project's established CLI-first precedent --
      via `.ai/project/CAPABILITIES.yml`'s AskUserQuestion decision point,
      since #481's own task contract required human sign-off on the public
      vocabulary/contract/first-consumer before implementation. Complexity
      is bounded by construction: `temporal_context()` only ever computes
      one target item's neighborhood (sorted candidates within
      `window_days`, capped at `limit`), never an all-pairs scan of the
      whole workspace, addressing #481's own "avoid O(n^2) near-every-item
      behavior" investigation question. TUI exposure, `overlap`/near-window
      relations, and any change to `command-center-v1` remain explicit,
      unimplemented follow-ups; `/api/graph`/MCP `get_graph` gained a bounded,
      opt-in overlay in #563 (see that requirement's own notes under
      `cap-graph-link-foundation`), which reuses `temporal_context()`
      unmodified rather than merging it into the graph's default edge list.
      #489 adds `get_temporal_context`, a read-only MCP tool delegating
      entirely to the existing `temporal_context()` engine -- no
      due/staleness/same_day/before/after rule is duplicated in
      `lifetxt/mcp.py`. It reuses the same target-resolution helper
      (`find_item_by_id`) and error-raising convention (`raise ValueError`
      on an empty/unknown/ambiguous id) already established by
      `_tool_get_item`/`_tool_get_backlinks`, rather than reimplementing
      the CLI's own try/except wrapper. `window`/`limit`/`stale_after`
      accept the same defaults as `lifetxt temporal` and are validated only
      for type (a non-integer value raises a named `ValueError`), matching
      the issue's "remain bounded consistently with the CLI/library
      contract" constraint -- no additional range clamping was added
      beyond what the underlying engine already guarantees by construction
      (a target item's neighborhood only, never an all-pairs scan). The
      tool is registered in `READ_ONLY_TOOLS` (so the existing
      `test_read_only_context_blocks_every_write_tool`/annotation-
      consistency gates cover it automatically) and carries no
      `openWorldHint`, since it never leaves the local life.txt sources.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

