        - 'RULES.md gained 14 principle bullets (13 general + 1 parsing guarantee) and 7 product boundaries'
        - 'todo.md 450 -> 437 lines, 244 -> 237 checkbox items; migrated phrases absent from todo.md and present exactly once in RULES.md'
      release_or_deployment: null
      status: implemented
    - requirement_id: req-ai-standard-guided-activation
      capability_id: cap-ai-standard-guided-activation
      epic: https://github.com/Eruhitsuji/lifetxt/issues/51
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/56
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/60
      changed_files_or_scope:
        - Move the counter-machine internal specification and pure machine rules from todo.md into docs/design/counter-machine.md
        - docs/design/counter-machine.md
        - todo.md
      tests_or_evidence:
        - 'one-to-one mapping table in the pull request body'
        - 'todo.md dedicated counter-machine section replaced by a pointer'
        - '36 dedicated-section items, 12 scattered machine rules, and 3 counter-machine principles appear in docs/design/counter-machine.md'
        - 'category-3 roadmap items remain in todo.md and are not edited'
      release_or_deployment: null
      status: implemented
    - requirement_id: req-ai-standard-guided-activation
      capability_id: cap-ai-standard-guided-activation
      epic: https://github.com/Eruhitsuji/lifetxt/issues/51
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/57
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/61
      changed_files_or_scope:
        - Remove implementation-status narrative from todo.md
        - Restructure todo.md as roadmap plus Deferred Ideas parking lot
        - todo.md
      tests_or_evidence:
        - 'per-block coverage table to be recorded in the pull request body'
        - 'todo.md before/after counts: 101403 -> 79773 characters; 189 -> 190 checkbox items'
        - 'four Decide bullets remain explicitly marked by the header as pending decision prompts'
        - 'configuration documentation completion rule filed as follow-up issue #62 because .ai/project/RULES.md is out of scope for #57'
      release_or_deployment: null
      status: implemented
    - requirement_id: req-ai-standard-guided-activation
      capability_id: cap-ai-standard-guided-activation
      epic: standard adoption / foundation setup
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/62
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/70
      changed_files_or_scope:
        - Record the configuration-setting completion rule as a project rule
        - Add a task-template acceptance-criteria prompt for configuration-setting changes
        - .ai/project/RULES.md
        - .github/ISSUE_TEMPLATE/task.yml
        - .ai/project/TRACEABILITY.yml
      tests_or_evidence:
        - YAML parse of .ai/project/TRACEABILITY.yml and .github/ISSUE_TEMPLATE/task.yml
        - git diff --check
        - python -m lifetxt check examples/minimal_life.txt
      release_or_deployment: null
      status: implemented
    - requirement_id: req-config-concurrent-write-safety
      capability_id: cap-config-safe-writes
      epic: null
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/47
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/58
      changed_files_or_scope:
        - Make configuration writes revision-aware (compare-and-set) inside the shared lock
        - lifetxt/config_writer.py
        - lifetxt/cli.py
        - tests/test_config_validation.py
      tests_or_evidence:
        - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 1747 tests, OK (skipped=14); 1729 before, 18 new'
        - 'python -m lifetxt check examples/minimal_life.txt -> OK: 10 item(s)'
        - 'CI on ubuntu-latest 3.10/3.11/3.12 plus the no-Web job -> all 10 checks green on c37a831 (first Linux run of the locked compare-and-set)'
        - 'AI first-pass review found a check-then-write race, an unmanaged retained-candidate lifecycle, and a dead parameter; all three fixed before review of the head commit'
      release_or_deployment: null
      status: implemented
    - requirement_id: req-workspace-source-integrity
      capability_id: cap-workspace-resolution-safety
      epic: P1 Configuration and Workspace Foundation
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/48
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/63
      changed_files_or_scope:
        - Detect self-referential symlink/junction cycles before dangerous workspace source expansion
        - Enforce workspace.max_total_source_bytes across unique resolved source files
        - Register workspace.max_total_source_bytes in config defaults, metadata, and schema
        - lifetxt/config.py
        - lifetxt/config_registry.py
        - lifetxt/schema_extensions_v5.py
        - dist/schemas/config-v1.schema.json
        - lifetxt/workspace.py
        - tests/test_workspace_foundation.py
        - docs/en/config.md
        - docs/ja/config.md
        - .ai/project/CAPABILITIES.yml
        - .ai/project/TRACEABILITY.yml
      tests_or_evidence:
        - 'tests/test_workspace_foundation.py WorkspaceResolutionTests: symlink cycle, sibling symlink, Windows junction, broken symlink, and source-size boundary cases'
        - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover'
        - python -m lifetxt check examples/minimal_life.txt
      release_or_deployment: null
      status: implemented
    - requirement_id: req-diagnostic-contract-stability
      capability_id: cap-stable-diagnostics
      epic: P1 Configuration and Workspace Foundation
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/49
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/64
      changed_files_or_scope:
        - Add `hint` to parser/validator diagnostic dictionaries with `""` as the absent representation
        - Publish `category` as a stable diagnostic contract field
        - Share the diagnostic JSON builder across CLI, Web, and MCP raw-line validation surfaces
        - lifetxt/model.py
        - lifetxt/diagnostic_contract.py
        - lifetxt/cli.py
        - lifetxt/webapp.py
        - lifetxt/mcp.py
        - tests/diagnostic_contract_fixtures.py
        - tests/test_diagnostic_contract.py
        - docs/en/cli.md
        - docs/ja/cli.md
        - .ai/project/CAPABILITIES.yml
        - .ai/project/TRACEABILITY.yml
      tests_or_evidence:
        - 'tests/test_diagnostic_contract.py asserts CLI stdin, Web /api/check-line, and MCP check_line against one shared fixture table'
        - 'tests/test_diagnostic_contract.py asserts file-based CLI/Web/MCP diagnostics include and preserve source in the same shared shape'
        - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 1758 tests, OK (skipped=18)'
        - 'python -m lifetxt check examples/minimal_life.txt -> OK: 10 item(s)'
      release_or_deployment: null
      notes: >-
        #64 completes the stable field contract. Parser/validator diagnostics
        still use `hint: ""` until actionable hint text is authored in #65.
      status: implemented
    - requirement_id: req-diagnostic-hint-content
      capability_id: cap-stable-diagnostics
      epic: P1 Configuration and Workspace Foundation
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/65
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/68
      changed_files_or_scope:
        - Add parser diagnostic hint registry and route parser diagnostics through it
        - Add validator diagnostic hint registry and route validator diagnostics through it
        - Update CLI/Web/MCP diagnostic contract fixtures to include non-empty parser and validator hints
        - Document that empty hints are reserved for diagnostics without safe generic guidance
        - lifetxt/parser.py
        - lifetxt/validator.py
        - tests/diagnostic_contract_fixtures.py
        - tests/test_diagnostic_contract.py
        - docs/en/cli.md
        - docs/ja/cli.md
        - .ai/project/CAPABILITIES.yml
        - .ai/project/TRACEABILITY.yml
      tests_or_evidence:
        - python -m unittest tests.test_diagnostic_contract
        - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover'
        - python -m lifetxt check examples/minimal_life.txt
      release_or_deployment: null
      notes: >-
        No parser or validator diagnostic code is intentionally left with an
        empty hint. The model default remains `hint: ""` so diagnostics outside
        the parser/validator hint registries can still represent absent guidance
        without changing the stable object shape.
      status: implemented
    - requirement_id: req-cross-surface-consistency
      capability_id: cap-surface-capability-consistency
      epic: P1 Shared Surface Contracts
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/50
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/66
      changed_files_or_scope:
        - Add package/server version and optional_feature_state to capability documents
        - Make lifetxt capabilities use the surface-aware capability builder
        - Add a documented capability-drift exception record
        - Add live CLI, Web, MCP tool, MCP resource, and Web command-catalog drift gates
        - lifetxt/safety_foundation.py
        - lifetxt/surface_runtime.py
        - lifetxt/extra_safety.py
        - lifetxt/remote_contracts_v6.py
        - tests/test_surface_runtime.py
        - .ai/project/CAPABILITY_DRIFT_EXCEPTIONS.json
        - .ai/project/CAPABILITIES.yml
        - .ai/project/TRACEABILITY.yml
      tests_or_evidence:
        - python -m unittest tests.test_surface_runtime tests.test_safety_cli tests.test_safety_foundation tests.test_remote_compatibility_v21
        - python -m unittest tests.test_web_commands tests.test_remote_attachment_contracts_v6 tests.test_ticket_project_surfaces tests.test_ticket_revision_writes tests.test_ticket_custom_fields tests.test_ticket_workflow_surfaces
      release_or_deployment: null
      notes: >-
        Capability drift exceptions are currently empty. Future exceptions must
        be tracked by an issue whose closure condition is removal of that
        exception.
      status: implemented

    - requirement_id: req-supported-runtime-verification
      capability_id: cap-local-test-compatibility
      epic: null
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/72
      pull_request: null
      changed_files_or_scope:
        - Fail loudly instead of certifying the project on an interpreter below requires-python
        - tests/test_supported_runtime.py
        - .ai/project/COMMANDS.yml
        - readme.md
        - .gitignore
      tests_or_evidence:
        - 'guard on Python 3.12 -> pass; on Python 3.6.5 -> fails naming both versions'
        - 'unsupported interpreter measured before the guard: Ran 1619 tests, FAILED (errors=1) versus 1765 on a supported one -- 146 tests never loaded'
        - 'root cause: tests/test_cui_extensions.py:709 uses parenthesized with-statements (3.10+ syntax)'
        - 'clean run on the branch: Ran 1765 tests in 392.731s, OK (skipped=14) on Python 3.12'
        - 'python -m lifetxt check examples/minimal_life.txt -> OK: 10 item(s)'
        - 'ruff format --check lifetxt tests scripts -> 241 files already formatted; ruff check -> All checks passed'
      release_or_deployment: null
      status: implemented

    - requirement_id: req-clean-install-runtime
      capability_id: cap-supported-platform-install
      epic: null
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/73
      pull_request: null
      changed_files_or_scope:
        - Declare tzdata for Windows so a clean install can resolve timezones
        - pyproject.toml
        - lifetxt/safety_foundation.py
        - .ai/project/RULES.md
        - readme.md
      tests_or_evidence:
        - 'before the fix, a clean Windows 3.12 environment built by the recorded setup command: integration_test failed and the suite reported 15 failures / 28 errors'
        - 'installing tzdata alone restored python -m lifetxt check examples/minimal_life.txt -> OK: 10 item(s)'
        - 'PEP 508 marker evaluated per platform -> win32 True, linux False, darwin False'
        - 'clean run on the branch: Ran 1765 tests in 346.909s, OK (skipped=14) on Python 3.12'
        - 'ruff format --check -> 241 files already formatted; ruff check -> All checks passed'
        - 'Linux CI cannot verify this change; the marker excludes the dependency there'
      release_or_deployment: null
      status: implemented

    - requirement_id: req-clean-install-runtime
      capability_id: cap-supported-platform-install
      epic: null
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/76
      pull_request: null
      changed_files_or_scope:
        - Remove the undeclared dateutil and pytz timezone fallbacks
        - lifetxt/safety_foundation.py
        - tests/test_safety_foundation.py
        - .ai/project/RULES.md
      tests_or_evidence:
        - 'no dateutil or pytz reference remains in lifetxt/ outside one explanatory docstring'
        - 'regression test blocks the declared source while making working dateutil and pytz importable, and asserts resolution still fails'
        - 'the regression test was confirmed to fail when a fallback is reintroduced in-process'
        - 'unknown zone name reports "Unknown timezone" and does not suggest installing tzdata; a missing database does'
        - 'ruff format --check -> 241 files already formatted; ruff check -> All checks passed'
      release_or_deployment: 'behaviour change for release notes: an environment resolving timezones only through an incidentally installed dateutil or pytz will now fail'
      status: implemented

    - requirement_id: req-supported-runtime-verification
      capability_id: cap-local-test-compatibility
      epic: null
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/78
      pull_request: null
      changed_files_or_scope:
        - Retain complete suite output so an intermittent failure can be diagnosed instead of lost
        - .ai/project/COMMANDS.yml
        - .ai/project/RULES.md
      tests_or_evidence:
        - 'POSIX form, failing run -> exit=1, 16 lines retained including the traceback'
        - 'POSIX form, passing run -> exit=0, 5 lines retained'
        - 'PowerShell form, failing run -> exit=1, 19 lines retained; passing run -> exit=0, 10 lines'
        - '.test-output.log is already ignored: git check-ignore reports .gitignore:1:.*'
        - 'the failure this responds to was observed during #76 and never identified; its error text was lost to a truncating pipe'
      release_or_deployment: null
      status: implemented

required_chain:
  - Requirement
  - Capability
  - Epic
  - Task
  - Pull Request
  - Test/Evidence
  - Release

gap_policy:
  missing_link_action: create_follow_up_issue_or_approved_exception
