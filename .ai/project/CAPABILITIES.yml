      validation/mutation and revision/conflict contract is identical to
      every other TUI-initiated create. Native History created-event
      emission (#714/#767) is automatic and unmodified, since contextual
      creation is not a separate code path from the ordinary create route
      it wraps. Landed on child branch
      issue-770-context-aware-related-item-create, merged locally into
      feature/769-770-batch.
