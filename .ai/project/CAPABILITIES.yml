    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      First implementation child of the #500 "Provider-independent
      Generative AI Integration" epic (Phase 1, item 1 -- the epic's own
      recommended first implementation child). Security/High assurance per
      ASSURANCE_LEVELS.md's escalation rules (MCP authorization-boundary
      change); full change package at
      .ai/project/changes/mcp-permission-profiles/, cc-sdd spec at
      .kiro/specs/mcp-permission-profiles/. Requires independent
      implementation review, independent security review, and Merge
      Authority approval before merge to main -- the self-review and
      `/security-review` pass recorded above are informational only and do
      not satisfy that requirement (this repository's own AI must not be
      the final approver of its own implementation).
      Reuses the pre-existing `READ_ONLY_TOOLS`/`DESTRUCTIVE_TOOLS`
      classification and the pre-existing `stage_proposal`/Unified Inbox
      proposal contract (`cap-unified-inbox-proposals`) unmodified rather
      than building a parallel permission model. Found during
      implementation, before writing any enforcement code, that
      `lifetxt/__init__.py` unconditionally wraps `mcp.call_tool`/
      `tool_schemas`/`handle_request` at import time from four other
      modules (`surface_runtime.py`, `surface_runtime_compat.py`,
      `remote_contracts_v6.py`, `ticket_project_surfaces.py`), each adding
      further MCP tools; giving `tool_schemas()` a `profile` parameter
      directly would have raised `TypeError` through every one of those
      wrappers, none of which forward extra arguments. Fixed with a
      separate `filter_tool_schemas_for_profile()` applied in
      `handle_request`'s own `tools/list` branch instead, which works
      regardless of how many layers wrap `tool_schemas()` and still covers
      every tool any of them add, since `READ_ONLY_TOOLS` is read at call
      time from the same module global each of them extends in place --
      see `.kiro/specs/mcp-permission-profiles/research.md` for the full
      live-traced chain. Also found and fixed two defects during testing:
      the `--read-only`/`--profile` conflict check was moved from
      `from_args` into `McpContext.__init__` itself (protecting direct
      construction, not only the CLI, from a contradictory
      profile="assist"+read_only=True state); and the test helper was
      found to leak real `stage_proposal` writes into the actual
      repository checkout's cwd-relative `.cache/lifetxt/proposals.json`
      (confirmed via a full-suite run that failed four unrelated,
      pre-existing Command Center/Today-view/Web-API tests until the leaked
      proposals were found and the test helper was fixed to scope the
      store to each test's own temp directory).
      Deferred, not implemented here: reporting the active profile through
      `get_file_state` or a future `lifetxt ai doctor`-style command
      (candidate for a later #500 child issue); widening the `assist`
      allowlist beyond `stage_proposal`; workspace/disclosure policy
      (which data is visible, as opposed to which tools are reachable).
      #543 (a post-#500-completion review investigation) found that MCP
      resources (`resources/list`/`resources/read`) and the `remote_*`
      open-world read tools sit outside the operation-policy filter this
      capability implements, and asked whether that constitutes a
      disclosure gap. Traced directly against code rather than assumed:
      **it does not** for resources -- `list_items`/`get_item`/
      `get_file_state` already return the identical raw source content and
      local paths under the exact same profile, since local MCP has never
      applied per-record visibility/privacy filtering (that concept is
      Remote-Safe-Mode-specific, for a genuinely multi-principal server,
      confirmed to have no local equivalent scenario). Workspace/source
      selection at connection time is, and should remain, the sole local
      disclosure boundary -- already correctly implemented by the AI-safe
      named-workspace pattern (`cap-mcp-ai-safe-workspace`, #509), not a
      gap. #544 (documentation-only) records this finding in
      `docs/en+ja/ai-integration.md`/`cli.md` rather than changing
      resource behavior. The one genuine, evidenced gap #543 found is a
      missing third policy dimension alongside operation/data: **network
      reach**. `remote_*` tools' data is already correctly gated by the
      *remote* server's own Remote Safe Mode policy, but nothing today
      lets an operator guarantee a `read`/`assist` client cannot open any
      outbound connection at all, since three of the four `remote_*`
      tools are `READ_ONLY_TOOLS` members. #545 closes this with a new,
      independent, opt-in `--no-open-world` flag (`McpContext.no_open_world`)
      denying every `OPEN_WORLD_TOOLS` member regardless of profile,
      enforced at both `tools/list` and `tools/call` via the same
      dispatch chain #502 already established -- not a fourth profile
      value, since `OPEN_WORLD_TOOLS` was already an orthogonal
      classification from `READ_ONLY_TOOLS` before this change (three of
      four `remote_*` tools already belonged to both sets simultaneously).
      While rewriting the affected documentation paragraph for #545, two
      pre-existing inaccuracies were found and corrected in the same
      edit: the claim that the server makes "no outbound calls" (false
      since #243's `remote_*` tools shipped) and the claim that
      workspace/disclosure policy is "not yet implemented" (false since
      #509 shipped it, documented in the very next section of the same
      file). Full change package for #545 at
      `.ai/project/changes/mcp-no-open-world-restriction/`; same
      independent security review and Merge Authority approval
      requirement as this capability's original #502 implementation.
