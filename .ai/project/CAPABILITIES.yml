    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/684
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      #768 adds `TuiBackend.native_timeline(target_id, since=, until=,
      event=, limit=)` to the shared backend contract, reused by
      `tui_app._cmd_timeline` (#761) instead of that command calling
      `lifetxt.native_timeline.native_timeline()` directly. `LocalTuiBackend`
      delegates to the exact same call the command made before this change
      (zero behavior change for local sessions); `RemoteTuiBackend` fetches
      through the server's existing read-only `GET /api/native-timeline/{id}`
      route (#762) instead of parsing/normalizing history client-side --
      no server route changed for this. Refuses outright with a named
      `ValueError` while `serving_cache` is set (#681's offline read cache
      carries no history evidence to reconstruct a Timeline from), matching
      #768's own explicit "do not invent history from current cached
      items" requirement, and never even attempts the network call in that
      state. Connection/auth failures (`RemoteAuthError`/
      `RemoteConnectionError`) propagate unchanged through the existing
      `_safe_command`/`except Exception` TUI error-surfacing path, with no
      new error-handling code needed.
      #678 and #679 are the first two of three bounded #677 children (#678
      boundary, #679 remote Web backend, #680 polling/UX/docs) implemented
      on their own child branches into one integration branch. #678 is
      deliberately transport-free per its own scope: no HTTP, auth, or
      remote configuration is added there. `_mutate_rows` in
      `lifetxt/tui_app.py` keeps all of its existing grouping, validation,
      and undo-stack bookkeeping; only the final disk-commit step was
      extracted into `TuiBackend.apply_semantic_changes`, since that is
      the one step a remote backend genuinely needs to replace. Bulk edits
      spanning more than one source file at once
      (`apply_semantic_changes` receiving more than one grouped path)
      remain local-only by design; a remote backend is not required to
      implement that case in the MVP slice. `dashboard_model()` gained an
      additive `items=` parameter (default `None` preserves the exact
      original behavior of parsing `args.paths` itself) so a caller can
      supply an already-fetched item list instead.

      #679's most consequential finding: `lifetxt serve`'s ordinary item
      routes (`PUT`/`DELETE /api/items{,/id/{id}}`) already sit behind a
      comprehensive whole-file revision-precondition contract installed
      globally by `lifetxt.surface_runtime`/`surface_runtime_compat`
      (`GET /api/revision`, `If-Match`/`X-Lifetxt-Expected-Revision`,
      `X-Lifetxt-Revision` response header, 409 `CONFLICT` on mismatch,
      currently non-strict "observe" mode that legacy-fallbacks a missing
      header rather than rejecting it). An initial implementation attempt
      added a second, item-level `If-Match` precondition directly in
      `lifetxt/webapp.py` before discovering this -- it was reverted
      entirely once live testing showed the new item-level header
      collided with the existing whole-file one on the identical HTTP
      header name. `RemoteTuiBackend` instead reuses the existing
      whole-file contract unmodified: it tracks the last-known
      `X-Lifetxt-Revision` on its `RemoteTuiConnection` and sends it as
      `If-Match` on every write, exactly matching #679's own instruction
      to "add/modify a server route only if a concrete semantic gap is
      demonstrated" -- no gap existed. Zero lines of `lifetxt/webapp.py`
      changed for this capability. `RemoteTuiBackend.apply_semantic_changes`
      merges a `_mutate_rows`-style change dict (`status`/`set_details`/
      `delete`) onto its own last-loaded copy of the target item before
      sending a full-replace `PUT` payload, since the plain item route
      replaces `details` wholesale rather than merging -- this reproduces
      `write_operations.mutate_items`'s merge semantics client-side rather
      than a third, server-side merge implementation. `/add`
      (`_cmd_add`) is special-cased for remote mode to call
      `POST /api/items` (reusing the exact route the Web UI/CLI `add`
      already use) instead of `_write_target()`/`append_life_records()`,
      since quick-capture has no selected row to route through
      `_mutate_rows`. Presence commands (`/state`, `/now`) still call
      `_write_target()` directly and were not migrated in this slice;
      `_write_target()` now raises a clear, named error for remote mode
      instead of crashing or writing to a stray local file, satisfying
      #677's "never fall back to a local write target" requirement for
      every command outside the #679 MVP set.

      #680 adds `RemoteTuiBackend.poll_changed()` (one cheap
      `GET /api/revision` call, never a full item re-fetch) and wires it
      into `run_workspace`'s existing idle-tick branch (`key == -1`) at a
      new `REMOTE_POLL_SECONDS = 1.5` cadence -- deliberately independent
      of and much longer than the pre-existing local `WORKSPACE_POLL_SECONDS
      = 0.25` curses input-timeout/file-watch cadence, which remains
      unchanged and unused by remote mode. `_poll_remote()` only calls a
      real reload when `poll_changed()` actually reports a change;
      `_reload_preserving_selection()` reuses `row_key()` to re-locate the
      previously-selected row after a reload, since `WorkspaceState.selected`
      is a bare list index with no existing key-based re-anchoring -- a
      genuinely new behavior this issue required, not something the prior
      local file-watcher reload already provided. A poll that raises
      (connection lost) never calls `state.load()`/`state.reload()` at all,
      so `state.rows`/`state._model` are left completely untouched,
      directly satisfying "a transient poll failure must not destroy the
      last in-memory view." `state.remote_status`
      ("connected"/"disconnected") and `state.remote_status_detail` drive a
      `(connected)`/`(disconnected)` suffix on the existing header remote
      indicator, plus a one-time toast on each connect/disconnect
      transition (not repeated every failed poll tick). The manual
      `/reload` command already worked unchanged for remote mode with no
      code change, since it already called the shared `state.reload()`
      path #679 wired through the backend.

      Fixed two real regressions found only by running the complete
      repository suite (not caught by the narrower TUI-focused suites run
      during #678/#679's own development): (1)
      `tests/test_shared_surface_mutation_routing.py` constructs its own
      minimal fake TUI state object (predating the #678/#679 backend
      extraction) with no `.backend` attribute, which `_mutate_rows`/
      `_write_target` now require -- fixed by giving that fixture the same
      `LocalTuiBackend` `WorkspaceState` defaults to, rather than loosening
      the production code's now-required backend check. (2) the project's
      `clock_boundary_audit` release-policy gate flagged the new
      `time.time()` poll-scheduling call in `lifetxt/tui_app.py` as an
      unclassified direct host-clock boundary; added a
      `config/release/clock-boundary-baseline-v1.json` entry classifying
      it `operational-network` (paces a background poll interval, never
      selects or persists a life.txt workflow date), matching this
      project's existing precedent for every other allowed clock call in
      that baseline.

      #681 adds `lifetxt/tui_remote_cache.py`, an opt-in (`--remote-cache`,
      off by default) bounded read-only offline cache: after every
      successful `RemoteTuiBackend.load_items()` call, `save_snapshot()`
      persists the raw item payload and current revision under
      `~/.cache/lifetxt/remote-tui/` (or `$LIFETXT_REMOTE_TUI_CACHE_DIR`),
      keyed by `connection_cache_key(base_url, username)` (a SHA-256 of
      `url|username`, truncated to 32 hex characters) so different servers
      or users never collide, bounded to `MAX_CACHED_ITEMS = 2000`, and
      written with owner-only permissions (`stat.S_IRUSR | stat.S_IWUSR`)
      where the OS supports it -- never containing credentials, since the
      persisted payload is exactly the already-credential-free
      `GET /api/items` response. `RemoteTuiBackend.load_items()` falls back
      to `load_snapshot()` only when `--remote-cache` is enabled and the
      live request fails, setting a new `serving_cache`/`cache_saved_at`
      state; every mutation method
      (`apply_semantic_changes`/`create_item`/`delete_item`) checks
      `_refuse_if_serving_cache()` first and raises a named `ValueError`
      naming the attempted action, since a cached snapshot cannot honor
      the server's revision-precondition contract. `_build_header` in
      `lifetxt/tui_app.py` reports a `cached, stale` status word (with the
      snapshot's age) instead of `disconnected` while serving cached data.
      `_poll_remote()`'s reconnection-from-disconnected branch was changed
      to *always* force a real `_reload_preserving_selection()` call on
      reconnection, not only when the polled revision differs from the
      last-known one -- this was necessary because a cache-serving session
      has no reliable "last-known revision" to compare against, so relying
      on the pre-existing revision-diff check alone could leave
      `serving_cache` incorrectly set (and writes incorrectly refused)
      after the connection was actually restored; this is a genuine
      behavior change to #680's reconnection logic, not an addition
      alongside it. `lifetxt/cli.py` gained `--remote-cache` and
      `--remote-clear-cache` (the latter calls
      `tui_remote_cache.clear_snapshot()` and exits before starting the
      TUI, handled first in `command_tui` so it works even without
      `--remote-cache` set). Two real regressions were found and fixed
      while writing the offline-cache tests, both already recorded as
      resolved in `tests_or_evidence` above: a `_StubConnection` test
      double missing `base_url`/`username` attributes the new
      `_save_cache_snapshot`/`_load_cached_snapshot` methods read, and a
      second `clock_boundary_audit` release-policy finding for the new
      `time.time()` call in `tui_remote_cache.py:save_snapshot`'s default
      `now` parameter, classified `operational-recovery` in
      `config/release/clock-boundary-baseline-v1.json` (cache freshness
      metadata, not a life.txt workflow date choice) matching the same
      classification already used for `transaction_journal.py` and
      `server_update.py`'s comparable recovery-evidence timestamps. An
      offline *mutation* queue remains explicitly out of scope, per #681's
      own boundary: writes always require a live connection regardless of
      whether `--remote-cache` is enabled.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

