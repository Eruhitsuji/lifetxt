        - readme.md
        - lifetxt/
        - tests/
        - scripts/
        - .ai/project/COMMANDS.yml
        - .ai/project/PROJECT.yml
        - .ai/project/CAPABILITIES.yml
        - .ai/project/TRACEABILITY.yml
        - .ai/adoption/REPORT.md
      tests_or_evidence:
        - 'ruff format --check lifetxt tests scripts -> 240 files already formatted'
        - ruff check lifetxt tests scripts
        - YAML parse of edited project records
        - Ruff 0.16.1 parsed pyproject.toml while running the configured lint selection
        - python -m lifetxt check examples/minimal_life.txt
      release_or_deployment: null
      notes: >-
        The linter starts with Ruff fatal Python error rules
