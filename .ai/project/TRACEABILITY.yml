      changed_files_or_scope:
        - Implement find_backend() trying lifetxt, python -m lifetxt, python3 -m lifetxt, py -m lifetxt in order
        - Resolve each candidate to an absolute path via resolve_on_path() (PATH environment variable only) before probing or spawning it
