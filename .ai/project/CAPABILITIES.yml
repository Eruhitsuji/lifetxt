  - id: cap-git-historical-read
    name: Shared Git historical workspace snapshot reader
    summary: >-
      A surface-neutral, read-only historical workspace snapshot reader
      (`lifetxt.historical_temporal.read_historical_snapshot`) composing the
      pre-existing exact-revision (`historical_snapshot`) and committer-time
      as-of (`select_revision_as_of`) Git evidence primitives into one shared
      entry point, reused unmodified by every non-Temporal-Thread historical
      read surface: `lifetxt show --revision/--as-of` and
      `lifetxt query --revision/--as-of`. Never falls back to the current
      working tree; always returns requested selector, resolved full commit
      SHA, evidence mode, tracked-path membership, and shallow/incomplete-
      history limitations.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-git-historical-evidence-contract-investigation
      - req-reusable-git-historical-snapshot-reader
      - req-historical-item-show
      - req-revision-scoped-historical-query
    implementation_locations:
