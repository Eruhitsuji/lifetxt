      - https://github.com/Eruhitsuji/lifetxt/issues/183
      - https://github.com/Eruhitsuji/lifetxt/issues/254
      - https://github.com/Eruhitsuji/lifetxt/issues/255
      - https://github.com/Eruhitsuji/lifetxt/issues/256
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/258
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      Security/High assurance per ASSURANCE_LEVELS.md (data-loss-prevention
      feature responding to a real production incident); full change
      package at .ai/project/changes/project-archive-plan-v1/. Does not
      modify lifetxt/archive_safety_v3.py's existing --revision-flag path,
      which remains available and independently tested. reserved_transaction_id
      is a plan-identity value for audit correlation only, not threaded into
      transaction_journal.py's actual transaction ID -- see decisions.md for
      why deeper journal integration was scoped out. Known limitation:
      selected_item_ids is populated only from items carrying an explicit
      id: (or configured id_key) detail; an id-less item archives correctly
      but is invisible in that field. This does not weaken the write-safety
      guarantee (byte-identical source revisions deterministically reproduce
      the same selection), but for a workspace without ids.auto enabled,
      operators should review the accompanying dry-run text alongside the
      plan rather than selected_item_ids alone -- documented in
      docs/en|ja/projects.md and decisions.md. Known limitation: plan_hash
      is a self-consistency checksum (computed from and stored in the same
      file it covers), not a signature -- it detects accidental corruption
      or a hand-edit, not a deliberately forged plan; a plan file must be
      kept under the same trust as any other local input to this command,
      documented in docs/en|ja/projects.md and design.md's Security Review
      Finding after this was found by /security-review during
      implementation (original docs suggested a "share it" review/handoff
      workflow that the mechanism does not actually protect). #183's own
      root-cause investigation goals were separate from and unresolved by
      this change, which implements only the "reviewable plan workflow"
      item todo.md's P1 Project and Portfolio Management section requests;
      #183 was later closed at its evidence ceiling (root cause unprovable,
      recovery and preventive follow-up complete) once this capability had
      shipped -- see its closing comment for the final disposition.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

