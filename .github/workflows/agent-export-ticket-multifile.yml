name: Export ticket multifile development source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/ticket-multifile-bulk-recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ticket-multifile-bulk-recovery
          fetch-depth: 0
      - name: Package source tree
        shell: bash
        run: |
          tar --exclude=.git --exclude=.github/workflows/agent-export-ticket-multifile.yml -czf /tmp/lifetxt-ticket-multifile-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: lifetxt-ticket-multifile-source
          path: /tmp/lifetxt-ticket-multifile-source.tar.gz
          if-no-files-found: error
          retention-days: 1
