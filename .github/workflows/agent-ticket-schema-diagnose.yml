name: Diagnose ticket schema publication

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/ticket-workflow-history-time'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ticket-workflow-history-time
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record schema comparison output
        shell: bash
        run: |
          set +e
          python -m unittest \
            tests.test_schema_extensions_v2.SchemaExtensionsV2Tests.test_bundle_contains_sixty_four_generated_and_published_documents \
            > agent-ticket-schema-test.log 2>&1
          status=$?
          printf 'test_status=%s\n' "$status" > agent-ticket-schema-result.txt
          rm .github/workflows/agent-ticket-schema-diagnose.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Diagnose ticket schema publication'
          git push origin HEAD:agent/ticket-workflow-history-time
