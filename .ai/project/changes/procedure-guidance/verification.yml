release_evidence:
  migration_notes: No migration performed. New procedure-event-v1 is an opt-in local
    event-only log. Unknown schema refuses writes/replay rather than guessing. Generic
    Format 1.0/interchange preserves custom fields. No public schema-catalog change.
  rollback_plan: Revert software while retaining definitions/logs and recovery artifacts.
    Old clients may read Notes but must not update runs. Corrupt or pending journals
    need existing explicit operator inspection and verified-backup recovery; no deletion
    or automatic rollback is authorized.
  operations_evidence:
  - Synthetic failure and actual child-process crash were recovered through existing
    transaction journal resume without duplicate events; production data was not touched.
