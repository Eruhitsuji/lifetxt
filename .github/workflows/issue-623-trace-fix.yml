name: Align issue 623 traceability PR

on:
  push:
    branches:
      - fix/issue-623-report-v2-weekly-tests

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v5
        with:
          ref: fix/issue-623-report-v2-weekly-tests
          fetch-depth: 0

      - name: Align traceability PR URL
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.ai/project/TRACEABILITY.yml')
          text = path.read_text(encoding='utf-8')
          old = 'pull_request: https://github.com/Eruhitsuji/lifetxt/pull/624'
          new = 'pull_request: https://github.com/Eruhitsuji/lifetxt/pull/625'
          if old not in text:
              raise SystemExit('issue 623 provisional PR URL not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Commit authorized traceability correction
        shell: bash
        run: |
          git config user.name "Eruhitsuji"
          git config user.email "132959232+Eruhitsuji@users.noreply.github.com"
          git rm .github/workflows/issue-623-trace-fix.yml
          git add .ai/project/TRACEABILITY.yml
          git commit -m "chore: align issue 623 traceability with PR 625"
          git push origin HEAD:fix/issue-623-report-v2-weekly-tests
