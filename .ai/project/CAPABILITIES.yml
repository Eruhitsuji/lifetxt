  - id: cap-project-archive-plan-v1
    name: Reviewable pre-write project archive plan
    summary: >-
      A machine-readable, self-consistency-checked, schema-valid
      archive-plan-v1 document (project archive --dry-run --emit-plan
      PATH) and a verify-then-apply counterpart (project archive
      --apply-plan PLAN) that re-checks every frozen fact -- plan version,
      the plan_hash self-consistency check, source/destination revisions,
      workspace/config revision, re-derived
      candidate selection, recovery-evidence reachability -- against
      current state before any write, requiring explicit --yes to
      actually apply. Follow-up to the #183 production zero-byte incident,
      giving operators a reviewable object between "what will be archived"
      and "archive it" beyond the existing --revision-flag path.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-archive-plan-v1-schema-and-emit
      - req-archive-apply-plan-verification-execution
      - req-archive-plan-v1-operator-docs
    implementation_locations:
