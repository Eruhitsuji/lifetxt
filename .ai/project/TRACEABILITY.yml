      release_or_deployment: null
      notes: >-
        Extends the existing single-record reconfirm review action (#957/PR
        #958) with three further review outcomes -- Correct the record,
        Changed over time, and No longer valid -- reusing the existing
        correction_details()/expire_details()/changed_details() domain
        helpers, the shared currentness resolver's own valid_to/replaced_by/
        corrects conventions, and the same CAS mutation contract every other
        Personal Context write route already uses. No new record kind,
        Format key, or currentness state is introduced. All four write
        routes (reconfirm/expire/change/correct) were also hardened to build
        their response from the MutationResult.snapshot captured inside the
        write lock rather than a separate post-write disk read, fixing an
        intermittent stale-read race observed on this Windows host.
      status: implemented

