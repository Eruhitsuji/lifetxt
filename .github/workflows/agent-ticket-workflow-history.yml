name: Materialize ticket workflow implementation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'agent/ticket-workflow-history-time'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ticket-workflow-history-time
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify, extract, patch, and test
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import pathlib
          import shutil
          import tarfile

          root = pathlib.Path('.agent_ticket_workflow')
          chunks = sorted(root.glob('part-*.txt'))
          payload = ''.join(path.read_text(encoding='ascii') for path in chunks)
          expected = 'c5007609bb6191fe13c8cd015297a428ebfd3fb00fb2c37316fdfa179761a7dc'
          if len(chunks) != 9 or len(payload) != 54668:
              raise SystemExit('incomplete payload')
          if hashlib.sha256(payload.encode('ascii')).hexdigest() != expected:
              raise SystemExit('payload SHA-256 mismatch')
          data = base64.b64decode(payload, validate=True)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              archive.extractall('.')
          shutil.rmtree(root)
          PY
          python tools/apply_ticket_workflow_history_batch.py
          rm tools/apply_ticket_workflow_history_batch.py
          rm .github/workflows/agent-ticket-workflow-history.yml
          set +e
          python -m compileall -q lifetxt tests > agent-ticket-workflow-test.log 2>&1
          compile_status=$?
          python -m unittest \
            tests.test_ticket_workflow_history \
            tests.test_ticket_planning \
            tests.test_ticket_workflow_surfaces \
            tests.test_safety_cli \
            tests.test_safety_foundation \
            tests.test_schema_extensions_v2 >> agent-ticket-workflow-test.log 2>&1
          test_status=$?
          printf 'compile_status=%s\ntest_status=%s\n' "$compile_status" "$test_status" > agent-ticket-workflow-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Materialize ticket workflow implementation'
          git push origin HEAD:agent/ticket-workflow-history-time
          if [ "$compile_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            exit 1
          fi
