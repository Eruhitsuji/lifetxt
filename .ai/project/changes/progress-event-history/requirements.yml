schema_version: 1

requirements:
  - id: req-progress-event-history
    kind: ADDED
    statement: >-
      Every successful non-dry-run lifetxt progress --set/--delta mutation on
      a stably identified item updates the current progress and appends one
      structurally valid record:progress_event as an indivisible,
      exact-revision write; validation exposes incomplete history rather than
      reconstructing or backfilling boundaries.
    acceptance_criteria:
      - "The target must have the configured stable ID key; refusal and stale-revision failure leave the file byte-for-byte unchanged."
      - "The item update and event append occur in one mutation, and source_revision equals the exact SHA-256 read before that write."
      - "Each event records exactly one id, parent, normalized UTC at, positive per-parent sequence, transaction, source_revision, operation, and after_progress, plus exactly one before_progress or before_missing:true."
      - "Raw percentage/fraction representations are preserved, including denominator changes; all values reuse lifetxt.progress.parse_progress."
      - "lifetxt check warns on malformed, duplicated, gapped, discontinuous, backwards-time, or current-value-mismatched chains, and authoritative_progress_events returns no events for such a chain."
      - "No event is generated by dry-run and no historical event is backfilled; a parent with no events has no authoritative history."
      - "Remote Safe Mode evaluates a progress event with its uniquely resolved parent item's access tuple."
      - "The format and CLI behavior are documented in English and Japanese."
    constraints:
      - Must not derive history from undo logs, snapshots, filesystem timestamps, or version-control history.
      - Must not silently coerce a missing before value to zero or reconcile a manual edit.
      - Must not change the percentage/fraction validation semantics in lifetxt/progress.py.
      - Issue 695 aggregation remains blocked until this contract is merged and available as authoritative input.
    owner: Eruhitsuji

open_questions: []
