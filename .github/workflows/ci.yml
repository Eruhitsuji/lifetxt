name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: Python ${{ matrix.python-version }} with Web extras
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and optional Web test dependencies
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-web.txt

      - name: Compile Python files
        run: python -m compileall lifetxt tests scripts

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover 2>&1 | tee unit-tests-${{ matrix.python-version }}.log

      - name: Upload unit test log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-tests-${{ matrix.python-version }}
          path: unit-tests-${{ matrix.python-version }}.log

      - name: Validate examples
        run: |
          python -m lifetxt check examples/minimal_life.txt
          python -m lifetxt check examples/status_presence.txt
          python -m lifetxt check examples/messages_life.txt

      - name: Run release smoke test
        run: python scripts/smoke_test.py

  no-web-extras:
    name: Python 3.12 without optional Web dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependency-free package only
        run: python -m pip install -e .

      - name: Assert optional Web packages are absent
        run: |
          python - <<'PY'
          import importlib.util
          for name in ("fastapi", "uvicorn", "httpx", "httpx2"):
              if importlib.util.find_spec(name) is not None:
                  raise SystemExit("optional dependency unexpectedly installed: " + name)
          PY

      - name: Compile Python files
        run: python -m compileall lifetxt tests scripts

      - name: Run unit tests without extras
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover 2>&1 | tee unit-tests-no-web.log

      - name: Upload no-Web unit test log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: unit-tests-no-web
          path: unit-tests-no-web.log

      - name: Run dependency-free smoke checks
        run: |
          python -m lifetxt check examples/minimal_life.txt
          python -m lifetxt summary examples/minimal_life.txt
          python -m lifetxt completion powershell > /tmp/lifetxt-completion.ps1

  windows-core-smoke:
    name: Windows core CLI smoke
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependency-free package
        shell: pwsh
        run: python -m pip install -e . 2>&1 | Tee-Object windows-install.log

      - name: Verify Windows timezone data and stable entry points
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          from zoneinfo import ZoneInfo
          import tzdata

          root = Path("windows smoke \u65e5\u672c\u8a9e")
          root.mkdir()
          source = root / "\u5165\u529b life.txt"
          source.write_text('# [ ] T "Windows smoke"\\n', encoding="utf-8")
          ZoneInfo("Asia/Tokyo")
          print(tzdata.__version__)
          '@ | python 2>&1 | Tee-Object windows-python.log
          python -m lifetxt check "windows smoke $([char]0x65e5)$([char]0x672c)$([char]0x8a9e)/$([char]0x5165)$([char]0x529b) life.txt" 2>&1 | Tee-Object windows-module.log
          lifetxt summary "windows smoke $([char]0x65e5)$([char]0x672c)$([char]0x8a9e)/$([char]0x5165)$([char]0x529b) life.txt" 2>&1 | Tee-Object windows-console.log

      - name: Upload Windows smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-core-smoke
          if-no-files-found: warn
          path: windows-*.log

  macos-core-smoke:
    name: macOS core CLI smoke
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependency-free package
        shell: bash
        run: python -m pip install -e . 2>&1 | tee macos-install.log

      - name: Verify stable module and console entry points
        shell: bash
        run: |
          python - <<'PY' 2>&1 | tee macos-python.log
          from pathlib import Path

          root = Path("macos smoke \u65e5\u672c\u8a9e")
          root.mkdir()
          source = root / "input with spaces.life.txt"
          source.write_text('# [ ] T "macOS smoke"\\n', encoding="utf-8")
          print(source)
          PY
          python -m lifetxt check "macos smoke 日本語/input with spaces.life.txt" 2>&1 | tee macos-module.log
          python -m lifetxt summary "macos smoke 日本語/input with spaces.life.txt" 2>&1 | tee macos-console.log
          python -m lifetxt config init -o "macos smoke 日本語/config.json" 2>&1 | tee macos-write-surface.log
          test -f "macos smoke 日本語/config.json"

      - name: Upload macOS smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macos-core-smoke
          if-no-files-found: warn
          path: macos-*.log

  coverage-baseline:
    name: Publish stable coverage baseline
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package and coverage tooling
        run: python -m pip install -e ".[dev]"

      - name: Run tests and write coverage evidence
        shell: bash
        run: |
          set -o pipefail
          coverage run --branch -m unittest discover 2>&1 | tee coverage-tests.log
          coverage report -m | tee coverage-summary.txt
          coverage json -o coverage.json

      - name: Upload coverage baseline
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: stable-coverage-baseline
          if-no-files-found: warn
          path: |
            .coverage
            coverage-tests.log
            coverage-summary.txt
            coverage.json

  type-check:
    name: Static type check stable diagnostic contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install development tools
        run: python -m pip install -e ".[dev]"

      - name: Check approved typing boundary
        run: mypy --follow-imports=skip --ignore-missing-imports lifetxt/diagnostic_contract.py

  optional-dependency-compatibility:
    name: ${{ matrix.extra }} ${{ matrix.band }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extra: web
            band: minimum
            requirements: 'fastapi==0.95.0 "uvicorn[standard]==0.22.0"'
            tests: tests.test_completion_surfaces
          - extra: web
            band: upper
            requirements: '"fastapi>=0.95,<1.0" "uvicorn[standard]>=0.22,<1.0"'
            tests: tests.test_completion_surfaces
          - extra: tui
            band: minimum
            requirements: 'textual==0.24.0 watchdog==3.0.0'
            tests: tests.test_cui_extensions
          - extra: tui
            band: upper
            requirements: '"textual>=0.24,<1.0" "watchdog>=3,<7"'
            tests: tests.test_cui_extensions

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install core and test tooling
        run: python -m pip install -e ".[dev]"

      - name: Install ${{ matrix.extra }} ${{ matrix.band }} dependency set
        run: python -m pip install ${{ matrix.requirements }}

      - name: Record resolved dependency set
        run: python -m pip freeze | tee optional-${{ matrix.extra }}-${{ matrix.band }}.txt

      - name: Run focused ${{ matrix.extra }} smoke tests
        run: python -m unittest ${{ matrix.tests }}

      - name: Upload resolved dependency evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: optional-${{ matrix.extra }}-${{ matrix.band }}
          path: optional-${{ matrix.extra }}-${{ matrix.band }}.txt

  release-document-validation:
    name: Validate release documentation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate internal links and safe CLI help examples
        run: python scripts/validate_release_docs.py --output docs/en/release-doc-validation.json

      - name: Upload documentation validation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-document-validation
          path: docs/en/release-doc-validation.json

  release-gate:
    name: Required release policy and clean wheel
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run traceability update gate
        if: github.event_name == 'pull_request'
        env:
          LIFETXT_TRACEABILITY_GATE_BASE: ${{ github.event.pull_request.base.sha }}
          LIFETXT_TRACEABILITY_GATE_PR_URL: https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}
        run: python -m unittest tests.test_traceability_gate

      - name: Run isolated release profile
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_ci_like.py --profile release --python python3.12 2>&1 | tee release-gate.log

      - name: Upload release policy evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-policy-evidence
          if-no-files-found: warn
          path: |
            release-gate.log
            .cache/release-policy-manifest.json

  ci-visibility:
    name: Keep main-branch CI failures visible
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [test, no-web-extras, release-gate]
    runs-on: ubuntu-latest
    env:
      TEST_RESULT: ${{ needs.test.result }}
      NO_WEB_RESULT: ${{ needs['no-web-extras'].result }}
      RELEASE_RESULT: ${{ needs['release-gate'].result }}
    steps:
      - name: Open, update, or close the CI failure issue
        uses: actions/github-script@v8
        with:
          script: |
            const title = "CI failure on main";
            const failed = process.env.TEST_RESULT !== "success" || process.env.NO_WEB_RESULT !== "success" || process.env.RELEASE_RESULT !== "success";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (failed) {
              const body = [
                "The latest CI run on `main` failed.",
                "",
                `- Matrix result: \`${process.env.TEST_RESULT}\``,
                `- No-Web result: \`${process.env.NO_WEB_RESULT}\``,
                `- Release gate result: \`${process.env.RELEASE_RESULT}\``,
                `- Run: ${runUrl}`,
                "",
                "This issue is maintained automatically and closes after the next successful main-branch run.",
              ].join("\n");
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `CI recovered successfully: ${runUrl}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
            }
