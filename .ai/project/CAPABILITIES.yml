    notes: >-
      Landed on its own child branch (issue-596-generic-custom-fields)
      merged into feature/adoption-cli-commands, same workflow as
      cap-capture-presets/cap-tui-key-bindings. `lifetxt/ticket_custom_fields.py`
      (`ticketing.custom_fields`) already had a complete, ticket-scoped
      typed-value implementation with no config parameter threaded into
      `validator.validate_item`; investigation confirmed
      `ticketing.custom_fields` itself never suppressed the generic W106
      warning either, since `validate_ticket_custom_fields` is wired only
      into ticket revision-write paths, not the read/check path -- a
      pre-existing gap this capability does not attempt to fix for the
      ticket registry, per its own forbidden-scope boundary
      ("`lifetxt/ticket_custom_fields.py` only for extracting/reusing
      protocol-neutral primitive helpers while preserving public
      behavior"). Rather than monkey-patching `validator.validate_item`
      globally with a ContextVar-threaded config (the shape
      `lifetxt/timezone_policy.py`'s `timezone_context()` and
      `lifetxt/safety_compat_v2.py`'s `_QUICK_KNOWN_IDS` establish for
      config-derived behavior needed deep inside generic code paths across
      every surface), this capability integrates at the one seam the
      issue's own scope contract names -- `lifetxt/cli.py`'s
      `_parse_life_inputs`, the `check` command's existing post-`parse_text()`
      extra-diagnostics point, already used unconditionally for
      `duplicate_id_diagnostics`/`reference_diagnostics`/
      `_completed_parent_diagnostics` -- rather than a new cross-surface
      contextvar rollout touching `runtime_safety_v2.py`/`webapp.py`/
      `mcp.py`/`tui_app.py`, none of which the issue's own write-scope
      contract named. `generic_custom_field_diagnostics()` reuses
      `safety_compat_v2.py`'s established W106-message-regex-matching
      technique (`_w106_key()`) to remove exactly the diagnostic a
      declared, applicable field's own key produced, rather than
      reconstructing `validate_item`'s internal logic. Query/Saved-View/
      MCP integration required no change beyond `query.py`/`saved_views.py`
      themselves: `run_query`/`_tool_run_query`/MCP/CLI/`command_query`
      already thread `config` through to `parse_query`, so making
      `parse_query`/`query_fields` accept an optional `config` parameter
      was sufficient for every consumer to gain `filterable:true` field
      recognition automatically, with zero change to `webapp.py`,
      `mcp.py`, or `tui_app.py`. Web UI rendering of `custom_fields`-driven
      values (a custom form widget/editor) is explicitly out of scope per
      the issue's own non-goals and is not attempted here.
