    - requirement_id: req-extended-cli-workspace-resolution
      capability_id: cap-workspace-resolution-safety
      epic: P1 Configuration and Workspace Foundation
      task_issue: https://github.com/Eruhitsuji/lifetxt/issues/176
      pull_request: https://github.com/Eruhitsuji/lifetxt/pull/177
      changed_files_or_scope:
        - Make compatibility-preserving extended CLI commands resolve the configured default workspace before falling back to the literal life.txt default
        - Carry global --workspace / --workspace= through lifetxt.entrypoint into lifetxt.extra_cli
        - Preserve explicit positional paths as command-level overrides and preserve legacy top-level paths/write_file behavior
        - lifetxt/entrypoint.py
        - lifetxt/extra_cli.py
        - lifetxt/extra_common.py
        - tests/test_extended_workspace_resolution.py
        - todo.md
      tests_or_evidence:
        - tests/test_extended_workspace_resolution.py covers config-relative default workspace resolution from an unrelated cwd, explicit workspace selection in both flag forms, explicit-path override, and legacy top-level config preservation
        - python -m unittest tests.test_extended_workspace_resolution
        - python -m unittest tests.test_extra_cli tests.test_extended_workspace_resolution
        - python -m lifetxt check examples/minimal_life.txt
        - ruff format --check lifetxt tests scripts
        - ruff check lifetxt tests scripts
        - GitHub Actions required CI on PR #177
        - 'real deployment reproduction before the fix: lifetxt --config /srv/lifetxt/.lifetxt.json next failed with Errno 2 for cwd-relative life.txt, while passing the workspace-resolved absolute source paths explicitly succeeded'
      release_or_deployment: >-
        Behaviour fix: extended commands such as `lifetxt next` now use named
        workspace sources when no explicit positional input paths are supplied.
      notes: >-
        Found during a real Ubuntu deployment migration from top-level paths/write_file
        to a named `personal` workspace. The extended compatibility dispatcher bypassed
        the ordinary CLI's workspace runtime injection, so `_resolved_input_paths()`
        silently reached its historical literal `life.txt` fallback. The fix is shared
        in the extended CLI config-loading path rather than special-casing `next`, carries
        explicit `--workspace` selection through the entrypoint, keeps explicit command
        paths highest priority, and leaves non-workspace legacy configurations unchanged.
        The roadmap follow-up consolidates global invocation-context resolution so the two
        dispatch paths cannot drift again.
      status: implemented

