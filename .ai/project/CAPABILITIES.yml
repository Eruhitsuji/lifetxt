      - req-stable-release-artifact-evidence
      - req-stable-dependency-security-audit
      - req-stable-release-doc-parity
      - req-stable-release-security-review
    implementation_locations:
      - .ai/project/STABLE_RELEASE.yml
      - .ai/project/RULES.md
      - .ai/project/CAPABILITIES.yml
      - .ai/project/TRACEABILITY.yml
    public_interfaces:
      - .ai/project/STABLE_RELEASE.yml
      - .ai/project/RULES.md
    tests_or_evidence:
      - YAML parse of .ai/project/STABLE_RELEASE.yml, .ai/project/CAPABILITIES.yml, and .ai/project/TRACEABILITY.yml
      - python -m lifetxt check examples/minimal_life.txt
      - '#284 acceptance-criteria mapping reviewed in the pull request'
      - '#285 support matrix classifies runtime, OS, CLI, TUI, Web, browser, MCP, Remote, fzf/peco, SMTP, and filesystem entries'
      - '#286 release gates separately define RC entry and stable promotion criteria'
      - '#287 roadmap classification maps current P0 and Format 1.0 compatibility work to release severity and child issues'
      - '#293 delegated mutation inventory classifies stable writable, experimental, read-only/disabled, and deferred adapter surfaces'
      - '#341 traceability gate rejects unapproved existing requirement-to-capability remaps while allowing new chains and declared remaps'
      - '#356 compatibility policy defines stable versioning, public contract coverage, deprecation, and unsafe-compatibility exceptions'
      - '#359 installed Remote read smoke evidence covers authz, pagination, revision consistency, and restart diagnostics'
      - '#360 clean installed artifact MCP smoke covers read resources, JSON-RPC errors, and write-surface rejection'
      - '#349 optional Web/TUI ranges are documented and protected by metadata tests'
      - '#352 release artifacts have checksum, SBOM, and provenance evidence from one build'
      - '#351 direct stable dependencies have point-in-time license and vulnerability evidence with scanner limitations'
      - '#354 release-critical English and Japanese documentation has a recorded semantic-parity audit'
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/283
      - https://github.com/Eruhitsuji/lifetxt/issues/284
      - https://github.com/Eruhitsuji/lifetxt/issues/285
      - https://github.com/Eruhitsuji/lifetxt/issues/286
      - https://github.com/Eruhitsuji/lifetxt/issues/287
      - https://github.com/Eruhitsuji/lifetxt/issues/293
      - https://github.com/Eruhitsuji/lifetxt/issues/341
      - https://github.com/Eruhitsuji/lifetxt/issues/356
      - https://github.com/Eruhitsuji/lifetxt/issues/359
      - https://github.com/Eruhitsuji/lifetxt/issues/360
      - https://github.com/Eruhitsuji/lifetxt/issues/349
      - https://github.com/Eruhitsuji/lifetxt/issues/352
      - https://github.com/Eruhitsuji/lifetxt/issues/351
      - https://github.com/Eruhitsuji/lifetxt/issues/354
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/332
      - https://github.com/Eruhitsuji/lifetxt/pull/333
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      This capability deliberately extends existing project governance instead
      of creating a second task-status source of truth. GitHub Issues and
      status:* labels remain authoritative for actionable work. Later Phase 0
      issues (#285, #286, #287) should reuse this boundary rather than
      redefining feature-freeze rules.
      #285 extends the same policy file with a support matrix that distinguishes
      stable support, experimental surfaces, deferred filesystem classes, and
      the minimum evidence required before release documentation can advertise a
      surface as stable.
      #286 adds the RC entry and stable promotion gates, including failed,
      flaky, and stale required-check handling plus known-issue severity classes.
      #287 classifies the current P0 roadmap and public-compatibility Format
      1.0 work against the stable-release boundary without turning todo.md into
      a task-status source.
      #293 freezes the delegated and externally mediated writable release scope:
      the CLI proposal contract and existing editor-session contract are the
      only stable-writable entries, while MCP write tools, Remote ticket writes,
      Web writes, Web git routes, provider side effects, and future plugin
      adapters remain experimental or deferred until their linked verification
      issues close. #341 extends this governance capability with an offline
      guard against silent requirement-to-capability mapping drift. #356 adds
      the first explicit stable compatibility promise, including versioning,
      deprecation, migration, and experimental/deferred boundaries.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

