name: Issue 427 closeout

on:
  push:
    branches:
      - agent/issue-427-closeout-425
    paths:
      - .github/workflows/issue-427-closeout.yml

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/issue-427-closeout-425
          fetch-depth: 0
      - name: Apply closeout metadata
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          change_path = Path('.ai/project/changes/issue-425-external-verification-automation/change.yml')
          change = change_path.read_text(encoding='utf-8')
          old_status = '  status: in_review\n'
          if old_status not in change:
              raise SystemExit('expected in_review status not found')
          change_path.write_text(change.replace(old_status, '  status: implemented\n', 1), encoding='utf-8')

          encoded = ''
          verification_path = Path('.ai/project/changes/issue-425-external-verification-automation/verification.yml')
          verification_path.write_bytes(base64.b64decode(encoded))

          todo_path = Path('todo.md')
          todo = todo_path.read_text(encoding='utf-8')
          old_header = 'Last updated: 2026-08-13 (updated x131)'
          new_header = 'Last updated: 2026-08-13 (updated x132)'
          if old_header not in todo:
              raise SystemExit('expected todo.md update header not found')
          todo_path.write_text(todo.replace(old_header, new_header, 1), encoding='utf-8')

          Path('.github/workflows/issue-427-closeout.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ai/project/changes/issue-425-external-verification-automation/change.yml \
            .ai/project/changes/issue-425-external-verification-automation/verification.yml \
            todo.md .github/workflows/issue-427-closeout.yml
          git diff --cached --check
          git commit -m "Close out issue 425 verification record (#427)"
          git push origin HEAD:agent/issue-427-closeout-425
