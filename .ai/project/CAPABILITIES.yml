      - dist/schemas/archive-plan-v1.schema.json
      - tests/test_archive_plan_v1.py
      - docs/en/projects.md
      - docs/ja/projects.md
      - .ai/project/changes/project-archive-plan-v1/
    public_interfaces:
      - lifetxt project archive --dry-run --emit-plan PATH
      - lifetxt project archive --apply-plan PLAN [--yes]
      - lifetxt.archive_plan_v1.build_plan
      - lifetxt.archive_plan_v1.write_plan
      - lifetxt.archive_plan_v1.load_plan
