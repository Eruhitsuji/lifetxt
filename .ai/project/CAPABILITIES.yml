      - tests/test_fault_matrix_v6.py tests/test_fault_drill_v5.py -> Ran 5 tests, OK
      - '#300 extends simulated subprocess crash-boundary matrix through delete, verification, compensation write/verify, terminal cleanup, backup copy, and restore-working-copy points'
