release_evidence:
  migration_notes: >-
    Existing deployments opt in by adding the Polkit rule path, applying the
    reviewed server-init plan, and replacing the Remote runner's sudo argv with
    systemctl --no-ask-password.
  rollback_plan: >-
    Revert the change or remove the generated Polkit rule and disable the Remote
    backup-run capability. Scheduled lifetxt-backup.timer operation is unaffected.
