name: Export truncated PR13 repair part

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/repair-pr13-implementation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-pr13-implementation
      - uses: actions/upload-artifact@v4
        with:
          name: repair-part-04a0
          path: .github/repair-patch/part-04a0
          if-no-files-found: error
