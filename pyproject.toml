[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "lifetxt"
version = "0.1.0"
description = "Parser, validator, converter, CLI, and optional web UI for life.txt."
readme = "readme.md"
requires-python = ">=3.6"
license = { file = "LICENSE" }
authors = [
  { name = "lifetxt contributors" }
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Scheduling",
  "Topic :: Text Processing"
]

[project.scripts]
lifetxt = "lifetxt.entrypoint:main"

[project.optional-dependencies]
web = [
  "fastapi",
  "uvicorn[standard]"
]
tui = [
  "textual>=0.1.0",
  "watchdog>=2.0.0"
]

[tool.setuptools]
packages = ["lifetxt"]
