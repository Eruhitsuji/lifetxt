name: Apply agent implementation

on:
  push:
    branches:
      - agent/p0-transaction-recovery

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Add durable transaction recovery and strict timers') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply implementation patch
        run: |
          cat .github/agent-patch/part-* | base64 -d | gzip -d > /tmp/lifetxt.patch
          git apply --index /tmp/lifetxt.patch
          rm -rf .github/agent-patch
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add durable transaction recovery and strict timers"
          git push origin HEAD:agent/p0-transaction-recovery
