      agreeing on what counts as an actionable next step: open/in-progress
      status, kind coverage (Task/Deferred/Recurring/Habit), no someday/maybe/
      waiting tag, and not blocked by an unfinished or unresolvable `depends_on`
      reference, resolved across every file in scope.
