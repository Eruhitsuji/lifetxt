name: Inspect staged P0 x105 chunks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/p0-format-contract-batch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-format-contract-batch
      - name: Record chunk metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'sha256:'
            sha256sum .github/agent-patch/part-*
            echo 'bytes:'
            wc -c .github/agent-patch/part-*
            echo 'joined:'
            cat .github/agent-patch/part-* > /tmp/joined.b64
            wc -c /tmp/joined.b64
            sha256sum /tmp/joined.b64
          } > /tmp/p0-chunk-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: p0-x105-chunk-metadata
          path: /tmp/p0-chunk-metadata.txt
          if-no-files-found: error
