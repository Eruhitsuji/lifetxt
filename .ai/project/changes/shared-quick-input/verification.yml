      result: Ran 89 tests -- OK
      status: passed
    - type: final-full-regression
      command: MPLBACKEND=Agg python -m unittest discover
      requirement_ids: [req-shared-quick-input-resolution]
      result: Ran 4962 tests in 337.441s -- OK (46 optional/environment skips); commit c766570c712c3b1230d27ab5c9fd03472d338414; Python 3.12.14, Bash; BashCompletionExecutionTests ran; working tree unchanged throughout the run.
