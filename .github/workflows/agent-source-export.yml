name: Apply verified P0 remote safety implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/p0-remote-safety-batch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/p0-remote-safety-batch
          fetch-depth: 0
      - name: Verify and apply implementation patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/parts.sha256 <<'EOF'
          ff40a1900965cf95ed8e96a6f5bab663b43d9ecf484714654d2c3766438f0262  .github/agent-patch/part-00
          96d8e78d3178853ef6b487e09a411da152eb9a25e2e51e5f9c666d1cc95b76ea  .github/agent-patch/part-01
          0550fff95e734f9dae68153eb0d907b68cddba9ea00c7b7d1322bbb68a91b937  .github/agent-patch/part-02
          2a6df08e222e1393f365e55e34f6242550f5601a8a34e2157ca75eafb74ebd41  .github/agent-patch/part-03
          92633476367e3978f38917aea1d11bf106f187cde20bfb0b524b8c1f8583e334  .github/agent-patch/part-04
          c5dc3c78e0078eb7da0012ca160055fe84dacb607603ab841b9ba8b13af493c6  .github/agent-patch/part-05
          c2e495f3d0943056c150700162027f43cea344ea66ee959abd6f6eb48a5a369e  .github/agent-patch/part-06
          fdf3e0d6478ed724da973f7a0789afee3ba6e844d0ef0bb5cd57492f7823cfd7  .github/agent-patch/part-07
          EOF
          sha256sum --check /tmp/parts.sha256
          for part in 00 01 02 03 04 05 06; do
            test "$(wc -c < ".github/agent-patch/part-${part}")" -eq 7000
          done
          test "$(wc -c < .github/agent-patch/part-07)" -eq 3848
          cat .github/agent-patch/part-* > /tmp/pr22.patch.gz.b64
          echo 'c12464d45d409bf4e0fa8f2663a1e123fc3e02631220ca5ac099b82b93c5e117  /tmp/pr22.patch.gz.b64' | sha256sum --check
          base64 -d /tmp/pr22.patch.gz.b64 > /tmp/pr22.patch.gz
          echo 'a18b4cc76113617c67a3a004eaf3c0328dedfbf554874f3339ecfe3ce3cb14f1  /tmp/pr22.patch.gz' | sha256sum --check
          gzip -t /tmp/pr22.patch.gz
          gzip -dc /tmp/pr22.patch.gz > /tmp/pr22.patch
          echo 'a95e0959623f7fb171f58503661197297f60e35d1e1c8c15bbd3e4a785b74191  /tmp/pr22.patch' | sha256sum --check
          git apply --check /tmp/pr22.patch
          git apply --index --whitespace=fix /tmp/pr22.patch
          rm -rf .github/agent-patch
          rm -f .github/agent-probe*.txt .github/agent-note.md .github/agent-trigger.txt
          rm -f .github/workflows/agent-source-export.yml
          git add -A
          git diff --cached --check
      - name: Commit and push implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add delegated remote attachment and recovery contracts'
          git push origin HEAD:agent/p0-remote-safety-batch
