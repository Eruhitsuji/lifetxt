name: Extract corrected typed ticket custom fields

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ticket-typed-custom-fields'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ticket-typed-custom-fields
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and verify implementation
        run: |
          python - <<'PY'
          import base64, io, pathlib, shutil, tarfile
          chunks = sorted(pathlib.Path('.agent_payload').glob('part-*.txt'))
          if len(chunks) != 6:
              raise SystemExit('expected six payload chunks, found %d' % len(chunks))
          payload = ''.join(path.read_text(encoding='ascii') for path in chunks)
          data = base64.b64decode(payload, validate=True)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              archive.extractall('.')
          shutil.rmtree('.agent_payload')
          for name in ('agent-ticket-custom-fields-error.log', 'agent-payload-report.json'):
              path = pathlib.Path(name)
              if path.exists():
                  path.unlink()
          pathlib.Path('.github/workflows/agent-ticket-custom-fields-extract.yml').unlink()
          PY
          python -m compileall -q lifetxt tests
          python -m unittest tests.test_ticket_custom_fields
      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add typed ticket custom fields'
          git push origin HEAD:agent/ticket-typed-custom-fields
