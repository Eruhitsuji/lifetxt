name: Patch Remote client roadmap

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/remote-cli-tui-permissions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Patch todo.md
        shell: python
        run: |
          from pathlib import Path

          path = Path('todo.md')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('Last updated: 2026-07-26 (updated x123)', 'Last updated: 2026-07-27 (updated x124)'),
              (
                  'and add the first authoritative Remote ticket mutation contract for protocol v2 with explicit opt-in, authenticated write scope, project/visibility filtering, exact aggregate revision admission, per-file CAS, stable transaction IDs, replay-safe request hashing, append-only created/field-change/transition/comment/time events, Remote clock/CSRF enforcement, conservative field allow-listing, and one additional response schema, raising the generated/public Draft 2020-12 bundle to 76 documents.',
                  'and add the first authoritative Remote ticket mutation contract for protocol v2 with explicit opt-in, authenticated write scope, project/visibility filtering, exact aggregate revision admission, per-file CAS, stable transaction IDs, replay-safe request hashing, append-only created/field-change/transition/comment/time events, Remote clock/CSRF enforcement, conservative field allow-listing, and one additional response schema, raising the generated/public Draft 2020-12 bundle to 76 documents; and add permission-aware dependency-free Remote clients that inspect effective role/scope/capability state, perform capability-gated ticket create/edit/transition/comment/time mutations with fresh aggregate revisions, stable transaction IDs, and dry runs, and provide an explicitly confirmed interactive TUI that remains read-only without server-granted write permission.'
              ),
              (
                  '10. Harden the implemented Remote Safe Mode v2: complete the shared local/remote read-backend adoption, capability/version compatibility matrix, durable session/audit deployment policy, bounded pagination/cache contracts, and real browser/TLS/reverse-proxy/multi-worker evidence.',
                  '10. Harden the implemented Remote Safe Mode v2 and permission-aware clients: complete shared local/remote read-backend adoption for every CLI and TUI query, add bounded pagination and cache freshness contracts, preserve capability/version refusal across older and newer clients, define durable browser-session and audit deployment policy, and collect real browser, TLS, reverse-proxy, disconnect, restart, and multi-worker evidence. The dependency-free client already provides profile management, permission inspection, filtered resource reads, diagnostics, snapshot export, ticket mutation commands, and an explicitly confirmed interactive TUI; do not rebuild those completed surfaces.'
              ),
              (
                  '11. Harden and expand the implemented single-source Remote ticket write adapter: prove real-client one-winner/replay behavior, enforce private custom-field visibility/edit roles, then add version/sprint planning, relation/watcher/attachment side effects, all-or-none bulk operations, and journal-backed multi-file writes only where capability entries report complete exact revision, authenticated permission, privacy/redaction, event-history, clock, idempotency, recovery, and provider-side-effect enforcement.',
                  '11. Harden and expand the implemented single-source Remote ticket write adapter after the permission-aware CLI/TUI client foundation: prove real-client one-winner, stale-revision refusal, lost-response replay, timeout, disconnect, and server-restart behavior; add ticket detail refresh and conflict presentation without automatic overwrite; enforce visible/editable roles for private typed custom fields; then add version and sprint planning, relations, watcher delivery, attachment metadata/content, timer side effects, and all-or-none bulk operations. Route every cross-file or side-store mutation through the implemented journal and revision-set contracts, publish exact operation and limitation metadata through capabilities, and require authenticated permission, project/group/visibility filtering, privacy/redaction, append-only event history, clock admission, stable idempotency, deterministic recovery, and provider-side-effect compensation before exposing each operation to CLI, TUI, Web, or MCP.'
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit('roadmap anchor not found: ' + old[:80])
              text = text.replace(old, new, 1)

          completed = [
              '- [x] Implement a deny-by-default authenticated Remote Safe Mode foundation with bearer and trusted-proxy authentication, owner/editor/reader/auditor roles, explicit scopes, project and visibility grants, HTTPS enforcement, exact-revision write preconditions, request IDs, rate limiting, local-path redaction, bounded JSONL audit events, authenticated capabilities/session/snapshot/ticket/project routes, dependency-free named client profiles, connection tests, export, and a read-only remote TUI.\n',
              '- [x] Add an explicitly enabled protocol-v2 Remote ticket mutation adapter for `create`, conservative `edit`, workflow-aware `transition`, `comment`, and `log_time`. Bind every authored event/time entry to the authenticated principal; require `write` scope, project/visibility access, exact aggregate `If-Match`, per-file SHA-256 CAS, a caller-stable transaction ID, append-only history, server clock-skew enforcement, and browser Origin/CSRF checks; reject tickets outside the configured writable source; store the normalized request hash in the event; return an idempotent replay for an identical committed retry; refuse transaction-ID reuse for a different request; publish the effective operation and limitation set through protocol-v2 capability discovery; keep the adapter disabled unless `remote.ticket_writes_enabled: true`; and publish/validate `remote-ticket-mutation-v1.schema.json` plus English/Japanese usage documentation.\n',
          ]
          for row in completed:
              if row not in text:
                  raise SystemExit('completed roadmap item not found')
              text = text.replace(row, '', 1)

          heading = '## P1: Remote Safe Mode follow-up\n\n'
          detail = '''- [ ] Replace the compact interactive Remote prompt with a shared ticket detail controller that can refresh one ticket, show the current aggregate revision and effective editable fields, preserve the server-returned event timeline, and return to the filtered list without losing context. Keep the dependency-free line-oriented mode as the compatibility baseline; optional richer terminal rendering must consume the same controller and operation contracts.
- [ ] Add explicit conflict recovery UX for CLI and TUI. On `REVISION_CONFLICT`, fetch and display the new aggregate revision plus a bounded field-level comparison, never retry automatically, and require the operator to choose refresh, abandon, or construct a new mutation with a new transaction ID. Preserve identical-request replay only when the caller intentionally reuses the original stable transaction ID after a lost response.
- [ ] Extend permission inspection with per-operation denial reasons, effective project/group/visibility constraints, server read-only state, ticket-write configuration state, protocol/capability revision, and custom-field visible/editable-role summaries. Redact token values and private field definitions that the authenticated principal cannot discover.
- [ ] Add Remote ticket create/edit completion and validation driven by server capabilities and typed registries. Reject unsupported fields locally for usability while treating server validation as authoritative. Support repeatable values, explicit unset semantics, date/datetime/duration normalization, and tracker/project applicability without permitting arbitrary raw life.txt replacement.
- [ ] Add permission-aware Remote views for ticket detail, history, time entries, versions, sprints, dependencies, watchers, and attachments before adding their mutation commands. Every view must use the same principal filtering and aggregate revision as the resource backend and must expose truncation, pagination, and freshness metadata.
- [ ] Add real integration fixtures using the packaged CLI against an HTTPS Remote server for owner, editor, reader, and auditor principals. Cover allowed and denied projects/visibilities, disabled writes, server read-only mode, stale revisions, concurrent writers, identical replay, conflicting transaction-ID reuse, clock skew, proxy identity, TLS verification failure, timeout, partial response, disconnect, server restart, and older/newer protocol combinations.
- [ ] Add real terminal evidence for the interactive TUI in Windows Terminal, WSL without VS Code Remote mode, macOS Terminal, Linux terminals, narrow widths, redirected stdin/stdout, non-UTF-8 locale failure, Ctrl-C at every prompt, and inaccessible profile/token environment variables. Document exact fallback behavior and keep non-interactive commands scriptable with stable JSON output and exit codes.
- [ ] Define credential and profile administration beyond environment-variable token lookup: token rotation diagnostics, missing/empty token refusal, optional OS credential-store adapters behind explicit dependencies, profile import/export with secrets excluded, profile file permission checks, and migration/refusal tests for future profile versions. Never persist Bearer secrets in life.txt, configuration, logs, command history, audit details, or exported profiles.
- [ ] Add audit correlation to client output by retaining request IDs, transaction IDs, negotiated protocol, capability revision, and server audit references without exposing sensitive audit detail. Provide a bounded diagnostic bundle suitable for incident handoff while preserving server-side redaction and path privacy.
'''
          if heading not in text:
              raise SystemExit('Remote P1 heading not found')
          text = text.replace(heading, heading + detail, 1)
          path.write_text(text, encoding='utf-8')
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/agent-patch-remote-client-roadmap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add todo.md
          git commit -m 'Update Remote client roadmap'
          git push origin HEAD:${{ github.head_ref }}
