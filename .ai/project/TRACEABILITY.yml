      release_or_deployment: null
      status: implemented

required_chain:
  - Requirement
  - Capability
  - Epic
  - Task
  - Pull Request
  - Test/Evidence
  - Release

gap_policy:
  missing_link_action: create_follow_up_issue_or_approved_exception
