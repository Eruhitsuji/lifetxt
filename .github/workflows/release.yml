name: Release
run-name: Release preflight artifact ${{ inputs.preflight_artifact_id }}
on:
  workflow_dispatch:
    inputs:
      preflight_artifact_id:
        description: "Completed preflight-verified artifact ID (not a run ID)"
        required: true
        type: string
      bundle_digest:
        description: "preflight-bundle.json digest, 64 lowercase hex"
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: lifetxt-release-authority
  cancel-in-progress: false
jobs:
  prepare:
    name: Prepare reviewable immutable release plan
    if: github.ref == 'refs/heads/main' && github.repository == 'Eruhitsuji/lifetxt'
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Authenticate all preflight bytes and present approval plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.preflight_artifact_id }}
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
        run: >-
          python controller/scripts/release_orchestrate.py prepare
          --controller controller --root prepared
          --artifact-id "$ARTIFACT_ID" --bundle-digest "$BUNDLE_DIGEST"
      - name: Check out exact source for strict release policy
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.plan.outputs.source_sha }}
          path: policy-source
          persist-credentials: false
      - name: Install strict policy validator
        run: python -m pip install 'jsonschema>=4'
      - name: Preserve strict release policy before human approval
        working-directory: policy-source
        run: |
          python scripts/check_release_policy.py --root . --pretty \
            --output ../prepared/release-policy-manifest.json \
            examples/minimal_life.txt examples/status_presence.txt examples/messages_life.txt
          python -m lifetxt safety release-gate --root . \
            examples/minimal_life.txt examples/status_presence.txt examples/messages_life.txt
      - uses: actions/upload-artifact@v6
        with:
          name: release-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            prepared/release-plan.json
            prepared/release-policy-manifest.json
            prepared/public/release-inventory.json
            prepared/public/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish-pypi:
    name: Approve and publish immutable primary
    needs: prepare
    runs-on: ubuntu-24.04
    # Keep the existing PyPI Trusted Publisher workflow/environment identity.
    # Configure required reviewer Eruhitsuji. API approval history is also
    # checked: auto-created/unprotected environments cannot authorize writes.
    environment:
      name: pypi
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v6
        with:
          name: release-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: approved-plan
      - name: Reauthenticate after approval and require the identical plan
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.preflight_artifact_id }}
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
        run: >-
          python controller/scripts/release_orchestrate.py prepare
          --controller controller --root release-work
          --artifact-id "$ARTIFACT_ID" --bundle-digest "$BUNDLE_DIGEST"
          --expected-plan approved-plan/release-plan.json
      - name: Install OCI transport without rebuilding
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Approve exact plan and publish missing immutable primary bytes
        id: primary
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CRITICAL_BLOCKER: ${{ vars.RELEASE_CRITICAL_BLOCKER }}
        run: python controller/scripts/release_orchestrate.py start --controller controller --root release-work
      - name: Publish package distributions to PyPI
        id: pypi
        if: steps.primary.outputs.pypi_pending == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi
          skip-existing: false
      - name: Finalize single canonical checksum
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CRITICAL_BLOCKER: ${{ vars.RELEASE_CRITICAL_BLOCKER }}
        run: >-
          python controller/scripts/release_orchestrate.py finalize
          --controller controller --root release-work
      - name: Record external action failures
        if: failure()
        env:
          RELEASE_STEPS_JSON: ${{ toJSON(steps) }}
        run: python controller/scripts/release_orchestrate.py failure --controller controller --root release-work
      - name: Retain channel receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-primary-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-work/release-plan.json
            release-work/release-receipt.json
            release-work/release-failure.json
          if-no-files-found: warn
          retention-days: 90

  verify:
    name: Verify public bytes with read-only token
    needs: [prepare, publish-pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v6
        with:
          name: release-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: approved-plan
      - name: Reauthenticate the approved immutable plan and current expiry
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.preflight_artifact_id }}
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
        run: >-
          python controller/scripts/release_orchestrate.py prepare
          --controller controller --root release-work
          --artifact-id "$ARTIFACT_ID" --bundle-digest "$BUNDLE_DIGEST"
          --expected-plan approved-plan/release-plan.json
      - name: Check out immutable source for remote native conformance
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Independently verify public downloads and native CLI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CRITICAL_BLOCKER: ${{ vars.RELEASE_CRITICAL_BLOCKER }}
        run: >-
          python controller/scripts/release_orchestrate.py verify
          --controller controller --root release-work --source source
      - name: Record external action failures
        if: failure()
        env:
          RELEASE_STEPS_JSON: ${{ toJSON(steps) }}
        run: python controller/scripts/release_orchestrate.py failure --controller controller --root release-work
      - name: Retain channel receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-verification-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-work/release-plan.json
            release-work/release-receipt.json
            release-work/release-failure.json
          if-no-files-found: warn
          retention-days: 90

  finish:
    name: Verified downstream and Latest
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          path: controller
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v6
        with:
          name: release-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: approved-plan
      - name: Reauthenticate the approved immutable plan and current expiry
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ inputs.preflight_artifact_id }}
          BUNDLE_DIGEST: ${{ inputs.bundle_digest }}
        run: >-
          python controller/scripts/release_orchestrate.py prepare
          --controller controller --root release-work
          --artifact-id "$ARTIFACT_ID" --bundle-digest "$BUNDLE_DIGEST"
          --expected-plan approved-plan/release-plan.json
      - name: Download successful read-only verification receipt
        uses: actions/download-artifact@v6
        with:
          name: release-verification-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: verified-state
      - name: Stage same-plan primary receipt
        run: cp verified-state/release-receipt.json release-work/release-receipt.json
      - name: Generate winget Scoop conda and verify Homebrew update
        id: downstream
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          RELEASE_CRITICAL_BLOCKER: ${{ vars.RELEASE_CRITICAL_BLOCKER }}
        run: python controller/scripts/release_orchestrate.py downstream --controller controller --root release-work
      - name: Install OCI transport for alias promotion
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Promote verified aliases and GitHub Latest
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CRITICAL_BLOCKER: ${{ vars.RELEASE_CRITICAL_BLOCKER }}
        run: python controller/scripts/release_orchestrate.py promote --controller controller --root release-work
      - name: Record external action failures
        if: failure()
        env:
          RELEASE_STEPS_JSON: ${{ toJSON(steps) }}
        run: python controller/scripts/release_orchestrate.py failure --controller controller --root release-work
      - name: Retain channel receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-work/release-plan.json
            release-work/release-receipt.json
            release-work/release-failure.json
            release-work/generated/
          if-no-files-found: warn
          retention-days: 90
