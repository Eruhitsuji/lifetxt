# Dedicated public-site pipeline (#1352). Never publishes on PR or push.
# Pinned actions: checkout v5, setup-python v6, upload-pages-artifact v3, deploy-pages v4.
name: Official website Pages
'on':
  pull_request:
    paths:
    - website/**
    - assets/brand/**
    - scripts/build_website.py
    - scripts/check_website.py
    - tests/test_website*.py
    - .github/workflows/website-pages.yml
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: website-pages-${{ github.event_name }}-${{ github.event.pull_request.number
    || github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
    - name: Verify human deployment protection
      if: github.event_name == 'workflow_dispatch'
      shell: bash
      run: |
        python - <<'PY'
        import json
        import os
        from urllib.request import Request, urlopen

        if (os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch"
            or os.environ.get("GITHUB_REF") != "refs/heads/main"
            or os.environ.get("GITHUB_REPOSITORY") != "Eruhitsuji/lifetxt"):
            raise SystemExit("Deployment is restricted to a manual run on the official main branch")
        request = Request(
            "https://api.github.com/repos/Eruhitsuji/lifetxt/environments/github-pages",
            headers={"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"},
        )
        try:
            with urlopen(request, timeout=15) as response:
                body = response.read(1_000_001)
            if len(body) > 1_000_000:
                raise ValueError("environment response too large")
            environment = json.loads(body)
            rules = environment.get("protection_rules", [])
            reviews = [rule for rule in rules if rule.get("type") == "required_reviewers"]
            reviewers = [entry for rule in reviews for entry in rule.get("reviewers", [])]
            approved_gate = bool(reviewers) and all(
                entry.get("type") == "User"
                and entry.get("reviewer", {}).get("type") == "User"
                and entry.get("reviewer", {}).get("login") == "Eruhitsuji"
                for entry in reviewers
            )
        except Exception as error:
            raise SystemExit("Cannot verify github-pages human approval protection; configure it before retrying") from error
        if environment.get("name") != "github-pages" or not approved_gate:
            raise SystemExit("github-pages must require Eruhitsuji human approval; publication refused")
        print("Verified github-pages has the required human reviewer; no settings changed")
        PY
    - name: Build public website only
      run: python scripts/build_website.py --output .cache/pages
    - name: Check links, metadata, assets and sample
      run: |-
        python scripts/check_website.py .cache/pages
        python -m lifetxt check website/example.txt
        python -m unittest tests.test_website
    - name: Upload approved-main build
      if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        && github.repository == 'Eruhitsuji/lifetxt'
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
      with:
        path: .cache/pages
        retention-days: 1
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
      && github.repository == 'Eruhitsuji/lifetxt'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Recheck human deployment protection
      shell: bash
      run: |
        python - <<'PY'
        import json
        import os
        from urllib.request import Request, urlopen

        if (os.environ.get("GITHUB_EVENT_NAME") != "workflow_dispatch"
            or os.environ.get("GITHUB_REF") != "refs/heads/main"
            or os.environ.get("GITHUB_REPOSITORY") != "Eruhitsuji/lifetxt"):
            raise SystemExit("Deployment is restricted to a manual run on the official main branch")
        request = Request(
            "https://api.github.com/repos/Eruhitsuji/lifetxt/environments/github-pages",
            headers={"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"},
        )
        try:
            with urlopen(request, timeout=15) as response:
                body = response.read(1_000_001)
            if len(body) > 1_000_000:
                raise ValueError("environment response too large")
            environment = json.loads(body)
            rules = environment.get("protection_rules", [])
            reviews = [rule for rule in rules if rule.get("type") == "required_reviewers"]
            reviewers = [entry for rule in reviews for entry in rule.get("reviewers", [])]
            approved_gate = bool(reviewers) and all(
                entry.get("type") == "User"
                and entry.get("reviewer", {}).get("type") == "User"
                and entry.get("reviewer", {}).get("login") == "Eruhitsuji"
                for entry in reviewers
            )
        except Exception as error:
            raise SystemExit("Cannot verify github-pages human approval protection; configure it before retrying") from error
        if environment.get("name") != "github-pages" or not approved_gate:
            raise SystemExit("github-pages must require Eruhitsuji human approval; publication refused")
        print("Verified github-pages has the required human reviewer; no settings changed")
        PY
    - name: Publish reviewed artifact
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
