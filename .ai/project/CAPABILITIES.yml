    notes: >-
      #562 adds `lifetxt vm graph`, a static mermaid/dot control-flow export
      over a validated `VMProgram`: one node per counter (stadium shape) and
      per instruction (rectangle), solid labeled edges for
      `next:`/`zero:`/`nonzero:` control flow, and a separate dashed edge for
      each instruction's `var:` reference. Reuses
      `lifetxt.links._mermaid_node_id`/`_dot_quote` unmodified rather than
      duplicating node-id sanitization, matching this project's established
      cross-module private-helper reuse precedent (`lifetxt.mcp` already
      imports `webapp._subgraph` the same way). `run_program`'s own
      entry-validation logic was factored into a shared `_check_entry`
      helper so `program_to_mermaid`/`program_to_dot`'s optional `--entry`
      highlight raises the identical, already-tested `VMProgramError`
      message rather than a second implementation of the same check. No VM
      semantics, opcode, or validation behavior changed; this is a read-only
      static export, never `run_program`'s execution path. Runtime/state-trace
      visualization remains an explicit, unimplemented follow-up per the
      issue's own scope.
      Distilled directly from the issue's own detailed instruction-set,
      validation, safety-boundary, and non-goals specification (below the
      `.ai/project/changes/README.md` change-package threshold: Standard
      assurance -- the VM has no filesystem/network/shell/`eval`/`exec`/
      environment-variable/MCP/Web-API/plugin access and never mutates
      `life.txt`, so no security-impact escalation applies per
      `ASSURANCE_LEVELS.md`'s escalation rules). Reuses the existing
      parser's `Item.details` custom-key tolerance and the existing
      `id:`-addressed reference mechanism (`lifetxt links` already treats
      `id:` as the addressing scheme) rather than inventing a second
      address space or a new parser mode; `build_program` calls the
      already-imported `parse_text`/CLI input-resolution helpers
      unmodified. The combined counter+instruction id namespace is
      validated for uniqueness together (a counter id colliding with an
      instruction id is rejected as a duplicate VM id), which is a
      deliberate generalization of the issue's "duplicate instruction ID"
      wording to the VM's whole addressable namespace, not a separate,
      narrower check. `--entry`, `--max-steps`, and `--json` match the
      exact flags named in the issue; `vm run` reuses the same
      `_add_input_paths`/`_normalize_paths`/`_parse_or_exit`/
      `id_key_from_config` helpers `lifetxt temporal` already established
      for a single-file-or-multi-file, workspace-aware, parser-only (not
      full-validator) input path, so mixing VM records into an otherwise
      ordinary multi-file workspace costs nothing extra. `lifetxt vm check`,
      single-step tracing, JSON state schema versioning, runtime-state
      write-back, a program-visualization/CFG export, and a Brainfuck
      compiler are explicitly out of scope for this issue and recorded as
      candidate follow-up issues in both docs/en/vm.md and docs/ja/vm.md,
      matching the issue's own "future ideas" section.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

