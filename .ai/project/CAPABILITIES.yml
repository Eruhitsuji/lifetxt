      No existing capability entry covered `lifetxt/query.py`,
      `lifetxt/saved_views.py`, or `lifetxt/areas.py` before this change,
      even though their CLI/MCP exposure predates this session (confirmed
      via `git log` and by grepping this file); this entry closes that gap,
      matching the precedent set by `cap-remote-cli-read-client` for
      pre-existing-but-untraced functionality. #480 (an investigation issue
      under the #472 post-Stable product theme) confirmed these three
      engines are complete and already fully exposed through CLI/MCP, but
      had zero coverage in either the TUI or the Web UI, and recommended
      TUI first -- both because the TUI already has an established,
      directly analogous pattern to extend (`/project`/`/context`/`/tag`
      read-only filter commands) and because a naming collision exists on
      both surfaces (the TUI's own `/view` already means "switch which
      sections are listed"; the Web's `?view=` carries the identical
      meaning), so a saved *query* view could not reuse that word on either
      surface without ambiguity. #483 adds `/saved [NAME]` (list configured
      saved views, or apply one as the active row filter via
      `lifetxt.saved_views.run_saved_view`) and `/area [NAME]` (list areas
      with progress via `lifetxt.areas.area_list`, or filter rows to one
      area via `lifetxt.areas.collect_areas`) with no query grammar or
      area-membership logic duplicated in `lifetxt/tui_app.py`: both
      commands adapt the (source, line) identity every TUI row already
      carries to the engines' own item results, and both reuse the exact
      `ValueError` message `lifetxt.saved_views`/`lifetxt.areas` already
      raise for an unknown name rather than reconstructing it. The two
      filters are mutually exclusive with each other (applying one clears
      the other) and are reset by the existing `/clear` command alongside
      `/project`/`/context`/`/tag`; both persist across TUI sessions via the
      existing session-restore mechanism and stay fresh across `/reload`
      by recomputing the active filter's membership on every `load()`, the
      same pattern the `Today` view (#476) already established for
      `command_center()`. A Web-side counterpart (#484) is tracked as a
      separate, deferred follow-up per #480's own recommended sequencing.

