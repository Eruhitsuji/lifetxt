  - id: cap-server-init-git-commit-worker
    name: Opt-in periodic Git-commit worker for server-managed data
    summary: >-
      A disabled-by-default `lifetxt.git_commit_worker` module and
      `lifetxt git-commit-worker run` CLI command periodically staging and
      committing an explicit path allowlist inside an already-existing Git
      repository, never running `git init`, never creating a remote, and
      never configuring global Git identity. Fails closed on detached
      HEAD, a branch mismatch, missing Git identity, and pre-existing
      unrelated staged changes; a no-change run is a successful no-op.
      Wired into `server-init`'s opt-in `git_commit_worker` config section,
      generating a plan-first, idempotent systemd oneshot+timer pair
      through the same unit-generation pattern already established for
      scheduled report jobs. `server-update` can be configured to avoid
      racing the worker's own lock file.
