name: Align validated Remote Web source

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  align:
    if: github.event.pull_request.head.ref == 'agent/remote-browser-session-negotiation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remote-browser-session-negotiation
          fetch-depth: 0
      - name: Apply exact validated comments and verify blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object lifetxt/remote_web.py)" = "2d306ba026f1fd0a70ff78cb138acd8b8c836c0d"
          python - <<'PY'
          from pathlib import Path
          path = Path('lifetxt/remote_web.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _audit_safely(config, event):
              try:
                  append_audit(config, event)
              except Exception:
                  return False
              return True
          '''.replace('          ', '')
          new = '''def _audit_safely(config, event):
              try:
                  append_audit(config, event)
              except Exception:
                  # Audit storage hardening remains a separate roadmap item. Read access
                  # must not leak a local storage failure or crash the server response.
                  return False
              return True
          '''.replace('          ', '')
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = 'def _remote_page(nonce):\n    return """<!doctype html>'
          new = '''def _remote_page(nonce):
              # The token exists only in the password input until the login request is
              # complete. It is never placed in localStorage/sessionStorage/cookies.
              return """<!doctype html>'''.replace('          ', '')
          assert text.count(old) == 1
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          test "$(git hash-object lifetxt/remote_web.py)" = "11d06fc16d05cad7b26ef52244ceb1248b421d60"
      - name: Commit aligned source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-align-remote-web-v20.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align Remote Web source with validated implementation'
          git push origin HEAD:agent/remote-browser-session-negotiation
