  - id: cap-calendar-multiday-placement
    name: Calendar view multi-day record placement
    summary: >-
      Place a record with more than one in-window match (a multi-day all-day
      span expressed as several `on:DATE` values, e.g. imported from Google
      Calendar, or several repeat occurrences) on every matched
      day/occurrence instead of only the first, across the Web UI Calendar,
      Timeline, and Agenda views. The server already returned every matching
      occurrence as its own `record.matches` entry; the frontend silently
      read only the first for all three views.
    status: active
    owner: Eruhitsuji
    source_requirements:
      - req-calendar-multiday-placement
      - req-timeline-agenda-multi-occurrence-placement
    implementation_locations:
      - lifetxt/web_assets.py
      - tests/test_lifetxt.py
    public_interfaces:
      - Web UI Calendar view
      - Web UI Timeline view
      - Web UI Agenda view
    tests_or_evidence:
      - tests/test_lifetxt.py LifeTxtWebConfigAndCheckLineTests.test_calendar_places_a_record_on_every_matched_day, confirmed via git stash to fail on the prior matches[0]-only code
      - 'manual: a real Node.js run of the extracted _calRecordDayPlacements/_calEntryHtml/loadCalendar source against 4 cases (3-day multi-day placement, single-occurrence, matches-less fallback, per-day HTML) -- all passed'
      - 'design-time: direct lifetxt.agenda.agenda_records() calls against an on:/on:/on: fixture confirm the server already returns one matches entry per matched day in range, and that Timeline (_tlDisplayInfo) already receives only the in-window subset -- the basis for excluding Timeline from this capability'
      - python -m unittest tests.test_lifetxt -> Ran 574 tests, OK
      - python -m lifetxt check examples/minimal_life.txt -> OK: 10 item(s)
      - ruff format --check lifetxt tests scripts
      - ruff check lifetxt tests scripts -> All checks passed
      - tests/test_lifetxt.py test_calendar_shows_a_day_span_badge_on_multiday_records_only
      - 'manual: a real Node.js run confirming a 3-day record produces "1/3"/"2/3"/"3/3" badges in chronological order, and a single-day record renders no badge'
      - 'live: real lifetxt serve process with a 3-day on:/on:/on: fixture, served page confirmed to contain the cal-entry-span markup'
      - python -m unittest tests.test_release_policy tests.test_web_i18n -> Ran 26 tests, OK (no translation-coverage regression)
      - tests/test_lifetxt.py test_calendar_places_a_record_on_every_day_even_with_occurrence_start -> asserts matches is checked before occurrence_start in the served page source
      - 'live: real lifetxt serve process against the exact #220 reproduction fixture (10-day Google Calendar on: import), GET /api/agenda confirmed occurrence_start=matches[0].start while matches carries all 10 real day entries'
      - 'manual: a real Node.js run of the extracted, fixed _calRecordDayPlacements against that exact real API payload -> 10/10 placements (was 1 before the fix); single-day and occurrence_start-only-no-matches fallback cases re-verified unaffected'
      - python -m unittest tests.test_release_policy tests.test_surface_runtime -> Ran 31 tests, OK
      - '$env:MPLBACKEND="Agg"; python -W ignore::ResourceWarning -m unittest discover -> Ran 2110 tests, OK (skipped=13)'
      - tests/test_lifetxt.py LifeTxtWebConfigAndCheckLineTests.test_timeline_places_a_record_on_every_in_window_match, test_timeline_row_shows_a_span_badge_for_multi_match_records, test_agenda_places_a_record_on_every_in_window_match
      - 'manual: a real Node.js 20.20.0 run (via WSL2; the system Node was 12.22.9, which predates optional chaining) of the extracted, real _tlRecordEntries/_agendaRecordEntries/_agendaMatchWhen source against a 3-day on: span fixture and a 3-occurrence daily-habit fixture -- both Timeline and Agenda now produce 3 entries with correct per-match when/occurrence_index/matchIndex/matchTotal, versus 1 before the fix'
      - '$env:MPLBACKEND="Agg"; python -m unittest discover -> Ran 2157 tests, OK (skipped=13)'
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/194
      - https://github.com/Eruhitsuji/lifetxt/issues/213
      - https://github.com/Eruhitsuji/lifetxt/issues/220
      - https://github.com/Eruhitsuji/lifetxt/issues/229
    related_pull_requests:
      - https://github.com/Eruhitsuji/lifetxt/pull/195
      - https://github.com/Eruhitsuji/lifetxt/pull/214
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      Distilled from a cc-sdd spec at .kiro/specs/calendar-multiday-placement/
      (below the .ai/project/changes/README.md change-package threshold: Standard
      assurance, S-sized bug fix). Investigated and confirmed the fix is generic
      across every record kind (not event-specific) and that Timeline exhibits no
      equivalent defect, both explicitly asked for in the originating bug report;
      recorded as findings in requirements.md rather than folded into extra,
      unevidenced code changes. Fifth implementation task of the
      cli-web-multiday-enhancements batch. #213/#214 (Standard assurance) added a
      "day X of Y" badge to each multi-day placement, distilled from a cc-sdd spec
      at .kiro/specs/calendar-multiday-span-badge/ -- a lighter alternative to a
      connecting spanning-bar redesign, which remains explicitly out of scope.
      #220 (Standard assurance) fixed a genuine gap #194's own fixture never
      exercised: agenda_records() always derives occurrence_start from
      matches[0], so a real multi-day on: import (or any record with more
      than one match) carries both fields at once, and
      _calRecordDayPlacements checked occurrence_start first -- silently
      collapsing every such record back to one day, the exact #194
      regression, reintroduced through a field the original fixture left
      unset. Fixed by preferring matches whenever present; occurrence_start
      and record.when remain fallbacks only for a record shape with no
      matches array at all. Confirmed generic across record kinds (no
      Event/Google-Calendar-specific branching). A horizontal re-check of
      Timeline and the Agenda list (both explicitly named in #220's audit
      list) found a related but distinct limitation -- both render exactly
      one row per record via matches[0], never expanding to one row per
      in-window match -- filed separately as #229 rather than fixed here,
      since it needs a product decision (is one row per record the intended
      flat-list design, or should these mirror Calendar's per-occurrence
      grid now) that #220's own reproduction and acceptance criteria did not
      settle. This is a narrower re-finding than #194's original "Timeline
      exhibits no equivalent defect" claim above: that check was about
      in-window record *selection*, not about how many rows one selected
      record with several in-window matches produces, which #229 is about.
      #229 was resolved after confirming with the repository owner (via
      AskUserQuestion) that Timeline and Agenda should mirror Calendar's
      post-#220 behavior: one row per in-window match, not one row per
      record with a badge count. record.matches was already the
      authoritative, range-clipped per-occurrence list on the server side
      for both views (confirmed by reading lifetxt/agenda.py's
      item_time_matches/_add_match, which only ever appends matches
      overlapping the requested range), so the fix is pure client-side
      expansion mirroring _calRecordDayPlacements -- no Python change was
      needed. Agenda's overdue badge intentionally still counts unique
      records, not expanded occurrences; that distinction was out of #229's
      scope.
    replacement:
      replaces: []
      replaced_by: null
      deprecation_issue: null

