name: Retired entry (lifetxt-mini-release)
# Atomic cutover: no tag, release event or manual publication path remains.
# All producers are release-preflight-*.yml; publication and downstream
# generation run as explicitly ordered stages of release.yml after approval.
on:
  workflow_call:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Reject the retired entry
        run: |
          echo 'Use release-preflight.yml, then the single approved release.yml entry.'
          exit 1
