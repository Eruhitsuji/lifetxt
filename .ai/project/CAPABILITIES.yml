      - https://github.com/Eruhitsuji/lifetxt/issues/78
      - https://github.com/Eruhitsuji/lifetxt/issues/86
      - https://github.com/Eruhitsuji/lifetxt/issues/300
      - https://github.com/Eruhitsuji/lifetxt/issues/301
      - https://github.com/Eruhitsuji/lifetxt/issues/302
      - https://github.com/Eruhitsuji/lifetxt/issues/303
      - https://github.com/Eruhitsuji/lifetxt/issues/305
      - https://github.com/Eruhitsuji/lifetxt/issues/306
      - https://github.com/Eruhitsuji/lifetxt/issues/307
      - https://github.com/Eruhitsuji/lifetxt/issues/308
      - https://github.com/Eruhitsuji/lifetxt/issues/309
      - https://github.com/Eruhitsuji/lifetxt/issues/310
