    - req-procedure-guidance-v1
    source_commit: 9fc056590dc7bc0ca9a38672dcb7e16be4008a7e
    status: passed
    result: Baseline 10 items accepted. All bilingual examples and text/Mermaid/DOT
      commands returned 0; W106 for generic opt-in check and PG201 for exit-capable
      loop are expected.
  - type: render
    command: 'Isolated Node probe: mermaid.parse and viz.renderString(format=svg,
