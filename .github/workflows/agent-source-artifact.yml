name: Inspect PR13 repair patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/repair-pr13-implementation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/repair-pr13-implementation
      - name: Record uploaded repair patch metadata
        run: |
          {
            echo 'sha256:'
            sha256sum .github/repair-patch/part-*
            echo 'bytes:'
            wc -c .github/repair-patch/part-*
          } > /tmp/repair-patch-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: repair-patch-metadata
          path: /tmp/repair-patch-metadata.txt
          if-no-files-found: error
