verification:
  checks:
  - type: runtime_inventory_followup
    command: build.py and inventory_probe.mjs; focused PoC/Core/runtime/diagnostic/site/trace/package unittests
    source_commit: 6ea5ed56 plus isolated 1362 additions
    status: passed
    result: 44 focused tests including actual Chromium, 2 optional Web skips; sixteen notice hashes and copied
      artifact entries verified. Actual WASM versions zlib 1.3.1, SQLite 3.39.0,
      Expat 2.7.3; 91 builtins declared. Ruff, format, mypy and diff checks pass.
      Full runtime suite not rerun locally. Complete distribution audit remains false.
  - type: followup_regression
    command: python -m unittest tests.test_browser_check_poc tests.test_browser_check_poc_browser
      tests.test_core_import_boundary tests.test_supported_runtime tests.test_diagnostic_contract
      tests.test_website tests.test_traceability_gate tests.test_change_package_closeout
    source_commit: 17583a3e plus isolated 1360 additions
    status: passed
    result: 43 tests, 2 existing optional Web diagnostic skips; actual Chromium
      dependency gate required and executed. Ruff lint and focused format, approved
      mypy boundary and diff whitespace pass. Full runtime suite not rerun locally.
  - type: actual_browser_acceptance
    command: LIFETXT_REQUIRE_BROWSER_CHECK=1 LIFETXT_BROWSER_BIN=local-chromium
      python -m unittest tests.test_browser_check_poc_browser
    source_commit: 17583a3e plus isolated 1360 additions; browser-evidence.json has exact artifact and probe hashes
    status: passed
    result: Real HTTP Chromium 153 corpus 16 of 16; unchanged CSP/MIME, bounded
      network/storage, lazy/warm/offline, cancel/restart, failure/retry and virtual-clock
      startup timeout pass. Mobile emulation is not a physical device.
  - type: notice_provenance
    command: python -m unittest tests.test_browser_check_poc
    source_commit: 17583a3e plus isolated 1360 additions
    status: passed
    result: Three upstream notice texts have stored hashes and are copied into
      the manifest-bound local artifact. Full binary inventory is not complete.
  - type: native_and_wasm
    command: build.py, probe.mjs, worker_probe.mjs and compare_cli.py
    source_commit: e59ef2b6 plus isolated 1356 PoC; exact input/source hashes in evidence.json
    status: passed
    result: Node WASM and worker-shim corpus match native 16 of 16. CLI diagnostic
      match is 14 of 16; two semantic scope differences retained. Byte limit and
      termination pass. Results do not claim browser or complete CLI equivalence.
  - type: offline_regression
    command: python -m unittest tests.test_browser_check_poc tests.test_core_import_boundary
      tests.test_supported_runtime tests.test_diagnostic_contract tests.test_website
      tests.test_traceability_gate tests.test_change_package_closeout
    source_commit: e59ef2b6 plus isolated 1356 PoC
    status: passed
    result: 41 tests run, 2 optional Web diagnostic tests skipped; executed tests pass.
      No core, website, workflow or standard behavior changed.
  - type: static
    command: Ruff lint including contrib PoC, focused format, approved mypy boundary,
      node --check for all PoC mjs and test_ui.mjs execution
    source_commit: e59ef2b6 plus isolated 1356 PoC
    status: passed
    result: All executed checks pass. Fake DOM lifecycle is not browser evidence.
  gaps:
  - description: Chromium execution, CSP/MIME and bounded network/storage are now
      covered in 1360. Physical mobile, Firefox/Safari, screen reader, desktop
      200 percent zoom, realistic download and peak-memory remain unverified.
    tracked_by: https://github.com/Eruhitsuji/lifetxt/issues/1356
  - description: Runtime notices/SBOM and distribution obligations, broader Core
      conformance and final adoption/scope/production limits require separate review.
    tracked_by: https://github.com/Eruhitsuji/lifetxt/issues/1358
