      - "Definition of Ready checklist for the follow-up server implementation issue (#728) is recorded at the end of the document"
    related_issues:
      - https://github.com/Eruhitsuji/lifetxt/issues/724
      - https://github.com/Eruhitsuji/lifetxt/issues/727
    related_pull_requests: []
    reuse_policy: prefer_reuse_or_extension_before_new_implementation
    notes: >-
      Investigation only, per #727's own forbidden scope (no endpoint, no
      Git mutation, no runtime code). No human was available to
      synchronously answer #727's design questions; per this batch's task
      instruction, the design call was made autonomously and recorded here.
      Explicitly reuses cap-mcp-permission-profiles's established
      "never infer a broader grant from a narrower one" precedent for why a
      plain read role must not imply historical access. #728 (the server/
      Remote Safe Mode implementation itself) remains a separate, not-yet-
      implemented, High-assurance follow-up issue; this capability records
      only the completed disclosure-policy investigation.
